<style>
[hidden]{display:none!important}
/* Layout: a computer-based test console. Home lists tests and history; inside a test, a sticky toolbar and one question per screen, passage or data beside the question on wide screens. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #18212b; --muted: #5a6573; --line: #d5dbe2;
  --accent: #1d5a86; --accent-ink: #ffffff; --accent-soft: #e3edf5;
  --flag: #a8660f; --flag-soft: #fbefdc; --good: #2b7a4b; --good-soft: #e2f2e8; --bad: #ad3434; --bad-soft: #f8e3e3;
  --c1: #1d5a86; --c2: #c07a1a; --c3: #5b8a3a;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c;
  --c1: #6ea9d8; --c2: #e0a24a; --c3: #8cc46a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c;
  --c1: #6ea9d8; --c2: #e0a24a; --c3: #8cc46a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-ui); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button { font: inherit; cursor: pointer }
button:disabled { cursor: not-allowed; opacity: .5 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar-in { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-title { font-weight: 600 }
.bar-sub { color: var(--muted); font-size: 13px }
.bar-tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.timer { font-family: var(--f-num); font-variant-numeric: tabular-nums; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 76px; text-align: center; background: var(--surface); color: var(--ink) }
.timer.low { color: var(--bad); border-color: var(--bad) }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 6px }
.btn:hover:not(:disabled) { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.flagged { background: var(--flag-soft); border-color: var(--flag); color: var(--flag) }
.btn.big { padding: 10px 20px; font-size: 16px }
.btn.danger { border-color: var(--bad); color: var(--bad) }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0 }
h1 { font-size: 28px; font-weight: 600 }
h2 { font-size: 21px; font-weight: 600 }
h3 { font-size: 16px; font-weight: 600 }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.stack { display: flex; flex-direction: column; gap: 16px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0 }
.prose { max-width: 70ch }
.prose ul, .prose ol { margin: 0; padding-left: 20px }
.muted { color: var(--muted) }
.small { font-size: 13px }
table.plain { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top }
table.plain th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600 }
.num { font-family: var(--f-num) }
.scroll-x { overflow-x: auto }
.tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px }
.tcard { display: flex; flex-direction: column; gap: 10px }
.tcard .meta { font-size: 13px; color: var(--muted) }
.q-grid { display: grid; grid-template-columns: 1fr; gap: 20px }
.q-grid.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
@media (max-width: 760px) { .q-grid.split { grid-template-columns: 1fr } }
.passage { font-family: var(--f-read); font-size: 16.5px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0 }
.passage p { margin: 0 0 12px }
.passage p:last-child { margin: 0 }
.passage .s { border-radius: 3px }
.passage.selectable .s { cursor: pointer }
.passage.selectable .s:hover { background: var(--accent-soft) }
.passage .s.on { background: var(--accent); color: var(--accent-ink) }
.stem { font-family: var(--f-read); font-size: 17px; line-height: 1.65; min-width: 0 }
.direction { font-size: 13px; color: var(--muted); font-style: italic }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--ink) }
.opt:hover { border-color: var(--accent) }
.opt .mk { flex: 0 0 auto; width: 22px; height: 22px; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-top: 1px }
.opt.round .mk { border-radius: 50% }
.opt.square .mk { border-radius: 3px }
.opt.on { border-color: var(--accent); background: var(--accent-soft) }
.opt.on .mk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.opt.key { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good) }
.opt .tx { min-width: 0 }
.blanks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px }
.blank-col { display: flex; flex-direction: column; gap: 6px }
.blank-col .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase }
.cell { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 10px; border-radius: 4px; text-align: center; font-family: var(--f-read); font-size: 16px }
.cell:hover { border-color: var(--accent) }
.cell.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.cell.key { box-shadow: 0 0 0 2px var(--good) }
.qc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.qc > div { border: 1px solid var(--line); border-radius: 6px; padding: 12px; text-align: center; background: var(--surface); min-width: 0 }
.qc .h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.qc .v { font-family: var(--f-read); font-size: 17px }
.given { text-align: center; font-family: var(--f-read); font-size: 16.5px }
.numin { font: 18px var(--f-num); padding: 8px 10px; width: 180px; max-width: 100%; border: 1.5px solid var(--muted); border-radius: 4px; background: var(--surface); color: var(--ink) }
.frac { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; align-self: flex-start }
.frac hr { width: 100%; border: 0; border-top: 2px solid var(--ink); margin: 0 }
.frac .numin { width: 120px; text-align: center }
.essay-tools { display: flex; gap: 6px; flex-wrap: wrap }
.essay-box { width: 100%; min-height: 380px; font: 16px/1.6 var(--f-read); padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); resize: vertical }
.data-table caption { caption-side: top; text-align: left; font-weight: 600; padding-bottom: 6px }
.chart svg { width: 100%; height: auto; display: block }
.chart text { fill: var(--ink); font-family: var(--f-ui); font-size: 12px }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .axis { stroke: var(--muted); stroke-width: 1 }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.rv button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 10px }
.rv button:hover { border-color: var(--accent) }
.rv .st { display: block; font-size: 12px; color: var(--muted) }
.rv .st.unans { color: var(--bad) }
.rv .flag { color: var(--flag); font-weight: 600 }
.calc { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 248px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 10px }
.calc .disp { font: 20px var(--f-num); text-align: right; padding: 8px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums; position: relative }
.calc .disp .m { position: absolute; left: 8px; top: 4px; font-size: 11px; color: var(--muted) }
.calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px }
.calc .keys button { padding: 8px 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; font-family: var(--f-num) }
.calc .keys button.wide { grid-column: span 4; font-family: var(--f-ui); font-size: 13px }
.calc .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600 }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 16px }
.modal .panel { max-width: 640px; width: 100%; max-height: 85vh; overflow: auto }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0 }
.score .big { font: 600 44px/1 var(--f-num); font-variant-numeric: tabular-nums; margin: 6px 0 }
.score .range { font-family: var(--f-num); font-size: 14px }
.scale { position: relative; height: 8px; background: var(--line); border-radius: 4px; margin: 14px 0 6px }
.scale .band { position: absolute; top: 0; height: 8px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 4px }
.scale .pt { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; transform: translateX(-2px) }
.scale-lbl { display: flex; justify-content: space-between; font: 11px var(--f-num); color: var(--muted) }
.unofficial { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px }
.unofficial div { border: 1px solid var(--line); border-radius: 8px; padding: 18px; background: var(--surface); text-align: center }
.unofficial b { display: block; font: 600 48px/1.1 var(--f-num) }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
.pill.good { color: var(--good); background: var(--good-soft) }
.pill.bad { color: var(--bad); background: var(--bad-soft) }
.pill.skip { color: var(--muted) }
.pill.warn { color: var(--flag); background: var(--flag-soft) }
.qrev { border-top: 1px solid var(--line); padding-block: 14px; display: flex; flex-direction: column; gap: 6px }
.qrev .ex, .feedback { background: var(--bg); border-radius: 6px; padding: 10px 12px; font-size: 14px }
.feedback.good { border-left: 3px solid var(--good) }
.feedback.bad { border-left: 3px solid var(--bad) }
details > summary { cursor: pointer; font-weight: 600; padding-block: 6px }
.copybox { width: 100%; min-height: 160px; font: 13px var(--f-num); padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink) }
.note { border-left: 3px solid var(--flag); background: var(--flag-soft); padding: 10px 14px; border-radius: 0 6px 6px 0 }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); padding: 12px 14px; border-radius: 6px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

]}, "version": "8249df475b"}, "tests": [{"id": "test-01", "title": "Practice Test 1", "order": ["V1", "V2", "Q1", "Q2"], "essay": {"minutes": 30, "variant": "recommendation", "prompt": "Governments should place greater emphasis on funding basic scientific research, which has no immediate practical purpose, than on research aimed at solving specific practical problems.", "instructions": "Write a response in which you discuss how far you agree or disagree with this recommendation and explain the reasoning behind your position. As you develop your position, consider specific situations in which following the recommendation would and would not be beneficial, and explain how these situations shape your view."}, "passages": {"guilds": ["For much of the twentieth century, historians treated the medieval guild primarily as an obstacle to economic growth.", "Guilds, the argument ran, restricted entry into trades, fixed prices and suppressed innovation in order to protect the incomes of existing masters.", "More recent scholarship has complicated this picture.", "Several economic historians have pointed out that guilds also enforced quality standards, which allowed buyers in distant markets to trust goods they could not inspect in person.", "Others have noted that guild apprenticeships provided a structured way of passing on skills at a time when few other forms of training existed.", "None of these scholars claims that guilds were economically benign; rather, they argue that the institutions' effects varied with local circumstances and cannot be summarised by a single verdict."], "predators": ["Some ecologists have proposed reintroducing large predators, such as wolves, to regions from which they were eliminated, on the grounds that predators regulate populations of grazing animals and thereby allow vegetation to recover.", "Critics respond that the evidence for such cascading effects is drawn largely from a handful of well-publicised cases, and that in many landscapes human
