    if (c.done && /^[0-9.(]$/.test(k)) c.expr = "";
    c.done = false;
    function result(v) { var s = v === null ? null : calcFormat(v); if (s === null) { c.err = true; } else { c.expr = s; c.done = true; } }
    if (k === "=") result(calcEval(c.expr));
    else if (k === "√") { var r = calcEval(c.expr); if (r === null || r < 0) c.err = true; else result(Math.sqrt(r)); }
    else if (k === "±") { var s = calcEval(c.expr); if (s !== null) result(-s); }
    else if (k === "M+") { var m = calcEval(c.expr); if (m !== null) { c.mem += m; c.done = true; } }
    else if (k === "MR") c.expr += (c.mem < 0 ? "(" + calcFormat(c.mem) + ")" : calcFormat(c.mem));
    else if (k === "MC") c.mem = 0;
    else if (k === "T") { var nq = currentNumericQ(), t = calcEval(c.expr); if (nq && t !== null && calcFormat(t) !== null) { setAnswer(nq, calcFormat(t)); render(); return; } }
    else c.expr += k;
    renderCalc();
  }

  // ---------- question rendering (shared by test and practice) ----------
  function passageHtml(test, key, q, selectable, sel) {
    var p = test.passages[key], paras = p.paragraphs || [p], idx = 0;
    return '<div class="passage' + (selectable ? " selectable" : "") + '">' + paras.map(function (para) {
      return "<p>" + para.map(function (s) { var i = idx++; return '<span class="s' + (selectable && sel === i ? " on" : "") + '" data-s="' + i + '">' + esc(s) + "</span> "; }).join("") + "</p>";
    }).join("") + "</div>";
  }
  function sentencesOf(test, key) { var p = test.passages[key]; return p.paragraphs ? [].concat.apply([], p.paragraphs) : p; }
  function tableHtml(test, key) {
    var t = test.tables[key];
    return '<div class="panel scroll-x" style="padding:14px"><table class="plain data-table"><caption>' + esc(t.title) + "</caption><thead><tr>" +
      t.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      t.rows.map(function (r) { return "<tr>" + r.map(function (c, i) { return "<td" + (i ? ' class="num"' : "") + ">" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>" +
      (t.note ? '<p class="small muted" style="margin:8px 0 0">' + esc(t.note) + "</p>" : "") + "</div>";
  }
  function niceMax(v) { var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
  function chartHtml(test, key) {
    var c = test.charts[key], W = 560, H = 300, L = 56, R = 16, T = 16, B = 44;
    var all = [].concat.apply([], c.series.map(function (s) { return s.values; }));
    var ymax = c.yMax || niceMax(Math.max.apply(null, all)), ymin = c.yMin || 0, ticks = c.yTicks || 5;
    var pw = W - L - R, ph = H - T - B, n = c.categories.length;

    var g = "";
    for (var i = 0; i <= ticks; i++) { var v = ymin + (ymax - ymin) * i / ticks, yy = y(v); g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + +v.toFixed(2) + "</text>"; }
    var band = pw / n, colors = ["var(--c1)", "var(--c2)", "var(--c3)"];
    c.categories.forEach(function (cat, i) { g += '<text x="' + (L + band * (i + 0.5)) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + esc(cat) + "</text>"; });
    if (c.kind === "line") {
      c.series.forEach(function (s, si) {
        var pts = s.values.map(function (v, i) { return (L + band * (i + 0.5)) + "," + y(v); });
        g += '<polyline fill="none" stroke="' + colors[si % 3] + '" stroke-width="2.5" points="' + pts.join(" ") + '"/>';
        s.values.forEach(function (v, i) { g += '<circle cx="' + (L + band * (i + 0.5)) + '" cy="' + y(v) + '" r="4" fill="' + colors[si % 3] + '"/>'; });
      });
    } else {
      var k = c.series.length, bw = band * 0.7 / k;
      c.series.forEach(function (s, si) { s.values.forEach(function (v, i) { var x = L + band * i + band * 0.15 + bw * si; g += '<rect x="' + x + '" y="' + y(v) + '" width="' + (bw - 2) + '" height="' + (y(ymin) - y(v)) + '" fill="' + colors[si % 3] + '"/>'; }); });
    }
    g += '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(ymin) + '" y2="' + y(ymin) + '"/><line class="axis" x1="' + L + '" x2="' + L + '" y1="' + T + '" y2="' + y(ymin) + '"/>';
    if (c.yLabel) g += '<text transform="translate(14 ' + (T + ph / 2) + ') rotate(-90)" text-anchor="middle">' + esc(c.yLabel) + "</text>";
    return '<div class="panel chart stack" style="gap:8px;padding:14px"><strong>' + esc(c.title) + "</strong>" +
      '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(c.title) + '">' + g + "</svg>" +
      (c.series.length > 1 || c.series[0].name ? '<div class="legend">' + c.series.map(function (s, si) { return '<span><i style="background:' + colors[si % 3] + '"></i>' + esc(s.name) + "</span>"; }).join("") + "</div>" : "") +
      (c.note ? '<p class="small muted" style="margin:0">' + esc(c.note) + "</p>" : "") + "</div>";
  }
  function stimulusHtml(test, q, a, showKey) {
    if (q.passage) return passageHtml(test, q.passage, q, q.type === "sentence", showKey ? q.answer : a);
    if (q.table) return tableHtml(test, q.table);
    if (q.chart) return chartHtml(test, q.chart);
    return "";
  }
  function optsHtml(opts, a, many, key) {
    return '<div class="opts">' + opts.map(function (o, i) {
      var on = many ? Array.isArray(a) && a.indexOf(i) >= 0 : a === i;
      var isKey = key !== undefined && (Array.isArray(key) ? key.indexOf(i) >= 0 : key === i);
      return '<button class="opt ' + (many ? "square" : "round") + (on ? " on" : "") + (isKey ? " key" : "") + '" data-o="' + i + '" aria-pressed="' + on + '"><span class="mk">' + (many ? (on ? "✓" : "") : LET[i]) + '</span><span class="tx">' + esc(o) + "</span></button>";
    }).join("") + "</div>";
  }
  function questionBody(q, a, showKey) {
    var h = '<div class="direction">' + esc(directionFor(q)) + "</div>", key = showKey ? q.answer : undefined;
    if (q.type === "qc") {
      h += (q.given ? '<div class="given">' + esc(q.given) + "</div>" : "") +
        '<div class="qc"><div><div class="h">Quantity A</div><div class="v">' + esc(q.qa) + '</div></div><div><div class="h">Quantity B</div><div class="v">' + esc(q.qb) + "</div></div></div>" + optsHtml(QC_OPTS, a, false, key);
      return h;
    }
    h += '<div class="stem">' + (q.type === "tc" ? blankify(q.stem) : esc(q.stem)) + "</div>";
    if (q.type === "tc") h += '<div class="blanks">' + q.blanks.map(function (col, b) {
      return '<div class="blank-col">' + (q.blanks.length > 1 ? '<span class="lbl">Blank (' + ["i", "ii", "iii"][b] + ")</span>" : "") +
        col.map(function (w, i) { return '<button class="cell' + (a && a[b] === i ? " on" : "") + (showKey && q.answer[b] === i ? " key" : "") + '" data-b="' + b + '" data-i="' + i + '">' + esc(w) + "</button>"; }).join("") + "</div>";
    }).join("") + "</div>";
    else if (q.type === "mc" || q.type === "multi" || q.type === "se") h += optsHtml(q.options, a, q.type !== "mc", key);
    else if (q.type === "numeric") h += '<div class="row"><input id="num" class="numin" inputmode="decimal" autocomplete="off" aria-label="Your answer" value="' + esc(a || "") + '">' + (q.unit ? '<span>' + esc(q.unit) + "</span>" : "") + "</div>";
    else if (q.type === "fraction") h += '<div class="frac"><input id="fn" class="numin" inputmode="numeric" aria-label="Numerator" value="' + esc((a && a[0]) || "") + '"><hr><input id="fd" class="numin" inputmode="numeric" aria-label="Denominator" value="' + esc((a && a[1]) || "") + '"></div>';
    return h;
  }
  function layoutQuestion(test, q, a, showKey, after) {
    var left = stimulusHtml(test, q, a, showKey), right = questionBody(q, a, showKey) + (after || "");
    app.innerHTML = '<div class="q-grid' + (left ? " split" : "") + '">' + (left ? '<div style="min-width:0">' + left + "</div>" : "") + '<div class="stack" style="min-width:0">' + right + "</div></div>";
  }
  function answersObj() { return view.name === "practice" ? practice.answers : progress[view.testId].answers; }
  function setAnswer(q, v) { answersObj()[q.id] = v; if (view.name === "attempt") saveProg(); }
  function wireQuestion(q, rerender) {
    var ans = answersObj();
    function set(v) { setAnswer(q, v); rerender(); }
    app.querySelectorAll(".opt").forEach(function (b) { b.addEventListener("click", function () {
      var i = +b.dataset.o, a = ans[q.id];
      if (q.type === "mc" || q.type === "qc") return set(i);
      a = Array.isArray(a) ? a.slice() : [];
      var p = a.indexOf(i), max = q.type === "se" ? 2 : q.selectCount || 99;
      if (p >= 0) a.splice(p, 1); else { if (a.length >= max) a.shift(); a.push(i); }
      set(a);
    }); });
    app.querySelectorAll(".cell").forEach(function (b) { b.addEventListener("click", function () {
      var a = Array.isArray(ans[q.id]) ? ans[q.id].slice() : q.blanks.map(function () { return null; });
      a[+b.dataset.b] = +b.dataset.i; set(a);
    }); });
    if (q.type === "sentence") app.querySelectorAll(".passage .s").forEach(function (s) { s.addEventListener("click", function () { set(+s.dataset.s); }); });
    function syncCheck() { var cb = document.getElementById("check"); if (cb) cb.disabled = !answered(q, ans[q.id]); }
    var num = document.getElementById("num");
    if (num) num.addEventListener("input", function () { setAnswer(q, num.value); syncCheck(); });
    var fn = document.getElementById("fn"), fd = document.getElementById("fd");
    if (fn) [fn, fd].forEach(function (el) { el.addEventListener("input", function () { setAnswer(q, [fn.value, fd.value]); syncCheck(); }); });
  }
  function currentQuestionCtx() {
    if (view.name === "practice" && view.section) { var t = testById(view.testId); return { test: t, q: t.sections[view.section].questions[practice.current] }; }
    if (view.name !== "attempt") return null;
    var A = progress[view.testId], test = testById(view.testId); if (!A || A.phase !== "inSection") return null;
    var k = secKey(test, A, A.step); if (k === "AW") return null;
    return { test: test, q: test.sections[k].questions[A.current] };
  }

  function renderQuestion(test, A) {
    var k = secKey(test, A, A.step), sec = test.sections[k], q = sec.questions[A.current];
    renderBar(sec.label, "Question " + (A.current + 1) + " of " + sec.questions.length, { q: q, test: test, sectionKey: k, mark: true, marked: A.marked[q.id], review: true, calc: sec.measure === "Quant", nav: true, first: A.current === 0 });
    on("mark", function () { A.marked[q.id] = !A.marked[q.id]; saveProg(); render(); });
    on("rev", function () { ui.review = true; ui.confirm = null; render(); window.scrollTo(0, 0); });
    on("back", function () { A.current--; saveProg(); render(); window.scrollTo(0, 0); });
    on("next", function () { if (A.current === sec.questions.length - 1) ui.review = true; else A.current++; saveProg(); render(); window.scrollTo(0, 0); });
    layoutQuestion(test, q, A.answers[q.id], false);
    wireQuestion(q, function () { renderQuestion(test, A); });
  }
  function renderReview(test, A) {
    var k = secKey(test, A, A.step), sec = test.sections[k];
    renderBar(sec.label, "Review", { test: test, sectionKey: k, review: true, calc: sec.measure === "Quant" });
    on("rev", function () { ui.review = false; render(); window.scrollTo(0, 0); });
    var unans = sec.questions.filter(function (q) { return !answered(q, A.answers[q.id]); }).length;
    app.innerHTML = '<div class="stack"><h2>Review: ' + esc(sec.label) + "</h2>" +
      '<p class="muted" style="margin:0">Select a question to go to it. ' + (unans ? "<strong>" + unans + " not answered.</strong> There is no penalty for guessing." : "All questions answered.") + "</p>" +
      '<div class="rv">' + sec.questions.map(function (q, i) {
        var ans = answered(q, A.answers[q.id]);
        return '<button data-g="' + i + '"><strong>Question ' + (i + 1) + '</strong><span class="st' + (ans ? "" : " unans") + '">' + (ans ? "Answered" : "Not answered") + "</span>" + (A.marked[q.id] ? '<span class="st flag">Marked</span>' : "") + "</button>";
      }).join("") + "</div>" +
      '<div class="row">' + (ui.confirm === "end" ? '<span>End this section? You cannot return to it.</span><button class="btn primary" id="yesEnd">Yes, end section</button><button class="btn" id="noEnd">Cancel</button>' : '<button class="btn primary" id="end">End section</button>') + "</div></div>";
    app.querySelectorAll("[data-g]").forEach(function (b) { b.addEventListener("click", function () { A.current = +b.dataset.g; ui.review = false; saveProg(); render(); window.scrollTo(0, 0); }); });
    on("end", function () { ui.confirm = "end"; render(); });
    on("noEnd", function () { ui.confirm = null; render(); });
    on("yesEnd", endSection);
  }
  function renderEssay(test, A) {
    renderBar("Analytical Writing", "Analyze an Issue", { test: test, sectionKey: "AW" });
    var words = (A.essay.match(/\S+/g) || []).length;
    app.innerHTML = '<div class="stack">' +
      '<div class="panel stack" style="gap:10px"><span class="eyebrow">Analyze an Issue</span><p class="stem" style="margin:0"><strong>' + esc(test.essay.prompt) + '</strong></p><p class="small muted" style="margin:0">' + esc(test.essay.instructions) + "</p></div>" +
      '<textarea id="essay" class="essay-box" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Your essay">' + esc(A.essay) + "</textarea>" +

      (ui.confirm === "end" ? '<span class="small">End the essay section? You cannot come back to it.</span><button class="btn primary" id="yesEnd">Yes, end section</button><button class="btn" id="noEnd">Keep writing</button>' : '<button class="btn primary" id="end">End section</button>') + "</div></div>";

  // ---------- end of test ----------
  function buildRecord(test, A, status) {
    var V = measureResult(test, "Verbal", A.answers, A.route), Q = measureResult(test, "Quant", A.answers, A.route);
    function strip(r) { return { est: r.est, lo: r.lo, hi: r.hi, pct: r.est ? r.pct : null, raw: r.raw, r1: r.r1, r2: r.r2, tier: r.tier }; }
    return { id: test.id + "-" + Date.now(), testId: test.id, testTitle: test.title, testVersion: test.version, cfgVersion: CFG.version, date: new Date().toISOString(), status: status,
      verbal: strip(V), quant: strip(Q), route: A.route, answers: A.answers,
      aw: { prompt: test.essay.prompt, instructions: test.essay.instructions, text: A.essay, words: (A.essay.match(/\S+/g) || []).length, secondsUsed: Math.round(A.essayUsed || 0), score: null, feedback: null } };
  }
  function renderReportChoice(test, A) {
    app.innerHTML = '<div class="stack prose"><span class="eyebrow">' + esc(test.title) + " · Test complete</span><h1>Report or cancel your scores</h1>" +
      "<p>On test day you now decide whether to report your scores or cancel them, before seeing them. If you report, you see your unofficial Verbal and Quantitative scores straight away; your Analytical Writing score comes later. If you cancel, no scores are reported, but you can reinstate them later.</p>" +
      (ui.confirm === "cancel" ? '<div class="confirm stack" style="gap:8px"><strong>Cancel your scores?</strong> They will be hidden. You can reinstate them later from your score history.<div class="row"><button class="btn primary" id="yesCancel">Yes, cancel scores</button><button class="btn" id="noCancel">Go back</button></div></div>' : "") +
      '<div class="row"><button class="btn primary big" id="report">Report my scores</button><button class="btn big danger" id="cancel">Cancel my scores</button></div></div>';
    on("report", function () { var rec = buildRecord(test, A, "reported"); saveAttempt(rec); delete progress[test.id]; saveProg(); go({ name: "report", attemptId: rec.id, fresh: true }); });
    on("cancel", function () { ui.confirm = "cancel"; render(); });
    on("noCancel", function () { ui.confirm = null; render(); });
    on("yesCancel", function () { var rec = buildRecord(test, A, "cancelled"); saveAttempt(rec); delete progress[test.id]; saveProg(); go({ name: "home" }); toast("Scores cancelled. You can reinstate them from your score history."); });
  }

  // ---------- score report ----------
  function scoreCard(r, label) {
    if (r.est === null || r.est === undefined) return '<div class="score"><span class="eyebrow">' + label + '</span><div class="big">NS</div><p class="small muted">No score: no questions were answered in this measure.</p></div>';
    var pos = function (s) { return ((s - 130) / 40 * 100).toFixed(2) + "%"; };
    return '<div class="score"><span class="eyebrow">' + label + " · estimate</span>" +
      '<div class="big">' + r.est + '</div><div class="range">Likely range ' + r.lo + "–" + r.hi + "</div>" +
      '<div class="scale" aria-hidden="true"><div class="band" style="left:' + pos(r.lo) + ";width:calc(" + pos(r.hi) + " - " + pos(r.lo) + ')"></div><div class="pt" style="left:' + pos(r.est) + '"></div></div>' +
      '<div class="scale-lbl"><span>130</span><span>150</span><span>170</span></div>' +
      '<p class="small" style="margin:10px 0 0">About the <strong>' + ordinal(r.pct) + " percentile</strong>: " + r.pct + "% of recent GRE takers scored lower.</p>" +
      '<p class="small muted" style="margin:6px 0 0">' + r.raw + " of 27 correct (section 1: " + r.r1 + "/12, section 2: " + r.r2 + "/15). Second section: <strong>" + r.tier + "</strong>.</p></div>";
  }
  function answerText(test, q, a) {
    if (!answered(q, a)) return "—";
    switch (q.type) {
      case "mc": return LET[a] + ". " + q.options[a];
      case "qc": return LET[a] + ". " + QC_OPTS[a];
      case "sentence": return "Sentence " + (a + 1);
      case "tc": return a.map(function (v, b) { return q.blanks[b][v]; }).join(" / ");
      case "se": case "multi": return a.slice().sort().map(function (i) { return q.options[i]; }).join("; ");
      case "numeric": return String(a);
      case "fraction": return a[0] + "/" + a[1];
    }
  }
  function keyText(test, q) {
    switch (q.type) {
      case "mc": return LET[q.answer] + ". " + q.options[q.answer];
      case "qc": return LET[q.answer] + ". " + QC_OPTS[q.answer];
      case "sentence": return "“" + sentencesOf(test, q.passage)[q.answer] + "”";
      case "tc": return q.answer.map(function (v, b) { return q.blanks[b][v]; }).join(" / ");
      case "se": case "multi": return q.answer.map(function (i) { return q.options[i]; }).join("; ");

  function breakdown(test, keys, answers, field) {

    var rows = Object.keys(agg); if (field === "difficulty") rows.sort(function (a, b) { return agg[a][2] - agg[b][2]; });
    return '<table class="plain"><thead><tr><th>' + (field === "difficulty" ? "Difficulty" : "Question type") + "</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>" +
      rows.map(function (s) { var a = agg[s], p = Math.round(a[0] / a[1] * 100); return "<tr><td>" + esc(s) + '</td><td class="num">' + a[0] + "/" + a[1] + '</td><td><span class="pill ' + (p >= 70 ? "good" : p < 50 ? "bad" : "skip") + '">' + p + "%</span></td></tr>"; }).join("") + "</tbody></table>";
  }
  function reviewList(test, k, answers) {
    var sec = test.sections[k];
    return "<details><summary>" + esc(sec.label) + (sec.tier ? " (" + sec.tier + ")" : "") + " · " + rawOf(test, k, answers) + "/" + sec.questions.length + "</summary>" +
      sec.questions.map(function (q, i) {
        var a = answers[q.id], ok = isCorrect(q, a), ans = answered(q, a);
        var stem = q.type === "qc" ? (q.given ? q.given + " · " : "") + "Quantity A: " + q.qa + " | Quantity B: " + q.qb : q.stem;
        var stim = q.passage ? '<details class="small"><summary>Show passage</summary>' + passageHtml(test, q.passage, q, false) + "</details>" :

          '<div class="small">' + esc(stem) + "</div>" +
          '<div class="small">Your answer: <strong>' + esc(answerText(test, q, a)) + "</strong><br>Correct: <strong>" + esc(keyText(test, q)) + "</strong></div>" +
          '<div class="ex">' + esc(q.explain) + "</div></div>";
      }).join("") + "</details>";
  }
  function awCard(h) {
    var aw = h.aw || {};
    if (aw.score !== null && aw.score !== undefined) return '<div class="score"><span class="eyebrow">Analytical Writing · marked by Claude</span><div class="big">' + aw.score.toFixed(1) + "</div>" +
      '<p class="small" style="margin:0">About the <strong>' + ordinal(CFG.percentiles.AW[aw.score.toFixed(1)]) + " percentile</strong>.</p>" + (aw.feedback ? '<details class="small"><summary>Feedback</summary><div style="white-space:pre-wrap">' + esc(aw.feedback) + "</div></details>" : "") + "</div>";

  function copyText(h) {
    return "GRE PRACTICE: ESSAY FOR MARKING\nTest: " + h.testTitle + " · " + fmtDate(h.date) + "\n" +
      "Verbal estimate: " + (h.verbal.est || "NS") + " (" + h.verbal.tier + " section 2) · Quant estimate: " + (h.quant.est || "NS") + " (" + h.quant.tier + " section 2)\n\n" +
      "Prompt: " + h.aw.prompt + "\nInstructions: " + h.aw.instructions + "\nTime used: " + fmt(h.aw.secondsUsed || 0) + " of 30:00 · Words: " + h.aw.words + "\n\nESSAY:\n" + (String(h.aw.text || "").trim() || "(no essay written)");
  }
  function renderReport(id) {
    var h = null; history.forEach(function (x) { if (x.id === id) h = x; });
    if (!h) { app.innerHTML = '<div class="stack"><p>Loading this report…</p><div class="row"><button class="btn" id="home">Back to tests</button></div></div>'; on("home", function () { go({ name: "home" }); }); return; }
    var test = testById(h.testId);
    if (h.status === "cancelled" && !view.reinstate) {
      app.innerHTML = '<div class="stack prose"><span class="eyebrow">' + esc(h.testTitle) + " · " + esc(fmtDate(h.date)) + "</span><h1>Scores cancelled</h1><p>You cancelled the scores for this attempt. On the real test, reinstating cancelled scores costs a fee and must be done within 60 days. Here it is free.</p>" +
        '<div class="row"><button class="btn primary" id="reinstate">Reinstate scores</button><button class="btn" id="home">Back to tests</button></div></div>';
      on("reinstate", function () { updateAttempt(h.id, { status: "reported" }); view.reinstate = true; render(); });
      on("home", function () { go({ name: "home" }); });
      return;
    }
    // If the test or the scoring has changed since this attempt, show the scores stored at the time and skip the per-question review.
    var stale = !test || h.testVersion !== test.version || h.cfgVersion !== CFG.version;
    var V = stale ? Object.assign({ measure: "Verbal" }, h.verbal) : measureResult(test, "Verbal", h.answers, h.route);
    var Q = stale ? Object.assign({ measure: "Quant" }, h.quant) : measureResult(test, "Quant", h.answers, h.route);
    var unofficial = view.fresh ? '<div class="panel stack" style="gap:10px"><span class="eyebrow">Unofficial scores, as shown on test day</span><div class="unofficial"><div>Verbal Reasoning<b>' + (V.est || "NS") + "</b></div><div>Quantitative Reasoning<b>" + (Q.est || "NS") + '</b></div></div><p class="small muted" style="margin:0">Official scores, including Analytical Writing, arrive about 8–10 days after the real test.</p></div>' : "";
    app.innerHTML = '<div class="stack">' +
      '<div class="row" style="justify-content:space-between"><div class="stack" style="gap:6px"><span class="eyebrow">' + esc(h.testTitle) + " · " + esc(fmtDate(h.date)) + "</span><h1>Score report</h1></div><button class=\"btn\" id=\"home\">Back to tests</button></div>" +
      unofficial +
      '<div class="scores">' + scoreCard(V, "Verbal Reasoning") + scoreCard(Q, "Quantitative Reasoning") + awCard(h) + "</div>" +
      '<div class="panel stack" style="gap:8px"><h3>Essay</h3><p class="small muted" style="margin:0">' + h.aw.words + " words · " + fmt(h.aw.secondsUsed || 0) + " used of 30:00</p>" +
      '<div class="row"><button class="btn" id="copy">Copy essay for Claude</button><span class="small" id="copied"></span></div><textarea id="copybox" class="copybox" readonly hidden></textarea></div>' +
      '<div class="note small prose"><strong>How to read these numbers.</strong> As on the real test, every question counts equally, and your score depends on how many you got right and which second section you received. ETS does not publish its conversion tables, and these questions have not been tried on real candidates, so each score is an estimate. The likely range adds ETS\'s measurement error (about ±2.5 points) plus ' + CFG.extraUncertainty + " points for that uncertainty. The hardest sections here are hard but not as hard as the toughest real GRE questions, so treat estimates above about 160 as optimistic. Percentiles are ETS's figures for test takers from 1 July 2022 to 30 June 2025.</div>" +
      (stale ? '<div class="note small prose">This test or its scoring has been updated since you took it, so these are the scores recorded at the time. The question-by-question review is not available for this attempt.</div></div>' :
      '<div class="scores"><div class="panel scroll-x"><h3 style="margin-bottom:8px">Verbal by question type</h3>' + breakdown(test, [V.k1, V.k2], h.answers, "skill") + "</div>" +
      '<div class="panel scroll-x"><h3 style="margin-bottom:8px">Quant by question type</h3>' + breakdown(test, [Q.k1, Q.k2], h.answers, "skill") + "</div>" +
      '<div class="panel scroll-x"><h3 style="margin-bottom:8px">All questions by difficulty</h3>' + breakdown(test, [V.k1, V.k2, Q.k1, Q.k2], h.answers, "difficulty") + "</div></div>" +
      '<div class="panel stack" style="gap:4px"><h2 style="margin-bottom:6px">Answers and explanations</h2>' + [V.k1, V.k2, Q.k1, Q.k2].map(function (k) { return reviewList(test, k, h.answers); }).join("") + "</div></div>");
    on("home", function () { go({ name: "home" }); });
    on("copy", function () {
      var txt = copyText(h), box = document.getElementById("copybox"), msg = document.getElementById("copied");
      box.value = txt;
      var fallback = function () { box.hidden = false; box.focus(); box.select(); msg.textContent = "Select all the text in the box and copy it."; };
      try { navigator.clipboard.writeText(txt).then(function () { msg.textContent = "Copied. Paste it into your chat with Claude."; }, fallback); } catch (e) { fallback(); }
    });
  }

  // ---------- practice mode ----------
  var practice = { answers: {}, checked: {}, current: 0 };
  function renderPractice() {
    var test = testById(view.testId);
    if (!view.section) {
      var keys = ["V1", "V2E", "V2M", "V2H", "Q1", "Q2E", "Q2M", "Q2H"];
      app.innerHTML = '<div class="stack"><div class="row" style="justify-content:space-between"><div class="stack" style="gap:6px"><span class="eyebrow">' + esc(test.title) + "</span><h1>Practice mode</h1></div><button class=\"btn\" id=\"home\">Back to tests</button></div>" +
        '<p class="prose" style="margin:0">Untimed. Check each answer as you go and read the explanation. Includes the second-section versions you did not get in the timed test.</p>' +
        '<div class="tests">' + keys.map(function (k) { var s = test.sections[k]; return '<div class="panel tcard"><h3>' + esc(s.label) + (s.tier ? " · " + s.tier : "") + '</h3><div class="meta">' + s.questions.length + ' questions</div><div class="row"><button class="btn primary" data-sec="' + k + '">Practise</button></div></div>'; }).join("") + "</div></div>";
      on("home", function () { go({ name: "home" }); });
      app.querySelectorAll("[data-sec]").forEach(function (b) { b.addEventListener("click", function () { practice = { answers: {}, checked: {}, current: 0 }; view.section = b.dataset.sec; render(); window.scrollTo(0, 0); }); });
      return;
    }
    var sec = test.sections[view.section], q = sec.questions[practice.current], checked = practice.checked[q.id];
    renderBar(sec.label + (sec.tier ? " · " + sec.tier : ""), "Practice · question " + (practice.current + 1) + " of " + sec.questions.length, { q: q, test: test, sectionKey: view.section, calc: sec.measure === "Quant", nav: true, first: practice.current === 0, exit: true });
    on("back", function () { practice.current--; render(); window.scrollTo(0, 0); });
    on("next", function () { if (practice.current < sec.questions.length - 1) { practice.current++; render(); window.scrollTo(0, 0); } else { view.section = null; render(); } });
    on("exitPractice", function () { view.section = null; ui.calc.show = false; render(); });
    var a = practice.answers[q.id], ok = isCorrect(q, a);
    var after = checked ? '<div class="feedback ' + (ok ? "good" : "bad") + '"><strong>' + (ok ? "Correct." : "Not quite.") + "</strong> Correct answer: " + esc(keyText(test, q)) + "<br>" + esc(q.explain) + '</div><div class="row"><button class="btn" id="retry">Try again</button></div>' :
      '<div class="row"><button class="btn primary" id="check"' + (answered(q, a) ? "" : " disabled") + ">Check answer</button></div>";
    layoutQuestion(test, q, a, checked, after);
    wireQuestion(q, function () { renderPractice(); });
    on("check", function () { practice.checked[q.id] = true; render(); });
    on("retry", function () { delete practice.checked[q.id]; delete practice.answers[q.id]; render(); });
  }

  window.__gre = { CFG: CFG, TESTS: TESTS, isCorrect: isCorrect, calcEval: calcEval, calcFormat: calcFormat };
  render();
  initDb();
})();
</script>

</body>
</html>
