<title>GRE Practice Centre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a computer-based test console. Home lists tests and history; inside a test, a sticky toolbar and one question per screen, passage or data beside the question on wide screens. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #18212b; --muted: #5a6573; --line: #d5dbe2;
  --accent: #1d5a86; --accent-ink: #ffffff; --accent-soft: #e3edf5;
  --flag: #a8660f; --flag-soft: #fbefdc; --good: #2b7a4b; --good-soft: #e2f2e8; --bad: #ad3434; --bad-soft: #f8e3e3;
  --c1: #1d5a86; --c2: #c07a1a; --c3: #5b8a3a;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c;
  --c1: #6ea9d8; --c2: #e0a24a; --c3: #8cc46a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c;
  --c1: #6ea9d8; --c2: #e0a24a; --c3: #8cc46a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-ui); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button { font: inherit; cursor: pointer }
button:disabled { cursor: not-allowed; opacity: .5 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar-in { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-title { font-weight: 600 }
.bar-sub { color: var(--muted); font-size: 13px }
.bar-tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.timer { font-family: var(--f-num); font-variant-numeric: tabular-nums; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 76px; text-align: center; background: var(--surface); color: var(--ink) }
.timer.low { color: var(--bad); border-color: var(--bad) }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 6px }
.btn:hover:not(:disabled) { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.flagged { background: var(--flag-soft); border-color: var(--flag); color: var(--flag) }
.btn.big { padding: 10px 20px; font-size: 16px }
.btn.danger { border-color: var(--bad); color: var(--bad) }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0 }
h1 { font-size: 28px; font-weight: 600 }
h2 { font-size: 21px; font-weight: 600 }
h3 { font-size: 16px; font-weight: 600 }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.stack { display: flex; flex-direction: column; gap: 16px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0 }
.prose { max-width: 70ch }
.prose ul, .prose ol { margin: 0; padding-left: 20px }
.muted { color: var(--muted) }
.small { font-size: 13px }
table.plain { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top }
table.plain th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600 }
.num { font-family: var(--f-num) }
.scroll-x { overflow-x: auto }
.tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px }
.tcard { display: flex; flex-direction: column; gap: 10px }
.tcard .meta { font-size: 13px; color: var(--muted) }
.q-grid { display: grid; grid-template-columns: 1fr; gap: 20px }
.q-grid.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
@media (max-width: 760px) { .q-grid.split { grid-template-columns: 1fr } }
.passage { font-family: var(--f-read); font-size: 16.5px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0 }
.passage p { margin: 0 0 12px }
.passage p:last-child { margin: 0 }
.passage .s { border-radius: 3px }
.passage.selectable .s { cursor: pointer }
.passage.selectable .s:hover { background: var(--accent-soft) }
.passage .s.on { background: var(--accent); color: var(--accent-ink) }
.stem { font-family: var(--f-read); font-size: 17px; line-height: 1.65; min-width: 0 }
.direction { font-size: 13px; color: var(--muted); font-style: italic }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--ink) }
.opt:hover { border-color: var(--accent) }
.opt .mk { flex: 0 0 auto; width: 22px; height: 22px; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-top: 1px }
.opt.round .mk { border-radius: 50% }
.opt.square .mk { border-radius: 3px }
.opt.on { border-color: var(--accent); background: var(--accent-soft) }
.opt.on .mk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.opt.key { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good) }
.opt .tx { min-width: 0 }
.blanks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px }
.blank-col { display: flex; flex-direction: column; gap: 6px }
.blank-col .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase }
.cell { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 10px; border-radius: 4px; text-align: center; font-family: var(--f-read); font-size: 16px }
.cell:hover { border-color: var(--accent) }
.cell.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.cell.key { box-shadow: 0 0 0 2px var(--good) }
.qc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.qc > div { border: 1px solid var(--line); border-radius: 6px; padding: 12px; text-align: center; background: var(--surface); min-width: 0 }
.qc .h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.qc .v { font-family: var(--f-read); font-size: 17px }
.given { text-align: center; font-family: var(--f-read); font-size: 16.5px }
.numin { font: 18px var(--f-num); padding: 8px 10px; width: 180px; max-width: 100%; border: 1.5px solid var(--muted); border-radius: 4px; background: var(--surface); color: var(--ink) }
.frac { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; align-self: flex-start }
.frac hr { width: 100%; border: 0; border-top: 2px solid var(--ink); margin: 0 }
.frac .numin { width: 120px; text-align: center }
.essay-tools { display: flex; gap: 6px; flex-wrap: wrap }
.essay-box { width: 100%; min-height: 380px; font: 16px/1.6 var(--f-read); padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); resize: vertical }
.data-table caption { caption-side: top; text-align: left; font-weight: 600; padding-bottom: 6px }
.chart svg { width: 100%; height: auto; display: block }
.chart text { fill: var(--ink); font-family: var(--f-ui); font-size: 12px }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .axis { stroke: var(--muted); stroke-width: 1 }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.rv button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 10px }
.rv button:hover { border-color: var(--accent) }
.rv .st { display: block; font-size: 12px; color: var(--muted) }
.rv .st.unans { color: var(--bad) }
.rv .flag { color: var(--flag); font-weight: 600 }
.calc { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 248px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 10px }
.calc .disp { font: 20px var(--f-num); text-align: right; padding: 8px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums; position: relative }
.calc .disp .m { position: absolute; left: 8px; top: 4px; font-size: 11px; color: var(--muted) }
.calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px }
.calc .keys button { padding: 8px 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; font-family: var(--f-num) }
.calc .keys button.wide { grid-column: span 4; font-family: var(--f-ui); font-size: 13px }
.calc .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600 }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 16px }
.modal .panel { max-width: 640px; width: 100%; max-height: 85vh; overflow: auto }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0 }
.score .big { font: 600 44px/1 var(--f-num); font-variant-numeric: tabular-nums; margin: 6px 0 }
.score .range { font-family: var(--f-num); font-size: 14px }
.scale { position: relative; height: 8px; background: var(--line); border-radius: 4px; margin: 14px 0 6px }
.scale .band { position: absolute; top: 0; height: 8px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 4px }
.scale .pt { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; transform: translateX(-2px) }
.scale-lbl { display: flex; justify-content: space-between; font: 11px var(--f-num); color: var(--muted) }
.unofficial { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px }
.unofficial div { border: 1px solid var(--line); border-radius: 8px; padding: 18px; background: var(--surface); text-align: center }
.unofficial b { display: block; font: 600 48px/1.1 var(--f-num) }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
.pill.good { color: var(--good); background: var(--good-soft) }
.pill.bad { color: var(--bad); background: var(--bad-soft) }
.pill.skip { color: var(--muted) }
.pill.warn { color: var(--flag); background: var(--flag-soft) }
.qrev { border-top: 1px solid var(--line); padding-block: 14px; display: flex; flex-direction: column; gap: 6px }
.qrev .ex, .feedback { background: var(--bg); border-radius: 6px; padding: 10px 12px; font-size: 14px }
.feedback.good { border-left: 3px solid var(--good) }
.feedback.bad { border-left: 3px solid var(--bad) }
details > summary { cursor: pointer; font-weight: 600; padding-block: 6px }
.copybox { width: 100%; min-height: 160px; font: 13px var(--f-num); padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink) }
.note { border-left: 3px solid var(--flag); background: var(--flag-soft); padding: 10px 14px; border-radius: 0 6px 6px 0 }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); padding: 12px 14px; border-radius: 6px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

    wireQuestion(q, function () { renderQuestion(test, A); });
  }
  function renderReview(test, A) {
    var k = secKey(test, A, A.step), sec = test.sections[k];
    renderBar(sec.label, "Review", { test: test, sectionKey: k, review: true, calc: sec.measure === "Quant" });
    on("rev", function () { ui.review = false; render(); window.scrollTo(0, 0); });
    var unans = sec.questions.filter(function (q) { return !answered(q, A.answers[q.id]); }).length;
    app.innerHTML = '<div class="stack"><h2>Review: ' + esc(sec.label) + "</h2>" +
      '<p class="muted" style="margin:0">Select a question to go to it. ' + (unans ? "<strong>" + unans + " not answered.</strong> There is no penalty for guessing." : "All questions answered.") + "</p>" +
      '<div class="rv">' + sec.questions.map(function (q, i) {
        var ans = answered(q, A.answers[q.id]);
        return '<button data-g="' + i + '"><strong>Question ' + (i + 1) + '</strong><span class="st' + (ans ? "" : " unans") + '">' + (ans ? "Answered" : "Not answered") + "</span>" + (A.marked[q.id] ? '<span class="st flag">Marked</span>' : "") + "</button>";
      }).join("") + "</div>" +
      '<div class="row">' + (ui.confirm === "end" ? '<span>End this section? You cannot return to it.</span><button class="btn primary" id="yesEnd">Yes, end section</button><button class="btn" id="noEnd">Cancel</button>' : '<button class="btn primary" id="end">End section</button>') + "</div></div>";
    app.querySelectorAll("[data-g]").forEach(function (b) { b.addEventListener("click", function () { A.current = +b.dataset.g; ui.review = false; saveProg(); render(); window.scrollTo(0, 0); }); });
    on("end", function () { ui.confirm = "end"; render(); });
    on("noEnd", function () { ui.confirm = null; render(); });
    on("yesEnd", endSection);
  }
  function renderEssay(test, A) {
    renderBar("Analytical Writing", "Analyze an Issue", { test: test, sectionKey: "AW" });
    var words = (A.essay.match(/\S+/g) || []).length;
    app.innerHTML = '<div class="stack">' +
      '<div class="panel stack" style="gap:10px"><span class="eyebrow">Analyze an Issue</span><p class="stem" style="margin:0"><strong>' + esc(test.essay.prompt) + '</strong></p><p class="small muted" style="margin:0">' + esc(test.essay.instructions) + "</p></div>" +
      '<textarea id="essay" class="essay-box" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Your essay">' + esc(A.essay) + "</textarea>" +
      '<div class="row"><span class="muted small" id="wc">' + words + ' words</span><span style="flex:1"></span>' +
      (ui.confirm === "end" ? '<span class="small">End the essay section? You cannot come back to it.</span><button class="btn primary" id="yesEnd">Yes, end section</button><button class="btn" id="noEnd">Keep writing</button>' : '<button class="btn primary" id="end">End section</button>') + "</div></div>";
    var ta = document.getElementById("essay");
    ta.addEventListener("input", function () { A.essay = ta.value; saveProg(); document.getElementById("wc").textContent = (ta.value.match(/\S+/g) || []).length + " words"; });
    on("end", function () { ui.confirm = "end"; render(); });
    on("noEnd", function () { ui.confirm = null; render(); });
    on("yesEnd", endSection);
  }

  // ---------- end of test ----------
  function buildRecord(test, A, status) {
    var V = measureResult(test, "Verbal", A.answers, A.route), Q = measureResult(test, "Quant", A.answers, A.route);
    function strip(r) { return { est: r.est, lo: r.lo, hi: r.hi, pct: r.est ? r.pct : null, raw: r.raw, r1: r.r1, r2: r.r2, tier: r.tier }; }
    return { id: test.id + "-" + Date.now(), testId: test.id, testTitle: test.title, testVersion: test.version, cfgVersion: CFG.version, date: new Date().toISOString(), status: status,
      verbal: strip(V), quant: strip(Q), route: A.route, answers: A.answers, composition: A.composition,
      aw: { prompt: test.essay.prompt, instructions: test.essay.instructions, text: A.essay, words: (A.essay.match(/\S+/g) || []).length, secondsUsed: Math.round(A.essayUsed || 0), score: null, feedback: null } };
  }
  function renderReportChoice(test, A) {
    app.innerHTML = '<div class="stack prose"><span class="eyebrow">' + esc(test.title) + " · Test complete</span><h1>Report or cancel your scores</h1>" +
      "<p>On test day you now decide whether to report your scores or cancel them, before seeing them. If you report, you see your unofficial Verbal and Quantitative scores straight away; your Analytical Writing score comes later. If you cancel, no scores are reported, but you can reinstate them later.</p>" +
      (ui.confirm === "cancel" ? '<div class="confirm stack" style="gap:8px"><strong>Cancel your scores?</strong> They will be hidden. You can reinstate them later from your score history.<div class="row"><button class="btn primary" id="yesCancel">Yes, cancel scores</button><button class="btn" id="noCancel">Go back</button></div></div>' : "") +
      '<div class="row"><button class="btn primary big" id="report">Report my scores</button><button class="btn big danger" id="cancel">Cancel my scores</button></div></div>';
    on("report", function () { var rec = buildRecord(test, A, "reported"); saveAttempt(rec); delete progress[test.id]; saveProg(); go({ name: "report", attemptId: rec.id, fresh: true }); });
    on("cancel", function () { ui.confirm = "cancel"; render(); });
    on("noCancel", function () { ui.confirm = null; render(); });
    on("yesCancel", function () { var rec = buildRecord(test, A, "cancelled"); saveAttempt(rec); delete progress[test.id]; saveProg(); go({ name: "home" }); toast("Scores cancelled. You can reinstate them from your score history."); });
  }

  // ---------- score report ----------
  function scoreCard(r, label) {
    if (r.est === null || r.est === undefined) return '<div class="score"><span class="eyebrow">' + label + '</span><div class="big">NS</div><p class="small muted">No score: no questions were answered in this measure.</p></div>';
    var pos = function (s) { return ((s - 130) / 40 * 100).toFixed(2) + "%"; };
    return '<div class="score"><span class="eyebrow">' + label + " · estimate</span>" +
      '<div class="big">' + r.est + '</div><div class="range">Likely range ' + r.lo + "–" + r.hi + "</div>" +
      '<div class="scale" aria-hidden="true"><div class="band" style="left:' + pos(r.lo) + ";width:calc(" + pos(r.hi) + " - " + pos(r.lo) + ')"></div><div class="pt" style="left:' + pos(r.est) + '"></div></div>' +
      '<div class="scale-lbl"><span>130</span><span>150</span><span>170</span></div>' +
      '<p class="small" style="margin:10px 0 0">About the <strong>' + ordinal(r.pct) + " percentile</strong>: " + r.pct + "% of recent GRE takers scored lower.</p>" +
      '<p class="small muted" style="margin:6px 0 0">' + r.raw + " of 27 correct (section 1: " + r.r1 + "/12, section 2: " + r.r2 + "/15). Second section: <strong>" + r.tier + "</strong>.</p></div>";
  }
  function answerText(test, q, a) {
    if (!answered(q, a)) return "—";
    switch (q.type) {
      case "mc": return LET[a] + ". " + q.options[a];
      case "qc": return LET[a] + ". " + QC_OPTS[a];
      case "sentence": return "Sentence " + (a + 1);
      case "tc": return a.map(function (v, b) { return q.blanks[b][v]; }).join(" / ");
      case "se": case "multi": return a.slice().sort().map(function (i) { return q.options[i]; }).join("; ");
      case "numeric": return String(a);
      case "fraction": return a[0] + "/" + a[1];
    }
  }
  function keyText(test, q) {
    switch (q.type) {
      case "mc": return LET[q.answer] + ". " + q.options[q.answer];
      case "qc": return LET[q.answer] + ". " + QC_OPTS[q.answer];
      case "sentence": return "“" + sentencesOf(test, q.passage)[q.answer] + "”";
      case "tc": return q.answer.map(function (v, b) { return q.blanks[b][v]; }).join(" / ");
      case "se": case "multi": return q.answer.map(function (i) { return q.options[i]; }).join("; ");
      case "numeric": return String(q.answer);
      case "fraction": return q.answer[0] + "/" + q.answer[1] + " (or any equivalent fraction)";
    }
  }
  function breakdown(test, keys, answers, field) {
    var agg = {};
    keys.forEach(function (k) { test.sections[k].questions.forEach(function (q) { var g = field === "difficulty" ? CFG.difficultyNames[q.difficulty] : q.skill; var s = agg[g] = agg[g] || [0, 0, field === "difficulty" ? q.difficulty : 0]; s[1]++; if (isCorrect(q, answers[q.id])) s[0]++; }); });
    var rows = Object.keys(agg); if (field === "difficulty") rows.sort(function (a, b) { return agg[a][2] - agg[b][2]; });
    return '<table class="plain"><thead><tr><th>' + (field === "difficulty" ? "Difficulty" : "Question type") + "</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>" +
      rows.map(function (s) { var a = agg[s], p = Math.round(a[0] / a[1] * 100); return "<tr><td>" + esc(s) + '</td><td class="num">' + a[0] + "/" + a[1] + '</td><td><span class="pill ' + (p >= 70 ? "good" : p < 50 ? "bad" : "skip") + '">' + p + "%</span></td></tr>"; }).join("") + "</tbody></table>";
  }
  function reviewList(test, k, answers) {
    var sec = test.sections[k];
    return "<details><summary>" + esc(sec.label) + (sec.tier ? " (" + sec.tier + ")" : "") + " · " + rawOf(test, k, answers) + "/" + sec.questions.length + "</summary>" +
      sec.questions.map(function (q, i) {
        var a = answers[q.id], ok = isCorrect(q, a), ans = answered(q, a);
        var stem = q.type === "qc" ? (q.given ? q.given + " · " : "") + "Quantity A: " + q.qa + " | Quantity B: " + q.qb : q.stem;
        var stim = q.passage ? '<details class="small"><summary>Show passage</summary>' + passageHtml(test, q.passage, q, false) + "</details>" :
          q.table ? '<details class="small"><summary>Show table</summary>' + tableHtml(test, q.table) + "</details>" :
          q.chart ? '<details class="small"><summary>Show graph</summary>' + chartHtml(test, q.chart) + "</details>" : "";
        return '<div class="qrev"><div class="row"><strong>Q' + (i + 1) + '</strong><span class="pill ' + (ok ? "good" : ans ? "bad" : "skip") + '">' + (ok ? "Correct" : ans ? "Wrong" : "Not answered") + '</span><span class="small muted">' + esc(q.skill) + " · " + esc(CFG.difficultyNames[q.difficulty]) + "</span></div>" + stim +
          '<div class="small">' + esc(stem) + "</div>" +
          '<div class="small">Your answer: <strong>' + esc(answerText(test, q, a)) + "</strong><br>Correct: <strong>" + esc(keyText(test, q)) + "</strong></div>" +
          '<div class="ex">' + esc(q.explain) + "</div></div>";
      }).join("") + "</details>";
  }
  function awCard(h) {
    var aw = h.aw || {};
    if (aw.score !== null && aw.score !== undefined) return '<div class="score"><span class="eyebrow">Analytical Writing · marked by Claude</span><div class="big">' + aw.score.toFixed(1) + "</div>" +
      '<p class="small" style="margin:0">About the <strong>' + ordinal(CFG.percentiles.AW[aw.score.toFixed(1)]) + " percentile</strong>.</p>" + (aw.feedback ? '<details class="small"><summary>Feedback</summary><div style="white-space:pre-wrap">' + esc(aw.feedback) + "</div></details>" : "") + "</div>";
    return '<div class="score"><span class="eyebrow">Analytical Writing</span><div style="font:600 24px/1.2 var(--f-ui);margin:16px 0">Awaiting marking</div>' +
      '<p class="small" style="margin:0">' + (store === "claude" ? "Your essay is saved. In your chat with Claude, ask it to mark your essay for " + esc(h.testTitle) + ". The score appears here once marked." : "Copy your essay below and paste it to Claude to get a 0–6 score with feedback.") + "</p></div>";
  }
  function copyText(h) {
    return "GRE PRACTICE: ESSAY FOR MARKING\nTest: " + h.testTitle + " · " + fmtDate(h.date) + "\n" +
      "Verbal estimate: " + (h.verbal.est || "NS") + " (" + h.verbal.tier + " section 2) · Quant estimate: " + (h.quant.est || "NS") + " (" + h.quant.tier + " section 2)\n\n" +
      "Prompt: " + h.aw.prompt + "\nInstructions: " + h.aw.instructions + "\nTime used: " + fmt(h.aw.secondsUsed || 0) + " of 30:00 · Words: " + h.aw.words + "\n\nESSAY:\n" + (String(h.aw.text || "").trim() || "(no essay written)");
  }
  function renderReport(id) {
    var h = null; history.forEach(function (x) { if (x.id === id) h = x; });
    if (!h) { app.innerHTML = '<div class="stack"><p>Loading this report…</p><div class="row"><button class="btn" id="home">Back to tests</button></div></div>'; on("home", function () { go({ name: "home" }); }); return; }
    var test = testById(h.testId);
    if (h.status === "cancelled" && !view.reinstate) {
      app.innerHTML = '<div class="stack prose"><span class="eyebrow">' + esc(h.testTitle) + " · " + esc(fmtDate(h.date)) + "</span><h1>Scores cancelled</h1><p>You cancelled the scores for this attempt. On the real test, reinstating cancelled scores costs a fee and must be done within 60 days. Here it is free.</p>" +
        '<div class="row"><button class="btn primary" id="reinstate">Reinstate scores</button><button class="btn" id="home">Back to tests</button></div></div>';
      on("reinstate", function () { updateAttempt(h.id, { status: "reported" }); view.reinstate = true; render(); });
      on("home", function () { go({ name: "home" }); });
      return;
    }
    // If the test or the scoring has changed since this attempt, show the scores stored at the time and skip the per-question review.
    var stale = !test || h.testVersion !== test.version || h.cfgVersion !== CFG.version || (test.random && hasRemoved(test));
    var V = stale ? Object.assign({ measure: "Verbal" }, h.verbal) : measureResult(test, "Verbal", h.answers, h.route);
    var Q = stale ? Object.assign({ measure: "Quant" }, h.quant) : measureResult(test, "Quant", h.answers, h.route);
    var unofficial = view.fresh ? '<div class="panel stack" style="gap:10px"><span class="eyebrow">Unofficial scores, as shown on test day</span><div class="unofficial"><div>Verbal Reasoning<b>' + (V.est || "NS") + "</b></div><div>Quantitative Reasoning<b>" + (Q.est || "NS") + '</b></div></div><p class="small muted" style="margin:0">Official scores, including Analytical Writing, arrive about 8–10 days after the real test.</p></div>' : "";
    app.innerHTML = '<div class="stack">' +
      '<div class="row" style="justify-content:space-between"><div class="stack" style="gap:6px"><span class="eyebrow">' + esc(h.testTitle) + " · " + esc(fmtDate(h.date)) + "</span><h1>Score report</h1></div><button class=\"btn\" id=\"home\">Back to tests</button></div>" +
      unofficial +
      '<div class="scores">' + scoreCard(V, "Verbal Reasoning") + scoreCard(Q, "Quantitative Reasoning") + awCard(h) + "</div>" +
      '<div class="panel stack" style="gap:8px"><h3>Essay</h3><p class="small muted" style="margin:0">' + h.aw.words + " words · " + fmt(h.aw.secondsUsed || 0) + " used of 30:00</p>" +
      '<div class="row"><button class="btn" id="copy">Copy essay for Claude</button><span class="small" id="copied"></span></div><textarea id="copybox" class="copybox" readonly hidden></textarea></div>' +
      '<div class="note small prose"><strong>How to read these numbers.</strong> As on the real test, every question counts equally, and your score depends on how many you got right and which second section you received. ETS does not publish its conversion tables, and these questions have not been tried on real candidates, so each score is an estimate. The likely range adds ETS\'s measurement error (about ±2.5 points) plus ' + CFG.extraUncertainty + " points for that uncertainty. The hardest sections here are hard but not as hard as the toughest real GRE questions, so treat estimates above about 160 as optimistic. Percentiles are ETS's figures for test takers from 1 July 2022 to 30 June 2025.</div>" +
      (stale ? '<div class="note small prose">This test or its scoring has been updated since you took it, so these are the scores recorded at the time. The question-by-question review is not available for this attempt.</div></div>' :
      '<div class="scores"><div class="panel scroll-x"><h3 style="margin-bottom:8px">Verbal by question type</h3>' + breakdown(test, [V.k1, V.k2], h.answers, "skill") + "</div>" +
      '<div class="panel scroll-x"><h3 style="margin-bottom:8px">Quant by question type</h3>' + breakdown(test, [Q.k1, Q.k2], h.answers, "skill") + "</div>" +
      '<div class="panel scroll-x"><h3 style="margin-bottom:8px">All questions by difficulty</h3>' + breakdown(test, [V.k1, V.k2, Q.k1, Q.k2], h.answers, "difficulty") + "</div></div>" +
      '<div class="panel stack" style="gap:4px"><h2 style="margin-bottom:6px">Answers and explanations</h2>' + [V.k1, V.k2, Q.k1, Q.k2].map(function (k) { return reviewList(test, k, h.answers); }).join("") + "</div></div>");
    on("home", function () { go({ name: "home" }); });
    on("copy", function () {
      var txt = copyText(h), box = document.getElementById("copybox"), msg = document.getElementById("copied");
      box.value = txt;
      var fallback = function () { box.hidden = false; box.focus(); box.select(); msg.textContent = "Select all the text in the box and copy it."; };
      try { navigator.clipboard.writeText(txt).then(function () { msg.textContent = "Copied. Paste it into your chat with Claude."; }, fallback); } catch (e) { fallback(); }
    });
  }

  // ---------- practice mode ----------
  var practice = { answers: {}, checked: {}, current: 0 };
  function renderPractice() {
    var test = testById(view.testId);
    if (!view.section) {
      var keys = ["V1", "V2E", "V2M", "V2H", "Q1", "Q2E", "Q2M", "Q2H"];
      app.innerHTML = '<div class="stack"><div class="row" style="justify-content:space-between"><div class="stack" style="gap:6px"><span class="eyebrow">' + esc(test.title) + "</span><h1>Practice mode</h1></div><button class=\"btn\" id=\"home\">Back to tests</button></div>" +
        '<p class="prose" style="margin:0">Untimed. Check each answer as you go and read the explanation. Includes the second-section versions you did not get in the timed test.</p>' +
        '<div class="tests">' + keys.map(function (k) { var s = test.sections[k]; return '<div class="panel tcard"><h3>' + esc(s.label) + (s.tier ? " · " + s.tier : "") + '</h3><div class="meta">' + s.questions.length + ' questions</div><div class="row"><button class="btn primary" data-sec="' + k + '">Practise</button></div></div>'; }).join("") + "</div></div>";
      on("home", function () { go({ name: "home" }); });
      app.querySelectorAll("[data-sec]").forEach(function (b) { b.addEventListener("click", function () { practice = { answers: {}, checked: {}, current: 0 }; view.section = b.dataset.sec; render(); window.scrollTo(0, 0); }); });
      return;
    }
    var sec = test.sections[view.section], q = sec.questions[practice.current], checked = practice.checked[q.id];
    renderBar(sec.label + (sec.tier ? " · " + sec.tier : ""), "Practice · question " + (practice.current + 1) + " of " + sec.questions.length, { q: q, test: test, sectionKey: view.section, calc: sec.measure === "Quant", nav: true, first: practice.current === 0, exit: true });
    on("back", function () { practice.current--; render(); window.scrollTo(0, 0); });
    on("next", function () { if (practice.current < sec.questions.length - 1) { practice.current++; render(); window.scrollTo(0, 0); } else { view.section = null; render(); } });
    on("exitPractice", function () { view.section = null; ui.calc.show = false; render(); });
    var a = practice.answers[q.id], ok = isCorrect(q, a);
    var after = checked ? '<div class="feedback ' + (ok ? "good" : "bad") + '"><strong>' + (ok ? "Correct." : "Not quite.") + "</strong> Correct answer: " + esc(keyText(test, q)) + "<br>" + esc(q.explain) + '</div><div class="row"><button class="btn" id="retry">Try again</button></div>' :
      '<div class="row"><button class="btn primary" id="check"' + (answered(q, a) ? "" : " disabled") + ">Check answer</button></div>";
    layoutQuestion(test, q, a, checked, after);
    wireQuestion(q, function () { renderPractice(); });
    on("check", function () { practice.checked[q.id] = true; render(); });
    on("retry", function () { delete practice.checked[q.id]; delete practice.answers[q.id]; render(); });
  }

  // ---------- practice by topic ----------
  var drill = null, drillSetup = { measure: "Quant", n: 10, timer: false };
  function drillSecs() { var id = drill.ids[drill.i], s = drill.secs[id] || 0; return drill.checked[id] || !drill.shownAt ? s : s + (Date.now() - drill.shownAt) / 1000; }
  function drillPause() { var id = drill.ids[drill.i]; if (drill.shownAt && !drill.checked[id]) drill.secs[id] = drillSecs(); drill.shownAt = 0; }
  function logPractice(q, ok, secs) {
    var e = { qid: q.id, ok: ok, at: new Date().toISOString(), tries: ((plog[q.id] || {}).tries || 0) + 1, secs: Math.round(secs) };
    plog[q.id] = e; lsSet(kPlog(), plog);
    if (account) upsert(pRows([e])); // a failed upload is retried by the next sync
  }
  function drillTitle(t) { return t === "mixed" ? "Mixed " + drillSetup.measure : t === "missed" ? "Retry missed" : t; }
  function startDrill(topic) {
    var m = drillSetup.measure, ids = GRE_PRACTICE.pick(PBANK, PTOPICS, { measure: m, topic: topic, n: drillSetup.n }, plog, Math.random);
    if (!ids.length) return toast("No questions to practise here yet.");
    drill = { measure: m, topic: topic, ids: ids, i: 0, answers: {}, checked: {}, ok: {}, secs: {}, shownAt: 0, timer: drillSetup.timer, pace: m === "Quant" ? 105 : 90, done: false };
    ui.calc.show = false; render(); window.scrollTo(0, 0);
  }
  function renderDrill() {
    stopTimer();
    if (!drill) return renderDrillSetup();
    if (drill.done) return renderDrillSummary();
    var q = PQ[drill.ids[drill.i]], checked = drill.checked[q.id], a = drill.answers[q.id];
    if (!checked && !drill.shownAt) drill.shownAt = Date.now();
    renderBar(drillTitle(drill.topic), "Question " + (drill.i + 1) + " of " + drill.ids.length + " · " + q.topic, { q: q, test: PBANK, sectionKey: drill.measure, calc: drill.measure === "Quant", nav: true, first: drill.i === 0, exit: true });
    tick = setInterval(paintTimer, 1000);
    on("back", function () { drillPause(); drill.i--; render(); window.scrollTo(0, 0); });
    on("next", function () { drillPause(); if (drill.i < drill.ids.length - 1) drill.i++; else drill.done = true; render(); window.scrollTo(0, 0); });
    on("exitPractice", function () { drillPause(); drill.done = true; ui.calc.show = false; render(); window.scrollTo(0, 0); });
    var ok = drill.ok[q.id];
    var after = checked ? '<div class="feedback ' + (ok ? "good" : "bad") + '"><strong>' + (ok ? "Correct." : "Not quite.") + "</strong> Correct answer: " + esc(keyText(PBANK, q)) + "<br>" + esc(q.explain) + "</div>" :
      '<div class="row"><button class="btn primary" id="check"' + (answered(q, a) ? "" : " disabled") + ">Check answer</button></div>";
    layoutQuestion(PBANK, q, a, checked, after);
    if (!checked) wireQuestion(q, function () { renderDrill(); });
    on("check", function () {
      var secs = drillSecs(), right = isCorrect(q, drill.answers[q.id]);
      drill.secs[q.id] = secs; drill.shownAt = 0; drill.checked[q.id] = true; drill.ok[q.id] = right;
      logPractice(q, right, secs); render();
    });
  }
  function renderDrillSetup() {
    var m = drillSetup.measure, st = GRE_PRACTICE.stats(PBANK, PTOPICS, m, plog);
    var missed = PBANK.questions.filter(function (q) { return PTOPICS[q.topic] === m && plog[q.id] && plog[q.id].ok === false; }).length;
    var all = { total: 0, seen: 0, correct: 0 };
    Object.keys(st).forEach(function (t) { all.total += st[t].total; all.seen += st[t].seen; all.correct += st[t].correct; });
    function line(s) { return s.seen + " of " + s.total + " done" + (s.seen ? " · " + Math.round(100 * s.correct / s.seen) + "% correct" : ""); }
    function card(title, meta, topic, disabled) { return '<div class="panel tcard"><h3>' + esc(title) + '</h3><div class="meta">' + esc(meta) + '</div><div class="row"><button class="btn primary" data-dtopic="' + esc(topic) + '"' + (disabled ? " disabled" : "") + ">Start</button></div></div>"; }
    function seg(attr, val, cur, label) { return '<button class="btn' + (val === cur ? " primary" : "") + '" ' + attr + '="' + val + '">' + label + "</button>"; }
    app.innerHTML = '<div class="stack"><div class="row" style="justify-content:space-between"><div class="stack" style="gap:6px"><span class="eyebrow">Untimed unless you time yourself</span><h1>Practice by topic</h1></div><button class="btn" id="home">Back to tests</button></div>' +
      '<p class="prose" style="margin:0">Questions written for this practice bank only, at 160+ difficulty; they never appear in the tests. Answer one at a time, check it, and read the explanation. ' +
      (store === "account" ? "Your progress is saved to your account." : "Your progress is saved in this browser" + (store === "browser" && !accountsOff ? "; log in to keep it in an account." : ".")) + "</p>" +
      '<div class="row">' + seg("data-dm", "Quant", m, "Quant") + seg("data-dm", "Verbal", m, "Verbal") + "</div>" +
      '<div class="row small"><span>Questions per session</span>' + [5, 10, 20].map(function (n) { return seg("data-dn", n, drillSetup.n, n); }).join("") +
      '<label class="row" style="gap:6px"><input type="checkbox" id="dTimer"' + (drillSetup.timer ? " checked" : "") + "> Time myself (" + (m === "Quant" ? "1:45" : "1:30") + " per question, GRE pace)</label></div>" +
      '<div class="tests">' + card("Mixed " + m, line(all) + ". All topics, unseen questions first.", "mixed") +
      card("Retry missed", missed ? missed + " question" + (missed > 1 ? "s" : "") + " you got wrong." : "Nothing to retry yet.", "missed", !missed) +
      Object.keys(st).map(function (t) { return card(t, line(st[t]), t); }).join("") + "</div></div>";
    on("home", function () { go({ name: "home" }); });
    app.querySelectorAll("[data-dm]").forEach(function (b) { b.addEventListener("click", function () { drillSetup.measure = b.dataset.dm; render(); }); });
    app.querySelectorAll("[data-dn]").forEach(function (b) { b.addEventListener("click", function () { drillSetup.n = +b.dataset.dn; render(); }); });
    var tb = document.getElementById("dTimer"); if (tb) tb.addEventListener("change", function () { drillSetup.timer = tb.checked; });
    app.querySelectorAll("[data-dtopic]").forEach(function (b) { b.addEventListener("click", function () { startDrill(b.dataset.dtopic); }); });
  }
  function renderDrillSummary() {
    var done = drill.ids.filter(function (id) { return drill.checked[id]; }), right = done.filter(function (id) { return drill.ok[id]; }).length;
    var total = done.reduce(function (s, id) { return s + (drill.secs[id] || 0); }, 0);
    var rows = drill.ids.map(function (id, i) {
      var q = PQ[id], res = !drill.checked[id] ? '<span class="pill skip">Skipped</span>' : drill.ok[id] ? '<span class="pill good">Correct</span>' : '<span class="pill bad">Wrong</span>';
      return "<tr><td>" + (i + 1) + "</td><td>" + esc(q.topic) + '<span class="muted small"> · ' + esc(q.skill) + "</span></td><td>" + res + '</td><td class="num">' + (drill.checked[id] ? fmt(drill.secs[id]) : "") + '</td><td><button class="btn" data-drev="' + i + '">Review</button></td></tr>';
    }).join("");
    app.innerHTML = '<div class="stack"><div class="stack" style="gap:6px"><span class="eyebrow">' + esc(drillTitle(drill.topic)) + "</span><h1>" + right + " of " + drill.ids.length + " correct</h1></div>" +
      '<p class="prose" style="margin:0">' + done.length + " answered in " + fmt(total) + (done.length ? " (" + fmt(total / done.length) + " per question; GRE pace is " + fmt(drill.pace) + ")" : "") + ".</p>" +
      '<div class="panel scroll-x"><table class="plain"><thead><tr><th>#</th><th>Topic</th><th>Result</th><th>Time</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="row"><button class="btn primary" id="dAgain">Another ' + drill.ids.length + "</button><button class=\"btn\" id=\"dTopics\">Choose a topic</button><button class=\"btn\" id=\"home\">Back to tests</button></div></div>";
    app.querySelectorAll("[data-drev]").forEach(function (b) { b.addEventListener("click", function () { drill.i = +b.dataset.drev; drill.done = false; render(); window.scrollTo(0, 0); }); });
    on("dAgain", function () { drillSetup.measure = drill.measure; startDrill(drill.topic); });
    on("dTopics", function () { drill = null; render(); window.scrollTo(0, 0); });
    on("home", function () { go({ name: "home" }); });
  }

  window.__gre = { CFG: CFG, TESTS: TESTS, isCorrect: isCorrect, calcEval: calcEval, calcFormat: calcFormat };
  render();
  initDb();
})();
</script>
