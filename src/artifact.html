<style>
/* Layout: a computer-based test console. Home lists tests and history; inside a test, a sticky toolbar and one question per screen, passage or data beside the question on wide screens. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #18212b; --muted: #5a6573; --line: #d5dbe2;
  --accent: #1d5a86; --accent-ink: #ffffff; --accent-soft: #e3edf5;
  --flag: #a8660f; --flag-soft: #fbefdc; --good: #2b7a4b; --good-soft: #e2f2e8; --bad: #ad3434; --bad-soft: #f8e3e3;
  --c1: #1d5a86; --c2: #c07a1a; --c3: #5b8a3a;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c;
  --c1: #6ea9d8; --c2: #e0a24a; --c3: #8cc46a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c;
  --c1: #6ea9d8; --c2: #e0a24a; --c3: #8cc46a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-ui); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button { font: inherit; cursor: pointer }
button:disabled { cursor: not-allowed; opacity: .5 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar-in { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-title { font-weight: 600 }
.bar-sub { color: var(--muted); font-size: 13px }
.bar-tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.timer { font-family: var(--f-num); font-variant-numeric: tabular-nums; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 76px; text-align: center; background: var(--surface); color: var(--ink) }
.timer.low { color: var(--bad); border-color: var(--bad) }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 6px }
.btn:hover:not(:disabled) { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.flagged { background: var(--flag-soft); border-color: var(--flag); color: var(--flag) }
.btn.big { padding: 10px 20px; font-size: 16px }
.btn.danger { border-color: var(--bad); color: var(--bad) }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0 }
h1 { font-size: 28px; font-weight: 600 }
h2 { font-size: 21px; font-weight: 600 }
h3 { font-size: 16px; font-weight: 600 }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.stack { display: flex; flex-direction: column; gap: 16px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0 }
.prose { max-width: 70ch }
.prose ul, .prose ol { margin: 0; padding-left: 20px }
.muted { color: var(--muted) }
.small { font-size: 13px }
table.plain { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top }
table.plain th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600 }
.num { font-family: var(--f-num) }
.scroll-x { overflow-x: auto }
.tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px }
.tcard { display: flex; flex-direction: column; gap: 10px }
.tcard .meta { font-size: 13px; color: var(--muted) }
.q-grid { display: grid; grid-template-columns: 1fr; gap: 20px }
.q-grid.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
@media (max-width: 760px) { .q-grid.split { grid-template-columns: 1fr } }
.passage { font-family: var(--f-read); font-size: 16.5px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0 }
.passage p { margin: 0 0 12px }
.passage p:last-child { margin: 0 }
.passage .s { border-radius: 3px }
.passage.selectable .s { cursor: pointer }
.passage.selectable .s:hover { background: var(--accent-soft) }
.passage .s.on { background: var(--accent); color: var(--accent-ink) }
.stem { font-family: var(--f-read); font-size: 17px; line-height: 1.65; min-width: 0 }
.direction { font-size: 13px; color: var(--muted); font-style: italic }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--ink) }
.opt:hover { border-color: var(--accent) }
.opt .mk { flex: 0 0 auto; width: 22px; height: 22px; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-top: 1px }
.opt.round .mk { border-radius: 50% }
.opt.square .mk { border-radius: 3px }
.opt.on { border-color: var(--accent); background: var(--accent-soft) }
.opt.on .mk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.opt.key { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good) }
.opt .tx { min-width: 0 }
.blanks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px }
.blank-col { display: flex; flex-direction: column; gap: 6px }
.blank-col .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase }
.cell { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 10px; border-radius: 4px; text-align: center; font-family: var(--f-read); font-size: 16px }
.cell:hover { border-color: var(--accent) }
.cell.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.cell.key { box-shadow: 0 0 0 2px var(--good) }
.qc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.qc > div { border: 1px solid var(--line); border-radius: 6px; padding: 12px; text-align: center; background: var(--surface); min-width: 0 }
.qc .h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.qc .v { font-family: var(--f-read); font-size: 17px }
.given { text-align: center; font-family: var(--f-read); font-size: 16.5px }
.numin { font: 18px var(--f-num); padding: 8px 10px; width: 180px; max-width: 100%; border: 1.5px solid var(--muted); border-radius: 4px; background: var(--surface); color: var(--ink) }
.frac { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; align-self: flex-start }
.frac hr { width: 100%; border: 0; border-top: 2px solid var(--ink); margin: 0 }
.frac .numin { width: 120px; text-align: center }
.essay-tools { display: flex; gap: 6px; flex-wrap: wrap }
.essay-box { width: 100%; min-height: 380px; font: 16px/1.6 var(--f-read); padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); resize: vertical }
.data-table caption { caption-side: top; text-align: left; font-weight: 600; padding-bottom: 6px }
.chart svg { width: 100%; height: auto; display: block }
.chart text { fill: var(--ink); font-family: var(--f-ui); font-size: 12px }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .axis { stroke: var(--muted); stroke-width: 1 }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.rv button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 10px }
.rv button:hover { border-color: var(--accent) }
.rv .st { display: block; font-size: 12px; color: var(--muted) }
.rv .st.unans { color: var(--bad) }
.rv .flag { color: var(--flag); font-weight: 600 }
.calc { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 248px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 10px }
.calc .disp { font: 20px var(--f-num); text-align: right; padding: 8px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums; position: relative }
.calc .disp .m { position: absolute; left: 8px; top: 4px; font-size: 11px; color: var(--muted) }
.calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px }
.calc .keys button { padding: 8px 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; font-family: var(--f-num) }
.calc .keys button.wide { grid-column: span 4; font-family: var(--f-ui); font-size: 13px }
.calc .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600 }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 16px }
.modal .panel { max-width: 640px; width: 100%; max-height: 85vh; overflow: auto }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0 }
.score .big { font: 600 44px/1 var(--f-num); font-variant-numeric: tabular-nums; margin: 6px 0 }
.score .range { font-family: var(--f-num); font-size: 14px }
.scale { position: relative; height: 8px; background: var(--line); border-radius: 4px; margin: 14px 0 6px }
.scale .band { position: absolute; top: 0; height: 8px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 4px }
.scale .pt { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; transform: translateX(-2px) }
.scale-lbl { display: flex; justify-content: space-between; font: 11px var(--f-num); color: var(--muted) }
.unofficial { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px }
.unofficial div { border: 1px solid var(--line); border-radius: 8px; padding: 18px; background: var(--surface); text-align: center }
.unofficial b { display: block; font: 600 48px/1.1 var(--f-num) }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
.pill.good { color: var(--good); background: var(--good-soft) }
.pill.bad { color: var(--bad); background: var(--bad-soft) }
.pill.skip { color: var(--muted) }
.pill.warn { color: var(--flag); background: var(--flag-soft) }
.qrev { border-top: 1px solid var(--line); padding-block: 14px; display: flex; flex-direction: column; gap: 6px }
.qrev .ex, .feedback { background: var(--bg); border-radius: 6px; padding: 10px 12px; font-size: 14px }
.feedback.good { border-left: 3px solid var(--good) }
.feedback.bad { border-left: 3px solid var(--bad) }
details > summary { cursor: pointer; font-weight: 600; padding-block: 6px }
.copybox { width: 100%; min-height: 160px; font: 13px var(--f-num); padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink) }
.note { border-left: 3px solid var(--flag); background: var(--flag-soft); padding: 10px 14px; border-radius: 0 6px 6px 0 }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); padding: 12px 14px; border-radius: 6px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

]}, "version": "8249df475b"}, "tests": [{"id": "test-01", "title": "Practice Test 1", "order": ["V1", "V2", "Q1", "Q2"], "essay": {"minutes": 30, "variant": "recommendation", "prompt": "Governments should place greater emphasis on funding basic scientific research, which has no immediate practical purpose, than on research aimed at solving specific practical problems.", "instructions": "Write a response in which you discuss how far you agree or disagree with this recommendation and explain the reasoning behind your position. As you develop your position, consider specific situations in which following the recommendation would and would not be beneficial, and explain how these situations shape your view."}, "passages": {"guilds": ["For much of the twentieth century, historians treated the medieval guild primarily as an obstacle to economic growth.", "Guilds, the argument ran, restricted entry into trades, fixed prices and suppressed innovation in order to protect the incomes of existing masters.", "More recent scholarship has complicated this picture.", "Several economic historians have pointed out that guilds also enforced quality standards, which allowed buyers in distant markets to trust goods they could not inspect in person.", "Others have noted that guild apprenticeships provided a structured way of passing on skills at a time when few other forms of training existed.", "None of these scholars claims that guilds were economically benign; rather, they argue that the institutions' effects varied with local circumstances and cannot be summarised by a single verdict."], "predators": ["Some ecologists have proposed reintroducing large predators, such as wolves, to regions from which they were eliminated, on the grounds that predators regulate populations of grazing animals and thereby allow vegetation to recover.", "Critics respond that the evidence for such cascading effects is drawn largely from a handful of well-publicised cases, and that in many landscapes human activity, rather than grazing, is the main constraint on plant growth.", "In such places, they argue, reintroduced predators might reduce grazing without producing any visible recovery in vegetation."], "industry": ["The standard account of the Industrial Revolution emphasises technological invention: the steam engine, the spinning jenny and the power loom are presented as the engines of transformation.", "Yet economic historians have long observed that many of these devices were known for decades before they were widely adopted.", "Robert Allen has argued that the timing of adoption is better explained by relative prices.", "In eighteenth-century Britain, wages were high and coal was cheap compared with continental Europe, so machines that substituted cheap energy for expensive labour were profitable there but not elsewhere.", "On this view, invention was less a cause of industrialisation than a response to it: inventors directed their efforts toward the technologies that local conditions rewarded.", "Critics have questioned whether British wages were in fact as high as Allen claims, but even they generally accept that the profitability of a technique, rather than its mere existence, determined how quickly it spread."], "maps-history": ["Historians of cartography once judged early modern maps chiefly by their accuracy, ranking each according to how closely its coastlines matched those revealed by later surveys.", "This approach produced a tidy story of steady progress, but it obscured the purposes for which many maps were made.", "A map commissioned to support a territorial claim, for instance, might deliberately exaggerate the extent of a ruler's lands, while one produced for merchants might leave out inland regions altogether because they were irrelevant to trade.", "To call such maps 'inaccurate' is to judge them by a standard their makers did not share.", "Recent scholars have therefore begun to read maps as arguments rather than as mere records, asking whom a map was meant to persuade, and of what.", "This shift has not abandoned the question of accuracy entirely; rather, it treats accuracy as one aim among several, and not always the most important one."], "night-pollination": ["Many plants that flower at night produce pale, strongly scented blossoms, traits long assumed to attract moths, which forage in darkness.", "Because moths are less efficient pollinators than bees (they visit fewer flowers per hour and carry less pollen), botanists generally regarded night-time pollination as a minor supplement to daytime activity.", "A recent field study challenges this view.", "By covering flowers either during the day or during the night, the researchers found that, for several species, flowers open to visitors only at night set nearly as many seeds as flowers open to visitors only during the day.", "The authors suggest that moths' long flights between plants may make up for their slow pace, since pollen carried farther is more likely to reach a genetically different plant."], "halden-hygiene": ["Two years ago the town of Halden began requiring every restaurant to display its official hygiene rating at its entrance.", "In the year after the rule took effect, the number of recorded cases of food poisoning in Halden fell by 30 per cent.", "The town council has concluded that displaying the ratings led restaurants to improve their hygiene."], "household-ledgers": {"paragraphs": [["Economic historians who set out to measure women's contribution to pre-industrial economies long relied on tax rolls and guild registers, sources that recorded property and formal occupations.", "Because married women seldom held property or guild membership in their own names, these records tended to erase them from the economic landscape, and historians concluded, not unreasonably given their evidence, that women's work had been marginal to the market.", "Over the past few decades, however, researchers have turned to a less obvious source: household account books, in which families noted day-to-day purchases, sales and debts, often naming the member of the household who had handled each one.", "These ledgers show wives selling surplus dairy produce, lending small sums to neighbours and bargaining with merchants, activities for which the official records had no column."], ["It would be tempting to conclude that the earlier picture was simply wrong and that women were as economically active as men.", "Yet account books, for all the detail they preserve, have biases of their own.", "They survive disproportionately from literate and relatively prosperous households, and they were often kept by husbands, who may have entered a wife's transactions under their own names or left out those they regarded as trivial.", "The ledgers therefore do not so much replace the older evidence as expose an assumption built into every source: each type of record makes some kinds of work visible precisely by rendering others invisible.", "What historians can reasonably claim, then, is not a precise measure of women's economic activity but a recognition that its apparent scale has always depended on the documents chosen to measure it."]]}, "inhaler-cap": ["Critics of a proposed cap on the price of a widely used asthma inhaler argue that it would discourage manufacturers from developing improved inhalers.", "Their reasoning is that the cap would reduce manufacturers' revenues, and that lower revenues mean smaller research budgets.", "Yet the cap would apply only to existing inhalers, not to any improved model brought to market later.", "If anything, then, the cap would make developing an improved inhaler more attractive, since a new model would be a manufacturer's only way to escape it."], "e-forgiving-streets": {"paragraphs": [["For much of the twentieth century, traffic engineers designed streets on a principle sometimes called forgiving design: if a road gave drivers generous room for error, their mistakes would less often turn into crashes.", "Lanes were widened, curves were straightened, and trees and other roadside objects were cleared away, so that a driver who drifted or misjudged a bend would have space to recover.", "The principle seemed self-evident, and it was applied not only to highways but also to residential and shopping streets, where it helped produce the broad, open roads typical of many suburbs built after the Second World War."], ["Beginning in the 1990s, however, a number of urban designers argued that forgiving design rested on a mistaken picture of how people drive.", "Drivers, they pointed out, do not hold to a fixed speed and simply enjoy the benefit of extra space; instead, they adjust their speed to how risky a road appears.", "A wide, straight, unobstructed street looks safe, and so it invites faster driving, which can cancel out the margin for error that the design was meant to provide.", "Studies of city streets lent some support to this view: on several urban roads where lanes had been narrowed or trees planted along the kerb, average speeds fell and the number of crashes did not rise, even though drivers now had less room to correct their mistakes.", "Because the harm done when a car strikes a pedestrian depends heavily on the car's speed, the critics concluded that on busy urban streets a design that feels slightly less comfortable to drive may in fact be the safer one."], ["This argument does not show that forgiving design was simply wrong.", "On rural highways, where traffic is meant to move quickly and pedestrians are rare, a driver who leaves the road at high speed still benefits greatly from a wide shoulder and a clear roadside.", "The lesson of the debate is rather that no feature of a street is safe or dangerous in itself: its effect depends on how drivers respond to it, and that response depends in turn on what the street is for."]]}, "e-generation-effect": ["People usually remember a word better if they have produced it themselves than if they have simply read it: someone who completes the pair 'hot–c_ld' is more likely to recall 'cold' later than someone who reads the pair already filled in.", "This advantage, known as the generation effect, was at first attributed to effort: producing a word takes more work than reading it, and the extra work was thought to strengthen the memory.", "Later experiments complicated this account by asking participants to generate made-up nonwords, for example by completing a string of letters according to a rule.", "Although producing the nonwords demanded at least as much effort as producing real words, it gave little or no memory advantage over simply reading them.", "Many researchers now conclude that effort aids memory in this way only when it draws on knowledge already stored there, such as a word's meaning or its links to other words."], "e-yoghurt-aroma": ["A food manufacturer cut the sugar in its strawberry yoghurt by 20 percent and, to compensate, added extra strawberry aroma.", "In blind tastings, panels of regular yoghurt eaters rated the new recipe exactly as sweet as the original.", "The company concluded that the added aroma had made up for the missing sugar, and it now plans to use the same approach to reduce the sugar in its other desserts."]}, "tables": {"bookshop": {"title": "Annual sales at a bookshop, by category (thousands of units)", "head": ["Category", "2023", "2024"], "rows": [["Fiction", "40", "46"], ["Non-fiction", "25", "30"], ["Children's", "15", "12"], ["Other", "20", "12"], ["Total", "100", "100"]]}, "commute-towns": {"title": "Main way of travelling to work among surveyed workers in two towns (number of workers)", "head": ["Mode", "Northfield", "Southbury"], "rows": [["Car", "120", "90"], ["Bus", "60", "75"], ["Rail", "45", "30"], ["Bicycle", "30", "45"], ["Walking", "45", "60"], ["Total", "300", "300"]]}, "e-sports-shop": {"title": "Monthly sales at a sports shop, January to April", "head": ["Month", "Footballs sold", "Price per football (£)", "Pairs of trainers sold", "Price per pair (£)"], "rows": [["January", "40", "15", "20", "60"], ["February", "60", "15", "25", "60"], ["March", "50", "18", "30", "45"], ["April", "70", "16", "24", "55"]]}}, "charts": {"museum-visitors": {"kind": "bar", "title": "Annual visitors to two museums, 2019–2024 (thousands)", "categories": ["2019", "2020", "2021", "2022", "2023", "2024"], "series": [{"name": "Museum A", "values": [40, 45, 20, 35, 50, 70]}, {"name": "Museum B", "values": [35, 30, 20, 25, 40, 50]}], "yLabel": "Visitors (thousands)", "yMax": 80, "yTicks": 16}}, "sections": {"V1": {"measure": "Verbal", "minutes": 18, "label": "Verbal Reasoning: Section 1", "questions": [{"id": "V1-1", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The scholar's prose is anything but ______: she qualifies nearly every claim, as though afraid of being pinned to a position.", "blanks": [["tentative", "circumspect", "categorical", "laborious", "elliptical"]], "answer": [2], "explain": "'Anything but' needs the opposite of constant qualification, which is categorical (stated without reservation). 'Circumspect' and 'tentative' are the trap: they describe what her prose actually is."}, {"id": "V1-2", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Although the reform was hailed as a ______ for the region's water shortages, engineers warned that it treated only the symptoms of a deeper problem.", "blanks": [["liability", "palliative", "panacea", "pretext", "precedent"]], "answer": [2], "explain": "'Although' sets the praise against a mere treatment of symptoms, so the reform was hailed as a cure-all: panacea. 'Palliative' (relieving symptoms only) is the engineers' view, so it creates no contrast."}, {"id": "V1-3", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Though the critics' warnings were (i)______ as alarmist at the time, events have since (ii)______ them: nearly every risk they identified has materialised.", "blanks": [["heeded", "derided", "echoed"], ["vindicated", "belied", "obscured"]], "answer": [1, 0], "explain": "'As alarmist' and 'though' show the warnings were mocked at first: derided. Risks that materialised prove the critics right, so events vindicated them; 'belied' (shown to be false) is the reverse."}, {"id": "V1-4", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The director's early films were praised for their (i)______, each scene pared to essentials; her later work, by contrast, strikes many critics as (ii)______, so crowded with subplots and digressions that its (iii)______ concerns are hard to discern.", "blanks": [["exuberance", "ambiguity", "economy"], ["austere", "derivative", "diffuse"], ["peripheral", "trivial", "central"]], "answer": [2, 2, 2], "explain": "Scenes 'pared to essentials' show economy. 'By contrast' and 'crowded with subplots' make the later work diffuse (spread out, unfocused), and what gets lost in the clutter is its central concerns; 'austere' would repeat the early praise."}, {"id": "V1-5", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The minister's apology was so ______ that it seemed designed less to acknowledge wrongdoing than to end the discussion as quickly as possible.", "options": ["perfunctory", "contrite", "heartfelt", "cursory", "sincere", "elaborate"], "answer": [0, 3], "explain": "An apology aimed at ending discussion quickly is done with minimal effort: perfunctory and cursory. 'Heartfelt' and 'sincere' are the trap pair: synonyms, but they contradict the rest of the sentence."}, {"id": "V1-6", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "Initially ______ about the merger, the board grew more enthusiastic once the projected savings were confirmed.", "options": ["vocal", "ardent", "lukewarm", "fervent", "tepid", "hostile"], "answer": [2, 4], "explain": "'Grew more enthusiastic' implies a little enthusiasm at first, so tepid and lukewarm. 'Ardent' and 'fervent' form a pair but leave no room to grow more enthusiastic, and 'hostile' has no partner."}, {"id": "V1-7", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Though she was ______ in conversation, rarely offering an opinion unless pressed, her letters reveal decided and often caustic views.", "options": ["dogmatic", "diffident", "opinionated", "gregarious", "voluble", "reserved"], "answer": [1, 5], "explain": "'Rarely offering an opinion' calls for diffident or reserved. 'Opinionated' and 'dogmatic' are the trap pair: they describe the letters, not her conversation."}, {"id": "V1-8", "type": "mc", "skill": "Reading comprehension", "passage": "guilds", "difficulty": 3, "stem": "The sentence 'More recent scholarship has complicated this picture' functions primarily to", "options": ["summarise the evidence presented in the preceding sentence", "introduce the author's rejection of the twentieth-century view", "signal a shift from an established view to evidence that qualifies it", "identify the historians whose view the passage defends", "concede a weakness in the recent scholarship"], "answer": 2, "explain": "The sentence turns from the older 'obstacle' view to newer findings that add to it. 'Complicated' is weaker than 'rejected', and the last sentence confirms that the older criticisms are not dismissed, so outright rejection is the trap."}, {"id": "V1-9", "type": "multi", "skill": "Reading comprehension", "passage": "guilds", "difficulty": 3, "stem": "It can be inferred that the recent scholars described in the passage would agree with which of the following? Select all that apply.", "options": ["Guilds had broadly similar economic effects wherever they existed.", "Earlier historians were mistaken in claiming that guilds restricted entry into trades.", "Some of the restrictive effects attributed to guilds by earlier historians may have been real."], "answer": [2], "explain": "The scholars deny that guilds were 'economically benign', so they leave room for the restrictive effects. They say effects 'varied with local circumstances', which rules out uniform effects, and they never dispute the claim about entry into trades."}, {"id": "V1-10", "type": "sentence", "skill": "Reading comprehension", "passage": "guilds", "difficulty": 3, "stem": "Select the sentence that suggests how an institution that restricted competition might nonetheless have helped trade.", "answer": 3, "explain": "The fourth sentence explains that guild quality standards let buyers in distant markets trust goods they could not inspect, which would help trade. The apprenticeship sentence concerns training, not trade."}, {"id": "V1-11", "type": "mc", "skill": "Reading comprehension", "passage": "predators", "stem": "The critics mentioned in the passage would most likely agree that", "options": ["predators never affect populations of grazing animals", "the benefits of reintroducing predators may depend on local conditions", "vegetation recovery is caused mainly by human activity", "wolves should be removed from regions where they now live", "the well-publicised cases were based on fabricated data"], "answer": 1, "explain": "The critics say that 'in many landscapes' other factors limit plant growth, so the benefit depends on the place. They never deny predators affect grazing.", "difficulty": 2}, {"id": "V1-12", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "predators", "difficulty": 3, "stem": "Which of the following, if true, would most strengthen the critics' position?", "options": ["Many people living near reintroduction sites oppose the presence of wolves.", "Wolf populations in reintroduced regions have grown faster than expected.", "In regions where wolves were reintroduced, grazing animals spent less time feeding in open valleys.", "In several regions, vegetation recovered soon after wolves were reintroduced.", "In regions where wolves were reintroduced, plant cover recovered only in areas where farming and road-building had been limited."], "answer": 4, "explain": "The critics claim that human activity, not grazing, often limits plant growth; recovery only where human activity was limited supports exactly that. Grazing animals avoiding open valleys supports the reintroduction case, not the critics."}]}, "V2M": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "tier": "medium", "questions": [{"id": "VM-1", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The biographer's portrait is scrupulously ______: she records her subject's generosity and his pettiness with equal care, neither extenuating the one nor magnifying the other.", "blanks": [["tendentious", "hagiographic", "desultory", "elegiac", "dispassionate"]], "answer": [4], "explain": "Treating virtues and faults with equal care, excusing neither, is dispassionate (impartial). 'Hagiographic' (treating the subject as a saint) and 'tendentious' (slanted towards a view) both imply the bias the sentence denies."}, {"id": "VM-2", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Though the minister insisted that the new rules were merely ______, opponents argued that they would transform the way every school in the country was run.", "blanks": [["controversial", "costly", "sweeping", "cosmetic", "welcome"]], "answer": [3], "explain": "'Though' and 'merely' set up a contrast with 'transform': the minister claimed the change was only on the surface, which is cosmetic. 'Sweeping' is the opponents' view, not the minister's."}, {"id": "VM-3", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Early reports on the drug were (i)______, citing dramatic improvements in small trials; only when larger studies failed to repeat those results did the medical community's enthusiasm begin to (ii)______.", "blanks": [["guarded", "effusive", "hostile"], ["wane", "spread", "intensify"]], "answer": [1, 0], "explain": "Reports that cite 'dramatic improvements' and create 'enthusiasm' are effusive (gushing). 'Only when ... failed' signals that the enthusiasm then faded: wane."}, {"id": "VM-4", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The archive's new catalogue was meant to make its holdings easier to (i)______; in practice, however, its categories were so (ii)______ that researchers often found documents only by (iii)______, coming across them while looking for something else.", "blanks": [["acquire", "navigate", "preserve"], ["idiosyncratic", "intuitive", "comprehensive"], ["serendipity", "design", "appointment"]], "answer": [1, 0, 0], "explain": "A catalogue exists to help people find their way through a collection: navigate. 'However' means it failed, so its categories were idiosyncratic (peculiar to their maker), and finding things 'while looking for something else' is serendipity (happy accident). 'Comprehensive' is the trap: thoroughness would not make documents hard to find."}, {"id": "VM-5", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The mayor's response to the flooding was widely criticised as ______: officials took nearly a week to visit the worst-affected neighbourhoods.", "options": ["lavish", "tardy", "partisan", "heavy-handed", "transparent", "dilatory"], "answer": [1, 5], "explain": "Taking nearly a week shows slowness: dilatory and tardy both mean late or slow to act. 'Heavy-handed' and 'partisan' are criticisms too, but nothing in the sentence supports them and they have no partner."}, {"id": "VM-6", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "Although the scientist was ______ in private, often joking with her students, her public lectures were famously formal.", "options": ["earnest", "reserved", "stern", "jocular", "punctual", "playful"], "answer": [3, 5], "explain": "'Often joking' defines the blank, and 'although' contrasts it with 'formal': jocular and playful. 'Reserved' and 'stern' describe the public lectures, not her private manner."}, {"id": "VM-7", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The proposal was ______ by the board, which voted unanimously to reject it without further discussion.", "options": ["rebuffed", "postponed", "spurned", "amended", "endorsed", "examined"], "answer": [0, 2], "explain": "Rejecting a proposal outright is to rebuff or spurn it. 'Endorsed' is the opposite, and 'postponed' and 'amended' do not match a unanimous rejection."}, {"id": "VM-8", "type": "mc", "skill": "Reading comprehension", "passage": "maps-history", "difficulty": 2, "stem": "The passage is primarily concerned with", "options": ["comparing maps made for rulers with maps made for merchants", "explaining the surveying methods used by early modern mapmakers", "describing a change in how historians interpret early modern maps and the reasoning behind it", "arguing that early modern maps were more accurate than historians have assumed", "criticising recent scholars for ignoring questions of accuracy"], "answer": 2, "explain": "The passage moves from the old accuracy-based approach to the newer view of maps as arguments, and explains why. Rulers' and merchants' maps are only examples, and the last sentence rules out the claim that recent scholars ignore accuracy."}, {"id": "VM-9", "type": "mc", "skill": "Reading comprehension", "passage": "maps-history", "difficulty": 2, "stem": "The author mentions a map 'produced for merchants' primarily in order to", "options": ["criticise merchants for neglecting inland trade", "illustrate how a map's purpose could shape what it included", "explain why inland regions were poorly understood in the early modern period", "show that merchants valued accuracy more than rulers did", "suggest that commercial maps were more reliable than political ones"], "answer": 1, "explain": "The merchants' map leaves out inland regions because they did not matter for trade, so the example shows purpose deciding content. The passage says nothing about how well inland regions were understood, which is the trap."}, {"id": "VM-10", "type": "multi", "skill": "Reading comprehension", "passage": "maps-history", "difficulty": 3, "stem": "Based on the passage, the author would most likely agree with which of the following statements? Select all that apply.", "options": ["Accuracy is irrelevant to the study of early modern maps.", "A map's omissions may reflect its intended use rather than its maker's ignorance.", "The older approach to the history of cartography gave an incomplete picture."], "answer": [1, 2], "explain": "The merchants' map omits inland regions on purpose, and the older approach 'obscured' the maps' purposes, so it was incomplete. The final sentence says accuracy remains one aim among several, so it is not irrelevant."}, {"id": "VM-11", "type": "sentence", "skill": "Reading comprehension", "passage": "maps-history", "difficulty": 3, "stem": "Select the sentence in which the author indicates that the newer approach retains a concern that was central to the older approach.", "answer": 5, "explain": "The last sentence says the shift 'has not abandoned the question of accuracy', which was the older approach's central concern. The sentence about calling maps 'inaccurate' rejects the older standard rather than keeping it."}, {"id": "VM-12", "type": "mc", "skill": "Reading comprehension", "passage": "night-pollination", "difficulty": 3, "stem": "The botanists' view described in the second sentence depends on the assumption that", "options": ["bees are more numerous than moths in most habitats", "moths visit only plants that flower at night", "a pollinator's contribution depends chiefly on how many flowers it visits and how much pollen it carries", "night-flowering plants are never visited by bees", "pale blossoms attract bees as well as moths"], "answer": 2, "explain": "The botanists judged moths minor only because they visit fewer flowers and carry less pollen, which assumes that those quantities are what count. The study's suggestion that the distance pollen travels also matters attacks exactly this assumption."}, {"id": "VM-13", "type": "mc", "skill": "Reading comprehension", "passage": "night-pollination", "difficulty": 2, "stem": "The researchers covered flowers either during the day or during the night primarily in order to", "options": ["identify which species of moth visited each plant", "prevent moths from damaging the flowers", "separate the contribution of night-time visitors to seed production from that of daytime visitors", "test whether scent attracts moths more strongly than colour does", "measure how much pollen each moth carried"], "answer": 2, "explain": "Covering flowers at one time of day leaves them open only at the other, so the seed counts show what night visitors and day visitors each achieve. Nothing was measured about pollen loads, moth species or scent."}, {"id": "VM-14", "type": "mc", "skill": "Reading comprehension", "passage": "night-pollination", "difficulty": 3, "stem": "The authors' suggestion in the final sentence implies which of the following?", "options": ["Pollen from a genetically different plant can be more useful for reproduction than pollen from a neighbouring plant.", "A pollinator's speed is the main factor in its effectiveness.", "Night-flowering plants cannot set seed without moths.", "Bees seldom carry pollen between plants of the same species.", "Moths visit more flowers per hour than bees do."], "answer": 0, "explain": "Long flights can only 'make up for' slowness if pollen that reaches a genetically different plant is worth more than pollen from close by. The idea that moths visit more flowers per hour contradicts the passage, and the claim about bees goes far beyond it."}, {"id": "VM-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "halden-hygiene", "difficulty": 2, "stem": "Which of the following, if true, would most seriously weaken the council's conclusion?", "options": ["In the same year, Halden's health service changed its procedures so that mild cases of food poisoning were no longer recorded.", "Restaurants in Halden that received low ratings lost customers after the rule took effect.", "The hygiene ratings were awarded by the same inspectors who had inspected Halden's restaurants before the rule.", "Some diners in Halden say they rarely notice the ratings displayed at restaurant entrances.", "Neighbouring towns that did not introduce the rule saw no fall in recorded food poisoning over the same period."], "answer": 0, "explain": "If mild cases simply stopped being recorded, the 30 per cent fall could reflect a change in counting rather than better hygiene. Unaffected neighbouring towns and customers deserting low-rated restaurants support the council; 'some diners' not noticing the ratings is too weak to matter."}]}, "V2H": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "tier": "harder", "questions": [{"id": "VH-1", "type": "tc", "skill": "Text completion", "stem": "Far from being ______, the historian's prose is so dense with qualification that readers often lose track of her argument.", "blanks": [["recondite", "tortuous", "prolix", "pedantic", "limpid"]], "answer": [4], "explain": "'Far from being' needs the opposite of dense and hard to follow: limpid (perfectly clear). The other options all describe difficult prose.", "difficulty": 3}, {"id": "VH-2", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "Although the essayist cultivated a reputation for ______, her private notebooks reveal a writer who drafted and redrafted even her most seemingly offhand remarks.", "blanks": [["reticence", "erudition", "fastidiousness", "artlessness", "candour"]], "answer": [3], "explain": "'Although' contrasts the reputation with careful redrafting, so the reputation was for unstudied naturalness: artlessness. 'Fastidiousness' describes what the notebooks show, and 'candour' is tempting but is not the opposite of careful drafting."}, {"id": "VH-4", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The historian argues that the treaty's (i)______ was the source of both its success and its eventual failure: language vague enough for each government to claim victory secured (ii)______ in the short term, but because the underlying disputes had been (iii)______ rather than settled, they resurfaced within a decade.", "blanks": [["brevity", "equivocation", "severity"], ["ratification", "scrutiny", "repudiation"], ["papered over", "adjudicated", "exacerbated"]], "answer": [1, 0, 0], "explain": "Language 'vague enough for each government to claim victory' is equivocation, which explains the short-term success: both sides accepted it (ratification). Disputes that were hidden 'rather than settled' and later resurfaced were papered over; 'adjudicated' would mean settled, which the sentence denies."}, {"id": "VH-5", "type": "tc", "skill": "Text completion", "stem": "Scholars once regarded the poet's late works as (i)______, the hasty products of a mind in decline; yet a closer reading reveals a deliberate (ii)______, a stripping away of ornament in pursuit of clarity.", "blanks": [["slapdash", "derivative", "sublime"], ["extravagance", "ambiguity", "austerity"]], "answer": [0, 2], "explain": "'Hasty products' = slapdash (careless). 'Stripping away of ornament' = austerity (plainness).", "difficulty": 3}, {"id": "VH-6", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The minister's (i)______ on the subject, long taken as evidence of indifference, now appears to have been (ii)______: newly released papers show that she was quietly (iii)______ the very policy she declined to discuss in public.", "blanks": [["garrulity", "taciturnity", "forthrightness"], ["inadvertent", "characteristic", "calculated"], ["publicising", "neglecting", "undermining"]], "answer": [1, 2, 2], "explain": "Declining to discuss the policy is taciturnity (habitual silence). Silence mistaken for indifference but concealing active work was calculated, and the work must be something done quietly that is not indifference: undermining. 'Neglecting' would confirm the indifference, and 'publicising' contradicts 'quietly'."}, {"id": "VH-8", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "Ordinarily the most ______ of reviewers, she astonished readers by devoting an entire column to unqualified praise of a first novel.", "options": ["laudatory", "prolific", "effusive", "captious", "perspicacious", "carping"], "answer": [3, 5], "explain": "Her astonishing praise must contrast with her usual manner, so she is normally fault-finding: captious and carping. 'Effusive' and 'laudatory' are the trap: they are close in meaning but describe the praise, not her ordinary habit."}, {"id": "VH-9", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Far from ______ the committee's concerns, the chair's reassurances only deepened them, since they rested on the very figures the committee had already shown to be unreliable.", "options": ["aggravating", "corroborating", "allaying", "assuaging", "articulating", "exacerbating"], "answer": [2, 3], "explain": "'Far from' sets the blank against 'only deepened them', so it must mean easing: allaying and assuaging. 'Exacerbating' and 'aggravating' form a pair too, but they mean deepening, which the sentence says the reassurances did rather than failed to do."}, {"id": "VH-10", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "The scholar's later essays are ______ in a way that her admirers call economy and her detractors call evasion: she gestures towards conclusions she never quite states.", "options": ["didactic", "oblique", "elliptical", "verbose", "strident", "prolix"], "answer": [1, 2], "explain": "Gesturing at conclusions without stating them is indirect and allusive: oblique and elliptical. 'Prolix' and 'verbose' are the trap pair: they are synonyms, but wordiness is the opposite of the 'economy' her admirers see."}, {"id": "VH-11", "type": "mc", "skill": "Reading comprehension", "passage": "industry", "difficulty": 3, "stem": "Which of the following is most strongly supported by the passage?", "options": ["If British wages had been as high as Allen claims, his critics would accept his account in full.", "Inventors in continental Europe were less skilled than those in Britain.", "Allen's critics reject his explanation of why machinery spread faster in Britain than elsewhere.", "The long delay between the invention of many devices and their adoption is better accounted for by Allen's view than by the standard account.", "Allen holds that invention played no part in industrialisation."], "answer": 3, "explain": "The 'Yet' after the standard account presents the delay as a problem for it, and Allen's price explanation is offered as accounting for the timing of adoption. The critics accept his central point about profitability, and calling invention 'less a cause of industrialisation than a response to it' does not mean invention played no part."}, {"id": "VH-12", "type": "multi", "skill": "Reading comprehension", "passage": "industry", "stem": "Allen's argument, as described in the passage, would predict which of the following? Select all that apply.", "options": ["Inventors would focus on technologies that local prices made profitable.", "A labour-saving machine would be adopted more quickly where wages are high.", "Countries with expensive coal would be the first to adopt coal-powered machines."], "answer": [0, 1], "explain": "High wages make a labour-saving machine profitable, and inventors respond to what local prices reward, so both of those predictions follow from Allen's view. The claim about countries with expensive coal reverses his logic: dear coal would discourage coal-powered machines.", "difficulty": 3}, {"id": "VH-13", "type": "mc", "skill": "Reading comprehension", "passage": "industry", "difficulty": 3, "stem": "The final sentence of the passage primarily serves to", "options": ["indicate that a central element of Allen's position survives a dispute over one of his premises", "show that Allen's critics have refuted his estimate of British wages", "suggest that the existence of a technique matters more than its profitability", "introduce a new explanation for the timing of industrialisation", "concede that Allen's argument depends entirely on his estimate of wages"], "answer": 0, "explain": "The critics question Allen's wage figures, a premise, yet still accept that profitability rather than mere existence governed adoption, his central claim. They only 'questioned' the wages, so 'refuted' overstates their position."}, {"id": "VH-3", "type": "mc", "skill": "Reading comprehension", "passage": "household-ledgers", "difficulty": 4, "stem": "The author would most likely agree with which of the following statements about the historians who relied on tax rolls and guild registers?", "options": ["Their conclusions would have been reversed had they consulted household account books.", "They were right that women's work was marginal, though for the wrong reasons.", "Their error lay less in how they reasoned from their sources than in treating those sources as complete.", "Their methods are no longer used by economic historians.", "They reasoned carelessly from evidence that should have warned them of its gaps."], "answer": 2, "explain": "The author calls their conclusion 'not unreasonably given their evidence' but shows the records had no column for much of women's work, so the fault was in the sources' coverage, not the reasoning. 'Reversed' is the trap: the author warns that the ledgers do not simply show the earlier picture was wrong."}, {"id": "VH-7", "type": "mc", "skill": "Reading comprehension", "passage": "household-ledgers", "difficulty": 3, "stem": "The sentence 'It would be tempting to conclude that the earlier picture was simply wrong and that women were as economically active as men' functions primarily to", "options": ["concede a limitation of account books as historical evidence", "present the author's main thesis", "state the conclusion that the account books establish", "summarise the view of the historians who relied on tax rolls", "introduce an overstatement that the author goes on to qualify"], "answer": 4, "explain": "'Tempting' signals a conclusion the author will resist, and the next sentence ('Yet account books, for all the detail they preserve, have biases of their own') begins to qualify it. Treating it as the author's thesis is the trap: the thesis comes in the final sentence."}, {"id": "VH-14", "type": "sentence", "skill": "Reading comprehension", "passage": "household-ledgers", "difficulty": 3, "stem": "Select the sentence in which the author moves from the shortcomings of one kind of record to a claim about records of every kind.", "answer": 7, "explain": "The eighth sentence draws on the ledgers' biases ('therefore') to conclude that every type of record makes some work visible by hiding other work. The sentence before it lists faults of the ledgers alone, and the final sentence states what historians can claim rather than generalising about records."}, {"id": "VH-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "inhaler-cap", "difficulty": 4, "stem": "In the argument, the statement that the cap would apply only to existing inhalers plays which of the following roles?", "options": ["It is offered to show that manufacturers' research budgets do not depend on their revenues.", "It is the main conclusion of the argument.", "It is a premise that the critics use to support their prediction.", "It is a consideration that the author concedes counts against the main conclusion.", "It is a premise offered in support of a conclusion that runs counter to the critics' prediction."], "answer": 4, "explain": "The author introduces the fact ('Yet') and uses it to reach the final conclusion ('then') that the cap would encourage new models, the opposite of the critics' prediction. The author never disputes the link between revenue and research budgets, which is the tempting wrong role."}]}, "Q1": {"measure": "Quant", "minutes": 21, "label": "Quantitative Reasoning: Section 1", "questions": [{"id": "Q1-1", "type": "qc", "skill": "Algebra", "given": "x > 0", "qa": "x / (x + 1)", "qb": "(x + 1) / (x + 2)", "answer": 1, "explain": "Cross-multiply (both denominators are positive): compare x(x + 2) = x² + 2x with (x + 1)² = x² + 2x + 1. B is always larger by 1.", "difficulty": 3}, {"id": "Q1-2", "type": "qc", "skill": "Number properties", "difficulty": 3, "given": "n is a positive integer.", "qa": "The units digit of 7ⁿ", "qb": "The units digit of 3ⁿ", "answer": 3, "explain": "Units digits of powers of 7 cycle 7, 9, 3, 1 and those of 3 cycle 3, 9, 7, 1. n = 1 gives 7 against 3 (A greater), n = 2 gives 9 and 9 (equal), and n = 3 gives 3 against 7 (B greater)."}, {"id": "Q1-3", "type": "qc", "skill": "Statistics", "difficulty": 3, "given": "The average (arithmetic mean) of x, y and 10 is 20, and x > y.", "qa": "x", "qb": "25", "answer": 0, "explain": "The three numbers total 60, so x + y = 50. Since x is the larger of two numbers that add to 50, x must be greater than 25."}, {"id": "Q1-4", "type": "qc", "skill": "Geometry", "difficulty": 2, "given": "A triangle has sides of lengths 7, 10 and x, where x is an integer.", "qa": "x", "qb": "17", "answer": 1, "explain": "Each side must be less than the sum of the other two, so x < 7 + 10 = 17; the largest possible integer is 16. The trap is allowing x = 17, which would flatten the triangle into a line."}, {"id": "Q1-5", "type": "mc", "skill": "Ratios", "difficulty": 3, "stem": "At an animal shelter, the ratio of cats to dogs is 3 : 5. After 12 cats are adopted and 4 more dogs arrive, the ratio of cats to dogs becomes 1 : 3. How many cats were at the shelter originally?", "options": ["30", "36", "40", "45", "50"], "answer": 0, "explain": "Write the numbers as 3k cats and 5k dogs. Then (3k − 12) : (5k + 4) = 1 : 3, so 9k − 36 = 5k + 4 and k = 10, giving 30 cats."}, {"id": "Q1-6", "type": "mc", "skill": "Coordinate geometry", "difficulty": 3, "stem": "In the xy-plane, line k passes through the points (1, 2) and (5, 10). Line m is perpendicular to line k and passes through the point (4, 0). What is the y-intercept of line m?", "options": ["−4", "−2", "2", "4", "8"], "answer": 2, "explain": "Line k has slope (10 − 2) ÷ (5 − 1) = 2, so line m has slope −1/2. Then y = −(1/2)(x − 4), and at x = 0, y = 2."}, {"id": "Q1-7", "type": "numeric", "skill": "Rates", "difficulty": 3, "stem": "A driver travels 120 km from town P to town Q at an average speed of 60 km/h and returns along the same road at an average speed of 40 km/h. What is the average speed, in kilometres per hour, for the whole round trip?", "answer": 48, "explain": "The trip out takes 2 hours and the return 3 hours, so 240 km takes 5 hours: 48 km/h. Averaging the two speeds to get 50 is the trap, because more time is spent at the slower speed."}, {"id": "Q1-8", "type": "multi", "skill": "Algebra", "difficulty": 4, "stem": "If x is an integer and |x − 4| < 3, which of the following could be the value of x² − 6x? Select all that apply.", "options": ["−9", "−8", "−6", "−5", "0", "7"], "answer": [0, 1, 3, 4], "explain": "|x − 4| < 3 means 1 < x < 7, so x is 2, 3, 4, 5 or 6. Then x² − 6x is −8, −9, −8, −5 and 0, so −6 and 7 are impossible."}, {"id": "Q1-9", "type": "mc", "skill": "Statistics", "difficulty": 4, "stem": "The mean of the five numbers 2, 5, 9, 12 and x is equal to their median. What is the sum of all possible values of x?", "options": ["7", "14", "17", "19", "21"], "answer": 4, "explain": "The sum is 28 + x, so the mean is (28 + x)/5. The median depends on where x falls: if x ≤ 5 the median is 5 and x = −3; if 5 ≤ x ≤ 9 the median is x and x = 7; if x ≥ 9 the median is 9 and x = 17. All three work, so the sum is −3 + 7 + 17 = 21."}, {"id": "Q1-10", "type": "fraction", "skill": "Probability", "stem": "A bag holds 4 red and 6 blue marbles. Two marbles are drawn at random without replacement. What is the probability that both are red? Give your answer as a fraction.", "answer": [2, 15], "explain": "4/10 × 3/9 = 12/90 = 2/15. Any equivalent fraction is accepted.", "difficulty": 2}, {"id": "Q1-11", "type": "mc", "skill": "Data interpretation", "table": "bookshop", "difficulty": 3, "stem": "In 2024 the average price of a non-fiction book sold at the bookshop was £12, and the bookshop's total revenue from non-fiction was 20% higher than in 2023. What was the average price of a non-fiction book sold in 2023?", "options": ["£10.00", "£12.00", "£12.50", "£14.40", "£15.00"], "answer": 1, "explain": "2024 revenue = 30,000 × £12 = £360,000, so 2023 revenue = £360,000 ÷ 1.2 = £300,000. Divided by 25,000 books, that is £12.00: unit sales rose by the same 20% as revenue, so the price did not change."}, {"id": "Q1-12", "type": "multi", "skill": "Data interpretation", "table": "bookshop", "difficulty": 3, "stem": "For which categories did sales change by at least 20%, either up or down, from 2023 to 2024? Select all that apply.", "options": ["Fiction", "Non-fiction", "Children's", "Other"], "answer": [1, 2, 3], "explain": "Fiction rose 6/40 = 15%, non-fiction rose 5/25 = 20%, children's fell 3/15 = 20% and other fell 8/20 = 40%. Exactly 20% counts as 'at least 20%', and falls count as well as rises."}]}, "Q2M": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "tier": "medium", "questions": [{"id": "QM-1", "type": "qc", "skill": "Arithmetic", "difficulty": 3, "qa": "The number of integers between −7.5 and 4.2", "qb": "12", "answer": 2, "explain": "The integers are −7, −6, ..., 3, 4: seven negative integers, zero and four positive integers, which is 12. Forgetting zero gives 11, and including −8 or 5 gives 13."}, {"id": "QM-2", "type": "qc", "skill": "Algebra", "difficulty": 2, "given": "x + y = 10 and x − y = 4", "qa": "xy", "qb": "20", "answer": 0, "explain": "Adding the equations gives 2x = 14, so x = 7 and y = 3. Then xy = 21, which is greater than 20."}, {"id": "QM-3", "type": "qc", "skill": "Geometry", "difficulty": 3, "given": "An isosceles triangle has one side of length 5 and another side of length 8.", "qa": "The perimeter of the triangle", "qb": "20", "answer": 3, "explain": "The third side could be 5 (perimeter 18) or 8 (perimeter 21), and both triangles exist. So A could be smaller or larger than 20."}, {"id": "QM-4", "type": "qc", "skill": "Number properties", "difficulty": 3, "given": "x and y are integers and xy = 12.", "qa": "x + y", "qb": "7", "answer": 3, "explain": "x = 3, y = 4 gives 7 (equal) and x = 1, y = 12 gives 13 (A greater). The hidden case is negatives: x = −3, y = −4 gives −7 (B greater)."}, {"id": "QM-5", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "−1 < x < 0", "qa": "x", "qb": "x³", "answer": 1, "explain": "x³ − x = x(x² − 1). Here x is negative and x² − 1 is negative, so the product is positive and x³ > x. For example, x = −0.5 gives x³ = −0.125, which is greater than −0.5."}, {"id": "QM-6", "type": "mc", "skill": "Percentages", "difficulty": 2, "stem": "In a sale, the price of a coat is reduced by 30%. By approximately what percentage must the sale price be increased to bring it back to the original price?", "options": ["30%", "33.3%", "40%", "42.9%", "70%"], "answer": 3, "explain": "The sale price is 0.7 of the original, so it must be multiplied by 1 ÷ 0.7 ≈ 1.429, an increase of about 42.9%. The trap is 30%: the increase is measured from the smaller, sale price."}, {"id": "QM-7", "type": "mc", "skill": "Algebra", "difficulty": 3, "stem": "If x + 1/x = 4, what is the value of x² + 1/x²?", "options": ["14", "16", "18", "20", "22"], "answer": 0, "explain": "Square both sides: x² + 2 + 1/x² = 16, so x² + 1/x² = 14. The trap is 16, which forgets the middle term 2 × x × (1/x) = 2."}, {"id": "QM-8", "type": "mc", "skill": "Geometry", "difficulty": 3, "stem": "A square is drawn inside a large circle so that all four corners of the square lie on the circle. A small circle is drawn inside the square so that it touches all four sides of the square. What is the ratio of the area of the large circle to the area of the small circle?", "options": ["√2 : 1", "2 : 1", "2√2 : 1", "3 : 1", "4 : 1"], "answer": 1, "explain": "If the square has side 2, the small circle has radius 1 and the large circle's radius is half the diagonal, √2. The areas are 2π and π, a ratio of 2 : 1. (√2 : 1 is the ratio of the radii, not the areas.)"}, {"id": "QM-9", "type": "numeric", "skill": "Number properties", "difficulty": 3, "stem": "How many integers from 1 to 100, inclusive, are multiples of 4 or multiples of 6 (or both)?", "answer": 33, "explain": "There are 25 multiples of 4 and 16 multiples of 6, but the 8 multiples of 12 are counted twice: 25 + 16 − 8 = 33."}, {"id": "QM-10", "type": "fraction", "skill": "Probability", "difficulty": 3, "stem": "An integer is chosen at random from the integers 1 to 20, inclusive. What is the probability that it is a multiple of 3 or a prime number (or both)? Give your answer as a fraction.", "answer": [13, 20], "explain": "Multiples of 3: 6 numbers. Primes: 2, 3, 5, 7, 11, 13, 17, 19, which is 8 numbers. The number 3 is in both lists, so 6 + 8 − 1 = 13 of the 20 integers qualify."}, {"id": "QM-11", "type": "multi", "skill": "Algebra", "difficulty": 3, "stem": "If x < 0, which of the following must be positive? Select all that apply.", "options": ["x²", "x³", "−x", "x + |x|", "x² − x"], "answer": [0, 2, 4], "explain": "x² and −x are positive for any negative x, and x² − x is a positive number plus a positive number. x³ is negative, and x + |x| = x − x = 0, which is not positive."}, {"id": "QM-12", "type": "mc", "skill": "Statistics", "difficulty": 2, "stem": "The average (arithmetic mean) of six numbers is 15. When a seventh number is added, the average of the seven numbers is 17. What is the seventh number?", "options": ["17", "19", "23", "26", "29"], "answer": 4, "explain": "The six numbers total 6 × 15 = 90 and the seven total 7 × 17 = 119, so the seventh number is 119 − 90 = 29."}, {"id": "QM-13", "type": "mc", "skill": "Data interpretation", "table": "commute-towns", "difficulty": 3, "stem": "If 20% of the bus users in each town switched to rail, what percentage of all the surveyed workers in the two towns combined would then travel by rail?", "options": ["12.5%", "15%", "17%", "19.5%", "22.5%"], "answer": 2, "explain": "Northfield moves 0.2 × 60 = 12 people and Southbury 0.2 × 75 = 15. Rail becomes 45 + 12 + 30 + 15 = 102 out of 600, which is 17%."}, {"id": "QM-14", "type": "mc", "skill": "Data interpretation", "table": "commute-towns", "difficulty": 2, "stem": "In Southbury, the number of surveyed workers who cycle or walk to work is what percentage greater than the corresponding number in Northfield?", "options": ["25%", "28.6%", "30%", "40%", "52.5%"], "answer": 3, "explain": "Southbury: 45 + 60 = 105; Northfield: 30 + 45 = 75. The difference, 30, divided by Northfield's 75 is 40%. Dividing by 105 instead gives the trap answer 28.6%."}, {"id": "QM-15", "type": "multi", "skill": "Data interpretation", "table": "commute-towns", "difficulty": 3, "stem": "Which of the following statements are true? Select all that apply.", "options": ["In each town, more of the surveyed workers travel by car than by any other single mode.", "The ratio of rail users to bus users is the same in the two towns.", "If 15 of Northfield's car users switched to rail, rail users would make up exactly 20% of Northfield's surveyed workers."], "answer": [0, 2], "explain": "Car is the largest group in both towns (120 and 90). Rail to bus is 45 : 60 = 3 : 4 in Northfield but 30 : 75 = 2 : 5 in Southbury. Rail would become 45 + 15 = 60, and 60 ÷ 300 = 20%."}]}, "Q2H": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "tier": "harder", "questions": [{"id": "QH-1", "type": "numeric", "skill": "Counting", "difficulty": 4, "stem": "How many positive integers less than 1,000 have digits that add up to 10?", "answer": 63, "explain": "Write each number as three digits a, b, c (leading zeros allowed) with a + b + c = 10: there are C(12, 2) = 66 ways to split 10 into three non-negative parts. Three of those use a 'digit' of 10 (10 + 0 + 0 in some order), which is impossible, so the answer is 66 − 3 = 63."}, {"id": "QH-2", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "When the positive integer n is divided by 6, the remainder is 4.", "qa": "The remainder when n is divided by 4", "qb": "The remainder when n is divided by 3", "answer": 3, "explain": "n is 4, 10, 16, 22, ..., so dividing by 3 always leaves 1. Dividing by 4 leaves 0 when n = 4 or 16 but 2 when n = 10 or 22, so A can be smaller or larger than B."}, {"id": "QH-3", "type": "qc", "skill": "Algebra", "difficulty": 4, "given": "x³ < x", "qa": "x", "qb": "x²", "answer": 3, "explain": "x³ − x = x(x − 1)(x + 1) < 0 when 0 < x < 1 or x < −1. For x = 0.5, A (0.5) is greater than B (0.25), but for x = −2, B (4) is greater than A (−2). The trap is to assume only fractions between 0 and 1 satisfy x³ < x."}, {"id": "QH-4", "type": "qc", "skill": "Statistics", "difficulty": 3, "qa": "The standard deviation of the list 0, 10, 10, 10, 10, 10, 10, 20", "qb": "The standard deviation of the list 2, 2, 2, 2, 18, 18, 18, 18", "answer": 1, "explain": "Both lists have mean 10. In list A only two values are away from the mean (by 10 each), so the standard deviation is √(200 ÷ 8) = 5; in list B every value is 8 away, so it is 8. The trap is to judge by range, where A (20) beats B (16)."}, {"id": "QH-5", "type": "numeric", "skill": "Counting", "difficulty": 4, "stem": "How many odd four-digit integers greater than 5,000 have four different digits?", "answer": 1232, "explain": "Choose the thousands digit and the units digit first, because they interact. If the thousands digit is odd (5, 7 or 9), the units digit has 4 odd choices left; if it is even (6 or 8), it has all 5: 3 × 4 + 2 × 5 = 22 pairs. The middle two digits then have 8 × 7 = 56 choices, so 22 × 56 = 1,232."}, {"id": "QH-6", "type": "mc", "skill": "Overlapping sets", "difficulty": 4, "stem": "In a group of 50 people, 40 like tea, 38 like coffee and 36 like juice. What is the least possible number of people in the group who like all three drinks?", "options": ["0", "4", "7", "10", "14"], "answer": 4, "explain": "Count the dislikes: 10 dislike tea, 12 coffee and 14 juice, so at most 10 + 12 + 14 = 36 people dislike at least one drink. At least 50 − 36 = 14 must like all three, and 14 is reached when no one dislikes two drinks."}, {"id": "QH-7", "type": "qc", "skill": "Absolute value", "difficulty": 3, "given": "|x − 2| = 2x − 7", "qa": "x", "qb": "5", "answer": 2, "explain": "If x ≥ 2, then x − 2 = 2x − 7, so x = 5, which works. If x < 2, then 2 − x = 2x − 7 gives x = 3, which contradicts x < 2 (check: |3 − 2| = 1 but 2 × 3 − 7 = −1). So x = 5 is the only solution, and accepting x = 3 to choose 'cannot be determined' is the trap."}, {"id": "QH-8", "type": "multi", "skill": "Number properties", "stem": "If n is an odd integer, which of the following must be true? Select all that apply.", "options": ["n² + 1 is even", "3n is even", "n(n + 1) is even", "(n + 3) / 2 is odd", "n² − 1 is divisible by 8"], "answer": [0, 2, 4], "explain": "Odd × odd is odd, so n² + 1 is even, and n(n + 1) contains the even factor n + 1. n² − 1 = (n − 1)(n + 1) is the product of two consecutive even numbers, one of them a multiple of 4, so 8 divides it. 3n is odd, and n = 1 gives (n + 3)/2 = 2, which is even.", "difficulty": 4}, {"id": "QH-9", "type": "mc", "skill": "Coordinate geometry", "difficulty": 3, "stem": "In the xy-plane, the parabola y = x² − 4 and the line y = 2x − 1 meet at two points. What is the distance between these two points?", "options": ["4√2", "2√10", "8", "4√5", "4√10"], "answer": 3, "explain": "Setting x² − 4 = 2x − 1 gives x² − 2x − 3 = 0, so x = 3 or x = −1, giving the points (3, 5) and (−1, −3). Distance = √(4² + 8²) = √80 = 4√5."}, {"id": "QH-10", "type": "mc", "skill": "Inequalities", "difficulty": 4, "stem": "How many integers x satisfy |x − 3| + |x + 2| < 9?", "options": ["8", "9", "10", "11", "12"], "answer": 0, "explain": "For −2 ≤ x ≤ 3 the sum is always 5, which gives 6 integers. Above 3 the sum is 2x − 1, so x < 5 adds 4, and below −2 it is 1 − 2x, so x > −4 adds −3: 8 integers in all, from −3 to 4. Including −4 and 5, where the sum equals exactly 9, is the trap."}, {"id": "QH-11", "type": "fraction", "skill": "Conditional probability", "difficulty": 3, "stem": "Two fair six-sided dice are rolled. Given that at least one of the dice shows a 6, what is the probability that the sum of the two dice is at least 10? Give your answer as a fraction.", "answer": [5, 11], "explain": "There are 11 outcomes with at least one 6, not 12, because (6, 6) is counted once. Of these, (6, 4), (4, 6), (6, 5), (5, 6) and (6, 6) have a sum of at least 10, giving 5/11."}, {"id": "QH-12", "type": "mc", "skill": "Rates and work", "difficulty": 4, "stem": "Working together at their constant rates, machines P and Q can complete a job in 12 hours. On one occasion, P worked alone for 6 hours and then Q, working alone, finished the job in a further 21 hours. How many hours would P take to complete the whole job working alone?", "options": ["12", "15", "16", "18", "20"], "answer": 4, "explain": "Let the rates be p and q, with p + q = 1/12 and 6p + 21q = 1. Six hours of both together does half the job, so 6p + 6q = 1/2 and therefore 15q = 1/2, giving q = 1/30. Then p = 1/12 − 1/30 = 1/20, so P alone takes 20 hours."}, {"id": "QH-13", "type": "mc", "skill": "Data interpretation", "chart": "museum-visitors", "difficulty": 3, "stem": "For how many of the years from 2020 to 2024 was the ratio of Museum A's visitors to Museum B's visitors greater than it had been in the previous year?", "options": ["1", "2", "3", "4", "5"], "answer": 2, "explain": "The ratios are 2019: 40/35 ≈ 1.14; 2020: 1.5; 2021: 1.0; 2022: 1.4; 2023: 1.25; 2024: 1.4. The ratio rose in 2020, 2022 and 2024, so 3 years; tracking only Museum A's growth is the trap."}, {"id": "QH-14", "type": "numeric", "skill": "Data interpretation", "chart": "museum-visitors", "difficulty": 3, "stem": "Suppose that, after 2024, Museum A's visitors grow each year by the same percentage as they grew from 2023 to 2024. How many thousand visitors would Museum A have in 2026? (Enter the number only.)", "answer": 137.2, "explain": "From 2023 to 2024 visitors rose from 50 to 70 thousand, a 40% increase. Two more years give 70 × 1.4 × 1.4 = 137.2 thousand; adding 20 thousand a year (110) is the trap."}, {"id": "QH-15", "type": "multi", "skill": "Data interpretation", "chart": "museum-visitors", "difficulty": 3, "stem": "Based on the chart, which of the following statements are true? Select all that apply.", "options": ["In every year shown, Museum A had more visitors than Museum B.", "Museum B's visitors in 2024 were more than double its visitors in 2020.", "The median of Museum A's six annual visitor numbers is greater than 40 thousand.", "Museum B's average (arithmetic mean) annual number of visitors over the six years is less than 35 thousand.", "From 2022 to 2023, Museum B's visitors increased by a greater percentage than Museum A's."], "answer": [2, 3, 4], "explain": "Museum A's values in order are 20, 35, 40, 45, 50, 70, so the median is 42.5. Museum B totals 200, an average of about 33.3, and its 2022–2023 rise is 15/25 = 60% against A's 15/35 ≈ 43%. In 2021 the museums were equal (20 each), and B's 2024 figure (50) is less than double its 2020 figure (30)."}]}, "V2E": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "E-V-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Far from being ______, the committee's report was so carefully hedged that readers struggled to find a single firm recommendation in it.", "blanks": [["tentative", "lengthy", "belated", "unequivocal", "partisan"]], "answer": [3], "explain": "A report so hedged that no firm recommendation appears is the opposite of clear and definite, and 'far from being' asks for that opposite: unequivocal. 'Tentative' is the trap, since it describes what the report actually was. Nothing in the sentence concerns length, bias or timing."}, {"id": "E-V-02", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Because the old factory's brick walls proved far sturdier than expected, the architects decided to ______ them in the new building rather than demolish them, and the exposed brick now gives the lobby much of its character.", "blanks": [["dismantle", "replicate", "retain", "abandon", "disguise"]], "answer": [2], "explain": "'Rather than demolish them' and the walls still being visible in the lobby show they were kept: retain. 'Disguise' clashes with the brick being exposed, and 'dismantle' means much the same as demolish."}, {"id": "E-V-03", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Early reviewers dismissed the cookbook as (i)______, a mere collection of familiar recipes, but cooks soon discovered that its methods were genuinely (ii)______, often reversing steps that every other book took for granted.", "blanks": [["innovative", "exhaustive", "derivative"], ["conventional", "novel", "tedious"]], "answer": [2, 1], "explain": "'A mere collection of familiar recipes' defines the first blank: derivative. 'But' and the methods that reverse standard steps call for the opposite in the second: novel. 'Innovative' in the first blank and 'conventional' in the second would reverse the contrast."}, {"id": "E-V-04", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The researcher's early findings were (i)______, drawn from only a handful of participants, so she was careful to describe them as (ii)______ rather than conclusive; only after a much larger study had (iii)______ them did she state them with confidence.", "blanks": [["controversial", "preliminary", "definitive"], ["decisive", "tentative", "misleading"], ["ignored", "corroborated", "contradicted"]], "answer": [1, 1, 1], "explain": "Results from a handful of participants are preliminary, and 'rather than conclusive' calls for tentative. She became confident only once a larger study had corroborated them; a study that contradicted the findings would have undermined her confidence instead. Nothing suggests the early results were controversial."}, {"id": "E-V-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The manager's ______ approach to spending, which included reusing old folders and refusing to replace chairs that still worked, saved the department thousands of pounds.", "options": ["generous", "careless", "lavish", "thrifty", "frugal", "innovative"], "answer": [3, 4], "explain": "Reusing folders and keeping old chairs to save money describes careful, economical spending: frugal and thrifty. 'Lavish' and 'generous' are the opposite, and reusing folders is hardly innovative."}, {"id": "E-V-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Despite the critic's reputation for harshness, her review of the young playwright's first play was surprisingly ______.", "options": ["severe", "lengthy", "scathing", "laudatory", "anonymous", "complimentary"], "answer": [3, 5], "explain": "'Despite' her reputation for harshness, the review must have been the reverse of harsh, that is, full of praise: laudatory and complimentary. 'Scathing' and 'severe' form a matching pair, but they describe exactly the harshness the sentence says was absent."}, {"id": "E-V-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The negotiato
