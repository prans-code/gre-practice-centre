next, so that lower courts could never be confident which would prevail.", "options": ["mediated", "deliberated", "wavered", "discriminated", "vacillated", "adjudicated"], "answer": [2, 4], "explain": "Endorsing one reading and then the other, term after term, is swinging back and forth: vacillated and wavered. 'Mediated' and 'adjudicated' sound right for a court, but a court does not mediate or adjudicate between readings by alternating them, and 'deliberated' would mean it had not yet endorsed either."}, {"id": "T3-V1-07", "type": "mc", "skill": "Reading comprehension", "passage": "t3-great-unconformity", "difficulty": 3, "stem": "The primary purpose of the passage is to", "options": ["reconcile two hypotheses by showing that they make identical predictions", "assess an explanation for a gap in the rock record and suggest that it applies only in part", "argue that a widely held explanation of a geological feature should be abandoned entirely", "describe the methods geologists use to date minerals beneath an unconformity", "show that a shift in seawater chemistry was caused by glaciation"], "answer": 1, "explain": "The passage sets out the glacial hypothesis, reports the critics' evidence, and concludes that the gap is composite, 'in places the work of ice and elsewhere' the result of other processes. Abandoning the hypothesis entirely is too strong, since the author says the critics' evidence 'does not exclude glaciation altogether'."}, {"id": "T3-V1-08", "type": "multi", "skill": "Reading comprehension", "passage": "t3-great-unconformity", "difficulty": 4, "why": "The tempting extra choice confuses what the critics' evidence fails to rule out with what the critics themselves claim.", "stem": "According to the passage, which of the following is true of the critics of the glacial hypothesis? Select all that apply.", "options": ["They deny that glaciation contributed to the gap in any region.", "They rest their objection on the ages of minerals beneath the unconformity in different regions.", "They hold that treating the gap as a single surface gives a misleading impression of one event."], "answer": [1, 2], "explain": "The critics cite the 'dating of minerals beneath the unconformity in different regions', and on their view the single dramatic event is 'an artefact of grouping surfaces of different ages under one name'. The passage never says they deny any role for ice; it says only that their evidence shows ice 'cannot have been responsible everywhere'."}, {"id": "T3-V1-09", "type": "mc", "skill": "Reading comprehension", "passage": "t3-great-unconformity", "difficulty": 3, "stem": "The author mentions the shift in the chemistry of seawater primarily in order to", "options": ["suggest that the glaciations were caused by changes in the oceans", "refute the critics' claim that the gap is composite", "explain how minerals beneath the unconformity can be dated", "show that erosion occurred at different times in different regions", "present evidence that was taken to favor the glacial hypothesis"], "answer": 4, "explain": "The passage says the hypothesis 'gained support from' the abrupt shift, which looked like a sudden flood of continental debris. The shift is never used against the critics, and the evidence of erosion at different times comes from mineral dating, not seawater."}, {"id": "T3-V1-10", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t3-sentencing-website", "difficulty": 5, "why": "The trap attacks how many people read the website, but the conclusion concerns the prospect of scrutiny; only judge turnover explains the narrowing with no judge changing behavior.", "stem": "Which of the following, if true, most seriously weakens the administrators' conclusion?", "options": ["Sentences for comparable offences also vary among judges in cities that publish no sentencing records.", "Judges in the city's civil court, whose decisions are not published online, vary widely in the damages they award.", "Few members of the public have ever visited the website on which the sentences are published.", "Before the website was launched, the court's sentencing records were available to anyone who requested them in writing.", "Most of the judges whose sentences had differed most from their colleagues' retired during the past two years and were replaced by newly appointed judges."], "answer": 4, "explain": "The administrators claim that the once harsh or lenient judges changed their sentencing; if most of those judges retired, the gap would narrow without any of them changing, so the evidence no longer supports the claim. Low public traffic is the tempting choice, but the conclusion rests on the prospect of scrutiny, which journalists and lawyers can supply however few citizens visit, and records available on written request were far less exposed than a public website."}, {"id": "T3-V1-11", "type": "mc", "skill": "Reading comprehension", "passage": "t3-early-recordings", "difficulty": 3, "stem": "The author's attitude toward using early recordings as evidence of what composers intended is best described as", "options": ["qualified skepticism", "studied neutrality", "grudging acceptance", "complete rejection", "enthusiastic endorsement"], "answer": 0, "explain": "The author calls that use 'tempting' but warns that studio conditions may have distorted the playing and concludes that the recordings are 'not ... proof that the composers required' the habits. The author still values the recordings as evidence of what was acceptable, so complete rejection goes too far, and acceptance of any kind is the opposite of the author's view of this particular use."}, {"id": "T3-V1-12", "type": "mc", "skill": "Reading comprehension", "passage": "t3-early-recordings", "difficulty": 4, "why": "Two choices restate facts already in the passage; only evidence from outside the recording horn answers the worry about exaggeration.", "stem": "Which of the following, if true, would most weaken the concern the author raises about the conditions of early studios?", "options": ["Many listeners in the early twentieth century bought recordings of Romantic music.", "Some of the performers on early recordings had never studied with any composer.", "Performers who made early studio recordings and were later recorded in live concerts with microphones played the hands out of step and slid between notes to the same degree in both.", "Early recording sessions were often limited to a few minutes for each side of a disc.", "Modern conservatories discourage string players from sliding audibly between notes."], "answer": 2, "explain": "The concern is that playing into a horn led musicians to exaggerate effects; if the same performers showed the same habits to the same degree in live concerts recorded with microphones, the studio cannot explain them. The short sessions only repeat a condition the author already cites, and the conservatories' teaching is likewise stated in the passage and bears on modern taste, not on the studios."}]}, "V2M": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "T3-V2M-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "That a climate model reproduces the past century's warming is often cited as a ______ of its forecasts, yet matching a record the model was tuned to fit is weaker evidence than predicting one it has never seen.", "blanks": [["distortion", "vindication", "refutation", "qualification", "caricature"]], "answer": [1], "explain": "'Yet' says the cited fact is weaker evidence than it seems, so the blank must name strong support: vindication. 'Refutation' reverses the direction, and 'qualification' would already concede the weakness the second clause goes on to point out."}, {"id": "T3-V2M-02", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The philosopher's prose is (i)______ to a fault: so determined is she to avoid overstatement that her central claims are hedged until they become almost (ii)______.", "blanks": [["cavalier", "scrupulous", "flamboyant"], ["provocative", "vacuous", "dogmatic"]], "answer": [1, 1], "explain": "A writer 'determined ... to avoid overstatement' is careful, so 'to a fault' marks her as scrupulous; 'cavalier' and 'flamboyant' suggest the carelessness or display she avoids. Claims hedged until they say almost nothing are vacuous; 'dogmatic' and 'provocative' describe the overstatement she shuns."}, {"id": "T3-V2M-03", "type": "tc", "skill": "Text completion", "difficulty": 4, "why": "'Ephemeral' and 'fractious' echo the first clause, but 'yet' demands a word for staying power in the second blank.", "stem": "Coalition governments are often thought to be inherently (i)______, collapsing at the first serious disagreement; yet in several parliamentary democracies coalitions have proved surprisingly (ii)______, perhaps because partners who must negotiate constantly become adept at (iii)______ disputes before they harden into crises.", "blanks": [["monolithic", "autocratic", "volatile"], ["ephemeral", "fractious", "tenacious"], ["publicizing", "fomenting", "quelling"]], "answer": [2, 2, 2], "explain": "Governments that collapse 'at the first serious disagreement' are volatile; 'monolithic' and 'autocratic' suggest unity and command, the opposite. 'Yet' turns the second blank toward endurance, so coalitions proved tenacious; 'ephemeral' and 'fractious' repeat the view being contradicted. Partners who stop disputes before they 'harden into crises' are skilled at quelling them, not fomenting or publicizing them."}, {"id": "T3-V2M-04", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Far from being a (i)______ feature of the landscape, the region's salt flats are surprisingly (ii)______: satellite images taken a decade apart show their margins advancing and retreating by kilometers with shifts in rainfall.", "blanks": [["static", "transient", "picturesque"], ["barren", "uniform", "variable"]], "answer": [0, 2], "explain": "Margins that advance and retreat by kilometers make the flats variable, and 'far from being' requires the first blank to mean the opposite: static. 'Transient' is the trap, since it agrees with the evidence instead of being denied by it, and 'uniform' and 'barren' ignore the movement the images show."}, {"id": "T3-V2M-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "Long after his death the composer was ______ by the townspeople, who preserved his study exactly as he had left it and staged an annual festival in his honor.", "options": ["venerated", "envied", "forgotten", "satirized", "revered", "pitied"], "answer": [0, 4], "explain": "Preserving his study and holding a festival 'in his honor' show deep respect: venerated and revered. 'Forgotten' contradicts the festival, and 'pitied' and 'envied' do not explain honoring him."}, {"id": "T3-V2M-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Reviewers urged the author to ______ her claims about the drought's causes, noting that her data, which could never establish the mechanism she asserted with such confidence, supported only a correlation with ocean temperatures.", "options": ["temper", "embellish", "reiterate", "qualify", "bolster", "trumpet"], "answer": [0, 3], "explain": "Claims asserted 'with such confidence' on data that support 'only a correlation' need to be moderated: temper and qualify. 'Bolster' is tempting, but the reviewers say her data 'could never establish' the mechanism, so more support is not what they ask for."}, {"id": "T3-V2M-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The cooling that followed the eruption was real but ______: within three years global temperatures had returned to the trend they had followed before the volcano's ash veiled the sun.", "options": ["temporary", "inexorable", "cumulative", "transient", "protracted", "pronounced"], "answer": [0, 3], "explain": "A return to the earlier trend within three years means the cooling was short-lived: transient and temporary. 'Protracted' says the opposite, and 'cumulative' and 'inexorable' imply an effect that builds or cannot be stopped."}, {"id": "T3-V2M-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "why": "'Slipshod' and 'sloppy' form a ready-made synonym pair, but the concession about exemplary care rules them out.", "stem": "Because the second experiment merely repeated the first under identical conditions, the reviewers judged it ______, though they conceded that it had been carried out with exemplary care.", "options": ["redundant", "slipshod", "sloppy", "superfluous", "seminal", "rigorous"], "answer": [0, 3], "explain": "An experiment that 'merely repeated the first' adds nothing new, so the reviewers judged it superfluous or redundant. 'Slipshod' and 'sloppy' are synonyms too, but 'exemplary care' rules out any complaint about workmanship, and 'rigorous' is praise, which 'though they conceded' shows the judgment was not."}, {"id": "T3-V2M-09", "type": "mc", "skill": "Reading comprehension", "passage": "t3-tree-ring-divergence", "difficulty": 3, "stem": "The passage is primarily concerned with", "options": ["arguing that tree-ring reconstructions should be abandoned", "describing how researchers calibrate tree rings against thermometer records", "evaluating what a problem implies for a method of reconstructing past climate", "comparing the reliability of tree rings with that of other climate archives", "explaining why northern forests have grown more slowly since the 1960s"], "answer": 2, "explain": "The passage introduces divergence, rejects the call to discard tree-ring reconstructions, and ends with a qualified recommendation about how to use them. Abandoning the reconstructions is the view the author rejects, and calibration is described only as background."}, {"id": "T3-V2M-10", "type": "mc", "skill": "Reading comprehension", "passage": "t3-tree-ring-divergence", "difficulty": 4, "why": "One choice reverses the direction of divergence, and another inflates 'a recent anomaly' into a claim that the method was never reliable.", "stem": "It can be inferred that the author regards the modern-era explanations of divergence as important chiefly because, if they are correct, they would", "options": ["prove that fifteenth-century summers were warmer than today's", "show that tree rings were never reliable indicators of temperature", "explain why ring density has risen faster than the calibration predicts", "remove the need for error ranges in published reconstructions", "make it less likely that trees lost their sensitivity to temperature in earlier centuries"], "answer": 4, "explain": "The worry is that trees may have lost sensitivity in the past; causes 'specific to the modern era' would not have operated in the fifteenth century, so divergence would be 'a recent anomaly'. The passage says density has risen less, not faster, than predicted, and the author still recommends wider error ranges."}, {"id": "T3-V2M-11", "type": "multi", "skill": "Reading comprehension", "passage": "t3-tree-ring-divergence", "difficulty": 4, "why": "The choice about earlier warm periods turns 'could understate' into 'shows', a certainty the author never claims.", "stem": "The author would most likely agree with which of the following? Select all that apply.", "options": ["The published error ranges of tree-ring reconstructions may understate their real uncertainty.", "Records from sites that show no divergence deserve more weight than records from sites that do.", "Divergence shows that earlier warm periods were warmer than reconstructions indicate."], "answer": [0, 1], "explain": "The final sentence recommends giving 'most weight to records from sites that show no divergence' and treating reconstructions as 'more uncertain than their published error ranges suggest'. The first paragraph says only that reconstructions 'could understate' earlier warm periods, and the author goes on to suggest that divergence may be a recent anomaly, so 'shows' is far too strong."}, {"id": "T3-V2M-12", "type": "sentence", "skill": "Reading comprehension", "passage": "t3-tree-ring-divergence", "difficulty": 3, "stem": "Select the sentence in which the author rejects a proposed response to the difficulty the passage describes.", "answer": 7, "explain": "The sentence 'That conclusion goes further than the evidence warrants' rejects the skeptics' proposal, stated in the sentence just before it, to discard tree-ring reconstructions. The skeptics' sentence proposes the response rather than rejecting it, and the final sentence offers the author's own response."}, {"id": "T3-V2M-13", "type": "mc", "skill": "Reading comprehension", "passage": "t3-intuitions", "difficulty": 3, "stem": "The author's response to the critics is best described as", "options": ["a demonstration that intuitions do not vary across backgrounds", "an acceptance of their conclusion with minor reservations", "a complete rejection of the evidence on which they rely", "a partial rebuttal that nonetheless concedes some force to their evidence", "an argument that philosophers should stop using imagined cases"], "answer": 3, "explain": "The author says the studies 'show less than the critics suppose' but grants that surviving disagreements 'cannot be dismissed so easily'. A complete rejection ignores that concession, and the author never accepts the critics' conclusion that intuitions reflect upbringing rather than insight."}, {"id": "T3-V2M-14", "type": "multi", "skill": "Reading comprehension", "passage": "t3-intuitions", "difficulty": 4, "why": "The choice about surviving disagreements adopts the critics' conclusion, while the author draws only a weaker lesson about how much weight intuitions deserve.", "stem": "According to the passage, which of the following is true? Select all that apply.", "options": ["The author holds that an intuition shared across many backgrounds is stronger evidence than one shared by a narrow group.", "The author holds that the disagreements that survive careful description show that intuitions reflect upbringing rather than insight.", "Some disagreements among participants in the studies disappear when the imagined cases are described more carefully."], "answer": [0, 2], "explain": "The passage says many disagreements 'vanish when the cases are described more carefully', and the author treats an intuition shared only by people like oneself as 'weaker evidence than one shared widely'. The surviving disagreements merely give reason to weigh intuitions differently; the claim that intuitions reflect upbringing is the critics' conclusion, which the author resists."}, {"id": "T3-V2M-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t3-term-limits", "difficulty": 4, "why": "The argument measures dependence only by who drafts bills; choices about spending or bill counts leave that gap untouched.", "stem": "Which of the following, if true, most seriously weakens the argument?", "options": ["Lobbying spending rose by a similar amount over the decade in neighboring states that have no term limits.", "Since term limits took effect, legislators have relied increasingly on lobbyists' briefings to decide how to vote on bills drafted by others.", "The number of bills enacted each year has stayed roughly constant over the decade.", "Term-limited legislators introduce, on average, slightly fewer bills than their predecessors did.", "Most of the opponents of term limits were themselves long-serving legislators."], "answer": 1, "explain": "The prediction was that legislators would become more dependent on lobbyists, but the argument checks only drafting; if they now lean on lobbyists to decide their votes, dependence has grown in a form the evidence does not measure. Rising spending in states without term limits gives no reason to doubt the conclusion, and the opponents' own careers say nothing about whether their prediction came true."}]}, "V2H": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "T3-V2H-01", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "Though her colleagues took her brevity for ______, the magistrate's one-paragraph judgments in fact distilled more learning than their twenty-page opinions, which often hid the want of an argument beneath a profusion of citation.", "blanks": [["superficiality", "circumspection", "erudition", "concision", "pedantry"]], "answer": [0], "explain": "'In fact distilled more learning' corrects what her colleagues assumed, so they took her brevity for a lack of depth: superficiality. 'Concision' only renames brevity and involves no mistake, 'erudition' is what she actually had, and 'pedantry' and 'circumspection' are not what a short judgment would be mistaken for.", "why": "'Concision' merely restates 'brevity' and 'erudition' echoes 'learning', but the blank must name the mistaken judgment that 'in fact distilled more learning' corrects."}, {"id": "T3-V2H-02", "type": "tc", "skill": "Text completion", "difficulty": 4, "why": "'Parsimony' is a familiar theoretical virtue, but the clue is the theory's reach, not its economy.", "stem": "The theory's admirers present its (i)______ as a virtue, since it seems to account for every outcome; to its critics, that very capacity is (ii)______, for a theory compatible with any result forbids nothing and so risks nothing.", "blanks": [["parsimony", "obscurity", "universality"], ["incidental", "vindicating", "suspect"]], "answer": [2, 2], "explain": "A theory that seems 'to account for every outcome' is prized for its universality; parsimony is a virtue too, but it concerns economy, not reach. The critics turn that capacity into a weakness, since a theory that 'risks nothing' is suspect; 'vindicating' sides with the admirers, and 'incidental' would make the capacity beside the point rather than a fault."}, {"id": "T3-V2H-03", "type": "tc", "skill": "Text completion", "difficulty": 5, "why": "'Hardly' negates the first blank, so readers who match it to 'stood to gain' pick 'partisan', the reverse of the key.", "stem": "The defendants' accounts of the night are hardly (i)______: each witness stood to gain from an acquittal, and their statements, though (ii)______ in their detail, are so (iii)______ that the prosecutor treated their very agreement as evidence of collusion.", "blanks": [["partisan", "unbiased", "coherent"], ["implausible", "inconsistent", "vivid"], ["contradictory", "uniform", "fragmentary"]], "answer": [1, 2, 1], "explain": "Witnesses who 'stood to gain' are not neutral, and 'hardly' needs the quality they lack: unbiased. 'Though' concedes something that would normally make the statements credible, so they are vivid in detail; 'implausible' and 'inconsistent' would count against them and so leave nothing to concede. Statements whose 'very agreement' suggested collusion are uniform, not contradictory or fragmentary."}, {"id": "T3-V2H-04", "type": "tc", "skill": "Text completion", "difficulty": 4, "why": "'Amplify' fits the bombast but would make the celebration sincere, which the contrast with face value rules out.", "stem": "Listeners who take the finale's blaring fanfares at face value hear in them a (i)______ tribute to the regime; but the composer's letters suggest that the bombast was (ii)______, its very excess designed to (iii)______ the triumph it appears to celebrate.", "blanks": [["muted", "veiled", "servile"], ["sardonic", "heartfelt", "spontaneous"], ["amplify", "consecrate", "undermine"]], "answer": [2, 0, 2], "explain": "Taken 'at face value', blaring fanfares are an open, fawning tribute: servile, not 'veiled' or 'muted'. 'But' sets the letters against that reading, so the bombast was sardonic, mocking rather than heartfelt. Excess meant to mock a triumph it 'appears to celebrate' is designed to undermine it; to amplify or consecrate it would make the tribute sincere."}, {"id": "T3-V2H-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The memoir portrays the minister's advisers as uniformly ______, so eager to win his favor that none dared tell him the policy was failing.", "options": ["defiant", "perfunctory", "toadying", "truculent", "judicious", "sycophantic"], "answer": [2, 5], "explain": "Advisers 'so eager to win his favor' that they hid bad news are fawning: sycophantic and toadying. 'Truculent' and 'defiant' make a pair, but advisers who were defiant would have dared to tell him."}, {"id": "T3-V2H-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "why": "'Spectacular' and 'sensational' form a pair, but they describe the experiments the historians turned away from.", "stem": "Historians of science have lately turned from the dramatic experiments of famous geologists to the ______ labor of the surveyors and assistants whose unremarked measurements made those experiments possible.", "options": ["quotidian", "spectacular", "ingenious", "workaday", "sensational", "sporadic"], "answer": [0, 3], "explain": "The historians turned 'from the dramatic' experiments to labor that went 'unremarked', so the blank means ordinary and everyday: quotidian and workaday. 'Spectacular' and 'sensational' are synonyms, but they describe the dramatic experiments, and nothing in the sentence supports 'sporadic' or 'ingenious'."}, {"id": "T3-V2H-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 5, "why": "'Vitiated' is often mistaken for a word of praise, so readers who do not know it look for a second synonym of 'undermined' that is not there, or fall back on the 'buttressed' and 'bolstered' pair.", "stem": "The study's conclusion is ______ by a flaw in its sampling: the households surveyed were drawn only from districts that had already adopted the reform, so no comparison with districts that had not was possible.", "options": ["vindicated", "anticipated", "buttressed", "undermined", "bolstered", "vitiated"], "answer": [3, 5], "explain": "A sampling flaw that makes the needed comparison impossible weakens the conclusion: it is vitiated, or undermined. 'Buttressed' and 'bolstered' form a pair, but a flaw cannot strengthen a conclusion, and 'vindicated' is a look-alike that means the opposite of 'vitiated'."}, {"id": "T3-V2H-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "why": "Readers who stop at 'admirable in its aims' are drawn to words of praise, but the colon's second half requires impractical idealism.", "stem": "The delegates' plan to rewrite the constitution in a single session, with the unanimous consent of every province, was dismissed as ______: admirable in its aims but wholly detached from political reality.", "options": ["quixotic", "incendiary", "venal", "utopian", "cynical", "pragmatic"], "answer": [0, 3], "explain": "A plan admirable in aim but 'wholly detached from political reality' is idealistic and unrealistic: quixotic and utopian. 'Pragmatic' is the opposite of detached from reality, and 'cynical' and 'venal' contradict 'admirable in its aims'."}, {"id": "T3-V2H-09", "type": "mc", "skill": "Reading comprehension", "passage": "t3-courts-opinion", "difficulty": 4, "why": "The second paragraph's criticisms tempt readers toward outright rejection, but the final paragraph accepts the core finding.", "stem": "The author's attitude toward the research described in the first paragraph is best described as", "options": ["acceptance of its central finding and of the conclusion that the democratic anomaly is largely illusory", "suspicion that its authors set out to defend the courts", "qualified acceptance of its central finding, combined with the view that the finding has been brought to bear on the wrong question", "indifference, since it addresses a question of little democratic importance", "doubt about its central finding, since surveys cannot capture the technical matters in which courts exert influence"], "answer": 2, "explain": "The author calls the research 'persuasive as far as it goes' and the evidence that sustained defiance is rare 'too consistent to dismiss', yet says the democratic question 'has been misplaced'. The author therefore does not accept that the anomaly is illusory, and the point about technical matters limits what the research can show without casting doubt on its finding about headline cases."}, {"id": "T3-V2H-10", "type": "mc", "skill": "Reading comprehension", "passage": "t3-courts-opinion", "difficulty": 5, "why": "The most tempting choice shows opinion already moving before the ruling, which supports anticipation, the rival reading.", "stem": "Which of the following, if true, would most strengthen the possibility, raised in the second paragraph, that courts help to lead public opinion rather than merely anticipate it?", "options": ["Opinion on an issue shifts more in the year after a ruling than in comparable years without one, even when the ruling was unpopular at first.", "On many issues, opinion had been shifting steadily in the same direction for years before the court ruled.", "Courts often decline to hear cases on subjects about which public opinion is evenly divided.", "Judges appointed late in their careers are less responsive to public opinion than judges appointed young.", "Most citizens cannot name a recent ruling of their country's constitutional court."], "answer": 0, "explain": "If opinion moves faster after a ruling than in comparable periods, even after an unpopular ruling, the ruling itself appears to move opinion, which is what leading means. A steady shift before the ruling is the trap: it shows the public was already heading that way, which favors anticipation, and citizens' ignorance of rulings would make leading less likely."}, {"id": "T3-V2H-11", "type": "multi", "skill": "Reading comprehension", "passage": "t3-courts-opinion", "difficulty": 5, "why": "All three are supported, and students who expect at least one distractor in a select-all item tend to drop one of them.", "stem": "The passage suggests which of the following about a court's influence? Select all that apply.", "options": ["It may be exercised through decisions about which questions the court agrees to hear.", "It could alter the practical effect of a right even when the court's headline rulings agree with public opinion.", "It is not fully captured by research that compares rulings with public opinion on broad outcomes."], "answer": [0, 1, 2], "explain": "The passage lists 'the questions it declines to hear' among the sources of influence, and says a court could follow opinion 'in every headline case' while reshaping 'the practical meaning of the rights at stake'. Because the research measures agreement only 'at the level of broad outcomes' and much influence lies in matters 'too technical to register in opinion surveys', that research misses part of a court's influence, so all three hold."}, {"id": "T3-V2H-12", "type": "sentence", "skill": "Reading comprehension", "passage": "t3-courts-opinion", "difficulty": 4, "why": "The sentence reporting the studies' findings is tempting, but the author accepts those findings and challenges only what was inferred from them.", "stem": "Select the sentence that presents an inference drawn from the research that the author goes on to challenge.", "answer": 2, "explain": "The third sentence reports the conclusion that courts are 'a lagging reflection' of majorities and that the anomaly is 'largely illusory', which the rest of the passage disputes. The sentence before it gives the studies' findings, which the author accepts as 'too consistent to dismiss'."}, {"id": "T3-V2H-13", "type": "mc", "skill": "Reading comprehension", "passage": "t3-well-tempered", "difficulty": 4, "why": "'Nothing ... confirms' means unsupported, not disproved, so the choice saying the claim was refuted overstates the author's verdict.", "stem": "The author's view of the claim about the ornamental loops on the title page is that it", "options": ["has been conclusively disproved by Bach's surviving writings", "is the strongest evidence that Bach intended an unequal tuning", "shows that Bach wrote the collection for equal temperament", "lacks adequate support, though its weakness does not undermine the broader reassessment of the collection's tuning", "is correct about the tuning Bach intended but mistaken about where the evidence for it lies"], "answer": 3, "explain": "The author says the claim reads a 'decorative flourish as a set of instructions' that nothing in Bach's writings confirms, then says 'the broader point survives the weakness of the narrower one'. Lack of confirmation is not disproof, so the choice saying Bach's writings refute the claim goes too far."}, {"id": "T3-V2H-14", "type": "multi", "skill": "Reading comprehension", "passage": "t3-well-tempered", "difficulty": 4, "why": "The choice about moving a piece to another key raises something the passage never mentions, so students reject it, though it follows directly from the passage's definition of equal temperament.", "stem": "It can be inferred from the passage that the author holds which of the following? Select all that apply.", "options": ["Under the unequal tunings the passage describes, some keys could not be played at all.", "Under equal temperament, a piece moved into a different key would not change in character.", "Bach's purpose in the collection was more likely to show that every key could be played than to show that all keys sound alike."], "answer": [1, 2], "explain": "In equal temperament 'every key ... sounds alike', so moving a piece to another key leaves its character unchanged, and the final sentence states that the collection was probably meant to show that all keys 'could be played'. The unequal tunings 'made every key usable', which contradicts the claim that some keys were unplayable."}, {"id": "T3-V2H-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t3-induced-quakes", "difficulty": 5, "why": "The choice about the monitoring network sounds like a flaw in the evidence, but it would help the industry group rather than weaken it.", "stem": "Which of the following, if true, most seriously weakens the industry group's argument?", "options": ["Some regions where no wastewater is injected have also recorded more small earthquakes in recent years.", "Most of the earthquakes recorded in the region were too small to be felt at the surface.", "Pressure from injected fluid spreads slowly through deep rock, so faults can continue to slip for years after injection volumes are reduced.", "All operators complied with the order to halve injection volumes within a month of its issue.", "The region's network of seismic monitors was expanded when injection began, allowing smaller earthquakes to be detected."], "answer": 2, "explain": "The group infers that injection was not a cause because cutting it brought little immediate change; if pressure keeps spreading for years after injection is reduced, a slow decline is just what injection as a cause would predict. The expanded monitoring network is the trap: it suggests the rise was partly an artefact of detection, which supports the group's conclusion, and prompt compliance only removes one excuse for the weak response."}]}, "Q1": {"measure": "Quant", "minutes": 21, "label": "Quantitative Reasoning: Section 1", "questions": [{"id": "T3-Q1-01", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "n is a positive integer, and n² is divisible by 72.", "qa": "The remainder when n is divided by 12", "qb": "0", "answer": 2, "explain": "72 = 2³ × 3². A square carries every prime to an even power, so for n² to contain 2³ it must contain 2⁴, which means n contains 2²; for n² to contain 3², n must contain 3. So n is a multiple of 4 × 3 = 12 and the remainder is always 0. Thinking n need only be a multiple of 6 is the trap: n = 6 gives n² = 36, which 72 does not divide.", "why": "Squares carry even prime powers, so 2³ in n² forces 2² in n, not just 2."}, {"id": "T3-Q1-02", "type": "qc", "skill": "Inequalities", "difficulty": 4, "given": "−1 < x < 0", "qa": "1/x", "qb": "x − 1", "answer": 3, "explain": "For x = −0.5, A is −2 and B is −1.5, so B is greater. For x = −0.9, A is about −1.11 and B is −1.9, so A is greater. The trap is to assume the reciprocal of a negative fraction is always the more negative number: near −1 the reciprocal is close to −1, while x − 1 is close to −2.", "why": "Testing only a value such as −1/2 makes B look greater every time."}, {"id": "T3-Q1-03", "type": "qc", "skill": "Geometry", "difficulty": 3, "given": "In triangle PQR, PQ = 6, QR = 8 and angle PQR is greater than 90°.", "qa": "PR", "qb": "10", "answer": 0, "explain": "If angle Q were exactly 90°, PR would be √(36 + 64) = 10. Opening the angle beyond 90° pushes P and R further apart, so PR² > PQ² + QR² = 100 and PR > 10 (though PR must still be less than 6 + 8 = 14)."}, {"id": "T3-Q1-04", "type": "qc", "skill": "Statistics", "difficulty": 4, "given": "A list of five integers has an average (arithmetic mean) of 10 and a median of 12.", "qa": "The greatest possible value of the least integer in the list", "qb": "7", "answer": 2, "explain": "The five integers total 50. The median and the two integers above it are each at least 12, so together they are at least 36, leaving at most 14 for the two smallest. The smaller of two integers that total at most 14 is at most 7, and the list 7, 7, 12, 12, 12 reaches it. Forgetting that the top two values are at least 12 suggests a larger answer.", "why": "Solvers forget that the two values above the median must each be at least 12."}, {"id": "T3-Q1-05", "type": "mc", "skill": "Percent and interest", "difficulty": 3, "stem": "Ines deposits $5,000 in an account that pays 6% simple annual interest and another $5,000 in an account that pays 4% annual interest, compounded annually. She makes no other deposits or withdrawals. After 3 years, to the nearest cent, how much more interest has the simple-interest account earned than the compound-interest account?", "options": ["$24.32", "$100.00", "$275.68", "$300.00", "$324.32"], "answer": 2, "explain": "Simple interest is 5,000 × 0.06 × 3 = $900. Compound interest is 5,000 × (1.04³ − 1) = 5,000 × 0.124864 = $624.32. The difference is $275.68. Taking the 2-point rate gap over 3 years ($300) ignores the extra $24.32 that compounding earns."}, {"id": "T3-Q1-06", "type": "numeric", "skill": "Counting", "difficulty": 4, "stem": "A history exam has 12 questions, numbered 1 to 12. Each student must answer exactly 8 of the questions, including at least 4 of questions 1 to 5. How many different sets of 8 questions can a student choose to answer?", "answer": 210, "explain": "Split by how many of questions 1 to 5 are chosen. Exactly 4: C(5, 4) × C(7, 4) = 5 × 35 = 175. All 5: C(5, 5) × C(7, 3) = 35. The total is 210. Choosing 'the required 4' first and then any 4 of the remaining 8 gives 5 × 70 = 350, which counts each set containing all five early questions five times.", "why": "Picking the required 4 first and then any 4 of the rest overcounts sets that contain all five."}, {"id": "T3-Q1-07", "type": "multi", "skill": "Number properties", "difficulty": 4, "stem": "The positive integer k has exactly three positive divisors. Which of the following could be the number of positive divisors of 6k? Indicate all such values.", "options": ["4", "6", "8", "9", "12", "18"], "answer": [2, 4], "explain": "Only the square of a prime has exactly three divisors, so k = p². If p = 2, then 6k = 24 = 2³ × 3, with 4 × 2 = 8 divisors; if p = 3, then 6k = 54 = 2 × 3³, again 8. For any other prime, 6k = 2 × 3 × p², with 2 × 2 × 3 = 12 divisors. Forgetting that p can be 2 or 3 leaves only 12.", "why": "The cases p = 2 and p = 3 merge with the factor 6 and have to be checked separately."}, {"id": "T3-Q1-08", "type": "mc", "skill": "Geometry and number properties", "difficulty": 5, "stem": "A right triangle has sides whose lengths are all integers, and one of its legs has length 12. How many different such triangles are there?", "options": ["3", "4", "5", "6", "8"], "answer": 1, "explain": "If the other leg is b and the hypotenuse is c, then c² − b² = 144, so (c − b)(c + b) = 144, where both factors must be even (they have the same parity and multiply to an even number). The pairs 2 × 72, 4 × 36, 6 × 24 and 8 × 18 give (b, c) = (35, 37), (16, 20), (9, 15) and (5, 13), while 12 × 12 gives b = 0. That is 4 triangles; listing only familiar triples misses 12, 35, 37.", "why": "The triple 12, 35, 37 is unfamiliar, and only the factor-pair method finds it."}, {"id": "T3-Q1-09", "type": "fraction", "skill": "Probability", "difficulty": 4, "stem": "A teacher chooses 4 students at random from a class of 12 to sit on an exam-review panel. Ana and Ben are two of the 12 students. What is the probability that exactly one of Ana and Ben is chosen? Give your answer as a fraction.", "answer": [16, 33], "explain": "There are C(12, 4) = 495 possible panels. Choose which of Ana and Ben is on it (2 ways) and fill the other 3 places from the 10 other students (C(10, 3) = 120 ways): 240/495 = 16/33. Counting only the panels with Ana but not Ben gives 8/33, half the answer.", "why": "Counting the case for only one named student gives half the answer."}, {"id": "T3-Q1-10", "type": "mc", "skill": "Data interpretation", "table": "t3-exam-results", "difficulty": 3, "stem": "For the four schools combined, what percent of the students who sat the exam passed, to the nearest whole percent?", "options": ["72%", "73%", "74%", "75%", "76%"], "answer": 0, "explain": "The numbers passing are 152, 144, 186 and 120, a total of 602 out of 200 + 180 + 300 + 160 = 840 students, or about 71.7%, which rounds to 72%. Averaging the four percentages gives 73.25%, which ignores that Carrow, with the lowest pass rate, has the most students."}, {"id": "T3-Q1-11", "type": "mc", "skill": "Data interpretation", "table": "t3-exam-results", "difficulty": 3, "stem": "What was the mean score of all the students at Ashford and Carrow taken together?", "options": ["59.5", "60", "60.5", "61", "61.5"], "answer": 3, "explain": "Ashford's scores total 200 × 64 = 12,800 and Carrow's total 300 × 59 = 17,700, so the 500 students average 30,500 ÷ 500 = 61. The simple average of the two means, 61.5, gives too much weight to the smaller school."}, {"id": "T3-Q1-12", "type": "multi", "skill": "Data interpretation", "table": "t3-exam-results", "difficulty": 4, "stem": "Which of the following statements are true? Indicate all such statements.", "options": ["Carrow had more students who did not pass than the other three schools combined.", "More students passed at Brookvale than at Denholm.", "The sum of all the scores at Denholm was greater than the sum of all the scores at Brookvale.", "More students passed at Ashford than at Brookvale."], "answer": [1, 3], "explain": "The numbers not passing are 48, 36, 114 and 40, and the other three schools' 124 exceed Carrow's 114. Brookvale passed 144 and Denholm 120, and Ashford's 152 beats Brookvale's 144 despite its lower pass rate. Denholm has the higher mean, but its score total, 160 × 70 = 11,200, is below Brookvale's 180 × 66 = 11,880.", "why": "A higher rate or mean does not mean a larger count or total; each row has to be multiplied out."}]}, "Q2M": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "T3-Q2M-01", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "a and b are positive integers whose greatest common divisor is 6 and whose least common multiple is 72.", "qa": "a + b", "qb": "42", "answer": 3, "explain": "Write a = 6m and b = 6n, where m and n share no common factor; then mn = 72 ÷ 6 = 12, so {m, n} is {1, 12} or {3, 4} ({2, 6} fails because 2 and 6 share a factor). The pairs are 6 and 72, with sum 78, or 18 and 24, with sum 42, so A can be greater than B or equal to it.", "why": "Most solvers find 18 and 24 and stop, missing 6 and 72."}, {"id": "T3-Q2M-02", "type": "qc", "skill": "Algebra", "difficulty": 4, "given": "x² − 5x + 6 < 0", "qa": "(x − 2)(x − 4)", "qb": "−1", "answer": 0, "explain": "x² − 5x + 6 = (x − 2)(x − 3) < 0 means 2 < x < 3. Then (x − 2)(x − 4) = x² − 6x + 8 = (x − 3)² − 1, which is greater than −1 because x cannot equal 3. Substituting x = 3 to get −1 and choosing 'equal' is the trap, since the strict inequality excludes 3.", "why": "The value −1 is reached only at x = 3, which the strict inequality excludes."}, {"id": "T3-Q2M-03", "type": "qc", "skill": "Geometry and rates", "difficulty": 4, "given": "Water is pumped at a constant rate of 0.5 cubic meters per minute into a cylindrical tank whose base has a radius of 2 meters.", "qa": "The number of minutes it takes the water level to rise by 1 meter", "qb": "25", "answer": 0, "explain": "A 1-meter rise adds π × 2² × 1 = 4π cubic meters of water, which takes 4π ÷ 0.5 = 8π minutes. Since π > 3.14, 8π > 25.1, so A is greater. Using π ≈ 3 gives 24 minutes and the wrong answer.", "why": "Rounding π down to 3 flips the comparison."}, {"id": "T3-Q2M-04", "type": "qc", "skill": "Probability", "difficulty": 4, "given": "A fair coin is tossed 6 times.", "qa": "The probability of getting exactly 3 heads", "qb": "The probability of getting exactly 2 heads or exactly 4 heads", "answer": 1, "explain": "There are 2⁶ = 64 equally likely sequences. Exactly 3 heads occurs in C(6, 3) = 20 of them, while exactly 2 or exactly 4 heads occurs in C(6, 2) + C(6, 4) = 15 + 15 = 30. Three heads is the most likely single count, but B combines two outcomes and is larger.", "why": "The most likely single outcome is being compared with a pair of outcomes."}, {"id": "T3-Q2M-05", "type": "qc", "skill": "Statistics", "difficulty": 3, "qa": "The standard deviation of the list 4, 8, 12, 16", "qb": "The standard deviation of the list 4, 8, 10, 12, 16", "answer": 0, "explain": "Both lists have mean 10. List B is list A plus the value 10, which sits exactly at the mean: it adds nothing to the total squared distance from the mean but adds one more value, so the typical distance shrinks. A is greater."}, {"id": "T3-Q2M-06", "type": "mc", "skill": "Rates and work", "difficulty": 3, "stem": "A crew of 6 builders, all working at the same constant rate, can lay the foundations for a house in 10 days. After the 6 builders have worked for 4 days, 3 more builders who work at the same rate join them. How many days in total does it take to lay the foundations?", "options": ["6", "7", "8", "9", "10"], "answer": 2, "explain": "The job is 6 × 10 = 60 builder-days. The first 4 days complete 24 builder-days, leaving 36 for 9 builders, which takes 4 more days, so 8 days in total. Answering 10 ignores the extra builders altogether."}, {"id": "T3-Q2M-07", "type": "mc", "skill": "Coordinate geometry", "difficulty": 4, "stem": "In the xy-plane, the line 3x + 4y = 24 crosses the x-axis at point P and the y-axis at point Q. What is the shortest distance from the origin to line PQ?", "options": ["4", "4.8", "5", "6", "8"], "answer": 1, "explain": "P = (8, 0) and Q = (0, 6), so PQ = 10 and triangle OPQ has area ½ × 8 × 6 = 24. Taking PQ as the base, the height from O is 2 × 24 ÷ 10 = 4.8. The answer 5, half of PQ, is the distance to the midpoint of PQ, not the perpendicular distance.", "why": "The distance 5 to the midpoint looks natural but is not the shortest distance."}, {"id": "T3-Q2M-08", "type": "numeric", "skill": "Functions", "difficulty": 3, "stem": "The function g is defined by g(x) = (2x + 6)/(x − 3) for all x ≠ 3. If g(k) = 4, what is the value of g(2k)?", "answer": 2.8, "explain": "From (2k + 6)/(k − 3) = 4, 2k + 6 = 4k − 12, so k = 9. Then g(18) = 42/15 = 2.8. Doubling g(k) to get 8 is the trap, because g is not a linear function."}, {"id": "T3-Q2M-09", "type": "multi", "skill": "Number properties", "difficulty": 4, "stem": "The sum of four consecutive integers is S. Which of the following could be the value of S? Indicate all such values.", "options": ["−2", "0", "10", "26", "32", "50"], "answer": [0, 2, 3, 5], "explain": "If the smallest integer is n, then S = 4n + 6, which is 2 more than a multiple of 4. −2 (from −2, −1, 0, 1), 10, 26 and 50 all have that form, but 0 and 32 are multiples of 4. Assuming the integers must be positive rules out −2 wrongly.", "why": "S must be 2 more than a multiple of 4, and the integers may be negative."}, {"id": "T3-Q2M-10", "type": "mc", "skill": "Statistics", "difficulty": 3, "stem": "On a chemistry exam, the average (arithmetic mean) score of 25 students was 72. After the exam was re-marked, 5 of the students each had their scores raised by 8 points and 1 student had a score lowered by 10 points; no other scores changed. What was the new average score?", "options": ["73.2", "73.6", "74.0", "74.4", "75.0"], "answer": 0, "explain": "The total was 25 × 72 = 1,800. It rises by 5 × 8 = 40 and falls by 10, to 1,830, so the new average is 1,830 ÷ 25 = 73.2. Leaving out the lowered score gives 73.6."}, {"id": "T3-Q2M-11", "type": "fraction", "skill": "Geometry and probability", "difficulty": 4, "stem": "A point (x, y) is chosen at random from the interior of the square with vertices (0, 0), (6, 0), (6, 6) and (0, 6) in the xy-plane. What is the probability that |x − y| < 2? Give your answer as a fraction.", "answer": [5, 9], "explain": "The points with |x − y| ≥ 2 form two corner triangles, one above the line y = x + 2 and one below the line y = x − 2, each with legs of length 4 and area 8. The favorable region therefore has area 36 − 16 = 20, and the probability is 20/36 = 5/9. Treating the band around the diagonal as a strip of width 2 on each side of a 6-unit diagonal mismeasures it.", "why": "The band around the diagonal is found most easily by subtracting the two corner triangles."}, {"id": "T3-Q2M-12", "type": "mc", "skill": "Mixtures", "difficulty": 3, "stem": "A builder has 18 kilograms of a dry mortar mix that is 25% cement by weight. How many kilograms of pure cement must be added to make a mix that is 40% cement by weight?", "options": ["2.7", "3.0", "3.6", "4.2", "4.5"], "answer": 4, "explain": "The mix holds 0.25 × 18 = 4.5 kg of cement. Adding c kg gives (4.5 + c)/(18 + c) = 0.4, so 4.5 + c = 7.2 + 0.4c and c = 4.5. Taking 15% of 18 (2.7 kg) forgets that the added cement also increases the total weight."}, {"id": "T3-Q2M-13", "type": "mc", "skill": "Data interpretation", "table": "t3-materials-orders", "difficulty": 4, "stem": "By 30 June, the value of the timber delivered (units delivered × price per unit) was approximately what percent of the value of all the materials delivered?", "options": ["20%", "25%", "30%", "35%", "40%"], "answer": 3, "explain": "Delivered values are steel 90 × $450 = $40,500, concrete 480 × $110 = $52,800, timber 200 × $320 = $64,000 and bricks 45 × $600 = $27,000, a total of $184,300. Timber's share is 64,000 ÷ 184,300 ≈ 34.7%, about 35%. Using the full orders instead gives 80,000 ÷ 276,000 ≈ 29%, which points to the trap answer of 30%.", "why": "Using ordered rather than delivered values gives 29%, close to a listed option."}, {"id": "T3-Q2M-14", "type": "numeric", "skill": "Data interpretation", "table": "t3-materials-orders", "difficulty": 3, "stem": "The concrete not delivered by 30 June was delivered in July at a price per cubic meter 15% higher than the price shown. What was the total cost, in dollars, of all the concrete ordered?", "answer": 93280, "explain": "60% of 800 is 480 cubic meters at $110, costing $52,800. The other 320 cubic meters cost $110 × 1.15 = $126.50 each, or $40,480. The total is $93,280; applying the 15% rise to all 800 cubic meters would overstate it."}, {"id": "T3-Q2M-15", "type": "multi", "skill": "Data interpretation", "table": "t3-materials-orders", "difficulty": 3, "stem": "For which materials was the value of the units not yet delivered by 30 June (units not delivered × price per unit) greater than $25,000? Indicate all such materials.", "options": ["Steel beams", "Concrete", "Timber", "Bricks"], "answer": [1, 3], "explain": "The undelivered values are steel 30 × $450 = $13,500, concrete 320 × $110 = $35,200, timber 50 × $320 = $16,000 and bricks 45 × $600 = $27,000. Only concrete and bricks exceed $25,000; steel has the same ordered value as bricks but a much smaller share still outstanding."}]}, "Q2H": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "T3-Q2H-01", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "N is the product of all the integers from 1 to 20, inclusive.", "qa": "The greatest integer k such that 12ᵏ is a factor of N", "qb": "9", "answer": 1, "explain": "12ᵏ = 4ᵏ × 3ᵏ. N contains the factor 2 a total of 10 + 5 + 2 + 1 = 18 times, enough for 4⁹, but the factor 3 only 6 + 2 = 8 times (from 3, 6, 9, 12, 15 and 18, with 9 and 18 counting twice). The scarcer prime 3 limits k to 8, so B is greater.", "why": "Counting only factors of 2 gives 9; the scarcer factor 3 caps k at 8."}, {"id": "T3-Q2H-02", "type": "qc", "skill": "Inequalities", "difficulty": 4, "given": "|x − 3| > |x + 1|", "qa": "x", "qb": "1", "answer": 1, "explain": "|x − 3| is the distance from x to 3 and |x + 1| the distance from x to −1. x is farther from 3 than from −1 exactly when it lies to the left of their midpoint, 1, so x < 1 and B is greater. Squaring both sides confirms it: x² − 6x + 9 > x² + 2x + 1 gives x < 1.", "why": "Splitting into sign cases invites errors; the distance view shows x < 1 at once."}, {"id": "T3-Q2H-03", "type": "qc", "skill": "Geometry", "difficulty": 4, "given": "A rectangle is inscribed in a circle of radius 5, so that all four of its vertices lie on the circle.", "qa": "The area of the rectangle", "qb": "50", "answer": 3, "explain": "The rectangle's diagonal is a diameter, so its sides a and b satisfy a² + b² = 100. Since (a − b)² ≥ 0, ab ≤ (a² + b²)/2 = 50, with equality only for the square of side 5√2. A square is a rectangle, so A can equal 50 or be less than it; choosing 'B is greater' overlooks the square.", "why": "A square is a rectangle, so the maximum area of 50 can be reached."}, {"id": "T3-Q2H-04", "type": "qc", "skill": "Counting", "difficulty": 5, "qa": "The number of four-digit positive integers whose digits are strictly increasing from left to right", "qb": "The number of four-digit positive integers whose digits are strictly decreasing from left to right", "answer": 1, "explain": "Any 4 different digits can be arranged in exactly one increasing order and one decreasing order. An increasing number cannot contain 0 (it would have to lead), so its digits come from 1 to 9: C(9, 4) = 126. A decreasing number can end in 0, so its digits come from 0 to 9: C(10, 4) = 210. The symmetry argument that the two counts are equal fails because of the digit 0.", "why": "The digit 0 can end a decreasing number but can never appear in an increasing one."}, {"id": "T3-Q2H-05", "type": "qc", "skill": "Statistics", "difficulty": 4, "given": "List L consists of six numbers whose average (arithmetic mean) is 50. List M consists of the six numbers in L together with the numbers 46 and 54.", "qa": "The standard deviation of M", "qb": "The standard deviation of L", "answer": 3, "explain": "M has the same mean, 50, and gains two values that are each 4 from it. If L is six 50s, its standard deviation is 0 and M's is positive, so A is greater. If L is 0, 0, 0, 100, 100, 100, every value is 50 from the mean, and adding two values only 4 away pulls the spread down, so B is greater. Assuming the spread stays the same because the new values are balanced is the trap.", "why": "Adding values near the mean can raise or lower the spread, depending on how spread out L already is."}, {"id": "T3-Q2H-06", "type": "mc", "skill": "Percent and interest", "difficulty": 5, "stem": "Marta borrows $10,000 at an annual interest rate of 10%, compounded annually. At the end of each of the next two years she makes a payment of the same amount, P dollars, and the second payment repays the loan exactly. To the nearest cent, what is P?", "options": ["$5,500.00", "$5,700.00", "$5,761.90", "$6,050.00", "$6,100.00"], "answer": 2, "explain": "After the first year and payment she owes 11,000 − P. After the second year she owes 1.1(11,000 − P), and paying P clears it: 1.1(11,000 − P) − P = 0, so 12,100 = 2.1P and P ≈ $5,761.90. Splitting $12,100 into two payments of $6,050 ignores that the first payment stops interest from being charged on that money in the second year.", "why": "Halving $12,100 ignores that the first payment reduces the balance on which year-two interest is charged."}, {"id": "T3-Q2H-07", "type": "mc", "skill": "Geometry", "difficulty": 4, "stem": "In triangle ABC, angle BAC is a right angle, AB = 6 and AC = 8. Point D lies on side BC, and AD is perpendicular to BC. What is the length of BD?", "options": ["3.6", "4", "4.8", "5", "6.4"], "answer": 0, "explain": "BC = √(36 + 64) = 10. Triangles DBA and ABC are similar, since they share angle B and each has a right angle, so BD/AB = AB/BC and BD = 36 ÷ 10 = 3.6. The value 4.8 is the length of AD and 6.4 is the length of DC, the two most common slips.", "why": "The similar-triangle ratio has to pair the correct corresponding sides."}, {"id": "T3-Q2H-08", "type": "numeric", "skill": "Counting", "difficulty": 5, "stem": "A school schedules six different exams, one on each of six consecutive days. The exams include Mathematics, Physics and Chemistry. Mathematics must be on an earlier day than Physics, though not necessarily the day before, and Chemistry cannot be on the first day. How many different schedules are possible?", "answer": 300, "explain": "Of the 6! = 720 orders, exactly half, 360, put Mathematics before Physics. Among those, the schedules with Chemistry on the first day arrange the other five exams with Mathematics before Physics: 5! ÷ 2 = 60. So 360 − 60 = 300. Subtracting all 5! = 120 schedules with Chemistry first gives 240, but only half of those satisfy the Mathematics condition.", "why": "The excluded case must also satisfy the Mathematics-before-Physics rule, so only 60, not 120, are removed."}, {"id": "T3-Q2H-09", "type": "multi", "skill": "Inequalities", "difficulty": 4, "stem": "Which of the following values of x satisfy the inequality x/(x − 2) ≥ 3? Indicate all such values.", "options": ["−3", "0", "2", "2.5", "3", "4"], "answer": [3, 4], "explain": "Rewrite the inequality as x/(x − 2) − 3 ≥ 0, that is (6 − 2x)/(x − 2) ≥ 0. The numerator is non-negative when x ≤ 3 and the denominator is positive when x > 2, so the solution is 2 < x ≤ 3: only 2.5 and 3. Multiplying both sides by x − 2 without checking its sign gives x ≤ 3 and wrongly admits −3 and 0, and x = 2 makes the expression undefined.", "why": "Multiplying by x − 2 without regard to its sign admits values below 2."}, {"id": "T3-Q2H-10", "type": "mc", "skill": "Number properties and counting", "difficulty": 4, "stem": "How many positive integers less than 200 are divisible by 6 or by 15 but not by 10?", "options": ["28", "30", "32", "34", "40"], "answer": 3, "explain": "There are 33 multiples of 6 and 13 multiples of 15 below 200, and the 6 multiples of 30 are in both lists, so 33 + 13 − 6 = 40 numbers are divisible by 6 or 15. Such a number is divisible by 10 only if it is a multiple of 30, so those 6 must be removed as well: 40 − 6 = 34. Stopping at 40 ignores the 'not by 10' condition.", "why": "The multiples of 30 have to be removed twice: once as the overlap and again for the 'not by 10' condition."}, {"id": "T3-Q2H-11", "type": "fraction", "skill": "Rates and work", "difficulty": 4, "stem": "An empty storage tank on a building site is filled by two inlet pipes and emptied by a drain. Working alone, pipe A would fill the tank in 4 hours and pipe B in 6 hours, and the drain alone would empty a full tank in 8 hours. All three are opened at the same time. After 2 hours pipe B is shut off, while pipe A and the drain stay open. What fraction of the tank is full 1 hour after pipe B is shut off? Give your answer as a fraction.", "answer": [17, 24], "explain": "Together the three fill 1/4 + 1/6 − 1/8 = 7/24 of the tank per hour, so after 2 hours the tank is 14/24 full. Pipe A and the drain then add 1/4 − 1/8 = 3/24 in the next hour, giving 17/24. Adding the drain's rate instead of subtracting it, or leaving pipe B running for all 3 hours, are the usual slips.", "why": "The drain's rate must be subtracted, and the combined rate changes when pipe B stops."}, {"id": "T3-Q2H-12", "type": "mc", "skill": "Statistics", "difficulty": 4, "stem": "Five different positive integers have a median of 12 and an average (arithmetic mean) of 10. What is the greatest possible range of the five integers?", "options": ["17", "19", "20", "21", "22"], "answer": 3, "explain": "The integers total 50. To make the range as large as possible, make every other value as small as the conditions allow: 1 and 2 below the median and 13 just above it. The largest is then 50 − 1 − 2 − 12 − 13 = 22, so the range is 22 − 1 = 21. The answer 22 comes from repeating 12 above the median, which 'different' rules out.", "why": "Every other value must be as small as distinctness allows, including the one just above the median."}, {"id": "T3-Q2H-13", "type": "mc", "skill": "Data interpretation", "chart": "t3-fund-values", "difficulty": 4, "stem": "By what percent did the combined value of the two funds increase from the end of 2019 to the end of 2024, to the nearest whole percent?", "options": ["55%", "57%", "58%", "60%", "67%"], "answer": 1, "explain": "The combined value rose from 40 + 30 = 70 to 60 + 50 = 110 thousand dollars, an increase of 40 ÷ 70 ≈ 57.1%, or 57%. Averaging the separate increases of 50% for Fund X and about 66.7% for Fund Y gives about 58%, which wrongly gives the smaller fund equal weight.", "why": "Averaging the two funds' percent increases gives 58%, one point off."}, {"id": "T3-Q2H-14", "type": "numeric", "skill": "Data interpretation", "chart": "t3-fund-values", "difficulty": 5, "stem": "Suppose that after 2024, Fund X's value increases by $3 thousand each year, while Fund Y's value increases each year by 10% of its value at the end of the previous year. In what year will Fund Y's year-end value first be greater than Fund X's?", "answer": 2028, "explain": "Start from the 2024 values, 60 and 50 thousand dollars. Fund X then reaches 63, 66, 69 and 72 while Fund Y reaches 55, 60.5, 66.55 and 73.205, so Fund Y first leads at the end of 2028. Treating Fund Y's growth as a fixed $5 thousand a year (10% of 50) makes the funds equal in 2029 and gives 2030.", "why": "Fund Y's growth compounds; treating it as a fixed $5 thousand a year gives 2030."}, {"id": "T3-Q2H-15", "type": "multi", "skill": "Data interpretation", "chart": "t3-fund-values", "difficulty": 4, "stem": "Based on the chart, which of the following statements are true? Indicate all such statements.", "options": ["The median of Fund Y's six year-end values is greater than $40 thousand.", "Fund X's average (arithmetic mean) year-end value over the six years is greater than $48 thousand.", "From the end of 2022 to the end of 2023, Fund Y's value increased by a greater percentage than Fund X's.", "In every year in which Fund X's value decreased, Fund Y's value also decreased."], "answer": [1, 2], "explain": "Fund Y's values in order are 30, 35, 40, 40, 50 and 50, so the median is exactly 40, not more. Fund X's values total 295, an average of about 49.2. From 2022 to 2023 both funds gained 10 thousand, but that is 25% of Fund Y's 40 against about 22% of Fund X's 45. Fund X fell only in 2022, when Fund Y stayed at 40.", "why": "Equal dollar gains are unequal percentages, and a median of exactly 40 is not greater than 40."}]}, "V2E": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "E-V-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Far from being ______, the committee's report was so carefully hedged that readers struggled to find a single firm recommendation in it.", "blanks": [["tentative", "lengthy", "belated", "unequivocal", "partisan"]], "answer": [3], "explain": "A report so hedged that no firm recommendation appears is the opposite of clear and definite, and 'far from being' asks for that opposite: unequivocal. 'Tentative' is the trap, since it describes what the report actually was. Nothing in the sentence concerns length, bias or timing."}, {"id": "E-V-02", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Because the old factory's brick walls proved far sturdier than expected, the architects decided to ______ them in the new building rather than demolish them, and the exposed brick now gives the lobby much of its character.", "blanks": [["dismantle", "replicate", "retain", "abandon", "disguise"]], "answer": [2], "explain": "'Rather than demolish them' and the walls still being visible in the lobby show they were kept: retain. 'Disguise' clashes with the brick being exposed, and 'dismantle' means much the same as demolish."}, {"id": "E-V-03", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Early reviewers dismissed the cookbook as (i)______, a mere collection of familiar recipes, but cooks soon discovered that its methods were genuinely (ii)______, often reversing steps that every other book took for granted.", "blanks": [["innovative", "exhaustive", "derivative"], ["conventional", "novel", "tedious"]], "answer": [2, 1], "explain": "'A mere collection of familiar recipes' defines the first blank: derivative. 'But' and the methods that reverse standard steps call for the opposite in the second: novel. 'Innovative' in the first blank and 'conventional' in the second would reverse the contrast."}, {"id": "E-V-04", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The researcher's early findings were (i)______, drawn from only a handful of participants, so she was careful to describe them as (ii)______ rather than conclusive; only after a much larger study had (iii)______ them did she state them with confidence.", "blanks": [["controversial", "preliminary", "definitive"], ["decisive", "tentative", "misleading"], ["ignored", "corroborated", "contradicted"]], "answer": [1, 1, 1], "explain": "Results from a handful of participants are preliminary, and 'rather than conclusive' calls for tentative. She became confident only once a larger study had corroborated them; a study that contradicted the findings would have undermined her confidence instead. Nothing suggests the early results were controversial."}, {"id": "E-V-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The manager's ______ approach to spending, which included reusing old folders and refusing to replace chairs that still worked, saved the department thousands of pounds.", "options": ["generous", "careless", "lavish", "thrifty", "frugal", "innovative"], "answer": [3, 4], "explain": "Reusing folders and keeping old chairs to save money describes careful, economical spending: frugal and thrifty. 'Lavish' and 'generous' are the opposite, and reusing folders is hardly innovative."}, {"id": "E-V-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Despite the critic's reputation for harshness, her review of the young playwright's first play was surprisingly ______.", "options": ["severe", "lengthy", "scathing", "laudatory", "anonymous", "complimentary"], "answer": [3, 5], "explain": "'Despite' her reputation for harshness, the review must have been the reverse of harsh, that is, full of praise: laudatory and complimentary. 'Scathing' and 'severe' form a matching pair, but they describe exactly the harshness the sentence says was absent."}, {"id": "E-V-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The negotiator remained ______ throughout the tense talks, never once raising her voice even when the other side made insulting remarks.", "options": ["indecisive", "verbose", "unflappable", "composed", "impatient", "belligerent"], "answer": [2, 3], "explain": "Never raising her voice in the face of insults shows calm self-control: composed and unflappable. 'Belligerent' and 'impatient' contradict that calm, and nothing in the sentence concerns how much she talked or whether she could make decisions."}, {"id": "E-V-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The council's plan to ______ flooding in the valley by restoring wetlands upstream was praised for reducing, though not eliminating, the risk to nearby homes.", "options": ["mitigate", "eliminate", "predict", "cause", "ignore", "alleviate"], "answer": [0, 5], "explain": "The plan reduces the risk 'though not eliminating' it, so it lessens the flooding: mitigate and alleviate. 'Eliminate' is the trap the sentence explicitly rules out, and a plan cannot predict or ignore flooding by restoring wetlands."}, {"id": "E-V-09", "type": "mc", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 2, "stem": "The passage is primarily concerned with", "options": ["describing the history of suburban road building in the twentieth century", "explaining a challenge to a long-standing principle of street design and assessing how far that challenge applies", "comparing the safety records of rural highways with those of city streets", "defending traffic engineers against criticism from urban designers", "arguing that forgiving design should be abandoned on every type of road"], "answer": 1, "explain": "The passage sets out forgiving design, presents the urban designers' objection and its evidence, then limits the objection to busy urban streets. Abandoning forgiving design everywhere is too strong, since the final paragraph says it still helps on rural highways; suburban history is only background in the first paragraph."}, {"id": "E-V-10", "type": "mc", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 3, "stem": "The studies of city streets described in the second paragraph are presented as evidence that", "options": ["planting trees is the most effective way to slow traffic", "drivers prefer narrow streets to wide ones", "narrowing urban streets prevents crashes altogether", "rural highways would also be safer if their lanes were narrowed", "reducing the room drivers have to correct mistakes need not lead to more crashes"], "answer": 4, "explain": "On the narrowed streets crashes 'did not rise, even though drivers now had less room to correct their mistakes', which is exactly what the critics' view predicts. The studies show no rise in crashes, not their disappearance, and the passage says nothing about drivers' preferences or about narrowing rural highways."}, {"id": "E-V-11", "type": "multi", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 3, "stem": "Which of the following can be inferred from the passage about forgiving design? Select all that apply.", "options": ["It remains appropriate for some kinds of road.", "Its supporters assumed that giving drivers more space would not lead them to change their behavior in a way that cancels the benefit.", "It was first developed for residential streets and only later extended to highways."], "answer": [0, 1], "explain": "The critics say forgiving design rested on a mistaken picture in which drivers 'simply enjoy the benefit of extra space' rather than speeding up, so its supporters assumed no such offsetting change. The final paragraph says rural highways still benefit from it. The passage says it was applied to highways and also to residential streets, but never that residential streets came first."}, {"id": "E-V-12", "type": "sentence", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 2, "stem": "Select the sentence in which the author states the general principle that the debate described in the passage illustrates.", "answer": 10, "explain": "The last sentence draws 'the lesson of the debate': no street feature is safe or dangerous in itself, because its effect depends on drivers' response and the street's purpose. The sentence about busy urban streets gives the critics' specific conclusion, not the general principle."}, {"id": "E-V-13", "type": "mc", "skill": "Reading comprehension", "passage": "e-generation-effect", "difficulty": 2, "stem": "The experiments with nonwords are mentioned primarily in order to", "options": ["demonstrate that people cannot remember nonwords at all", "argue that reading is a more effective way to learn than producing", "explain why producing real words takes more effort than producing nonwords", "present evidence that effort alone does not account for the generation effect", "show that the generation effect is stronger for nonwords than for real words"], "answer": 3, "explain": "Producing nonwords took at least as much effort as producing real words yet gave little or no memory advantage, which undercuts the idea that effort by itself explains the effect. The passage says nonwords show a weaker effect, not a stronger one, and it never claims they cannot be remembered at all."}, {"id": "E-V-14", "type": "multi", "skill": "Reading comprehension", "passage": "e-generation-effect", "difficulty": 3, "stem": "Which of the following can be inferred from the passage? Select all that apply.", "options": ["Producing material oneself improves later recall whatever kind of material is produced.", "The original explanation of the generation effect would predict a memory advantage for nonwords that participants produced themselves.", "People who read nonwords recall them about as well as people who produce them."], "answer": [1, 2], "explain": "The original account credited the effect to effort, and producing nonwords took at least as much effort as producing words, so that account predicts an advantage for them. The nonword experiments found 'little or no memory advantage' over reading, so recall was similar either way. That same finding rules out the claim that producing any kind of material helps."}, {"id": "E-V-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "e-yoghurt-aroma", "difficulty": 3, "stem": "Which of the following, if true, most seriously weakens the company's conclusion?", "options": ["Aroma compounds are known to affect how sweet some other fruit-flavored foods taste.", "In its first month, the new yoghurt sold slightly less than the original had sold in the month before.", "In a separate blind tasting, the same panels rated a version with 20 percent less sugar and no added aroma as exactly as sweet as the original.", "Some panellists said that the new recipe tasted more strongly of strawberry than the original.", "Strawberry aroma costs more per serving than the sugar it replaced."], "answer": 2, "explain": "If the panels could not detect the 20 percent cut even without extra aroma, there was no lost sweetness for the aroma to make up, so the tasting results no longer support the company's explanation. Sales figures are tempting but concern a different month and many other factors, not perceived sweetness. The point about other fruit-flavored foods strengthens the conclusion rather than weakening it."}]}, "Q2E": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "E-Q-01", "type": "qc", "skill": "Percentages", "difficulty": 3, "given": "A jacket priced at $80 has its price raised by 25%. The new price is then reduced by 25%.", "qa": "The final price of the jacket, in dollars", "qb": "80", "answer": 1, "explain": "After the rise the price is 80 × 1.25 = $100, and 25% off $100 is $25, leaving $75. The two changes do not cancel, because the cut is taken from a larger amount than the rise was. So Quantity B is greater."}, {"id": "E-Q-02", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "y² = 4y", "qa": "y", "qb": "4", "answer": 3, "explain": "Rearranging gives y² − 4y = 0, so y(y − 4) = 0 and y is 0 or 4. Dividing both sides by y to get y = 4 silently assumes y ≠ 0. If y = 4 the quantities are equal; if y = 0, Quantity B is greater, so the relationship cannot be determined."}, {"id": "E-Q-03", "type": "qc", "skill": "Geometry", "difficulty": 2, "given": "A triangle has two sides of lengths 5 and 8.", "qa": "The length of the third side", "qb": "3", "answer": 0, "explain": "Any side of a triangle must be longer than the difference of the other two and shorter than their sum, so the third side is between 8 − 5 = 3 and 8 + 5 = 13. A third side of exactly 3 would make the three points lie on a straight line, so it must be more than 3. Quantity A is greater."}, {"id": "E-Q-04", "type": "qc", "skill": "Geometry", "difficulty": 2, "given": "A rectangular floor measuring 6 meters by 4 meters is covered exactly, with no gaps or overlaps, by square tiles with sides of 50 centimeters.", "qa": "The number of tiles used", "qb": "96", "answer": 2, "explain": "Along the 6-meter side 600 ÷ 50 = 12 tiles fit, and along the 4-meter side 400 ÷ 50 = 8 fit, so 12 × 8 = 96 tiles are used. A common slip is dividing the area 24 m² by 0.5, which gives 48; each tile covers 0.5 × 0.5 = 0.25 m², and 24 ÷ 0.25 = 96. The quantities are equal."}, {"id": "E-Q-05", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "p and q are different positive integers, and p + q = 10.", "qa": "pq", "qb": "25", "answer": 1, "explain": "With a fixed sum, the product is largest when the two numbers are as close as possible. The product 25 needs p = q = 5, which is not allowed, so the largest possible product is 4 × 6 = 24. Quantity B is greater."}, {"id": "E-Q-06", "type": "mc", "skill": "Rates", "difficulty": 3, "stem": "A cyclist rides 24 kilometers to a lake at an average speed of 12 kilometers per hour and returns along the same 24-kilometer route at an average speed of 8 kilometers per hour. What is her average speed for the whole round trip, in kilometers per hour?", "options": ["9.2", "9.6", "10", "10.4", "12"], "answer": 1, "explain": "The outward trip takes 24 ÷ 12 = 2 hours and the return takes 24 ÷ 8 = 3 hours, so she covers 48 km in 5 hours: 48 ÷ 5 = 9.6 km/h. The tempting 10 averages the two speeds, but she spends longer at the slower speed, which pulls the average below 10."}, {"id": "E-Q-07", "type": "mc", "skill": "Algebra", "difficulty": 2, "stem": "Tickets for a school play cost $4 for students and $7 for adults. On opening night, 150 tickets were sold for a total of $795. How many adult tickets were sold?", "options": ["50", "55", "60", "65", "70"], "answer": 3, "explain": "If all 150 tickets had been student tickets the takings would be 150 × 4 = $600. Each adult ticket adds $3 more, and the extra is 795 − 600 = $195, so there were 195 ÷ 3 = 65 adult tickets. Check: 85 × 4 + 65 × 7 = 340 + 455 = 795."}, {"id": "E-Q-08", "type": "numeric", "skill": "Geometry", "difficulty": 2, "stem": "A rectangular lawn measures 18 meters by 12 meters. A path 1 meter wide runs around the outside of the lawn, along all four sides. What is the area of the path, in square meters?", "answer": 64, "explain": "The lawn and path together form a rectangle (18 + 2) by (12 + 2) = 20 m by 14 m, with area 280 m². Subtracting the lawn's 18 × 12 = 216 m² leaves 64 m². Multiplying the lawn's perimeter, 60 m, by the 1 m width gives 60 and misses the four 1 m by 1 m corner squares."}, {"id": "E-Q-09", "type": "multi", "skill": "Number properties", "difficulty": 3, "stem": "A coach divides 36 players into teams so that every player is on exactly one team, all teams are the same size, and each team has more than 3 but fewer than 12 players. Which of the following
