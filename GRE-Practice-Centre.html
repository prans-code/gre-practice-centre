 belong to the community rather than to her analysis.", "blanks": [["tendentious", "reductive", "untidy", "systematic", "polemical"]], "answer": [2], "why": "'In the best sense' signals a word normally taken as a fault, while 'systematic' sounds like praise but names what she avoids.", "explain": "She declines to force her observations into one scheme and leaves contradictions standing, so the account is untidy, a usual fault that 'in the best sense' turns into praise. 'Systematic' and 'reductive' describe the single scheme she refuses, and 'tendentious' and 'polemical' clash with her even-handed trust in readers."}, {"id": "T2-V2H-04", "type": "tc", "skill": "Text completion", "difficulty": 5, "stem": "Literary historians have tended to read the novelist's late fables as a retreat from the realism of her earlier work, yet the fables are in some respects the more (i)______ books: having (ii)______ the dense description through which the novels documented rural poverty, they lay bare the economic logic that such description had (iii)______.", "blanks": [["whimsical", "incisive", "derivative"], ["imitated", "intensified", "jettisoned"], ["occluded", "illuminated", "quantified"]], "answer": [1, 2, 0], "why": "Each blank depends on reading 'lay bare' as the reverse of what the description did; 'illuminated' feels apt for realist description but makes the fables' achievement redundant.", "explain": "'Yet' reverses the 'retreat' reading, so the fables are sharper in their grasp of reality: incisive, not 'whimsical'. Fables lack dense description, so they have jettisoned it. If the fables 'lay bare' the economic logic, the description must have hidden it: occluded; logic the novels had already illuminated would need no laying bare."}, {"id": "T2-V2H-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Though the eclipse expedition's photographs were later hailed as decisive, the measurements taken from them were so ______ that a skeptic could have read them as supporting either theory.", "options": ["ingenious", "inexact", "unimpeachable", "imprecise", "voluminous", "conclusive"], "answer": [1, 3], "explain": "Measurements that could support either theory lacked precision: imprecise and inexact. 'Conclusive' and 'unimpeachable' form a pair, but they repeat the 'decisive' verdict that 'though' sets against the blank, and neither 'ingenious' nor 'voluminous' would leave the result open to either reading."}, {"id": "T2-V2H-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "The novelist's prose, once dismissed as merely ______, has been reassessed by critics who find in its plainness a deliberate refusal of the ornamental style that her contemporaries mistook for depth.", "options": ["pedestrian", "florid", "prosaic", "opaque", "ornate", "polemical"], "answer": [0, 2], "why": "'Florid' and 'ornate' are a ready-made pair, but they describe the contemporaries' style, not her plain prose.", "explain": "The prose is plain, and the dismissal treated that plainness as dullness: pedestrian and prosaic. 'Florid' and 'ornate' are a pair, but they describe the ornamental style she refused, and 'opaque' and 'polemical' have nothing to do with plainness."}, {"id": "T2-V2H-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "The census-takers' local assistants were anything but ______ instruments of the colonial administration: they quietly reshaped its categories, recording clan affiliations for which the forms had no column and merging groups that the administrators had insisted were distinct.", "options": ["literate", "passive", "salaried", "subversive", "refractory", "obedient"], "answer": [1, 5], "why": "'Subversive' and 'refractory' form a tempting pair that describes the assistants accurately, which is exactly why 'anything but' rules them out.", "explain": "'Anything but' needs the opposite of reshaping the administration's categories, so the assistants were not compliant tools: passive and obedient. 'Subversive' and 'refractory' describe what they actually were, which 'anything but' denies, and 'salaried' and 'literate' have no bearing on reshaping the categories."}, {"id": "T2-V2H-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 5, "stem": "Her reviews were so consistently ______ that a single word of reproach from her could sink a debut novel, whereas her approval, being what everyone expected, did little for sales.", "options": ["indulgent", "caustic", "lenient", "anonymous", "acerbic", "influential"], "answer": [0, 2], "why": "'Caustic' and 'acerbic' fit the image of a feared critic, but the sentence says her reproach mattered because it was rare and her approval was expected.", "explain": "Her approval was 'what everyone expected', so her reviews were habitually generous, which is also why a rare reproach carried such weight: indulgent and lenient. 'Caustic' and 'acerbic' are a pair, but a habitually harsh critic's approval would be the surprising thing, and 'influential' clashes with approval that did little for sales."}, {"id": "T2-V2H-09", "type": "mc", "skill": "Reading comprehension", "passage": "t2-genetic-criticism", "difficulty": 4, "stem": "Which of the following best describes the relationship between the editors discussed in the first paragraph and the genetic critics discussed in the second?", "options": ["Both treat an author's final intentions as the standard against which a text should be judged.", "The editors ignored drafts, whereas the genetic critics were the first to examine them.", "Both examine drafts, but they disagree about whether the drafts or a finished text is the proper object of study.", "The editors valued deletions as evidence of an author's thinking, whereas the genetic critics regard them as errors.", "The genetic critics accept the editors' authoritative texts but dispute the methods used to establish them."], "answer": 2, "why": "Skimmers recall that editors 'set aside' drafts and pick the first option, missing that editors used drafts as evidence first.", "explain": "Editors used drafts 'chiefly as evidence' for fixing an authoritative text, while genetic critics 'reversed this order of priority', making drafts the 'primary object of study'. The editors did not ignore drafts; they set them aside only after using them. The option about deletions reverses the passage, since genetic critics treat a deletion as a possibility explored rather than an error."}, {"id": "T2-V2H-10", "type": "mc", "skill": "Reading comprehension", "passage": "t2-genetic-criticism", "difficulty": 5, "stem": "The author mentions authors who destroyed their drafts primarily in order to", "options": ["explain why genetic criticism developed later than editorial scholarship", "suggest that writers themselves granted their released work a standing that their drafts lacked", "argue that editors should refrain from publishing an author's drafts", "illustrate how accidents of preservation distort the record of a work's composition", "concede that genetic criticism has enlarged what counts as literary evidence"], "answer": 1, "why": "Destroying drafts does shrink the surviving record, so the option about preservation tempts, but the passage cites it as evidence of the line authors drew between released and kept work.", "explain": "The point appears in the sentence rejecting the claim that the published text 'enjoys no special status': authors drew a sharp line between what they released and what they kept, and destroying drafts shows that line. The incompleteness of the record is the next sentence's separate point, and it concerns 'accidents', whereas destruction was deliberate."}, {"id": "T2-V2H-11", "type": "multi", "skill": "Reading comprehension", "passage": "t2-genetic-criticism", "difficulty": 4, "stem": "Based on the passage, a genetic critic would most likely agree with which of the following statements? Select all that apply.", "options": ["The published version of a work is the stage of its composition that most deserves a critic's attention.", "Drafts remain worth studying even after an editor has used them to establish an authoritative text.", "A passage that an author struck out of a draft can shed light on the meaning of the published work."], "answer": [1, 2], "why": "The third statement is never stated; it follows from treating drafts as the object of study rather than as scaffolding to be removed.", "explain": "Genetic critics hold that attending to a deletion may teach 'how a work means', which supports the first statement, and they treat drafts as the 'primary object of study' rather than scaffolding discarded once the text is fixed, which supports the third. The second contradicts their view that the published version is 'not necessarily a privileged' moment."}, {"id": "T2-V2H-12", "type": "sentence", "skill": "Reading comprehension", "passage": "t2-genetic-criticism", "difficulty": 4, "stem": "Select the sentence in which the author questions the reliability of the evidence genetic critics work from, rather than the status they assign to that evidence.", "answer": 8, "why": "The sentence about authors who destroyed drafts also criticizes genetic criticism, but it disputes the status of the published text, not the reliability of the drafts.", "explain": "The sentence beginning 'Moreover' says surviving drafts are 'seldom a complete record' and reflect 'accidents of preservation', so accounts built on them may reflect the critic's ingenuity: a doubt about the evidence itself. The sentence before it disputes the claim that the published text has no special status, and the final sentence is about how much weight the drafts should carry."}, {"id": "T2-V2H-13", "type": "mc", "skill": "Reading comprehension", "passage": "t2-galaxy-rotation", "difficulty": 3, "stem": "The 'economy' that the rival proposal's defenders regard as decisive consists in the proposal's", "options": ["predicting galaxies' orbital speeds without a separate adjustment for each galaxy", "accounting for the motions of galaxies within clusters", "agreeing with the standard law of gravity at high accelerations", "relying on observations of clusters rather than of single galaxies", "showing that dark-matter models cannot reproduce orbital speeds at all"], "answer": 0, "explain": "The proposal predicts orbital speeds 'from the distribution of visible matter alone', whereas dark-matter models must adjust 'each halo separately'; that contrast is the economy. Clusters are where the proposal falls short, and dark-matter models can match the speeds, so the option saying they cannot is too strong."}, {"id": "T2-V2H-14", "type": "multi", "skill": "Reading comprehension", "passage": "t2-galaxy-rotation", "difficulty": 4, "stem": "Which of the following can be inferred from the passage? Select all that apply.", "options": ["The modified law of gravity, without additional unseen mass, does not account for all the motions observed in clusters of galaxies.", "Dark-matter models can reproduce the orbital speeds of individual galaxies.", "The author regards the proposal to modify the law of gravity as having been refuted."], "answer": [0, 1], "why": "The first statement hides inside 'can match only by adjusting', which readers take as a criticism and miss as a concession.", "explain": "Dark-matter models 'can match' the speeds, if only by adjusting each halo, and the modified law 'falls short' in clusters 'unless some unseen mass is added', so the first two statements follow. The author says the modification 'may capture a genuine regularity', which is not the language of refutation."}, {"id": "T2-V2H-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t2-wedding-cattle", "difficulty": 4, "stem": "Which of the following, if true, most helps to explain the apparent discrepancy described above?", "options": ["Because cattle have become so expensive, a gift of cattle at a wedding now confers more prestige than it did thirty years ago.", "In neighboring lowland regions, the number of cattle transferred at weddings has declined over the past thirty years.", "The rise in the price of cattle is largely the result of a series of droughts that reduced the size of the region's herds.", "Couples in the region now marry, on average, several years later than they did thirty years ago.", "Many families now pay for wedding cattle with money sent by relatives working in distant cities, and a lavish cattle payment has become a way to display that prosperity."], "answer": 4, "why": "The drought option explains half the puzzle, the price rise, and so looks relevant, but it makes rising wedding transfers more surprising, not less.", "explain": "The puzzle is how scarcer, dearer cattle can be given away in greater numbers. Money from outside the local herding economy supplies the means, and the display value of a costly gift supplies the motive. Greater prestige alone supplies a motive but not the means, since fewer households own cattle and each costs more; the drought explains only the higher price."}]}, "Q1": {"measure": "Quant", "minutes": 21, "label": "Quantitative Reasoning: Section 1", "questions": [{"id": "T2-Q1-01", "type": "qc", "skill": "Number properties", "difficulty": 3, "given": "n is a positive integer, and n² is divisible by 72.", "qa": "The least possible value of n", "qb": "12", "answer": 2, "explain": "72 = 2³ × 3², and every prime in n² appears to an even power, so n² must contain at least 2⁴ × 3². That means n must be a multiple of 2² × 3 = 12, and 12² = 144 = 2 × 72 works. Trying 6 fails, because 36 is only half of 72."}, {"id": "T2-Q1-02", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "x + y = 10 and x − y > 4", "qa": "xy", "qb": "21", "answer": 1, "explain": "Use 4xy = (x + y)² − (x − y)² = 100 − (x − y)². Since (x − y)² > 16, 4xy < 84, so xy < 21. For example, x = 7.5 and y = 2.5 give xy = 18.75."}, {"id": "T2-Q1-03", "type": "qc", "skill": "Geometry", "difficulty": 4, "given": "A rectangle has a perimeter of 40 and a diagonal of length 15.", "qa": "The area of the rectangle", "qb": "87.5", "answer": 2, "explain": "If the sides are l and w, then l + w = 20 and l² + w² = 15² = 225. Squaring the first gives 400 = l² + w² + 2lw = 225 + 2lw, so lw = 87.5. The sides themselves are not whole numbers, but the area is fixed.", "why": "The sides cannot be found easily, which tempts 'cannot be determined', yet the area follows directly from (l + w)²."}, {"id": "T2-Q1-04", "type": "qc", "skill": "Probability", "difficulty": 3, "given": "A rack holds 5 test tubes with red caps and 3 with blue caps. Two tubes are taken from the rack at random, without replacement.", "qa": "The probability that the two tubes have caps of the same color", "qb": "The probability that the two tubes have caps of different colors", "answer": 1, "explain": "There are C(8, 2) = 28 equally likely pairs. Same color: C(5, 2) + C(3, 2) = 10 + 3 = 13 pairs; different colors: 5 × 3 = 15 pairs. So B (15/28) is greater, even though red caps are in the majority."}, {"id": "T2-Q1-05", "type": "mc", "skill": "Percent", "difficulty": 3, "stem": "A shop sets the list price of a coat 60% above what the coat cost the shop. In a sale, the coat sells for 25% less than its list price, and the shop makes a profit of $36 on the sale. What did the coat cost the shop?", "options": ["$150", "$180", "$216", "$240", "$270"], "answer": 1, "explain": "If the cost is c, the sale price is c × 1.6 × 0.75 = 1.2c, so the profit is 0.2c = $36 and c = $180. $216 is the sale price, not the cost, and subtracting the percentages (60% − 25% = 35% profit) is the trap: percent changes multiply."}, {"id": "T2-Q1-06", "type": "numeric", "skill": "Rates", "difficulty": 3, "unit": "km", "stem": "Stations P and Q are 330 kilometers apart on a railway line. A train leaves P at 10:00 and travels toward Q at a constant 60 km/h. A second train leaves Q at 10:30 and travels toward P at a constant 90 km/h. How many kilometers from P are the trains when they pass each other?", "answer": 150, "explain": "By 10:30 the first train has covered 30 km, leaving a 300 km gap that closes at 60 + 90 = 150 km/h, so they meet 2 hours later, at 12:30. The first train has then run for 2.5 hours: 2.5 × 60 = 150 km from P. Ignoring the half-hour delay gives 330 × 60/150 = 132, the trap."}, {"id": "T2-Q1-07", "type": "multi", "skill": "Number properties", "difficulty": 4, "stem": "When the positive integer n is divided by 7, the remainder is 3. Which of the following could be the remainder when n² is divided by 21? Indicate all such values.", "options": ["2", "4", "9", "11", "16", "18"], "answer": [2, 4], "explain": "n is 3, 10, 17, 24, …, and modulo 21 these repeat as 3, 10, 17. Their squares are 9, 100 and 289, which leave remainders 9, 16 and 16 when divided by 21. So only 9 and 16 are possible.", "why": "Testing only n = 3 finds 9 and misses 16, because n can fall into three different classes modulo 21."}, {"id": "T2-Q1-08", "type": "mc", "skill": "Statistics", "difficulty": 5, "stem": "A list of seven integers has an average (arithmetic mean) of 10 and a median of 12, and 14 is its only mode. What is the greatest possible value of the smallest integer in the list?", "options": ["2", "3", "4", "5", "6"], "answer": 3, "explain": "The total is 70 and the middle value is 12, so the three values above 12 should be as small as possible. With 14, 14, 14 (total 42) the lowest three total 16 and may include a repeated value, since 14 appears three times: 5, 5, 6 gives a smallest value of 5. The cheaper-looking 13, 14, 14 (total 41) lets 14 appear only twice, so the lowest three must be different and total 17, and the smallest can then be at most 4 (for example 4, 6, 7).", "why": "Making the upper three as small as possible (13, 14, 14) seems best but forces the lower three to be distinct, giving 4 instead of 5."}, {"id": "T2-Q1-09", "type": "fraction", "skill": "Probability", "difficulty": 4, "stem": "An integer is chosen at random from the integers 1 to 60, inclusive. What is the probability that it is divisible by 4 or by 6, but not by both? Give your answer as a fraction.", "answer": [1, 4], "explain": "There are 15 multiples of 4 and 10 multiples of 6, and 5 numbers (the multiples of 12) are in both lists. Numbers in exactly one list: 15 + 10 − 2 × 5 = 15, so the probability is 15/60 = 1/4. Subtracting the overlap only once gives 20/60, which counts the multiples of 12.", "why": "'Not by both' means removing the multiples of 12 from both lists, so the overlap is subtracted twice."}, {"id": "T2-Q1-10", "type": "mc", "skill": "Data interpretation", "table": "t2-hardware-shop", "difficulty": 3, "stem": "For the product whose number of units sold rose by the greatest percentage from January–March to April–June, by approximately what percent did its revenue (price × units sold) rise?", "options": ["8%", "10%", "15%", "18%", "20%"], "answer": 4, "explain": "Units sold rose by 15/45 ≈ 33% for drills, 120/400 = 30% for screws and 6/30 = 20% for ladders, so drills had the greatest rise. Drill revenue went from 45 × $80 = $3,600 to 60 × $72 = $4,320, a rise of 20%. Screws had the largest rise in units, but their revenue rose only about 8%."}, {"id": "T2-Q1-11", "type": "mc", "skill": "Data interpretation", "table": "t2-hardware-shop", "difficulty": 4, "stem": "Considering every unit of the five products sold in April–June, what was the approximate average (arithmetic mean) price paid per unit?", "options": ["$10.44", "$14.36", "$24.40", "$30.20", "$36.00"], "answer": 0, "explain": "Revenue in April–June was $3,300 + $2,160 + $4,320 + $1,980 + $2,600 = $14,360 from 220 + 540 + 60 + 36 + 520 = 1,376 units, or about $10.44 per unit. Averaging the five prices gives $30.20, but that ignores how many of each product were sold.", "why": "The mean must be weighted by units sold; the plain average of the five listed prices is the trap."}, {"id": "T2-Q1-12", "type": "multi", "skill": "Data interpretation", "table": "t2-hardware-shop", "difficulty": 4, "stem": "For which products was the percent change in revenue (price × units sold) from January–March to April–June greater than the percent change in units sold? (A decrease counts as a negative percent change.) Indicate all such values.", "options": ["Paint (tin)", "Brush", "Drill", "Ladder", "Screws (box)"], "answer": [0, 3], "explain": "Revenue is price × units, so revenue grows by a larger percentage than units exactly when the price rose. Prices rose only for paint ($12 to $15) and ladders ($50 to $55). Brush revenue and units both fell by 10%, so they are equal, not greater.", "why": "Spotting that only the price change matters saves the arithmetic; the brush, with an unchanged price, ties rather than qualifies."}]}, "Q2M": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "T2-Q2M-01", "type": "qc", "skill": "Coordinate geometry", "difficulty": 3, "given": "In the xy-plane, point A is at (−3, 4) and point B is at (5, −2).", "qa": "The distance between the origin and the midpoint of segment AB", "qb": "1.4", "answer": 0, "explain": "The midpoint is ((−3 + 5)/2, (4 − 2)/2) = (1, 1), which is √2 ≈ 1.414 from the origin. Comparing squares: 2 > 1.96, so A is greater."}, {"id": "T2-Q2M-02", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "0 < x < 1", "qa": "(x² + 1) / x", "qb": "2", "answer": 0, "explain": "Since x > 0, multiply both quantities by x: compare x² + 1 with 2x. Their difference is x² − 2x + 1 = (x − 1)², which is positive because x ≠ 1. So A is always greater."}, {"id": "T2-Q2M-03", "type": "qc", "skill": "Statistics", "difficulty": 3, "given": "List X is 3, 5, 7, 9, 11. List Y is formed by multiplying each number in list X by −2 and then adding 30.", "qa": "The standard deviation of list Y", "qb": "Twice the standard deviation of list X", "answer": 2, "explain": "Adding 30 shifts every value without changing the spread. Multiplying by −2 doubles every distance from the mean and the sign only flips the list over, so the standard deviation exactly doubles. Y is 24, 20, 16, 12, 8: gaps of 4 instead of 2."}, {"id": "T2-Q2M-04", "type": "qc", "skill": "Number properties", "difficulty": 2, "qa": "The number of positive divisors of 36", "qb": "The number of positive divisors of 40", "answer": 0, "explain": "36 = 2² × 3² has (2 + 1)(2 + 1) = 9 divisors, and 40 = 2³ × 5 has (3 + 1)(1 + 1) = 8. The larger number does not have more divisors."}, {"id": "T2-Q2M-05", "type": "qc", "skill": "Coordinate geometry", "difficulty": 4, "given": "In the xy-plane, the point (a, b) lies on the line 2x + 3y = 12, with a > 0 and b > 0.", "qa": "ab", "qb": "6", "answer": 3, "explain": "From the line, b = (12 − 2a)/3, so ab = (12a − 2a²)/3 = 6 − (2/3)(a − 3)². The greatest value is 6, reached at (3, 2); any other point, such as (3/2, 3) with ab = 4.5, gives less. A can equal B or be smaller.", "why": "The maximum of ab is exactly 6, so trying only the point (3, 2) suggests 'equal' when other points give less."}, {"id": "T2-Q2M-06", "type": "mc", "skill": "Functions", "difficulty": 3, "stem": "The function f is defined by f(x) = x² − 4x for all numbers x. If f(t) = f(t + 3), what is the value of t?", "options": ["−1", "−1/2", "1/2", "1", "2"], "answer": 2, "explain": "t² − 4t = (t + 3)² − 4(t + 3) = t² + 2t − 3, so −4t = 2t − 3 and t = 1/2. As a check, the parabola is symmetric about x = 2, and 1/2 and 7/2 sit 1.5 on either side of it."}, {"id": "T2-Q2M-07", "type": "mc", "skill": "Mixtures", "difficulty": 4, "stem": "A lab technician has 300 milliliters of a solution that is 20% acid by volume. She pours off some of the solution and replaces it with the same volume of pure acid, giving 300 milliliters of a solution that is 30% acid. How many milliliters did she pour off?", "options": ["30", "37.5", "45", "50", "60"], "answer": 1, "explain": "If x mL is replaced, the acid is 0.2(300 − x) + x = 60 + 0.8x, which must equal 0.3 × 300 = 90. So 0.8x = 30 and x = 37.5. The answer 30 forgets that the solution poured off also took some acid with it.", "why": "Each milliliter swapped adds only 0.8 mL of acid, not 1 mL, because the liquid removed already contained 20% acid."}, {"id": "T2-Q2M-08", "type": "numeric", "skill": "Rates", "difficulty": 4, "unit": "km/h", "stem": "A bus route is 36 kilometers long. On one trip, the bus averages 24 km/h over the first 12 kilometers. What average speed, in kilometers per hour, must the bus keep over the remaining 24 kilometers so that its average speed for the whole route is 32 km/h?", "answer": 38.4, "explain": "The whole route must take 36/32 = 1.125 hours, and the first 12 km took 12/24 = 0.5 hours. That leaves 0.625 hours for 24 km: 24 ÷ 0.625 = 38.4 km/h. Weighting the speeds by distance gives 36 km/h, but average speed must be found from total distance over total time.", "why": "Averaging speeds, by distance or otherwise, gives 36 or 40; only total distance ÷ total time is right."}, {"id": "T2-Q2M-09", "type": "multi", "skill": "Geometry", "difficulty": 4, "stem": "Two sides of a triangle have lengths 6 and 10, and the angle between these two sides is obtuse. Which of the following could be the area of the triangle? Indicate all such values.", "options": ["15", "24", "29", "30", "31"], "answer": [0, 1, 2], "explain": "Take the side of length 10 as the base. The height is the distance from the far end of the side of length 6 to the line of the base, which equals 6 only when the angle is a right angle and is less than 6 otherwise. So the area, 5 × height, can be any value between 0 and 30 but not 30 itself.", "why": "The maximum area of 30 needs a right angle, which an obtuse angle rules out."}, {"id": "T2-Q2M-10", "type": "mc", "skill": "Counting", "difficulty": 3, "stem": "A shop assistant is arranging 6 different handbags in a row on a shelf. Two of the bags, one red and one blue, must not be placed next to each other. In how many different orders can the 6 bags be arranged?", "options": ["120", "240", "360", "480", "600"], "answer": 3, "explain": "There are 6! = 720 orders in all. Treating the red and blue bags as one block gives 5! = 120 orders, and the two bags can sit in the block in 2 orders, so 240 orders have them together. 720 − 240 = 480; forgetting to double the block gives 600."}, {"id": "T2-Q2M-11", "type": "fraction", "skill": "Probability", "difficulty": 3, "stem": "In a biology lab, 3 of the 10 cell cultures in a rack are contaminated. A technician selects 3 of the 10 cultures at random. What is the probability that exactly one of the selected cultures is contaminated? Give your answer as a fraction.", "answer": [21, 40], "explain": "There are C(10, 3) = 120 equally likely selections. Exactly one contaminated means choosing 1 of the 3 contaminated and 2 of the 7 clean cultures: 3 × 21 = 63. The probability is 63/120 = 21/40."}, {"id": "T2-Q2M-12", "type": "mc", "skill": "Number properties", "difficulty": 3, "stem": "How many positive integers less than 200 are multiples of 6 but not multiples of 9?", "options": ["22", "24", "27", "30", "33"], "answer": 0, "explain": "The multiples of 6 below 200 run from 6 to 198: 33 numbers. Those that are also multiples of 9 are the multiples of 18 (the least common multiple), from 18 to 198: 11 numbers. 33 − 11 = 22; using 6 × 9 = 54 instead of 18 gives 30."}, {"id": "T2-Q2M-13", "type": "mc", "skill": "Data interpretation", "table": "t2-bus-journeys", "difficulty": 3, "stem": "Journeys on all fare types other than adult, taken together, increased by approximately what percent from 2023 to 2024?", "options": ["4%", "8%", "12%", "14%", "16%"], "answer": 4, "explain": "Non-adult journeys were 1,000 − 480 = 520 thousand in 2023 and 1,036 − 432 = 604 thousand in 2024. The rise of 84 thousand is 84/520 ≈ 16%. The total grew by only 3.6% because adult journeys fell."}, {"id": "T2-Q2M-14", "type": "numeric", "skill": "Data interpretation", "table": "t2-bus-journeys", "difficulty": 4, "stem": "Suppose that after 2024, adult journeys fall each year by the same percentage as they did from 2023 to 2024, and student journeys rise each year by the same number as they did from 2023 to 2024. In what year would the number of student journeys first exceed the number of adult journeys?", "answer": 2027, "explain": "Adult journeys fell 10% (480 to 432) and student journeys rose by 40 thousand. Adult: 388.8 in 2025, 349.92 in 2026, 314.928 in 2027; student: 240, 280, 320. Student journeys first exceed adult ones in 2027.", "why": "One series shrinks by a percentage and the other grows by a fixed amount, so the gap has to be tracked year by year."}, {"id": "T2-Q2M-15", "type": "multi", "skill": "Data interpretation", "table": "t2-bus-journeys", "difficulty": 4, "stem": "For which fare types was the share of total journeys greater in 2024 than in 2023? Indicate all such values.", "options": ["Adult", "Student", "Child", "Senior", "Disability pass"], "answer": [1, 2, 3], "explain": "Total journeys grew by 3.6%, so a fare type's share rose only if its journeys grew by more than 3.6%. Student (+25%), child (+15%) and senior (+13%) qualify. Disability-pass journeys did not change, so their share fell from 4% to about 3.9%, and adult journeys fell.", "why": "An unchanged count looks like an unchanged share, but the share falls when the total grows."}]}, "Q2H": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "T2-Q2H-01", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "x and y are positive integers, and x² − y² = 45.", "qa": "The number of different pairs (x, y) that satisfy the equation", "qb": "3", "answer": 2, "explain": "Write (x − y)(x + y) = 45, where x − y is the smaller factor and both factors are odd. The factor pairs 1 × 45, 3 × 15 and 5 × 9 give (23, 22), (9, 6) and (7, 2). So there are exactly 3 pairs.", "why": "Students often stop after the first one or two factor pairs and miss 5 × 9."}, {"id": "T2-Q2H-02", "type": "qc", "skill": "Inequalities", "difficulty": 4, "given": "a and b are nonzero numbers, and a/b > 1.", "qa": "a²", "qb": "ab", "answer": 0, "explain": "a/b > 1 means a and b have the same sign and |a| > |b|. Then a² − ab = a(a − b): if both are positive, a > b and the product is positive; if both are negative, a < b < 0, so a and a − b are both negative and the product is again positive. For example, a = −4 and b = −2 give 16 against 8.", "why": "Negative values seem to break the comparison, but the case a < b < 0 still gives A greater."}, {"id": "T2-Q2H-03", "type": "qc", "skill": "Geometry", "difficulty": 4, "given": "A circle is inscribed in a square, and a smaller square is inscribed in the circle, with its four vertices on the circle.", "qa": "The area of the region inside the larger square but outside the circle", "qb": "The area of the region inside the circle but outside the smaller square", "answer": 1, "explain": "Let the radius be r. The larger square has side 2r and area 4r²; the smaller square has diagonal 2r and area 2r²; the circle has area πr². A = (4 − π)r² ≈ 0.86r² and B = (π − 2)r² ≈ 1.14r², so B is greater because π > 3.", "why": "The four corner regions look larger than the four thin slivers, but comparing 4 − π with π − 2 shows otherwise."}, {"id": "T2-Q2H-04", "type": "qc", "skill": "Statistics", "difficulty": 4, "given": "List L consists of 20 numbers, not all equal, with average (arithmetic mean) m. Exactly two of the numbers in L are equal to m. List M is formed by removing those two numbers from L.", "qa": "The standard deviation of list L", "qb": "The standard deviation of list M", "answer": 1, "explain": "Removing two values equal to m leaves the mean at m and leaves the sum of squared distances from the mean unchanged, since those two values contributed 0. The same total is now shared among 18 values instead of 20, so the typical distance from the mean grows and M has the greater standard deviation.", "why": "Removing values sounds as if it cannot widen a list, but removing values at the center does."}, {"id": "T2-Q2H-05", "type": "qc", "skill": "Counting", "difficulty": 4, "given": "A luggage locker at a railway station opens with a 4-digit code. Each digit can be any of 0 to 9, and digits may repeat.", "qa": "The number of possible codes in which at least one digit appears more than once", "qb": "The number of possible codes in which all four digits are different", "answer": 1, "explain": "All four digits different: 10 × 9 × 8 × 7 = 5,040. There are 10⁴ = 10,000 codes in all, so 10,000 − 5,040 = 4,960 have a repeat. B is greater, though only just.", "why": "Intuition about repeats can point either way, and the two counts differ by only 80, so they must be counted."}, {"id": "T2-Q2H-06", "type": "mc", "skill": "Functions", "difficulty": 5, "stem": "The function g is defined by g(x) = |x − 3| − |x + 1| for all numbers x. For how many integers k does the equation g(x) = k have exactly one solution?", "options": ["5", "6", "7", "8", "9"], "answer": 2, "explain": "For x ≤ −1, g(x) = (3 − x) − (−x − 1) = 4; for x ≥ 3, g(x) = −4; between them g(x) = 2 − 2x, which falls steadily from 4 to −4. So each k strictly between −4 and 4 is reached exactly once, while 4 and −4 are reached infinitely often. The integers −3 to 3 give 7.", "why": "Including k = 4 and k = −4 gives 9, but those values are taken on whole rays, not at a single point."}, {"id": "T2-Q2H-07", "type": "mc", "skill": "Work", "difficulty": 4, "stem": "Two pumps fill a tank in a marine-biology lab. Working alone, pump P can fill the tank in 6 hours and pump Q in 9 hours. Both pumps start together on the empty tank; after a while, pump P breaks down, and pump Q fills the rest of the tank alone. The tank is full exactly 5 hours after the start. For how long did pump P run?", "options": ["2 h", "2 h 10 min", "2 h 20 min", "2 h 30 min", "2 h 40 min"], "answer": 4, "explain": "Pump Q ran for all 5 hours and filled 5/9 of the tank, so pump P filled the other 4/9. At 1/6 of the tank per hour, that took (4/9) × 6 = 8/3 hours, or 2 h 40 min.", "why": "Q works for the full 5 hours; treating it as working only after P stops leads to a wrong equation."}, {"id": "T2-Q2H-08", "type": "numeric", "skill": "Coordinate geometry", "difficulty": 4, "stem": "In the xy-plane, a triangle has vertices at (0, 0), (8, 0) and (0, 6). How many points with integer coordinates lie inside the triangle or on its sides?", "answer": 33, "explain": "The triangle is x ≥ 0, y ≥ 0 and 3x + 4y ≤ 24. For x = 0, 1, …, 8 the number of allowed integer y values (0 up to (24 − 3x)/4) is 7, 6, 5, 4, 4, 3, 2, 1, 1. These add up to 33.", "why": "The hypotenuse passes through the lattice point (4, 3), which is easy to miss or to count twice."}, {"id": "T2-Q2H-09", "type": "multi", "skill": "Number properties", "difficulty": 5, "stem": "The positive integer n has exactly three positive divisors. Which of the following could be the number of positive divisors of 4n? Indicate all such values.", "options": ["3", "5", "6", "8", "9", "12"], "answer": [1, 4], "explain": "Only squares of primes have exactly three divisors, so n = p². If p is odd, 4n = 2² × p² has 3 × 3 = 9 divisors. If p = 2, then n = 4 and 4n = 16 = 2⁴ has 5 divisors.", "why": "Assuming p is odd gives only 9; the case p = 2 merges the primes and gives 5."}, {"id": "T2-Q2H-10", "type": "mc", "skill": "Statistics", "difficulty": 4, "stem": "Five different positive integers have a median of 10 and an average (arithmetic mean) of 12. What is the greatest possible difference between the largest and the smallest of the five integers?", "options": ["33", "35", "36", "37", "38"], "answer": 1, "explain": "The total is 60 and the middle value is 10. To stretch the range, make the smallest two as small as possible (1 and 2) and the fourth as small as possible (11); the largest is then 60 − 1 − 2 − 10 − 11 = 36, and the range is 36 − 1 = 35. Allowing repeats (1, 1, 10, 10, 38) would give 37.", "why": "The integers must be different, which pushes the second value up to 2 and the fourth up to 11."}, {"id": "T2-Q2H-11", "type": "fraction", "skill": "Probability", "difficulty": 5, "stem": "Each of 5 tourists is assigned at random to one of 3 tour buses; for each tourist, each bus is equally likely, independently of the others. What is the probability that every bus is assigned at least one tourist? Give your answer as a fraction.", "answer": [50, 81], "explain": "There are 3⁵ = 243 equally likely assignments. Assignments that leave a particular bus empty number 2⁵ = 32, and those that leave two particular buses empty number 1. By inclusion–exclusion, 3 × 32 − 3 × 1 = 93 leave some bus empty, so 243 − 93 = 150 fill every bus: 150/243 = 50/81.", "why": "Subtracting 3 × 32 alone double-counts the 3 assignments that put everyone on one bus."}, {"id": "T2-Q2H-12", "type": "mc", "skill": "Geometry", "difficulty": 3, "stem": "A storage box in the shape of a rectangular solid has a square base with sides of 6 centimeters. The straight-line distance through the inside of the box from one corner to the opposite corner is 11 centimeters. What is the height of the box, in centimeters?", "options": ["7", "8", "9", "√85", "11"], "answer": 0, "explain": "The space diagonal satisfies 6² + 6² + h² = 11², so h² = 121 − 72 = 49 and h = 7. Using only one side of the base (121 − 36 = 85) gives √85."}, {"id": "T2-Q2H-13", "type": "mc", "skill": "Data interpretation", "chart": "t2-ferry-routes", "difficulty": 4, "stem": "In how many of the six months did Route North carry more than 45% of the two routes' combined passengers?", "options": ["1", "2", "3", "4", "5"], "answer": 3, "explain": "North's share exceeds 45% when North > 0.45(North + South), that is when 11 × North > 9 × South. This holds in February (330 > 315), April (495 > 450), May (605 > 540) and June (660 > 630), but not in January (275 < 360) or March (385 < 405).", "why": "Several months are close to 45%, so eyeballing the bars is not enough; a quick exact test is needed."}, {"id": "T2-Q2H-14", "type": "numeric", "skill": "Data interpretation", "chart": "t2-ferry-routes", "difficulty": 4, "stem": "Suppose Route North carries x thousand passengers in July. If North's average (arithmetic mean) monthly number of passengers for January–July equals South's average monthly number of passengers for January–June, what is the value of x?", "answer": 100, "explain": "South carried 40 + 35 + 45 + 50 + 60 + 70 = 300 thousand in six months, an average of 50. North carried 25 + 30 + 35 + 45 + 55 + 60 = 250 thousand, so its seven-month total must be 7 × 50 = 350, giving x = 100. Answering 50 forgets that July must make up North's shortfall over the first six months.", "why": "The seven-month mean needs a seven-month total, so x must lift North's whole total, not just match South's average."}, {"id": "T2-Q2H-15", "type": "multi", "skill": "Data interpretation", "chart": "t2-ferry-routes", "difficulty": 4, "stem": "For which months was the percent increase in Route North's passengers over the previous month greater than the percent increase in Route South's passengers over the previous month? (A decrease counts as a negative percent increase.) Indicate all such months.", "options": ["February", "March", "April", "May", "June"], "answer": [0, 2, 3], "explain": "North vs South: February +20% vs −12.5%; March +16.7% vs +28.6%; April +28.6% vs +11.1%; May +22.2% vs +20%; June +9.1% vs +16.7%. North's increase is greater in February, April and May. In May both routes gained 10 thousand, but North's smaller base makes its percentage larger.", "why": "Equal rises in passengers (May) or a larger rise for South (June) must be judged against each route's starting value."}]}, "V2E": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "E-V-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Far from being ______, the committee's report was so carefully hedged that readers struggled to find a single firm recommendation in it.", "blanks": [["tentative", "lengthy", "belated", "unequivocal", "partisan"]], "answer": [3], "explain": "A report so hedged that no firm recommendation appears is the opposite of clear and definite, and 'far from being' asks for that opposite: unequivocal. 'Tentative' is the trap, since it describes what the report actually was. Nothing in the sentence concerns length, bias or timing."}, {"id": "E-V-02", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Because the old factory's brick walls proved far sturdier than expected, the architects decided to ______ them in the new building rather than demolish them, and the exposed brick now gives the lobby much of its character.", "blanks": [["dismantle", "replicate", "retain", "abandon", "disguise"]], "answer": [2], "explain": "'Rather than demolish them' and the walls still being visible in the lobby show they were kept: retain. 'Disguise' clashes with the brick being exposed, and 'dismantle' means much the same as demolish."}, {"id": "E-V-03", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Early reviewers dismissed the cookbook as (i)______, a mere collection of familiar recipes, but cooks soon discovered that its methods were genuinely (ii)______, often reversing steps that every other book took for granted.", "blanks": [["innovative", "exhaustive", "derivative"], ["conventional", "novel", "tedious"]], "answer": [2, 1], "explain": "'A mere collection of familiar recipes' defines the first blank: derivative. 'But' and the methods that reverse standard steps call for the opposite in the second: novel. 'Innovative' in the first blank and 'conventional' in the second would reverse the contrast."}, {"id": "E-V-04", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The researcher's early findings were (i)______, drawn from only a handful of participants, so she was careful to describe them as (ii)______ rather than conclusive; only after a much larger study had (iii)______ them did she state them with confidence.", "blanks": [["controversial", "preliminary", "definitive"], ["decisive", "tentative", "misleading"], ["ignored", "corroborated", "contradicted"]], "answer": [1, 1, 1], "explain": "Results from a handful of participants are preliminary, and 'rather than conclusive' calls for tentative. She became confident only once a larger study had corroborated them; a study that contradicted the findings would have undermined her confidence instead. Nothing suggests the early results were controversial."}, {"id": "E-V-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The manager's ______ approach to spending, which included reusing old folders and refusing to replace chairs that still worked, saved the department thousands of pounds.", "options": ["generous", "careless", "lavish", "thrifty", "frugal", "innovative"], "answer": [3, 4], "explain": "Reusing folders and keeping old chairs to save money describes careful, economical spending: frugal and thrifty. 'Lavish' and 'generous' are the opposite, and reusing folders is hardly innovative."}, {"id": "E-V-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Despite the critic's reputation for harshness, her review of the young playwright's first play was surprisingly ______.", "options": ["severe", "lengthy", "scathing", "laudatory", "anonymous", "complimentary"], "answer": [3, 5], "explain": "'Despite' her reputation for harshness, the review must have been the reverse of harsh, that is, full of praise: laudatory and complimentary. 'Scathing' and 'severe' form a matching pair, but they describe exactly the harshness the sentence says was absent."}, {"id": "E-V-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The negotiator remained ______ throughout the tense talks, never once raising her voice even when the other side made insulting remarks.", "options": ["indecisive", "verbose", "unflappable", "composed", "impatient", "belligerent"], "answer": [2, 3], "explain": "Never raising her voice in the face of insults shows calm self-control: composed and unflappable. 'Belligerent' and 'impatient' contradict that calm, and nothing in the sentence concerns how much she talked or whether she could make decisions."}, {"id": "E-V-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The council's plan to ______ flooding in the valley by restoring wetlands upstream was praised for reducing, though not eliminating, the risk to nearby homes.", "options": ["mitigate", "eliminate", "predict", "cause", "ignore", "alleviate"], "answer": [0, 5], "explain": "The plan reduces the risk 'though not eliminating' it, so it lessens the flooding: mitigate and alleviate. 'Eliminate' is the trap the sentence explicitly rules out, and a plan cannot predict or ignore flooding by restoring wetlands."}, {"id": "E-V-09", "type": "mc", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 2, "stem": "The passage is primarily concerned with", "options": ["describing the history of suburban road building in the twentieth century", "explaining a challenge to a long-standing principle of street design and assessing how far that challenge applies", "comparing the safety records of rural highways with those of city streets", "defending traffic engineers against criticism from urban designers", "arguing that forgiving design should be abandoned on every type of road"], "answer": 1, "explain": "The passage sets out forgiving design, presents the urban designers' objection and its evidence, then limits the objection to busy urban streets. Abandoning forgiving design everywhere is too strong, since the final paragraph says it still helps on rural highways; suburban history is only background in the first paragraph."}, {"id": "E-V-10", "type": "mc", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 3, "stem": "The studies of city streets described in the second paragraph are presented as evidence that", "options": ["planting trees is the most effective way to slow traffic", "drivers prefer narrow streets to wide ones", "narrowing urban streets prevents crashes altogether", "rural highways would also be safer if their lanes were narrowed", "reducing the room drivers have to correct mistakes need not lead to more crashes"], "answer": 4, "explain": "On the narrowed streets crashes 'did not rise, even though drivers now had less room to correct their mistakes', which is exactly what the critics' view predicts. The studies show no rise in crashes, not their disappearance, and the passage says nothing about drivers' preferences or about narrowing rural highways."}, {"id": "E-V-11", "type": "multi", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 3, "stem": "Which of the following can be inferred from the passage about forgiving design? Select all that apply.", "options": ["It remains appropriate for some kinds of road.", "Its supporters assumed that giving drivers more space would not lead them to change their behavior in a way that cancels the benefit.", "It was first developed for residential streets and only later extended to highways."], "answer": [0, 1], "explain": "The critics say forgiving design rested on a mistaken picture in which drivers 'simply enjoy the benefit of extra space' rather than speeding up, so its supporters assumed no such offsetting change. The final paragraph says rural highways still benefit from it. The passage says it was applied to highways and also to residential streets, but never that residential streets came first."}, {"id": "E-V-12", "type": "sentence", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 2, "stem": "Select the sentence in which the author states the general principle that the debate described in the passage illustrates.", "answer": 10, "explain": "The last sentence draws 'the lesson of the debate': no street feature is safe or dangerous in itself, because its effect depends on drivers' response and the street's purpose. The sentence about busy urban streets gives the critics' specific conclusion, not the general principle."}, {"id": "E-V-13", "type": "mc", "skill": "Reading comprehension", "passage": "e-generation-effect", "difficulty": 2, "stem": "The experiments with nonwords are mentioned primarily in order to", "options": ["demonstrate that people cannot remember nonwords at all", "argue that reading is a more effective way to learn than producing", "explain why producing real words takes more effort than producing nonwords", "present evidence that effort alone does not account for the generation effect", "show that the generation effect is stronger for nonwords than for real words"], "answer": 3, "explain": "Producing nonwords took at least as much effort as producing real words yet gave little or no memory advantage, which undercuts the idea that effort by itself explains the effect. The passage says nonwords show a weaker effect, not a stronger one, and it never claims they cannot be remembered at all."}, {"id": "E-V-14", "type": "multi", "skill": "Reading comprehension", "passage": "e-generation-effect", "difficulty": 3, "stem": "Which of the following can be inferred from the passage? Select all that apply.", "options": ["Producing material oneself improves later recall whatever kind of material is produced.", "The original explanation of the generation effect would predict a memory advantage for nonwords that participants produced themselves.", "People who read nonwords recall them about as well as people who produce them."], "answer": [1, 2], "explain": "The original account credited the effect to effort, and producing nonwords took at least as much effort as producing words, so that account predicts an advantage for them. The nonword experiments found 'little or no memory advantage' over reading, so recall was similar either way. That same finding rules out the claim that producing any kind of material helps."}, {"id": "E-V-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "e-yoghurt-aroma", "difficulty": 3, "stem": "Which of the following, if true, most seriously weakens the company's conclusion?", "options": ["Aroma compounds are known to affect how sweet some other fruit-flavored foods taste.", "In its first month, the new yoghurt sold slightly less than the original had sold in the month before.", "In a separate blind tasting, the same panels rated a version with 20 percent less sugar and no added aroma as exactly as sweet as the original.", "Some panellists said that the new recipe tasted more strongly of strawberry than the original.", "Strawberry aroma costs more per serving than the sugar it replaced."], "answer": 2, "explain": "If the panels could not detect the 20 percent cut even without extra aroma, there was no lost sweetness for the aroma to make up, so the tasting results no longer support the company's explanation. Sales figures are tempting but concern a different month and many other factors, not perceived sweetness. The point about other fruit-flavored foods strengthens the conclusion rather than weakening it."}]}, "Q2E": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "E-Q-01", "type": "qc", "skill": "Percentages", "difficulty": 3, "given": "A jacket priced at $80 has its price raised by 25%. The new price is then reduced by 25%.", "qa": "The final price of the jacket, in dollars", "qb": "80", "answer": 1, "explain": "After the rise the price is 80 × 1.25 = $100, and 25% off $100 is $25, leaving $75. The two changes do not cancel, because the cut is taken from a larger amount than the rise was. So Quantity B is greater."}, {"id": "E-Q-02", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "y² = 4y", "qa": "y", "qb": "4", "answer": 3, "explain": "Rearranging gives y² − 4y = 0, so y(y − 4) = 0 and y is 0 or 4. Dividing both sides by y to get y = 4 silently assumes y ≠ 0. If y = 4 the quantities are equal; if y = 0, Quantity B is greater, so the relationship cannot be determined."}, {"id": "E-Q-03", "type": "qc", "skill": "Geometry", "difficulty": 2, "given": "A triangle has two sides of lengths 5 and 8.", "qa": "The length of the third side", "qb": "3", "answer": 0, "explain": "Any side of a triangle must be longer than the difference of the other two and shorter than their sum, so the third side is between 8 − 5 = 3 and 8 + 5 = 13. A third side of exactly 3 would make the three points lie on a straight line, so it must be more than 3. Quantity A is greater."}, {"id": "E-Q-04", "type": "qc", "skill": "Geometry", "difficulty": 2, "given": "A rectangular floor measuring 6 meters by 4 meters is covered exactly, with no gaps or overlaps, by square tiles with sides of 50 centimeters.", "qa": "The number of tiles used", "qb": "96", "answer": 2, "explain": "Along the 6-meter side 600 ÷ 50 = 12 tiles fit, and along the 4-meter side 400 ÷ 50 = 8 fit, so 12 × 8 = 96 tiles are used. A common slip is dividing the area 24 m² by 0.5, which gives 48; each tile covers 0.5 × 0.5 = 0.25 m², and 24 ÷ 0.25 = 96. The quantities are equal."}, {"id": "E-Q-05", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "p and q are different positive integers, and p + q = 10.", "qa": "pq", "qb": "25", "answer": 1, "explain": "With a fixed sum, the product is largest when the two numbers are as close as possible. The product 25 needs p = q = 5, which is not allowed, so the largest possible product is 4 × 6 = 24. Quantity B is greater."}, {"id": "E-Q-06", "type": "mc", "skill": "Rates", "difficulty": 3, "stem": "A cyclist rides 24 kilometers to a lake at an average speed of 12 kilometers per hour and returns along the same 24-kilometer route at an average speed of 8 kilometers per hour. What is her average speed for the whole round trip, in kilometers per hour?", "options": ["9.2", "9.6", "10", "10.4", "12"], "answer": 1, "explain": "The outward trip takes 24 ÷ 12 = 2 hours and the return takes 24 ÷ 8 = 3 hours, so she covers 48 km in 5 hours: 48 ÷ 5 = 9.6 km/h. The tempting 10 averages the two speeds, but she spends longer at the slower speed, which pulls the average below 10."}, {"id": "E-Q-07", "type": "mc", "skill": "Algebra", "difficulty": 2, "stem": "Tickets for a school play cost $4 for students and $7 for adults. On opening night, 150 tickets were sold for a total of $795. How many adult tickets were sold?", "options": ["50", "55", "60", "65", "70"], "answer": 3, "explain": "If all 150 tickets had been student tickets the takings would be 150 × 4 = $600. Each adult ticket adds $3 more, and the extra is 795 − 600 = $195, so there were 195 ÷ 3 = 65 adult tickets. Check: 85 × 4 + 65 × 7 = 340 + 455 = 795."}, {"id": "E-Q-08", "type": "numeric", "skill": "Geometry", "difficulty": 2, "stem": "A rectangular lawn measures 18 meters by 12 meters. A path 1 meter wide runs around the outside of the lawn, along all four sides. What is the area of the path, in square meters?", "answer": 64, "explain": "The lawn and path together form a rectangle (18 + 2) by (12 + 2) = 20 m by 14 m, with area 280 m². Subtracting the lawn's 18 × 12 = 216 m² leaves 64 m². Multiplying the lawn's perimeter, 60 m, by the 1 m width gives 60 and misses the four 1 m by 1 m corner squares."}, {"id": "E-Q-09", "type": "multi", "skill": "Number properties", "difficulty": 3, "stem": "A coach divides 36 players into teams so that every player is on exactly one team, all teams are the same size, and each team has more than 3 but fewer than 12 players. Which of the following could be the number of teams? Indicate all such values.", "options": ["3", "4", "6", "8", "9", "12"], "answer": [1, 2, 4], "explain": "The team size must divide 36 and lie between 4 and 11, so it is 4, 6 or 9, giving 9, 6 or 4 teams. Three teams would need 12 players each and twelve teams would need 3 each, both outside the limits. Eight teams is impossible because 8 does not divide 36."}, {"id": "E-Q-10", "type": "mc", "skill": "Probability", "difficulty": 2, "stem": "A bag contains 4 red, 5 blue and 3 green counters. Two counters are drawn at random, one after the other, without replacement. What is the probability that both counters are red?", "options": ["1/11", "1/9", "4/33", "1/6", "1/3"], "answer": 0, "explain": "The first counter is red with probability 4/12. If it was, 3 of the remaining 11 counters are red, so the probability is 4/12 × 3/11 = 12/132 = 1/11. The answer 1/9 comes from (4/12)², which would apply only if the first counter were put back."}, {"id": "E-Q-11", "type": "fraction", "skill": "Fractions", "difficulty": 2, "stem": "Priya spent 1/4 of her vacation money on a train ticket and then spent 1/3 of what remained on a hotel. What fraction of her original vacation money did she have left? Give your answer as a fraction.", "answer": [1, 2], "explain": "After the ticket she has 3/4 of her money. The hotel takes 1/3 of that, leaving 2/3 × 3/4 = 1/2. Subtracting 1/4 and 1/3 from the whole, giving 5/12, wrongly treats the second fraction as a share of the original amount."}, {"id": "E-Q-12", "type": "mc", "skill": "Geometry", "difficulty": 3, "stem": "A café sells round pizzas in two sizes: a large with a diameter of 36 centimeters and a small with a diameter of 24 centimeters. Both pizzas have the same thickness. The area of the large pizza is how many times the area of the small pizza?", "options": ["1.25", "1.5", "1.75", "2", "2.25"], "answer": 4, "explain": "The diameters are in the ratio 36 : 24 = 1.5 : 1. Areas of circles scale with the square of the diameter, so the ratio of areas is 1.5² = 2.25. The answer 1.5 compares lengths, not areas."}, {"id": "E-Q-13", "type": "mc", "skill": "Data interpretation", "difficulty": 2, "table": "e-sports-shop", "stem": "By approximately what percent did the total number of items sold (soccer balls plus pairs of sneakers) increase from January to April?", "options": ["36%", "47%", "57%", "64%", "75%"], "answer": 2, "explain": "January's total is 40 + 20 = 60 items and April's is 70 + 24 = 94, an increase of 34. As a percent of the January figure that is 34 ÷ 60 ≈ 57%. Dividing by April's 94 gives about 36%, and 75% is the increase in soccer balls alone."}, {"id": "E-Q-14", "type": "numeric", "skill": "Data interpretation", "difficulty": 3, "table": "e-sports-shop", "stem": "In January, what was the average (arithmetic mean) revenue per item sold, in dollars, counting soccer balls and pairs of sneakers together?", "answer": 30, "explain": "Soccer balls brought in 40 × 15 = $600 and sneakers 20 × 60 = $1,200, a total of $1,800 from 60 items, so the mean is 1,800 ÷ 60 = $30. Averaging the two prices, (15 + 60) ÷ 2 = 37.5, ignores that twice as many soccer balls as pairs of sneakers were sold."}, {"id": "E-Q-15", "type": "multi", "skill": "Data interpretation", "difficulty": 3, "table": "e-sports-shop", "stem": "In which of the four months was the shop's revenue from sneakers more than 1.5 times its revenue from soccer balls? Indicate all such months.", "options": ["January", "February", "March", "April"], "answer": [0, 1], "explain": "Trainer and soccer revenues are $1,200 and $600 in January (ratio 2), $1,500 and $900 in February (about 1.67), $1,350 and $900 in March (exactly 1.5) and $1,320 and $1,120 in April (about 1.18). March is exactly 1.5 times, not more, so only January and February qualify."}]}}, "version": "1ae20d37e1"}, {"id": "test-03", "title": "Practice Test 3", "blurb": "New questions.", "order": ["V1", "V2", "Q1", "Q2"], "essay": {"minutes": 30, "variant": "challenge", "prompt": "A society is better served by institutions that change slowly and resist public pressure than by institutions that respond quickly to what the public wants.", "instructions": "Write a response in which you discuss how far you agree or disagree with the claim and explain the reasoning behind your position. As you develop your position, address the strongest reasons and examples that someone could use to challenge it, and explain why they do or do not change your view."}, "passages": {"t3-great-unconformity": ["Across much of the globe, rocks roughly half a billion years old rest directly on rocks more than a billion years older, a gap in the geological record known as the Great Unconformity.", "One influential hypothesis attributes the missing rock to the planet-wide glaciations of the late Precambrian, arguing that ice sheets scoured away kilometers of crust in a geologically brief interval.", "The hypothesis gained support from the observation that the chemistry of seawater shifted abruptly at about the time erosion would have peaked, as though a great volume of continental debris had suddenly washed into the oceans.", "Critics respond that the gap is not one surface but many: dating of minerals beneath the unconformity in different regions suggests that erosion there occurred at different times, some of it long before any glaciation.", "On their view, the single dramatic event that the glacial hypothesis requires is an artefact of grouping surfaces of different ages under one name.", "Yet the critics' evidence does not exclude glaciation altogether; it shows only that ice cannot have been responsible everywhere.", "The most defensible position may therefore be that the Great Unconformity is a composite feature, in places the work of ice and elsewhere the product of slower uplift and weathering."], "t3-sentencing-website": ["Two years ago the city's criminal court began publishing every sentence it hands down on a public website, together with the name of the judge who imposed it.", "Since then, the gap between the longest and shortest sentences given by different judges for comparable offences has narrowed considerably.", "The court's administrators conclude that the prospect of public scrutiny has led judges who were once unusually harsh or lenient to bring their sentences into line with those of their colleagues."], "t3-early-recordings": ["Recordings made in the first decades of the twentieth century preserve the playing of musicians trained in the middle of the nineteenth, and they have unsettled many assumptions about how Romantic music was performed.", "Pianists on these recordings routinely play the two hands slightly out of step, and string players slide audibly between notes, habits that modern conservatories teach students to avoid as lapses of taste.", "It is tempting to treat such recordings as a direct window on composers' intentions, since some of the performers had studied with the composers themselves.", "But the recordings may also reflect the conditions of early studios, in which musicians played into a horn for a few minutes at a time and may have exaggerated certain effects to make them audible.", "The recordings are best regarded, then, as evidence that the habits they display were acceptable to a generation close to the composers, not as proof that the composers required them."], "t3-tree-ring-divergence": {"paragraphs": [["Tree rings are among the most valuable archives of past climate, because in cold, high-latitude forests the width and density of each year's ring track summer temperature closely.", "Researchers calibrate this relationship against thermometer records from the twentieth century and then use it to estimate temperatures for centuries before thermometers existed.", "The method assumes that the relationship between growth and temperature has stayed constant: a tree that responded to a warm summer in 1950 in a certain way is presumed to have responded in the same way to a warm summer in 1450.", "Since the 1960s, however, rings at a number of northern sites have stopped tracking temperature as closely as they once did; summers there have continued to warm, but ring density has risen far less than the calibration predicts.", "This divergence, as it has come to be called, poses an obvious difficulty.", "If trees can lose their sensitivity to temperature now, they may have lost it in the past, and reconstructions built on the assumption of a constant response could understate earlier warm periods."], ["Some skeptics have taken divergence as grounds for discarding tree-ring reconstructions altogether.", "That conclusion goes further than the evidence warrants.", "Divergence is not universal: it is concentrated at particular sites, and many records continue to track recent temperatures as closely as they tracked those of the early twentieth century.", "Moreover, several of its proposed causes are specific to the modern era, among them drought stress intensified by recent warming and the dimming of sunlight by industrial pollution, and none of these is likely to have operated in the same way in the fifteenth century.", "If those explanations are right, divergence is a recent anomaly rather than evidence that the method was unreliable all along.", "But the explanations have not yet been confirmed, and some researchers suspect that part of the problem lies instead in the statistical methods used to remove the effects of a tree's age from its rings.", "Until the matter is settled, the prudent course is to treat reconstructions as more uncertain than their published error ranges suggest, and to give most weight to records from sites that show no divergence at all."]]}, "t3-intuitions": ["Philosophers often test a theory by imagining a case the theory must handle and consulting their intuitions about it.", "Critics of the practice point to studies in which people from different backgrounds gave different verdicts about the same imagined case, and they conclude that intuitions reflect upbringing rather than insight.", "The studies show less than the critics suppose.", "Many of the reported disagreements vanish when the cases are described more carefully, which suggests that participants were often answering different questions rather than reaching different verdicts on the same one.", "Still, the disagreements that survive careful description cannot be dismissed so easily, and they give philosophers reason to treat an intuition shared only by people like themselves as weaker evidence than one shared widely."], "t3-term-limits": ["When the state imposed term limits on its legislators, opponents predicted that lawmakers would become more dependent on lobbyists, since inexperienced legislators would lack the expertise to draft complex bills themselves.", "Yet in the decade since, the share of enacted bills drafted with lobbyists' assistance has not risen, and has even fallen slightly.", "The opponents' prediction, it seems, was mistaken: term-limited legislators are no more reliant on lobbyists than their predecessors were."], "t3-courts-opinion": {"paragraphs": [["Because judges on constitutional courts are appointed rather than elected, their power to strike down laws passed by elected legislatures has long been described as a democratic anomaly: a handful of unelected officials can overrule the considered choices of the majority's representatives.", "Studies of several national courts, however, find that their rulings seldom stray far from public opinion for long; when a court does issue a decision that most citizens oppose, it tends either to retreat in later cases or to find, within a few years, that opinion has moved toward it.", "Some political scientists have concluded that courts are less a check on majorities than a lagging reflection of them, and that the anomaly which has troubled democratic theorists is largely illusory."], ["The research is persuasive as far as it goes, but it measures agreement with opinion at the level of broad outcomes, such as whether a court tends to uphold or overturn laws on a given subject.", "Much of a court's influence, however, lies in matters too technical to register in opinion surveys: the standards of proof it demands, the remedies it permits, the questions it declines to hear.", "A court could follow public opinion in every headline case while reshaping, through such choices, the practical meaning of the rights at stake.", "Because survey respondents are rarely asked about such matters, the research cannot tell us whether courts follow opinion on them or quietly depart from it.", "Moreover, the finding that opinion often moves toward a court's position after a ruling cuts both ways.", "It may show that courts anticipate where the public is heading, but it may equally show that courts help to lead the public there, in which case their agreement with opinion is partly of their own making."], ["None of this restores the older picture of courts as freely defying majorities; the evidence that sustained defiance is rare is too consistent to dismiss.", "What it suggests is that the democratic question has been misplaced: the issue is not whether courts often overrule majorities, but how far they shape, in ways majorities scarcely notice, the terms on which majorities decide."]]}, "t3-well-tempered": ["Because Bach gave his collection of preludes and fugues in every major and minor key the title 'The Well-Tempered Clavier', it was long assumed that he wrote it for equal temperament, the tuning in which every semitone is the same size and every key therefore sounds alike.", "Historians of tuning have since pointed out that in Bach's day 'well-tempered' more often described any of several unequal tunings, which made every key usable while leaving each with a distinct character.", "Some have gone further, claiming to decode from the ornamental loops on the title page the precise tuning Bach intended.", "That claim rests on reading a decorative flourish as a set of instructions, and nothing in Bach's surviving writings confirms that he meant it as one.", "The broader point survives the weakness of the narrower one: the collection was probably written not to show that all keys sound the same but to show that all of them could be played."], "t3-induced-quakes": ["After a region's oil fields began disposing of wastewater by injecting it deep underground, the number of small earthquakes recorded there rose tenfold within five years.", "Regulators then ordered operators to halve their injection volumes.", "Over the following two years the number of recorded earthquakes fell only slightly, and an industry group argues that injection therefore cannot have been a significant cause of the increase."], "e-forgiving-streets": {"paragraphs": [["For much of the twentieth century, traffic engineers designed streets on a principle sometimes called forgiving design: if a road gave drivers generous room for error, their mistakes would less often turn into crashes.", "Lanes were widened, curves were straightened, and trees and other roadside objects were cleared away, so that a driver who drifted or misjudged a bend would have space to recover.", "The principle seemed self-evident, and it was applied not only to highways but also to residential and shopping streets, where it helped produce the broad, open roads typical of many suburbs built after the Second World War."], ["Beginning in the 1990s, however, a number of urban designers argued that forgiving design rested on a mistaken picture of how people drive.", "Drivers, they pointed out, do not hold to a fixed speed and simply enjoy the benefit of extra space; instead, they adjust their speed to how risky a road appears.", "A wide, straight, unobstructed street looks safe, and so it invites faster driving, which can cancel out the margin for error that the design was meant to provide.", "Studies of city streets lent some support to this view: on several urban roads where lanes had been narrowed or trees planted along the curb, average speeds fell and the number of crashes did not rise, even though drivers now had less room to correct their mistakes.", "Because the harm done when a car strikes a pedestrian depends heavily on the car's speed, the critics concluded that on busy urban streets a design that feels slightly less comfortable to drive may in fact be the safer one."], ["This argument does not show that forgiving design was simply wrong.", "On rural highways, where traffic is meant to move quickly and pedestrians are rare, a driver who leaves the road at high speed still benefits greatly from a wide shoulder and a clear roadside.", "The lesson of the debate is rather that no feature of a street is safe or dangerous in itself: its effect depends on how drivers respond to it, and that response depends in turn on what the street is for."]]}, "e-generation-effect": ["People usually remember a word better if they have produced it themselves than if they have simply read it: someone who completes the pair 'hot–c_ld' is more likely to recall 'cold' later than someone who reads the pair already filled in.", "This advantage, known as the generation effect, was at first attributed to effort: producing a word takes more work than reading it, and the extra work was thought to strengthen the memory.", "Later experiments complicated this account by asking participants to generate made-up nonwords, for example by completing a string of letters according to a rule.", "Although producing the nonwords demanded at least as much effort as producing real words, it gave little or no memory advantage over simply reading them.", "Many researchers now conclude that effort aids memory in this way only when it draws on knowledge already stored there, such as a word's meaning or its links to other words."], "e-yoghurt-aroma": ["A food manufacturer cut the sugar in its strawberry yoghurt by 20 percent and, to compensate, added extra strawberry aroma.", "In blind tastings, panels of regular yoghurt eaters rated the new recipe exactly as sweet as the original.", "The company concluded that the added aroma had made up for the missing sugar, and it now plans to use the same approach to reduce the sugar in its other desserts."]}, "tables": {"t3-exam-results": {"title": "Results of a national mathematics exam at four schools", "head": ["School", "Students who sat the exam", "Percent who passed", "Mean score"], "rows": [["Ashford", "200", "76", "64"], ["Brookvale", "180", "80", "66"], ["Carrow", "300", "62", "59"], ["Denholm", "160", "75", "70"]]}, "t3-materials-orders": {"title": "Materials ordered for a housing project, and deliveries by 30 June", "head": ["Material", "Units ordered", "Price per unit ($)", "Percent of units delivered by 30 June"], "rows": [["Steel beams", "120", "450", "75"], ["Concrete (cubic meters)", "800", "110", "60"], ["Timber (cubic meters)", "250", "320", "80"], ["Bricks (thousands)", "90", "600", "50"]]}, "e-sports-shop": {"title": "Monthly sales at a sports shop, January to April", "head": ["Month", "Soccer balls sold", "Price per soccer ($)", "Pairs of sneakers sold", "Price per pair ($)"], "rows": [["January", "40", "15", "20", "60"], ["February", "60", "15", "25", "60"], ["March", "50", "18", "30", "45"], ["April", "70", "16", "24", "55"]]}}, "charts": {"t3-fund-values": {"kind": "line", "title": "Value of two investment funds at the end of each year, 2019–2024 (thousands of dollars)", "categories": ["2019", "2020", "2021", "2022", "2023", "2024"], "series": [{"name": "Fund X", "values": [40, 45, 50, 45, 55, 60]}, {"name": "Fund Y", "values": [30, 35, 40, 40, 50, 50]}], "yLabel": "Value (thousands of dollars)", "yMax": 70, "yTicks": 14}}, "sections": {"V1": {"measure": "Verbal", "minutes": 18, "label": "Verbal Reasoning: Section 1", "questions": [{"id": "T3-V1-01", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Although the delegate had promised a spirited rebuttal, his remarks were so ______ that several listeners dozed off before he reached his main point.", "blanks": [["incendiary", "laconic", "soporific", "trenchant", "provocative"]], "answer": [2], "explain": "'Although' sets the remarks against the promised spirit, and listeners dozing off before the main point calls for a word meaning sleep-inducing: soporific. 'Laconic' means brief, but brief remarks would not lose the audience before reaching their point, and the other words describe exactly the spirited speech that never came."}, {"id": "T3-V1-02", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Early seismologists dismissed the faint tremors that precede some large earthquakes as (i)______, mere noise unworthy of study; only when dense networks of instruments revealed their (ii)______ did researchers begin to suspect that the tremors followed a pattern.", "blanks": [["ominous", "systematic", "trivial"], ["rarity", "regularity", "violence"]], "answer": [2, 1], "explain": "'Mere noise unworthy of study' defines the first blank as trivial; 'ominous' and 'systematic' are what the tremors later turned out to be, not how they were dismissed. What made researchers suspect a pattern must be the tremors' regularity; their rarity or violence would say nothing about a pattern."}, {"id": "T3-V1-03", "type": "tc", "skill": "Text completion", "difficulty": 4, "why": "'Austere' matches the champions' own description, but 'not ... but deliberately spare' needs the critics' contrasting charge.", "stem": "The composer's champions insist that her late quartets are not (i)______ but deliberately spare; the (ii)______ textures that critics dismissed as the product of exhausted invention are, on this reading, a (iii)______ renunciation of the lush harmonies of her youth.", "blanks": [["threadbare", "ornate", "austere"], ["dense", "opulent", "skeletal"], ["inadvertent", "studied", "perfunctory"]], "answer": [0, 2, 1], "explain": "The champions reject the critics' view that the music is thin from exhaustion, so the first blank is threadbare; 'austere' means much the same as 'spare', so it cannot be the term set against it. Textures that critics blamed on exhausted invention are skeletal, not opulent or dense. A deliberate renunciation is studied; 'inadvertent' and 'perfunctory' both contradict 'deliberately'."}, {"id": "T3-V1-04", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Political scientists have long noted that voters punish incumbents for economic downturns the incumbents could not have prevented; such ______ assignment of blame suggests that electoral accountability rests less on a judgment of policy than on mood.", "blanks": [["scrupulous", "belated", "partisan", "undiscriminating", "deferential"]], "answer": [3], "explain": "Blaming leaders for downturns they could not have prevented ignores who was actually responsible, so the blame is undiscriminating, which is why it points to mood rather than judgment. 'Scrupulous' is the opposite, and 'partisan' introduces party loyalty, which the sentence never mentions."}, {"id": "T3-V1-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Though famously ______ in interviews, offering little more than a nod or a shrug, the geologist became almost garrulous once she stood before an outcrop with her students.", "options": ["taciturn", "reticent", "candid", "voluble", "loquacious", "irascible"], "answer": [0, 1], "explain": "'A nod or a shrug' and the contrast with 'garrulous' call for words meaning sparing with speech: taciturn and reticent. 'Voluble' and 'loquacious' form a pair, but they mean talkative, which is what she became rather than what she usually was."}, {"id": "T3-V1-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "why": "'Mediated' and 'adjudicated' describe a court's normal work, which makes them tempting even though they do not express alternation.", "stem": "For years the court ______ between two readings of the statute, endorsing a broad interpretation in one term and a narrow one in the
