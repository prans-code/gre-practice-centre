6 hours (half the order), leaving Q's last 15 hours to do the other half."}, {"id": "T1-Q2M-07", "type": "mc", "skill": "Number properties", "difficulty": 3, "stem": "What is the units digit of 7⁴⁵ × 3²²?", "options": ["0", "1", "3", "7", "9"], "answer": 2, "explain": "Units digits of powers of 7 cycle 7, 9, 3, 1, and those of powers of 3 cycle 3, 9, 7, 1, each with period 4. Since 45 leaves remainder 1 on division by 4 and 22 leaves remainder 2, the units digits are 7 and 9, and 7 × 9 = 63 ends in 3. Swapping the remainders (7² and 3¹) gives 9 × 3 = 27, a units digit of 7, which is the trap."}, {"id": "T1-Q2M-08", "type": "numeric", "skill": "Percentages", "difficulty": 3, "stem": "A farm shop raised the price of a box of apples by 25%. In the month after the rise, its revenue from boxes of apples was 10% higher than in the month before the rise. By what percent did the number of boxes sold fall?", "answer": 12, "unit": "%", "explain": "Revenue = price × number sold, so 1.25 × q = 1.10, which gives q = 0.88: the number sold fell by 12%. Subtracting the percentages (25 − 10 = 15) ignores that percent changes multiply rather than add."}, {"id": "T1-Q2M-09", "type": "multi", "skill": "Geometry", "difficulty": 4, "stem": "Two sides of a triangle have lengths 5 and 9. Which of the following could be the area of the triangle? Indicate all such values.", "options": ["4", "12", "20", "22.5", "24", "45"], "answer": [0, 1, 2, 3], "explain": "Take the side of length 9 as the base. The height to it is at most 5, reached when the two given sides meet at a right angle, and it can be made as small as we like by flattening the angle. So the area can be any value greater than 0 and up to ½ × 9 × 5 = 22.5. 45 forgets the ½, and 24 exceeds the maximum.", "why": "The maximum area comes from a right angle between the given sides, and every smaller positive area is also possible, even a small one such as 4."}, {"id": "T1-Q2M-10", "type": "mc", "skill": "Probability", "difficulty": 4, "stem": "A gardener plants 4 rose bushes and 3 lavender bushes in a row of 7 holes, in an order chosen at random. What is the probability that no two lavender bushes are next to each other?", "options": ["1/7", "2/7", "2/5", "3/7", "4/7"], "answer": 1, "explain": "Only which 3 holes get lavender matters, and there are C(7, 3) = 35 equally likely choices. The 4 roses in a row leave 5 gaps (including both ends), and putting the lavenders in 3 different gaps keeps them apart: C(5, 3) = 10 ways. The probability is 10/35 = 2/7; using only the 3 gaps between roses gives 1/35.", "why": "The two ends of the row are gaps too: 4 roses leave 5 gaps, not 3."}, {"id": "T1-Q2M-11", "type": "fraction", "skill": "Functions", "difficulty": 3, "stem": "The function g is defined by g(x) = (ax + 1)/(x + 2) for all x ≠ −2, where a is a constant. If g(3) = 2, what is the value of g(g(3))? Give your answer as a fraction.", "answer": [7, 4], "explain": "g(3) = (3a + 1)/5 = 2, so 3a + 1 = 10 and a = 3. Then g(g(3)) = g(2) = (3 × 2 + 1)/(2 + 2) = 7/4. Squaring g(3) to get 4 is the trap; g(g(3)) means applying g to the output 2."}, {"id": "T1-Q2M-12", "type": "mc", "skill": "Statistics", "difficulty": 4, "stem": "The mean of the five numbers 2, 5, 9, 12 and x is equal to their median. What is the sum of all possible values of x?", "options": ["7", "14", "17", "19", "21"], "answer": 4, "explain": "The sum is 28 + x, so the mean is (28 + x)/5. The median depends on where x falls: if x ≤ 5 the median is 5 and x = −3; if 5 ≤ x ≤ 9 the median is x and x = 7; if x ≥ 9 the median is 9 and x = 17. All three work, so the sum is −3 + 7 + 17 = 21; stopping at the middle case gives 7.", "why": "x can be the smallest, middle or largest value, and each case gives a valid x: −3, 7 and 17."}, {"id": "T1-Q2M-13", "type": "mc", "skill": "Data interpretation", "table": "t1-league-season", "difficulty": 3, "stem": "Teams earn 3 points for a win, 1 point for a draw and 0 points for a loss. How many more points did the team with the most points earn than the team with the most wins?", "options": ["0", "1", "2", "3", "4"], "answer": 2, "explain": "The Harriers have the most wins (12) but earn 12 × 3 + 2 = 38 points, while the Kestrels earn 11 × 3 + 7 = 40, the most of any team. The difference is 2. Assuming the team with the most wins also has the most points gives 0."}, {"id": "T1-Q2M-14", "type": "numeric", "skill": "Statistics", "table": "t1-league-season", "difficulty": 4, "stem": "A team's goal difference is its goals scored minus its goals conceded. What is the median of the six teams' goal differences?", "answer": 4.5, "explain": "The goal differences are 16, 18, 8, 1, −6 and −25. In order they are −25, −6, 1, 8, 16, 18, so the median is (1 + 8)/2 = 4.5. Subtracting the median of goals conceded (27) from the median of goals scored (30) gives 3, but the median of differences is not the difference of medians.", "why": "The median of the differences (4.5) is not the difference of the medians (30 − 27 = 3)."}, {"id": "T1-Q2M-15", "type": "multi", "skill": "Data interpretation", "table": "t1-league-season", "difficulty": 4, "stem": "Unless stated otherwise, teams earn 3 points for a win, 1 point for a draw and 0 points for a loss. Which of the following statements are true? Indicate all such statements.", "options": ["If a win earned 2 points instead of 3 (with 1 point for a draw), the six teams would finish in the same order by points.", "The Falcons earned a greater percent of their points from draws than any other team did.", "If each of the Harriers' drawn matches had been a win instead, the Harriers would have earned more points than the Kestrels."], "answer": [0, 2], "explain": "With 3 points per win the order is Kestrels 40, Harriers 38, Ospreys 35, Falcons 30, Merlins 23, Buzzards 15; with 2 it is 29, 26, 25, 22, 17, 11, the same order. The Merlins took 5 of 23 points (about 22%) from draws, more than the Falcons' 6 of 30 (20%). Turning the Harriers' 2 draws into wins gives 14 wins and 42 points, beating the Kestrels' 40.", "why": "The draw-share statement fails only on the Merlins, whose small points total makes 5 draw points a larger share than the Falcons' 6."}]}, "Q2H": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "T1-Q2H-01", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "x and y are positive integers. x has exactly 6 positive divisors, and y has exactly 4 positive divisors.", "qa": "The number of positive divisors of xy", "qb": "24", "answer": 3, "explain": "If x and y share no prime factor, the divisor counts multiply: x = 12 and y = 35 give xy = 420 = 2² × 3 × 5 × 7, with 3 × 2 × 2 × 2 = 24 divisors. If they share a prime, the count is smaller: x = 12 and y = 6 give xy = 72 = 2³ × 3², with 4 × 3 = 12 divisors. So A can equal B or be less than B.", "why": "Divisor counts multiply only when the two numbers share no prime factor."}, {"id": "T1-Q2H-02", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "a is a positive integer, and the least common multiple of a and 18 is 90.", "qa": "The least possible value of a", "qb": "The number of possible values of a", "answer": 1, "explain": "90 = 2 × 3² × 5 and 18 = 2 × 3², so a must supply the factor 5 and may include 2⁰ or 2¹ and 3⁰, 3¹ or 3², but no other factor. The possible values are 5, 10, 15, 30, 45 and 90: six of them, while the least is 5. Assuming a must be 90 ÷ 18 = 5 and nothing else makes the count 1 and the answer A.", "why": "a needs only the 5 that 18 lacks; its powers of 2 and 3 can be anything up to those in 90, giving 2 × 3 = 6 values."}, {"id": "T1-Q2H-03", "type": "qc", "skill": "Geometry", "difficulty": 4, "given": "Triangle ABC has AB = AC = 10 and BC = 12. Triangle DEF has DE = DF = 10 and EF = 16.", "qa": "The area of triangle ABC", "qb": "The area of triangle DEF", "answer": 2, "explain": "In each triangle the height from the apex bisects the base. For ABC it is √(10² − 6²) = 8, so the area is ½ × 12 × 8 = 48; for DEF it is √(10² − 8²) = 6, and the area is ½ × 16 × 6 = 48. The longer base is exactly offset by the shorter height, since both triangles are two 6–8–10 right triangles joined together.", "why": "The longer base suggests a larger area, but the height shrinks to match."}, {"id": "T1-Q2H-04", "type": "qc", "skill": "Probability", "difficulty": 3, "given": "Each of 4 seeds planted in a tray will fail to sprout with probability 1/6, independently of the others.", "qa": "The probability that at least one of the 4 seeds fails to sprout", "qb": "1/2", "answer": 0, "explain": "All four sprout with probability (5/6)⁴ = 625/1,296, so at least one fails with probability 671/1,296, slightly more than 648/1,296 = 1/2. Adding 1/6 four times (2/3) overcounts the cases where two or more seeds fail, and guessing below 1/2 because each failure is unlikely is the other trap."}, {"id": "T1-Q2H-05", "type": "qc", "skill": "Mixtures", "difficulty": 4, "given": "Fertilizer X is 30% nitrogen by weight and fertilizer Y is 60% nitrogen by weight. A blend of x kilograms of X and y kilograms of Y, where x > 0 and y > 0, is more than 40% nitrogen by weight.", "qa": "x", "qb": "2y", "answer": 1, "explain": "The condition is 0.3x + 0.6y > 0.4(x + y), which simplifies to 0.2y > 0.1x, or x < 2y. The blend is exactly 40% when x = 2y, because 40% is twice as far from 60% as from 30%. Taking equal amounts as the balance point (which actually gives 45%) leads to comparing x with y instead.", "why": "The blend is exactly 40% when x = 2y, so 'more than 40%' means x is less than 2y."}, {"id": "T1-Q2H-06", "type": "mc", "skill": "Number properties", "difficulty": 4, "stem": "How many integers from 1 to 300, inclusive, are divisible by 6 or by 9 but not by both?", "options": ["51", "59", "67", "73", "83"], "answer": 0, "explain": "There are 50 multiples of 6 and 33 multiples of 9, and a number divisible by both is a multiple of 18 (not 54), of which there are 16. Divisible by 6 only: 50 − 16 = 34; by 9 only: 33 − 16 = 17; together 51. Inclusion–exclusion gives 67, but that still counts the multiples of 18 once, and they must be removed from both lists; using 54 instead of 18 gives 73.", "why": "The lcm of 6 and 9 is 18, not 54, and 'not by both' removes the multiples of 18 from each list."}, {"id": "T1-Q2H-07", "type": "mc", "skill": "Inequalities", "difficulty": 4, "stem": "How many integers x satisfy |x − 3| + |x + 2| < 9?", "options": ["8", "9", "10", "11", "12"], "answer": 0, "explain": "For −2 ≤ x ≤ 3 the sum is always 5, which gives the 6 integers −2 to 3. Above 3 the sum is 2x − 1, which is less than 9 only for x < 5, adding x = 4; below −2 it is 1 − 2x, which is less than 9 only for x > −4, adding x = −3. That makes 8 integers, from −3 to 4. Counting −4 and 5, where the sum equals exactly 9, gives the trap answer 10.", "why": "x = −4 and x = 5 make the sum exactly 9, which the strict inequality excludes."}, {"id": "T1-Q2H-08", "type": "numeric", "skill": "Geometry", "difficulty": 3, "stem": "The interior angles of a convex polygon add up to 2,340°. How many diagonals does the polygon have?", "answer": 90, "explain": "(n − 2) × 180 = 2,340 gives n − 2 = 13, so n = 15. Each vertex is joined by a diagonal to the n − 3 = 12 vertices that are neither itself nor its neighbors, and each diagonal is counted from both ends: 15 × 12 ÷ 2 = 90. Forgetting to halve gives 180."}, {"id": "T1-Q2H-09", "type": "multi", "skill": "Algebra", "difficulty": 5, "stem": "The equation x² − kx + 9 = 0, where k is a constant, has two different real solutions, and both are positive. Which of the following could be the value of k? Indicate all such values.", "options": ["−10", "−7", "−6", "0", "6", "6.5", "9"], "answer": [5, 6], "explain": "Two different real solutions need k² − 36 > 0, so k > 6 or k < −6. The solutions multiply to 9, so they have the same sign, and they add up to k, so both are positive only if k > 0. Hence k > 6: 6.5 and 9 work, while k = 6 gives a repeated solution and −7 and −10 give two negative solutions.", "why": "k = −7 and k = −10 pass the discriminant test, but their solutions are negative because the solutions add up to k."}, {"id": "T1-Q2H-10", "type": "mc", "skill": "Geometry", "difficulty": 5, "stem": "A cube has edges of length 6. An ant walks along the surface of the cube from one vertex to the vertex farthest from it. What is the length of the shortest possible path?", "options": ["6√3", "6√5", "6 + 6√2", "6√6", "18"], "answer": 1, "explain": "Unfold two adjacent faces into a 6 by 12 rectangle; the two vertices become opposite corners, so the shortest path is √(6² + 12²) = √180 = 6√5 ≈ 13.4. The space diagonal 6√3 passes through the inside of the cube, not along its surface. A face diagonal plus an edge (6 + 6√2 ≈ 14.5) bends at a corner, so it is longer than the straight line on the unfolded faces.", "why": "The space diagonal is not on the surface, and the face-diagonal-plus-edge route is beaten by the straight line on the unfolded net."}, {"id": "T1-Q2H-11", "type": "fraction", "skill": "Probability", "difficulty": 4, "stem": "In a sports league of 5 teams, each team plays every other team exactly once, and every game has a winner. Suppose each team in a game is equally likely to win it, independently of all other games. What is the probability that at least one team wins all of its games? Give your answer as a fraction.", "answer": [5, 16], "explain": "A given team wins all 4 of its games with probability (1/2)⁴ = 1/16. Two teams cannot both win all their games, because they play each other, so the five events never overlap and the probability is 5 × 1/16 = 5/16. Treating the events as independent, as in 1 − (15/16)⁵, gives a slightly different and wrong value.", "why": "The events 'this team is unbeaten' cannot happen together, so their probabilities add exactly; treating them as independent is wrong."}, {"id": "T1-Q2H-12", "type": "mc", "skill": "Overlapping sets", "difficulty": 4, "stem": "Of the 50 farms in a district, 40 grow wheat, 38 grow barley and 36 grow oats. What is the least possible number of these farms that grow all three crops?", "options": ["0", "4", "7", "10", "14"], "answer": 4, "explain": "Count the farms that lack each crop: 10 lack wheat, 12 barley and 14 oats, so at most 10 + 12 + 14 = 36 farms lack at least one crop. At least 50 − 36 = 14 must grow all three, and 14 is reached when no farm lacks two crops. Answering 0 assumes the groups can avoid one another, which 114 crop-growings among 50 farms do not allow.", "why": "Counting the farms that lack each crop, rather than those that grow it, gives the bound directly."}, {"id": "T1-Q2H-13", "type": "mc", "skill": "Data interpretation", "chart": "t1-farm-crops", "difficulty": 4, "stem": "In which year was the area planted with wheat the smallest percent of the total area planted with the three crops?", "options": ["2021", "2022", "2023", "2024", "2025"], "answer": 3, "explain": "The totals are 230, 260, 290, 320 and 330 hectares, so wheat's shares are about 52%, 54%, 52%, 44% and 52%. The smallest share is in 2024 (140/320 ≈ 44%), when barley jumped to 120 hectares. 2021 has the least wheat (120 hectares) but also the smallest total, so its share is about 52%.", "why": "The year with the least wheat is not the year with the smallest wheat share, because the totals differ."}, {"id": "T1-Q2H-14", "type": "numeric", "skill": "Data interpretation", "chart": "t1-farm-crops", "difficulty": 4, "stem": "In 2025 the farm harvested 8 tonnes per hectare of wheat, 6 tonnes per hectare of barley and 4.5 tonnes per hectare of oats. For all the land planted with the three crops in 2025, what was the average harvest in tonnes per hectare, to the nearest tenth?", "answer": 6.8, "explain": "The harvest was 170 × 8 + 100 × 6 + 60 × 4.5 = 1,360 + 600 + 270 = 2,230 tonnes from 170 + 100 + 60 = 330 hectares, so 2,230/330 ≈ 6.76, or 6.8, tonnes per hectare. The simple average of 8, 6 and 4.5 (about 6.2) ignores that far more land grew wheat.", "why": "The average must be weighted by area; the plain mean of the three yields is about 6.2."}, {"id": "T1-Q2H-15", "type": "multi", "skill": "Data interpretation", "chart": "t1-farm-crops", "difficulty": 4, "stem": "Which of the following statements are true? Indicate all such statements.", "options": ["Oats made up a greater percent of the total area planted with the three crops in 2025 than in 2021.", "In each year from 2022 to 2025, the total area planted with the three crops was more than 5% greater than in the previous year.", "The only year in which the wheat area decreased from the previous year was also the year with the largest increase in barley area.", "The median of the five annual areas planted with oats is greater than their average (arithmetic mean)."], "answer": [0, 2], "explain": "Oats rose from 30/230 ≈ 13% of the total to 60/330 ≈ 18%. The totals 230, 260, 290, 320 and 330 rise by about 13%, 12%, 10% and then only 3% (10/320), so not every year exceeds 5%. Wheat fell only in 2024, the year barley rose most (by 30 hectares). The oat areas 30, 50, 50, 60 and 60 have median 50 and mean 250/5 = 50, which are equal, not one greater than the other.", "why": "The totals rise steadily until 2025, when the increase drops to about 3%, and the oats median equals the mean rather than exceeding it."}]}, "V2E": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "E-V-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Far from being ______, the committee's report was so carefully hedged that readers struggled to find a single firm recommendation in it.", "blanks": [["tentative", "lengthy", "belated", "unequivocal", "partisan"]], "answer": [3], "explain": "A report so hedged that no firm recommendation appears is the opposite of clear and definite, and 'far from being' asks for that opposite: unequivocal. 'Tentative' is the trap, since it describes what the report actually was. Nothing in the sentence concerns length, bias or timing."}, {"id": "E-V-02", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Because the old factory's brick walls proved far sturdier than expected, the architects decided to ______ them in the new building rather than demolish them, and the exposed brick now gives the lobby much of its character.", "blanks": [["dismantle", "replicate", "retain", "abandon", "disguise"]], "answer": [2], "explain": "'Rather than demolish them' and the walls still being visible in the lobby show they were kept: retain. 'Disguise' clashes with the brick being exposed, and 'dismantle' means much the same as demolish."}, {"id": "E-V-03", "type": "tc", "skill": "Text completion", "difficulty": 2, "stem": "Early reviewers dismissed the cookbook as (i)______, a mere collection of familiar recipes, but cooks soon discovered that its methods were genuinely (ii)______, often reversing steps that every other book took for granted.", "blanks": [["innovative", "exhaustive", "derivative"], ["conventional", "novel", "tedious"]], "answer": [2, 1], "explain": "'A mere collection of familiar recipes' defines the first blank: derivative. 'But' and the methods that reverse standard steps call for the opposite in the second: novel. 'Innovative' in the first blank and 'conventional' in the second would reverse the contrast."}, {"id": "E-V-04", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The researcher's early findings were (i)______, drawn from only a handful of participants, so she was careful to describe them as (ii)______ rather than conclusive; only after a much larger study had (iii)______ them did she state them with confidence.", "blanks": [["controversial", "preliminary", "definitive"], ["decisive", "tentative", "misleading"], ["ignored", "corroborated", "contradicted"]], "answer": [1, 1, 1], "explain": "Results from a handful of participants are preliminary, and 'rather than conclusive' calls for tentative. She became confident only once a larger study had corroborated them; a study that contradicted the findings would have undermined her confidence instead. Nothing suggests the early results were controversial."}, {"id": "E-V-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The manager's ______ approach to spending, which included reusing old folders and refusing to replace chairs that still worked, saved the department thousands of pounds.", "options": ["generous", "careless", "lavish", "thrifty", "frugal", "innovative"], "answer": [3, 4], "explain": "Reusing folders and keeping old chairs to save money describes careful, economical spending: frugal and thrifty. 'Lavish' and 'generous' are the opposite, and reusing folders is hardly innovative."}, {"id": "E-V-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Despite the critic's reputation for harshness, her review of the young playwright's first play was surprisingly ______.", "options": ["severe", "lengthy", "scathing", "laudatory", "anonymous", "complimentary"], "answer": [3, 5], "explain": "'Despite' her reputation for harshness, the review must have been the reverse of harsh, that is, full of praise: laudatory and complimentary. 'Scathing' and 'severe' form a matching pair, but they describe exactly the harshness the sentence says was absent."}, {"id": "E-V-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 2, "stem": "The negotiator remained ______ throughout the tense talks, never once raising her voice even when the other side made insulting remarks.", "options": ["indecisive", "verbose", "unflappable", "composed", "impatient", "belligerent"], "answer": [2, 3], "explain": "Never raising her voice in the face of insults shows calm self-control: composed and unflappable. 'Belligerent' and 'impatient' contradict that calm, and nothing in the sentence concerns how much she talked or whether she could make decisions."}, {"id": "E-V-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The council's plan to ______ flooding in the valley by restoring wetlands upstream was praised for reducing, though not eliminating, the risk to nearby homes.", "options": ["mitigate", "eliminate", "predict", "cause", "ignore", "alleviate"], "answer": [0, 5], "explain": "The plan reduces the risk 'though not eliminating' it, so it lessens the flooding: mitigate and alleviate. 'Eliminate' is the trap the sentence explicitly rules out, and a plan cannot predict or ignore flooding by restoring wetlands."}, {"id": "E-V-09", "type": "mc", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 2, "stem": "The passage is primarily concerned with", "options": ["describing the history of suburban road building in the twentieth century", "explaining a challenge to a long-standing principle of street design and assessing how far that challenge applies", "comparing the safety records of rural highways with those of city streets", "defending traffic engineers against criticism from urban designers", "arguing that forgiving design should be abandoned on every type of road"], "answer": 1, "explain": "The passage sets out forgiving design, presents the urban designers' objection and its evidence, then limits the objection to busy urban streets. Abandoning forgiving design everywhere is too strong, since the final paragraph says it still helps on rural highways; suburban history is only background in the first paragraph."}, {"id": "E-V-10", "type": "mc", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 3, "stem": "The studies of city streets described in the second paragraph are presented as evidence that", "options": ["planting trees is the most effective way to slow traffic", "drivers prefer narrow streets to wide ones", "narrowing urban streets prevents crashes altogether", "rural highways would also be safer if their lanes were narrowed", "reducing the room drivers have to correct mistakes need not lead to more crashes"], "answer": 4, "explain": "On the narrowed streets crashes 'did not rise, even though drivers now had less room to correct their mistakes', which is exactly what the critics' view predicts. The studies show no rise in crashes, not their disappearance, and the passage says nothing about drivers' preferences or about narrowing rural highways."}, {"id": "E-V-11", "type": "multi", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 3, "stem": "Which of the following can be inferred from the passage about forgiving design? Select all that apply.", "options": ["It remains appropriate for some kinds of road.", "Its supporters assumed that giving drivers more space would not lead them to change their behavior in a way that cancels the benefit.", "It was first developed for residential streets and only later extended to highways."], "answer": [0, 1], "explain": "The critics say forgiving design rested on a mistaken picture in which drivers 'simply enjoy the benefit of extra space' rather than speeding up, so its supporters assumed no such offsetting change. The final paragraph says rural highways still benefit from it. The passage says it was applied to highways and also to residential streets, but never that residential streets came first."}, {"id": "E-V-12", "type": "sentence", "skill": "Reading comprehension", "passage": "e-forgiving-streets", "difficulty": 2, "stem": "Select the sentence in which the author states the general principle that the debate described in the passage illustrates.", "answer": 10, "explain": "The last sentence draws 'the lesson of the debate': no street feature is safe or dangerous in itself, because its effect depends on drivers' response and the street's purpose. The sentence about busy urban streets gives the critics' specific conclusion, not the general principle."}, {"id": "E-V-13", "type": "mc", "skill": "Reading comprehension", "passage": "e-generation-effect", "difficulty": 2, "stem": "The experiments with nonwords are mentioned primarily in order to", "options": ["demonstrate that people cannot remember nonwords at all", "argue that reading is a more effective way to learn than producing", "explain why producing real words takes more effort than producing nonwords", "present evidence that effort alone does not account for the generation effect", "show that the generation effect is stronger for nonwords than for real words"], "answer": 3, "explain": "Producing nonwords took at least as much effort as producing real words yet gave little or no memory advantage, which undercuts the idea that effort by itself explains the effect. The passage says nonwords show a weaker effect, not a stronger one, and it never claims they cannot be remembered at all."}, {"id": "E-V-14", "type": "multi", "skill": "Reading comprehension", "passage": "e-generation-effect", "difficulty": 3, "stem": "Which of the following can be inferred from the passage? Select all that apply.", "options": ["Producing material oneself improves later recall whatever kind of material is produced.", "The original explanation of the generation effect would predict a memory advantage for nonwords that participants produced themselves.", "People who read nonwords recall them about as well as people who produce them."], "answer": [1, 2], "explain": "The original account credited the effect to effort, and producing nonwords took at least as much effort as producing words, so that account predicts an advantage for them. The nonword experiments found 'little or no memory advantage' over reading, so recall was similar either way. That same finding rules out the claim that producing any kind of material helps."}, {"id": "E-V-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "e-yoghurt-aroma", "difficulty": 3, "stem": "Which of the following, if true, most seriously weakens the company's conclusion?", "options": ["Aroma compounds are known to affect how sweet some other fruit-flavored foods taste.", "In its first month, the new yoghurt sold slightly less than the original had sold in the month before.", "In a separate blind tasting, the same panels rated a version with 20 percent less sugar and no added aroma as exactly as sweet as the original.", "Some panellists said that the new recipe tasted more strongly of strawberry than the original.", "Strawberry aroma costs more per serving than the sugar it replaced."], "answer": 2, "explain": "If the panels could not detect the 20 percent cut even without extra aroma, there was no lost sweetness for the aroma to make up, so the tasting results no longer support the company's explanation. Sales figures are tempting but concern a different month and many other factors, not perceived sweetness. The point about other fruit-flavored foods strengthens the conclusion rather than weakening it."}]}, "Q2E": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "E-Q-01", "type": "qc", "skill": "Percentages", "difficulty": 3, "given": "A jacket priced at $80 has its price raised by 25%. The new price is then reduced by 25%.", "qa": "The final price of the jacket, in dollars", "qb": "80", "answer": 1, "explain": "After the rise the price is 80 × 1.25 = $100, and 25% off $100 is $25, leaving $75. The two changes do not cancel, because the cut is taken from a larger amount than the rise was. So Quantity B is greater."}, {"id": "E-Q-02", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "y² = 4y", "qa": "y", "qb": "4", "answer": 3, "explain": "Rearranging gives y² − 4y = 0, so y(y − 4) = 0 and y is 0 or 4. Dividing both sides by y to get y = 4 silently assumes y ≠ 0. If y = 4 the quantities are equal; if y = 0, Quantity B is greater, so the relationship cannot be determined."}, {"id": "E-Q-03", "type": "qc", "skill": "Geometry", "difficulty": 2, "given": "A triangle has two sides of lengths 5 and 8.", "qa": "The length of the third side", "qb": "3", "answer": 0, "explain": "Any side of a triangle must be longer than the difference of the other two and shorter than their sum, so the third side is between 8 − 5 = 3 and 8 + 5 = 13. A third side of exactly 3 would make the three points lie on a straight line, so it must be more than 3. Quantity A is greater."}, {"id": "E-Q-04", "type": "qc", "skill": "Geometry", "difficulty": 2, "given": "A rectangular floor measuring 6 meters by 4 meters is covered exactly, with no gaps or overlaps, by square tiles with sides of 50 centimeters.", "qa": "The number of tiles used", "qb": "96", "answer": 2, "explain": "Along the 6-meter side 600 ÷ 50 = 12 tiles fit, and along the 4-meter side 400 ÷ 50 = 8 fit, so 12 × 8 = 96 tiles are used. A common slip is dividing the area 24 m² by 0.5, which gives 48; each tile covers 0.5 × 0.5 = 0.25 m², and 24 ÷ 0.25 = 96. The quantities are equal."}, {"id": "E-Q-05", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "p and q are different positive integers, and p + q = 10.", "qa": "pq", "qb": "25", "answer": 1, "explain": "With a fixed sum, the product is largest when the two numbers are as close as possible. The product 25 needs p = q = 5, which is not allowed, so the largest possible product is 4 × 6 = 24. Quantity B is greater."}, {"id": "E-Q-06", "type": "mc", "skill": "Rates", "difficulty": 3, "stem": "A cyclist rides 24 kilometers to a lake at an average speed of 12 kilometers per hour and returns along the same 24-kilometer route at an average speed of 8 kilometers per hour. What is her average speed for the whole round trip, in kilometers per hour?", "options": ["9.2", "9.6", "10", "10.4", "12"], "answer": 1, "explain": "The outward trip takes 24 ÷ 12 = 2 hours and the return takes 24 ÷ 8 = 3 hours, so she covers 48 km in 5 hours: 48 ÷ 5 = 9.6 km/h. The tempting 10 averages the two speeds, but she spends longer at the slower speed, which pulls the average below 10."}, {"id": "E-Q-07", "type": "mc", "skill": "Algebra", "difficulty": 2, "stem": "Tickets for a school play cost $4 for students and $7 for adults. On opening night, 150 tickets were sold for a total of $795. How many adult tickets were sold?", "options": ["50", "55", "60", "65", "70"], "answer": 3, "explain": "If all 150 tickets had been student tickets the takings would be 150 × 4 = $600. Each adult ticket adds $3 more, and the extra is 795 − 600 = $195, so there were 195 ÷ 3 = 65 adult tickets. Check: 85 × 4 + 65 × 7 = 340 + 455 = 795."}, {"id": "E-Q-08", "type": "numeric", "skill": "Geometry", "difficulty": 2, "stem": "A rectangular lawn measures 18 meters by 12 meters. A path 1 meter wide runs around the outside of the lawn, along all four sides. What is the area of the path, in square meters?", "answer": 64, "explain": "The lawn and path together form a rectangle (18 + 2) by (12 + 2) = 20 m by 14 m, with area 280 m². Subtracting the lawn's 18 × 12 = 216 m² leaves 64 m². Multiplying the lawn's perimeter, 60 m, by the 1 m width gives 60 and misses the four 1 m by 1 m corner squares."}, {"id": "E-Q-09", "type": "multi", "skill": "Number properties", "difficulty": 3, "stem": "A coach divides 36 players into teams so that every player is on exactly one team, all teams are the same size, and each team has more than 3 but fewer than 12 players. Which of the following could be the number of teams? Indicate all such values.", "options": ["3", "4", "6", "8", "9", "12"], "answer": [1, 2, 4], "explain": "The team size must divide 36 and lie between 4 and 11, so it is 4, 6 or 9, giving 9, 6 or 4 teams. Three teams would need 12 players each and twelve teams would need 3 each, both outside the limits. Eight teams is impossible because 8 does not divide 36."}, {"id": "E-Q-10", "type": "mc", "skill": "Probability", "difficulty": 2, "stem": "A bag contains 4 red, 5 blue and 3 green counters. Two counters are drawn at random, one after the other, without replacement. What is the probability that both counters are red?", "options": ["1/11", "1/9", "4/33", "1/6", "1/3"], "answer": 0, "explain": "The first counter is red with probability 4/12. If it was, 3 of the remaining 11 counters are red, so the probability is 4/12 × 3/11 = 12/132 = 1/11. The answer 1/9 comes from (4/12)², which would apply only if the first counter were put back."}, {"id": "E-Q-11", "type": "fraction", "skill": "Fractions", "difficulty": 2, "stem": "Priya spent 1/4 of her vacation money on a train ticket and then spent 1/3 of what remained on a hotel. What fraction of her original vacation money did she have left? Give your answer as a fraction.", "answer": [1, 2], "explain": "After the ticket she has 3/4 of her money. The hotel takes 1/3 of that, leaving 2/3 × 3/4 = 1/2. Subtracting 1/4 and 1/3 from the whole, giving 5/12, wrongly treats the second fraction as a share of the original amount."}, {"id": "E-Q-12", "type": "mc", "skill": "Geometry", "difficulty": 3, "stem": "A café sells round pizzas in two sizes: a large with a diameter of 36 centimeters and a small with a diameter of 24 centimeters. Both pizzas have the same thickness. The area of the large pizza is how many times the area of the small pizza?", "options": ["1.25", "1.5", "1.75", "2", "2.25"], "answer": 4, "explain": "The diameters are in the ratio 36 : 24 = 1.5 : 1. Areas of circles scale with the square of the diameter, so the ratio of areas is 1.5² = 2.25. The answer 1.5 compares lengths, not areas."}, {"id": "E-Q-13", "type": "mc", "skill": "Data interpretation", "difficulty": 2, "table": "e-sports-shop", "stem": "By approximately what percent did the total number of items sold (soccer balls plus pairs of sneakers) increase from January to April?", "options": ["36%", "47%", "57%", "64%", "75%"], "answer": 2, "explain": "January's total is 40 + 20 = 60 items and April's is 70 + 24 = 94, an increase of 34. As a percent of the January figure that is 34 ÷ 60 ≈ 57%. Dividing by April's 94 gives about 36%, and 75% is the increase in soccer balls alone."}, {"id": "E-Q-14", "type": "numeric", "skill": "Data interpretation", "difficulty": 3, "table": "e-sports-shop", "stem": "In January, what was the average (arithmetic mean) revenue per item sold, in dollars, counting soccer balls and pairs of sneakers together?", "answer": 30, "explain": "Soccer balls brought in 40 × 15 = $600 and sneakers 20 × 60 = $1,200, a total of $1,800 from 60 items, so the mean is 1,800 ÷ 60 = $30. Averaging the two prices, (15 + 60) ÷ 2 = 37.5, ignores that twice as many soccer balls as pairs of sneakers were sold."}, {"id": "E-Q-15", "type": "multi", "skill": "Data interpretation", "difficulty": 3, "table": "e-sports-shop", "stem": "In which of the four months was the shop's revenue from sneakers more than 1.5 times its revenue from soccer balls? Indicate all such months.", "options": ["January", "February", "March", "April"], "answer": [0, 1], "explain": "Trainer and soccer revenues are $1,200 and $600 in January (ratio 2), $1,500 and $900 in February (about 1.67), $1,350 and $900 in March (exactly 1.5) and $1,320 and $1,120 in April (about 1.18). March is exactly 1.5 times, not more, so only January and February qualify."}]}}, "version": "b231acc1c5"}, {"id": "test-02", "title": "Practice Test 2", "blurb": "New questions, Quant first.", "order": ["Q1", "Q2", "V1", "V2"], "essay": {"minutes": 30, "variant": "claim-reason", "prompt": "Claim: When experts explain their findings to the public, they should present their conclusions without dwelling on the uncertainty behind them.\nReason: People who hear about the uncertainty in expert findings tend to discount sound conclusions along with doubtful ones.", "instructions": "Write a response in which you discuss how far you agree or disagree with the claim and with the reason on which it is based. As you develop your position, consider whether the reason actually supports the claim, and explain how your view of the reason shapes your view of the claim."}, "passages": {"t2-food-sharing": ["For much of the twentieth century, anthropologists treated food sharing among foraging peoples as the expression of an egalitarian ethic: hunters, it was said, gave away meat because their societies prized generosity above accumulation.", "Later fieldworkers, recording who actually received each portion, complicated this picture.", "Sharing turned out to follow predictable channels, with the largest shares going to close kin and to households that had given most in the past, a pattern more consistent with long-term insurance against the risk of a failed hunt than with indiscriminate generosity.", "Some researchers concluded that the egalitarian ethic was an ideology masking calculated self-interest.", "That conclusion, however, assumes that a practice must be explained either by values or by interests, as though the two could not coincide.", "A hunter who shares because he has been raised to regard hoarding as shameful may still, without intending to, be insuring himself; indeed, the norm may persist precisely because it makes the insurance reliable.", "The measured patterns of sharing thus reveal what the norm accomplishes without showing that the norm is insincere."], "t2-asteroid-camera": ["Since a regional observatory replaced its camera with a far more sensitive model, the number of near-Earth asteroids it discovers each year has doubled.", "The observatory's director argues that the upgrade, rather than any change in the sky, accounts for the increase.", "She therefore urges the national funding agency to install the same camera at its four other observatories, predicting that their annual discoveries will roughly double as well."], "t2-serial-novels": ["Critics have often blamed the sprawling plots of Victorian novels on the economics of serial publication: paid by the instalment and obliged to fill a fixed number of pages each month, novelists supposedly padded their stories with subplots and digressions.", "The explanation has the appeal of hard-headed realism, but it fits the evidence less well than its popularity suggests.", "Several novelists who published their books complete, and so had no monthly pages to fill, wrote at comparable length, while some serial novelists cut material that their editors would happily have printed.", "Serialization may well have shaped the novels in subtler ways, encouraging a suspenseful turn at the close of each instalment, for instance, but length itself seems to have answered to readers' tastes at least as much as to publishers' contracts."], "t2-gyrochronology": {"paragraphs": [["Determining the age of an isolated star is one of the more stubborn problems in astronomy, because a star like the Sun changes remarkably little in brightness or temperature during the long middle period of its life.", "Several decades ago, however, astronomers noticed a regularity that seemed to offer a way around the difficulty: among stars in clusters whose ages were already known, the older stars rotated more slowly, apparently because a magnetized wind carries angular momentum away from a star and brakes its spin at a steady rate.", "If the relation held generally, a star's rotation period, which can be measured from the regular dimming caused by dark spots crossing its face, would serve as a clock, and the method, known as gyrochronology, was eventually applied to thousands of stars monitored by space telescopes."], ["The clock, however, had been calibrated almost entirely on young stars, for the simple reason that the clusters with securely established ages are mostly young.", "When astronomers finally obtained independent ages for a sample of older stars, by measuring the minute oscillations of their surfaces and using them to probe their interiors, many of the stars turned out to be spinning faster than gyrochronology predicted for their ages.", "The most widely discussed explanation is that magnetic braking weakens markedly once a star reaches roughly the age of the Sun, perhaps because the structure of its magnetic field changes, so that its spin thereafter declines far more slowly than before.", "If that is right, a star whose rotation period indicates an age of five billion years under the original calibration might in fact be eight billion years old."], ["It would be premature, though, to conclude that rotation is useless as a measure of age.", "For stars younger than the Sun, the original relation continues to agree well with ages derived by other means, and for older stars a revised calibration that allows for weakened braking may restore much of the method's value.", "What the episode chiefly exposes is the hazard of extending an empirical rule beyond the conditions under which it was established: the rule broke down precisely in the range where it had been assumed rather than tested."]]}, "t2-ritual-efficacy": ["Anthropologists confronted with rites meant to bring rain or cure illness have often been reluctant to take participants' claims about their efficacy at face value.", "One influential response treats such rites as expressive rather than instrumental: on this view, a rain dance does not attempt to cause rain but dramatizes a community's dependence on it.", "The interpretation spares observers the awkwardness of attributing false beliefs to the people they study, yet it carries a cost of its own.", "Participants frequently insist that the rites work, and some communities abandon a rite that seems to have failed, behavior that is hard to square with a purely symbolic purpose.", "A more defensible position may be that many rites are both at once, their expressive force sustained in part by the expectation that they will have effects."], "t2-stylometry": ["An anonymous eighteenth-century novel has long been attributed to a minor playwright, chiefly on the strength of gossip recorded at the time of its publication.", "A computer analysis has now found that the novel's rates of use of common function words, such as 'upon' and 'while', closely match the rates in the surviving letters of a well-known essayist and differ sharply from those in the playwright's comedies.", "The analysts conclude that the essayist, not the playwright, wrote the novel."], "t2-genetic-criticism": {"paragraphs": [["For most of the twentieth century, editors of literary works sought to establish a single authoritative text, usually the version that came closest to what they took to be the author's final intentions.", "Manuscripts, drafts and proofs mattered to this enterprise chiefly as evidence: they allowed the editor to detect a compositor's error or a censor's interference and to restore the reading the author had wanted.", "Once the authoritative text was fixed, the drafts that had helped to fix it could be set aside."], ["Genetic criticism, which took shape in France from the 1970s onward, reversed this order of priority.", "Its practitioners treat drafts not as scaffolding to be removed once the building stands but as the primary object of study, a record of writing as a process in which the published version is only one moment, and not necessarily a privileged one.", "A deletion, on this view, is less an error corrected than a possibility explored and set aside, and the critic who attends to it may learn more about how a work means than the critic who reads only the finished page."], ["The approach has undeniably enlarged what counts as literary evidence, but its more ambitious claims are open to doubt.", "To say that the published text enjoys no special status is to ignore that authors themselves usually drew a sharp line between what they released and what they kept in a drawer, and that many destroyed drafts precisely so that they would not be read.", "Moreover, the drafts that survive are seldom a complete record; they reflect accidents of preservation as much as stages of composition, so that a narrative of a work's genesis built on them may owe as much to the critic's ingenuity as to the writer's practice.", "None of this diminishes the value of the manuscripts, but it suggests that genetic criticism is most persuasive when it treats the drafts as one witness among several rather than as a court of final appeal."]]}, "t2-galaxy-rotation": ["Stars in the outer regions of spiral galaxies orbit faster than the gravity of the galaxies' visible matter can account for.", "The usual explanation invokes halos of unseen 'dark' matter, but a rival proposal instead modifies the law of gravity at very low accelerations, and for individual galaxies its record is impressive: from the distribution of visible matter alone, it predicts orbital speeds that dark-matter models can match only by adjusting each halo separately.", "Its defenders regard this economy as decisive.", "Yet the same modified law, applied to clusters of galaxies, still falls short of the observed motions unless some unseen mass is added after all.", "The modification may therefore capture a genuine regularity in how galaxies behave without supplying the whole explanation for it."], "t2-wedding-cattle": ["Over the past thirty years, the proportion of households in a highland farming region that own cattle has fallen by half, and the price of cattle has risen sharply relative to that of other goods.", "Yet anthropologists working in the region report that the number of cattle transferred at weddings, traditionally the largest transfers of wealth in local life, has increased over the same period."], "e-forgiving-streets": {"paragraphs": [["For much of the twentieth century, traffic engineers designed streets on a principle sometimes called forgiving design: if a road gave drivers generous room for error, their mistakes would less often turn into crashes.", "Lanes were widened, curves were straightened, and trees and other roadside objects were cleared away, so that a driver who drifted or misjudged a bend would have space to recover.", "The principle seemed self-evident, and it was applied not only to highways but also to residential and shopping streets, where it helped produce the broad, open roads typical of many suburbs built after the Second World War."], ["Beginning in the 1990s, however, a number of urban designers argued that forgiving design rested on a mistaken picture of how people drive.", "Drivers, they pointed out, do not hold to a fixed speed and simply enjoy the benefit of extra space; instead, they adjust their speed to how risky a road appears.", "A wide, straight, unobstructed street looks safe, and so it invites faster driving, which can cancel out the margin for error that the design was meant to provide.", "Studies of city streets lent some support to this view: on several urban roads where lanes had been narrowed or trees planted along the curb, average speeds fell and the number of crashes did not rise, even though drivers now had less room to correct their mistakes.", "Because the harm done when a car strikes a pedestrian depends heavily on the car's speed, the critics concluded that on busy urban streets a design that feels slightly less comfortable to drive may in fact be the safer one."], ["This argument does not show that forgiving design was simply wrong.", "On rural highways, where traffic is meant to move quickly and pedestrians are rare, a driver who leaves the road at high speed still benefits greatly from a wide shoulder and a clear roadside.", "The lesson of the debate is rather that no feature of a street is safe or dangerous in itself: its effect depends on how drivers respond to it, and that response depends in turn on what the street is for."]]}, "e-generation-effect": ["People usually remember a word better if they have produced it themselves than if they have simply read it: someone who completes the pair 'hot–c_ld' is more likely to recall 'cold' later than someone who reads the pair already filled in.", "This advantage, known as the generation effect, was at first attributed to effort: producing a word takes more work than reading it, and the extra work was thought to strengthen the memory.", "Later experiments complicated this account by asking participants to generate made-up nonwords, for example by completing a string of letters according to a rule.", "Although producing the nonwords demanded at least as much effort as producing real words, it gave little or no memory advantage over simply reading them.", "Many researchers now conclude that effort aids memory in this way only when it draws on knowledge already stored there, such as a word's meaning or its links to other words."], "e-yoghurt-aroma": ["A food manufacturer cut the sugar in its strawberry yoghurt by 20 percent and, to compensate, added extra strawberry aroma.", "In blind tastings, panels of regular yoghurt eaters rated the new recipe exactly as sweet as the original.", "The company concluded that the added aroma had made up for the missing sugar, and it now plans to use the same approach to reduce the sugar in its other desserts."]}, "tables": {"t2-hardware-shop": {"title": "Prices and unit sales of five products at a hardware shop, January–March and April–June", "head": ["Product", "Price, Jan–Mar ($)", "Units sold, Jan–Mar", "Price, Apr–Jun ($)", "Units sold, Apr–Jun"], "rows": [["Paint (tin)", "12", "250", "15", "220"], ["Brush", "4", "600", "4", "540"], ["Drill", "80", "45", "72", "60"], ["Ladder", "50", "30", "55", "36"], ["Screws (box)", "6", "400", "5", "520"]]}, "t2-bus-journeys": {"title": "Journeys on a city bus network by fare type, 2023 and 2024 (thousands)", "head": ["Fare type", "2023", "2024"], "rows": [["Adult", "480", "432"], ["Student", "160", "200"], ["Child", "120", "138"], ["Senior", "200", "226"], ["Disability pass", "40", "40"], ["Total", "1,000", "1,036"]]}, "e-sports-shop": {"title": "Monthly sales at a sports shop, January to April", "head": ["Month", "Soccer balls sold", "Price per soccer ($)", "Pairs of sneakers sold", "Price per pair ($)"], "rows": [["January", "40", "15", "20", "60"], ["February", "60", "15", "25", "60"], ["March", "50", "18", "30", "45"], ["April", "70", "16", "24", "55"]]}}, "charts": {"t2-ferry-routes": {"kind": "bar", "title": "Monthly passengers on two ferry routes, January–June (thousands)", "categories": ["Jan", "Feb", "Mar", "Apr", "May", "Jun"], "series": [{"name": "Route North", "values": [25, 30, 35, 45, 55, 60]}, {"name": "Route South", "values": [40, 35, 45, 50, 60, 70]}], "yLabel": "Passengers (thousands)", "yMax": 80, "yTicks": 16}}, "sections": {"V1": {"measure": "Verbal", "minutes": 18, "label": "Verbal Reasoning: Section 1", "questions": [{"id": "T2-V1-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The comet's much-heralded brightening proved so ______ that the observatory's press office, having promised a spectacle visible even from city centers, quietly withdrew its viewing guide.", "blanks": [["negligible", "conspicuous", "protracted", "spectacular", "prodigious"]], "answer": [0], "explain": "Withdrawing a viewing guide after promising a spectacle means the brightening was too slight to see: negligible. 'Prodigious', 'conspicuous' and 'spectacular' describe the promised outcome, not what happened, and 'protracted' concerns how long the brightening lasted, which would not make the guide useless."}, {"id": "T2-V1-02", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Critics who dismiss the poet as merely ______ overlook how thoroughly her borrowings transform their sources: a line lifted from a hymn becomes, in her hands, an argument against the very faith it once expressed.", "blanks": [["prolix", "obscure", "imitative", "iconoclastic", "sentimental"]], "answer": [2], "explain": "'Borrowings' and 'a line lifted from a hymn' show that the critics' complaint is that she copies others: imitative. 'Iconoclastic' tempts because the transformed line attacks a faith, but that transformation is what the critics overlook, not what they accuse her of."}, {"id": "T2-V1-03", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The physicist's reputation for (i)______ was, her colleagues insisted, undeserved: what outsiders took for an inability to commit to a conclusion was a principled refusal to claim more than the data warranted, a (ii)______ that was vindicated when the anomaly she had declined to endorse vanished on reanalysis.", "blanks": [["irresolution", "credulity", "arrogance"], ["prudence", "pedantry", "temerity"]], "answer": [0, 0], "why": "'Pedantry' also names excessive caution, but it is a fault, and the sentence says the refusal was vindicated.", "explain": "An 'inability to commit to a conclusion' is irresolution, the unflattering reputation her colleagues reject. They recast the same habit as a virtue that events vindicated: prudence. 'Credulity' and 'temerity' describe the opposite habit of believing or claiming too readily, and 'pedantry' is a fault that no outcome could vindicate."}, {"id": "T2-V1-04", "type": "tc", "skill": "Text completion", "difficulty": 5, "stem": "Anthropologists who regard the market town's elaborate haggling as mere (i)______, a ritual whose outcome is settled before it begins, must explain why so many bargaining sessions end without a sale; the more (ii)______ reading is that the exchange is a genuine contest, though one governed by conventions so (iii)______ that outsiders mistake its moves for empty formality.", "blanks": [["chicanery", "barter", "pageantry"], ["parsimonious", "credulous", "recondite"], ["implicit", "codified", "capricious"]], "answer": [2, 0, 0], "why": "'Codified' looks like a natural partner for 'conventions', but written rules would be easy for outsiders to read; the logic needs rules that go unstated.", "explain": "A ritual 'settled before it begins' is show without substance: pageantry, which matches the later phrase 'empty formality'. Because failed sales are hard to explain on that view, the contest reading accounts for the evidence with fewer assumptions: parsimonious, whereas 'credulous' and 'recondite' would disparage the reading the author favors. Outsiders can mistake real moves for formality only if the rules go unstated, so the conventions are implicit; codified rules would be legible to anyone, and capricious ones would not be conventions at all."}, {"id": "T2-V1-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Because the faint galaxy's distance could be estimated only from its color, a method notorious for large errors, the team presented its figure as strictly ______, to be revised once spectroscopic measurements became available.", "options": ["peripheral", "arbitrary", "definitive", "interim", "authoritative", "provisional"], "answer": [3, 5], "explain": "A figure 'to be revised' once better data arrive is temporary: provisional and interim. 'Definitive' and 'authoritative' form a pair, but they contradict the planned revision, and 'arbitrary' is too strong for an estimate based on a recognized, if error-prone, method."}, {"id": "T2-V1-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "Reviewers who found the memoir merely ______ had evidently missed its irony: the author's praise of her own achievements is so relentless that it can only be a parody of the genre's habitual self-congratulation.", "options": ["satirical", "diffident", "pompous", "self-effacing", "immodest", "ironic"], "answer": [2, 4], "why": "'Satirical' and 'ironic' form an obvious pair, but reviewers who saw the satire could not have missed the irony.", "explain": "The reviewers took the relentless self-praise at face value, so they judged the memoir self-glorifying: immodest and pompous. 'Satirical' and 'ironic' are a pair, yet reviewers who saw that would not have missed the irony, and 'diffident' and 'self-effacing' contradict the relentless self-praise."}, {"id": "T2-V1-07", "type": "mc", "skill": "Reading comprehension", "passage": "t2-food-sharing", "difficulty": 3, "stem": "The primary purpose of the passage is to", "options": ["explain why later fieldworkers recorded sharing more accurately than earlier ones", "challenge an inference that some researchers drew from evidence about how food is shared", "argue that moral norms are generally disguised forms of self-interest", "defend the view that foragers share food out of generosity alone", "show that food sharing among foragers has no economic function"], "answer": 1, "explain": "After describing the new evidence, the author spends the rest of the passage disputing the conclusion that the ethic is a mask for self-interest, so the passage challenges an inference. The author does not defend generosity 'alone', since the insurance pattern is accepted, and the claim that norms are disguised self-interest is the very view the author rejects."}, {"id": "T2-V1-08", "type": "multi", "skill": "Reading comprehension", "passage": "t2-food-sharing", "difficulty": 4, "stem": "It can be inferred from the passage that the researchers who concluded that the egalitarian ethic was an ideology did which of the following? Select all that apply.", "options": ["Denied that sharing reduced the risks faced by individual hunters.", "Treated an explanation in terms of interests as ruling out an explanation in terms of values.", "Based their conclusion on observed patterns in who received shares of meat."], "answer": [1, 2], "why": "The first statement is never said outright; it follows from the conclusion's place right after the new evidence and from the final sentence's reply to it.", "explain": "Their conclusion follows the fieldworkers' findings, and the final sentence answers it by saying the 'measured patterns' do not show insincerity, so they reasoned from those patterns. The author says their conclusion 'assumes' a practice must be explained by values or interests but not both, which is the second statement. They did not deny the insurance effect; their view depends on it."}, {"id": "T2-V1-09", "type": "mc", "skill": "Reading comprehension", "passage": "t2-food-sharing", "difficulty": 4, "stem": "The author mentions a hunter 'raised to regard hoarding as shameful' primarily in order to", "options": ["suggest that shame is a more powerful motive among foragers than self-interest", "concede that the later fieldworkers' measurements of sharing were unreliable", "establish that the norm against hoarding originated as a strategy for insuring against failed hunts", "illustrate how a sincerely held motive and a self-interested effect can coexist in a single act", "show that most hunters are unaware of the norms that govern their behavior"], "answer": 3, "why": "The same sentence says the norm 'may persist' because of its insurance value, which tempts the option about origins, but persistence is not origin and 'may' is not 'establish'.", "explain": "The hunter shares out of a sincere sense of shame yet, 'without intending to', insures himself, a concrete case of values and interests coinciding, which answers the assumption in the previous sentence. The option about the norm's origins overstates a hedged remark about why the norm persists, and nothing suggests the measurements were unreliable."}, {"id": "T2-V1-10", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t2-asteroid-camera", "difficulty": 4, "stem": "Which of the following, if true, most seriously weakens the director's prediction?", "options": ["Asteroids discovered with the new camera are, on average, fainter than those the observatory discovered before the upgrade.", "The new camera costs considerably more than the cameras currently in use at the other observatories.", "Astronomers at the other observatories have asked the agency for new equipment several times in the past decade.", "The number of near-Earth asteroids passing within range of the observatories has not changed appreciably in recent years.", "At the other four observatories, the faintest objects that can be detected are limited by haze and city lighting rather than by the sensitivity of the cameras."], "answer": 4, "why": "The tempting answers address the director's explanation or the cost; the gap is the step from one observatory to four others with different conditions.", "explain": "The prediction assumes that what held back the other observatories is their cameras. If haze and city lighting set their limit, a more sensitive camera will add little. An unchanged asteroid population and fainter new discoveries both support the director, and the camera's cost bears on whether to buy it, not on what it would achieve."}, {"id": "T2-V1-11", "type": "mc", "skill": "Reading comprehension", "passage": "t2-serial-novels", "difficulty": 2, "stem": "According to the passage, some novelists who published in serial form", "options": ["later reissued their novels in shorter, complete editions", "were paid more per page than novelists who published complete books", "refused their editors' requests to add subplots", "ended fewer instalments with suspenseful turns than their contemporaries did", "removed material that their editors would have been willing to print"], "answer": 4, "explain": "The passage says that 'some serial novelists cut material that their editors would happily have printed'. Nothing is said about rates of pay, refused requests or later editions, and the suspenseful endings are offered as a general effect of serialization, not a comparison between novelists."}, {"id": "T2-V1-12", "type": "mc", "skill": "Reading comprehension", "passage": "t2-serial-novels", "difficulty": 3, "stem": "The author's attitude toward the economic explanation of the length of Victorian novels is best described as", "options": ["persuaded by it, though doubtful that it applies to every novelist", "dismissive of any connection between a novel's form and the way it was published", "convinced that it reverses the true relationship between payment and length", "indifferent, since the author regards length as unimportant", "skeptical of its adequacy, while allowing that serial publication influenced the novels in other ways"], "answer": 4, "explain": "The author says the explanation 'fits the evidence less well than its popularity suggests' yet grants that serialization 'may well have shaped the novels in subtler ways'. Being 'dismissive of any connection' ignores that concession, and nothing suggests the author is persuaded by the explanation."}]}, "V2M": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "T2-V2M-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The biographer's ______ treatment of her subject's failings, which she mentions only in passing and always with an excuse ready to hand, has led several reviewers to call the book a work of advocacy rather than of scholarship.", "blanks": [["exhaustive", "partial", "dispassionate", "censorious", "scathing"]], "answer": [1], "explain": "Mentioning failings only in passing and always excusing them is biased in the subject's favor, which is why reviewers call the book advocacy: partial. 'Censorious' and 'scathing' describe the opposite bias, 'exhaustive' contradicts 'only in passing', and 'dispassionate' is incompatible with advocacy."}, {"id": "T2-V2M-02", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Far from proving ______, the new measurement of the neutron's lifetime has deepened the disagreement it was meant to resolve, since it matches neither of the values that rival laboratories had already reported.", "blanks": [["imprecise", "contentious", "anomalous", "decisive", "provocative"]], "answer": [3], "explain": "'Far from' sets the blank against deepening a disagreement, so the measurement failed to settle the dispute: decisive. 'Contentious', 'provocative' and 'anomalous' all describe what the measurement turned out to be, and 'imprecise' has nothing to do with settling or deepening the dispute."}, {"id": "T2-V2M-03", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The ethnographer cautions against reading the island's funeral feasts as mere (i)______: the hosts may appear to squander their wealth, but every pig they slaughter places the guests' families under an (ii)______ that must be discharged at a future feast.", "blanks": [["prodigality", "piety", "parsimony"], ["obligation", "exemption", "illusion"]], "answer": [0, 0], "explain": "Appearing to 'squander their wealth' is prodigality, the reading the ethnographer warns against. Something that 'must be discharged' later is a debt: obligation. 'Parsimony' is the opposite of squandering, 'piety' does not match it, and an 'exemption' is never discharged."}, {"id": "T2-V2M-04", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The irregular dimming of the distant star was at first (i)______ in the popular press as evidence of an alien megastructure, but astronomers soon showed that the dips were deeper in blue light than in red, a pattern that pointed instead to (ii)______ dust; the episode illustrates how readily (iii)______ explanations rush in to fill the gaps left by incomplete data.", "blanks": [["discounted", "ignored", "promoted"], ["artificial", "exotic", "mundane"], ["empirical", "outlandish", "parsimonious"]], "answer": [2, 2, 1], "why": "'Parsimonious' sounds like praise for an explanation, but the sentence criticizes the explanation that rushed in, the megastructure.", "explain": "The 'but' shows the press initially pushed the megastructure idea: promoted. 'Instead' contrasts the dust with an alien structure, so it is ordinary: mundane, not 'artificial' or 'exotic'. The explanation that filled the gap was the megastructure, an outlandish idea; 'empirical' and 'parsimonious' would praise it."}, {"id": "T2-V2M-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Though the novel's plot is ______, turning on a chain of coincidences that strains belief, its portrait of provincial life is so exact that most readers forgive the contrivance.", "options": ["convincing", "improbable", "credible", "leisurely", "implausible", "autobiographical"], "answer": [1, 4], "explain": "Coincidences that 'strain belief' make the plot hard to credit: implausible and improbable. 'Credible' and 'convincing' are a pair with the opposite meaning, and 'leisurely' and 'autobiographical' are not explained by a chain of coincidences."}, {"id": "T2-V2M-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The astronomer was known for her ______ approach to observation, logging every variable from the humidity to the temperature of the telescope's mirror before she would trust a single measurement.", "options": ["painstaking", "cavalier", "theoretical", "meticulous", "slapdash", "intuitive"], "answer": [0, 3], "explain": "Logging every variable before trusting a measurement shows great care: meticulous and painstaking. 'Cavalier' and 'slapdash' form a pair meaning careless, the reverse, and an 'intuitive' approach would not depend on exhaustive records."}, {"id": "T2-V2M-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Although the ritual's outward form has remained ______ for generations, its meaning for participants has shifted considerably: a ceremony once understood as a plea for rain is now performed chiefly as an affirmation of village identity.", "options": ["invariant", "immutable", "obsolete", "clandestine", "mutable", "fluid"], "answer": [0, 1], "explain": "'Although' contrasts the form with a meaning that has 'shifted', so the form has stayed the same: immutable and invariant. 'Fluid' and 'mutable' are a pair meaning changeable, which removes the contrast, and 'obsolete' contradicts the fact that the ceremony is still performed."}, {"id": "T2-V2M-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "Critics charge that the theory has become so ______ that it can accommodate any conceivable observation, and a theory that no result could contradict has ceased to predict anything at all.", "options": ["abstruse", "rigid", "malleable", "parsimonious", "pliable", "inflexible"], "answer": [2, 4], "why": "'Rigid' and 'inflexible' are a ready-made synonym pair, but they describe the opposite of a theory that fits every result.", "explain": "A theory that can be bent to fit any observation is easily reshaped: pliable and malleable. 'Rigid' and 'inflexible' are a pair but mean the reverse, 'parsimonious' describes a lean theory that rules much out, and being 'abstruse' would not let a theory fit every result."}, {"id": "T2-V2M-09", "type": "mc", "skill": "Reading comprehension", "passage": "t2-gyrochronology", "difficulty": 3, "stem": "The primary purpose of the passage is to", "options": ["argue that gyrochronology should be replaced by the study of stellar oscillations", "defend the original calibration of gyrochronology against recent criticism", "compare several methods of determining the ages of star clusters", "describe a method of estimating stellar ages and evaluate a difficulty that has emerged in its use", "explain how magnetized winds remove angular momentum from stars"], "answer": 3, "explain": "The first paragraph presents gyrochronology, the second the evidence that it fails for older stars, and the third weighs what that failure means. The author explicitly rejects abandoning rotation as a measure of age, and the original calibration is the thing found wanting, not defended."}, {"id": "T2-V2M-10", "type": "mc", "skill": "Reading comprehension", "passage": "t2-gyrochronology", "difficulty": 4, "stem": "It can be inferred from the passage that, if magnetic braking does weaken markedly in stars older than the Sun, the original calibration of gyrochronology tends to", "options": ["overstate the rotation periods of such stars", "assign accurate ages to old stars but not to young ones", "give reliable ages for such stars provided their spots can be observed", "underestimate the ages of such stars", "overestimate the ages of such stars"], "answer": 3, "why": "Readers who link 'weakened braking' with 'older' pick the reversed option; the faster spin reads as youth.", "explain": "With weaker braking, old stars spin faster than the original rule expects, and faster spin reads as youth, so the rule gives ages that are too low; the passage's own example has a star read as five billion years old that may be eight. The calibration reads ages from measured periods, so it cannot overstate the periods themselves."}, {"id": "T2-V2M-11", "type": "multi", "skill": "Reading comprehension", "passage": "t2-gyrochronology", "difficulty": 4, "stem": "The passage suggests that which of the following contributed to the inaccuracy of gyrochronology for older stars? Select all that apply.", "options": ["Until recently, few older stars had ages that had been determined independently of their rotation.", "Most of the stars on which the method was calibrated were young.", "The rotation periods of older stars cannot be measured from their spots."], "answer": [0, 1], "why": "The third statement rests on 'finally' and on the remark that securely dated clusters are mostly young, neither of which states it outright.", "explain": "The clock 'had been calibrated almost entirely on young stars' because securely dated clusters are mostly young, and astronomers only 'finally' obtained independent ages for older stars, so both of those statements are supported. Nothing suggests that the periods of older stars cannot be measured; their fast spin was itself measured."}, {"id": "T2-V2M-12", "type": "sentence", "skill": "Reading comprehension", "passage": "t2-gyrochronology", "difficulty": 3, "stem": "Select the sentence that illustrates, with a hypothetical example, a consequence of the explanation that the author describes as the most widely discussed.", "answer": 6, "explain": "The sentence beginning 'If that is right' turns the weakened-braking explanation into a concrete case: a star read as five billion years old might be eight. The sentence before it states the explanation itself but gives no example, and the later sentence about younger stars concerns where the original rule still works."}, {"id": "T2-V2M-13", "type": "mc", "skill": "Reading comprehension", "passage": "t2-ritual-efficacy", "difficulty": 3, "stem": "The passage suggests that the expressive interpretation appeals to anthropologists partly because it", "options": ["accounts for communities' abandonment of rites that seem to fail", "has been confirmed by observers who took part in the rites themselves", "allows them to avoid ascribing mistaken beliefs to the people they study", "applies equally well to rites of every kind", "agrees with the accounts that participants give of their own rites"], "answer": 2, "explain": "The interpretation 'spares observers the awkwardness of attributing false beliefs to the people they study'. Abandoning failed rites and participants' insistence that rites work are exactly the evidence the passage says the interpretation struggles with, so those options reverse the passage."}, {"id": "T2-V2M-14", "type": "multi", "skill": "Reading comprehension", "passage": "t2-ritual-efficacy", "difficulty": 4, "stem": "Based on the passage, which of the following would be difficult to reconcile with the expressive interpretation? Select all that apply.", "options": ["Participants in a rain rite tell an observer that the rite is a way of making rain fall.", "A community stops performing a healing rite after several of the patients it was used to treat die.", "A village goes on performing a harvest rite for decades after it has begun irrigating its fields."], "answer": [0, 1], "why": "The harvest rite looks like one more piece of ritual evidence, but continuing a rite that no longer serves a practical end actually fits the symbolic reading.", "explain": "The passage names two kinds of behavior 'hard to square with a purely symbolic purpose': insisting that rites work and abandoning a rite that seems to have failed, and the first two cases are instances of these. A rite kept up after irrigation removed any practical need suggests the rite is valued for what it expresses, which supports the interpretation."}, {"id": "T2-V2M-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t2-stylometry", "difficulty": 4, "stem": "The analysts' conclusion depends on which of the following assumptions?", "options": ["Gossip recorded at the time of a book's publication is never a reliable guide to its authorship.", "The playwright's comedies were more widely read in the eighteenth century than the essayist's letters.", "A writer's rates of use of common function words do not differ greatly between dramatic dialogue and other kinds of writing.", "The gossip that attributed the novel to the playwright was spread by the playwright's rivals.", "The essayist is known to have written at least one other work of fiction."], "answer": 2, "why": "The genre gap is hidden: the novel is matched against letters on one side and stage comedies on the other.", "explain": "The analysts compare the novel's prose with the essayist's letters but with the playwright's comedies. If writers used function words very differently in dialogue, the mismatch with the comedies would say nothing about whether the playwright wrote the novel. The argument rests on the analysis, not on discrediting gossip, so it need not assume that gossip is 'never' reliable."}]}, "V2H": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "T2-V2H-01", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "So thoroughly has the poet's reputation been rehabilitated that it is now hard to recall how ______ she once was: within a decade of her death her books were out of print, and anthologies that had once opened with her poems omitted them altogether.", "blanks": [["imitated", "obscure", "prolific", "influential", "celebrated"]], "answer": [1], "why": "The anthologies that 'once opened with her' tempt 'celebrated', but a rehabilitated poet is celebrated now, so that is not what is hard to recall.", "explain": "A reputation that has been 'rehabilitated' was once low, and the colon supplies the evidence: books out of print and poems dropped from anthologies. What is hard to recall is how obscure she was. 'Celebrated' and 'influential' describe her standing now, so recalling them would not be hard."}, {"id": "T2-V2H-02", "type": "tc", "skill": "Text completion", "difficulty": 5, "stem": "The physicist's 1931 paper was long cited as an early (i)______ of the effect, yet a careful rereading shows that he mentioned the anomaly only to dismiss it as instrumental error, so that crediting him with the discovery is less an act of historical justice than of (ii)______.", "blanks": [["identification", "popularization", "refutation"], ["presentism", "plagiarism", "scholarship"]], "answer": [0, 0], "why": "Dismissing the anomaly sounds like refuting the effect, but then the 'yet' would have nothing to contrast with.", "explain": "'Yet' shows that the rereading undercuts the citation, so the paper was cited as recognizing the effect: identification. 'Refutation' fits what he actually did and so leaves the 'yet' with nothing to contrast. Crediting him reads today's knowledge back into a paper that rejected the effect, which is presentism; 'scholarship' is no contrast with justice, and no one's work is being copied, so 'plagiarism' fails."}, {"id": "T2-V2H-03", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The ethnographer's account is ______ in the best sense: rather than forcing her observations into a single explanatory scheme, she lets apparently contradictory practices stand side by side, trusting readers to see that the contradictions
