<style>
[hidden]{display:none!important}
/* Layout: a computer-based test console. Home lists tests and history; inside a test, a sticky toolbar and one question per screen, passage or data beside the question on wide screens. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #18212b; --muted: #5a6573; --line: #d5dbe2;
  --accent: #1d5a86; --accent-ink: #ffffff; --accent-soft: #e3edf5;
  --flag: #a8660f; --flag-soft: #fbefdc; --good: #2b7a4b; --good-soft: #e2f2e8; --bad: #ad3434; --bad-soft: #f8e3e3;
  --c1: #1d5a86; --c2: #c07a1a; --c3: #5b8a3a;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c;
  --c1: #6ea9d8; --c2: #e0a24a; --c3: #8cc46a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c;
  --c1: #6ea9d8; --c2: #e0a24a; --c3: #8cc46a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-ui); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button { font: inherit; cursor: pointer }
button:disabled { cursor: not-allowed; opacity: .5 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar-in { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-title { font-weight: 600 }
.bar-sub { color: var(--muted); font-size: 13px }
.bar-tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.timer { font-family: var(--f-num); font-variant-numeric: tabular-nums; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 76px; text-align: center; background: var(--surface); color: var(--ink) }
.timer.low { color: var(--bad); border-color: var(--bad) }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 6px }
.btn:hover:not(:disabled) { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.flagged { background: var(--flag-soft); border-color: var(--flag); color: var(--flag) }
.btn.big { padding: 10px 20px; font-size: 16px }
.btn.danger { border-color: var(--bad); color: var(--bad) }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0 }
h1 { font-size: 28px; font-weight: 600 }
h2 { font-size: 21px; font-weight: 600 }
h3 { font-size: 16px; font-weight: 600 }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.stack { display: flex; flex-direction: column; gap: 16px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0 }
.prose { max-width: 70ch }
.prose ul, .prose ol { margin: 0; padding-left: 20px }
.muted { color: var(--muted) }
.small { font-size: 13px }
table.plain { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top }
table.plain th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600 }
.num { font-family: var(--f-num) }
.scroll-x { overflow-x: auto }
.tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px }
.tcard { display: flex; flex-direction: column; gap: 10px }
.tcard .meta { font-size: 13px; color: var(--muted) }
.q-grid { display: grid; grid-template-columns: 1fr; gap: 20px }
.q-grid.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
@media (max-width: 760px) { .q-grid.split { grid-template-columns: 1fr } }
.passage { font-family: var(--f-read); font-size: 16.5px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0 }
.passage p { margin: 0 0 12px }
.passage p:last-child { margin: 0 }
.passage .s { border-radius: 3px }
.passage.selectable .s { cursor: pointer }
.passage.selectable .s:hover { background: var(--accent-soft) }
.passage .s.on { background: var(--accent); color: var(--accent-ink) }
.stem { font-family: var(--f-read); font-size: 17px; line-height: 1.65; min-width: 0 }
.direction { font-size: 13px; color: var(--muted); font-style: italic }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--ink) }
.opt:hover { border-color: var(--accent) }
.opt .mk { flex: 0 0 auto; width: 22px; height: 22px; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-top: 1px }
.opt.round .mk { border-radius: 50% }
.opt.square .mk { border-radius: 3px }
.opt.on { border-color: var(--accent); background: var(--accent-soft) }
.opt.on .mk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.opt.key { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good) }
.opt .tx { min-width: 0 }
.blanks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px }
.blank-col { display: flex; flex-direction: column; gap: 6px }
.blank-col .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase }
.cell { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 10px; border-radius: 4px; text-align: center; font-family: var(--f-read); font-size: 16px }
.cell:hover { border-color: var(--accent) }
.cell.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.cell.key { box-shadow: 0 0 0 2px var(--good) }
.qc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.qc > div { border: 1px solid var(--line); border-radius: 6px; padding: 12px; text-align: center; background: var(--surface); min-width: 0 }
.qc .h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.qc .v { font-family: var(--f-read); font-size: 17px }
.given { text-align: center; font-family: var(--f-read); font-size: 16.5px }
.numin { font: 18px var(--f-num); padding: 8px 10px; width: 180px; max-width: 100%; border: 1.5px solid var(--muted); border-radius: 4px; background: var(--surface); color: var(--ink) }
.frac { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; align-self: flex-start }
.frac hr { width: 100%; border: 0; border-top: 2px solid var(--ink); margin: 0 }
.frac .numin { width: 120px; text-align: center }
.essay-tools { display: flex; gap: 6px; flex-wrap: wrap }
.essay-box { width: 100%; min-height: 380px; font: 16px/1.6 var(--f-read); padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); resize: vertical }
.data-table caption { caption-side: top; text-align: left; font-weight: 600; padding-bottom: 6px }
.chart svg { width: 100%; height: auto; display: block }
.chart text { fill: var(--ink); font-family: var(--f-ui); font-size: 12px }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .axis { stroke: var(--muted); stroke-width: 1 }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.rv button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 10px }
.rv button:hover { border-color: var(--accent) }
.rv .st { display: block; font-size: 12px; color: var(--muted) }
.rv .st.unans { color: var(--bad) }
.rv .flag { color: var(--flag); font-weight: 600 }
.calc { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 248px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 10px }
.calc .disp { font: 20px var(--f-num); text-align: right; padding: 8px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums; position: relative }
.calc .disp .m { position: absolute; left: 8px; top: 4px; font-size: 11px; color: var(--muted) }
.calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px }
.calc .keys button { padding: 8px 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; font-family: var(--f-num) }
.calc .keys button.wide { grid-column: span 4; font-family: var(--f-ui); font-size: 13px }
.calc .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600 }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 16px }
.modal .panel { max-width: 640px; width: 100%; max-height: 85vh; overflow: auto }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0 }
.score .big { font: 600 44px/1 var(--f-num); font-variant-numeric: tabular-nums; margin: 6px 0 }
.score .range { font-family: var(--f-num); font-size: 14px }
.scale { position: relative; height: 8px; background: var(--line); border-radius: 4px; margin: 14px 0 6px }
.scale .band { position: absolute; top: 0; height: 8px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 4px }
.scale .pt { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; transform: translateX(-2px) }
.scale-lbl { display: flex; justify-content: space-between; font: 11px var(--f-num); color: var(--muted) }
.unofficial { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px }
.unofficial div { border: 1px solid var(--line); border-radius: 8px; padding: 18px; background: var(--surface); text-align: center }
.unofficial b { display: block; font: 600 48px/1.1 var(--f-num) }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
.pill.good { color: var(--good); background: var(--good-soft) }
.pill.bad { color: var(--bad); background: var(--bad-soft) }
.pill.skip { color: var(--muted) }
.pill.warn { color: var(--flag); background: var(--flag-soft) }
.qrev { border-top: 1px solid var(--line); padding-block: 14px; display: flex; flex-direction: column; gap: 6px }
.qrev .ex, .feedback { background: var(--bg); border-radius: 6px; padding: 10px 12px; font-size: 14px }
.feedback.good { border-left: 3px solid var(--good) }
.feedback.bad { border-left: 3px solid var(--bad) }
details > summary { cursor: pointer; font-weight: 600; padding-block: 6px }
.copybox { width: 100%; min-height: 160px; font: 13px var(--f-num); padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink) }
.note { border-left: 3px solid var(--flag); background: var(--flag-soft); padding: 10px 14px; border-radius: 0 6px 6px 0 }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); padding: 12px 14px; border-radius: 6px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

]}, "version": "8249df475b"}, "tests": [{"id": "test-01", "title": "Practice Test 1", "blurb": "Rewritten at 160+ difficulty.", "order": ["V1", "V2", "Q1", "Q2"], "essay": {"minutes": 30, "variant": "recommendation", "prompt": "Governments should place greater emphasis on funding basic scientific research, which has no immediate practical purpose, than on research aimed at solving specific practical problems.", "instructions": "Write a response in which you discuss how far you agree or disagree with this recommendation and explain the reasoning behind your position. As you develop your position, consider specific situations in which following the recommendation would and would not be beneficial, and explain how these situations shape your view."}, "passages": {"t1-model-books": ["When an unusual motif, such as a dragon whose tail coils three times around a capital letter, turns up in manuscripts produced at monasteries a hundred miles apart, historians of medieval illumination have often concluded that a single itinerant artist decorated them all.", "The inference seemed especially secure when the motif was rare, since a rare design is unlikely to have been invented twice.", "The survival of several model books, collections of drawings that workshops lent to one another and copied, has weakened that reasoning: a rare design could have traveled on parchment rather than in the memory of one painter.", "Yet the model books do not dissolve the problem entirely.", "A copyist working from a drawing reproduces its outline but must supply for himself the color, the modeling of folds and the pressure of the brush, and it is in these features, which no drawing records, that individual habits show most plainly.", "Where manuscripts share both a motif and these unrecorded habits, a common hand therefore remains the most economical explanation; where they share the motif alone, the case for an itinerant artist rests on little more than a rarity that the model books have shown to ook case of rapid evolution, in which males whose songs carried best left the most offspring and passed their pitch on to their sons.", "The appeal of the interpretation was plain: cities are only a few centuries old, and here, apparently, was natural selection reshaping a trait within that span, quickly enough to be measured by researchers within their own careers."], ["Recordings that followed individual birds through the day, rather than sampling whole populations, soon complicated the story.", "Males of several species were found to raise their pitch within minutes when noise increased and to lower it again when the noise subsided, so that the same bird might sing like a forest bird at dawn and like a city bird at the morning rush hour.", "Such flexibility requires no genetic change at all, and a population of birds that differed from their forest relatives only because they lived in noisier places would show exactly the pattern that had been attributed to selection.", "Some critics went further, suggesting that the whole literature on urban song had mistaken a reflex for an adaptation."], ["That conclusion, however, outruns the evidence.", "The capacity to adjust pitch is not equally developed in every individual, and if the birds that adjust most readily are also the ones that raise the most young in noisy places, then selection may be acting on flexibility itself rather than on any fixed pitch.", "Distinguishing these possibilities requires raising birds from city and forest nests under identical conditions and observing how their songs respond to noise, an undertaking that is slow and costly and has so far been attempted for only a handful of the species concerned.", "Until more such studies exist, the most that can be said is that urban song shows how quickly animals can respond to cities, while leaving open how much of that response is written in their genes."]]}, "t1-still-life": ["Art historians of the mid-twentieth century read Dutch still-life paintings of the seventeenth century as moral sermons in paint: a half-peeled lemon signified the deceptive sweetness of worldly pleasure, a guttering candle the brevity of life.", "Later scholars objected that the evidence for such readings came almost entirely from emblem books, which paired images with moralizing mottoes, and that the inventories in which owners listed their paintings describe them by subject and price, never by message.", "The second part of the objection is weaker than it first appears, since an inventory is not the kind of document in which one would expect meanings to be recorded.", "Still, the objection exposes a real flaw in the older method, which assumed that if some objects in these pictures carried moral meanings, every object must."], "t1-debasement": ["Between 1542 and 1551 the silver content of the realm's coins was cut by more than half, and over the same period prices in the realm roughly doubled.", "Some historians attribute the inflation instead to the silver then flowing into Europe from the Americas.", "But that flow raised prices across the continent, and during these years prices in the realm rose far faster than in neighboring states.", "So the debasement, not American silver, was chiefly responsible for the realm's inflation."], "t1-industrious-households": {"paragraphs": [["Between the mid-seventeenth and the late eighteenth centuries, the daily wages of labourers in much of north-western Europe, measured in the bread and fuel they could buy, barely rose and in some decades fell, a stagnation that historians of living standards have documented in town after town.", "Yet the same households, judged by the goods recorded at their members' deaths, came to own more clothing, more furniture and more of the new colonial groceries, such as sugar and tea, than their grandparents had.", "One influential explanation reconciles the two observations by shifting attention from the wage to the household: families, it proposes, worked more days in the year and sent wives and children into paid employment, earning more in total even as the rate for each day stood still.", "On this view the desire for goods came first, and the extra labor was undertaken in order to satisfy it."], ["The evidence that people worked more is substantial.", "Court testimony, in which witnesses mentioned in passing what they had been doing at a given hour on a given day, suggests that the working year lengthened considerably as the observance of saints' days and of the informal Monday holiday declined.", "But the same evidence is equally compatible with a darker story, in which households labored longer not because they wanted sugar and calico but because stagnant wages left them no other way to buy bread and pay their rent.", "Testimony about how people spent their hours records what they did, not why they did it."], ["Proponents of the first explanation reply that a household driven by want alone would have spent its additional earnings on necessities, whereas the inventories show it buying goods, such as sugar, tea and printed cottons, that no one needed in order to survive.", "The reply has force, but it assumes that the line between necessity and luxury was drawn then where historians draw it now; for a servant seeking a place in a respectable household, a decent coat or the ability to serve tea properly may have been as indispensable as bread.", "What the evidence secures, then, is the fact of greater industry; its motive, on which the larger argument depends, remains a matter of interpretation."]]}, "t1-cave-fish": ["Fish that colonize lightless caves repeatedly lose their eyes, and for a long time the loss was attributed to the mere absence of selection: once vision was useless, mutations that damaged the eye were no longer weeded out, and they accumulated by chance.", "This account struggles with the speed and consistency of the loss, which has occurred within a few thousand generations in population after population.", "Chance accumulation of damaging mutations should be slow, and it should leave different populations at very different stages of degeneration.", "Measurements showing that the eye and the brain tissue devoted to vision consume a considerable share of a small fish's energy suggest an alternative: in caves, where food is scarce, individuals that invested less in eyes may have survived better.", "The two mechanisms are not exclusive, but rapid and parallel loss is what one would expect if the second had been at work."], "t1-pigment-sky": ["Conservators have found that the blue sky of a landscape long attributed to the sixteenth-century painter Corvetti contains a pigment that was not manufactured until two centuries after his death.", "Some scholars conclude that the painting is a later forgery.", "That conclusion is premature.", "Old paintings were often retouched by restorers, and the pigment appears only in the sky, an area especially prone to damage; elsewhere, the paint layers contain only materials available in Corvetti's lifetime.", "The pigment's presence therefore tells us about the painting's later history, not about who made it."], "e-forgiving-streets": {"paragraphs": [["For much of the twentieth century, traffic engineers designed streets on a principle sometimes called forgiving design: if a road gave drivers generous room for error, their mistakes would less often turn into crashes.", "Lanes were widened, curves were straightened, and trees and other roadside objects were cleared away, so that a driver who drifted or misjudged a bend would have space to recover.", "The principle seemed self-evident, and it was applied not only to highways but also to residential and shopping streets, where it helped produce the broad, open roads typical of many suburbs built after the Second World War."], ["Beginning in the 1990s, however, a number of urban designers argued that forgiving design rested on a mistaken picture of how people drive.", "Drivers, they pointed out, do not hold to a fixed speed and simply enjoy the benefit of extra space; instead, they adjust their speed to how risky a road appears.", "A wide, straight, unobstructed street looks safe, and so it invites faster driving, which can cancel out the margin for error that the design was meant to provide.", "Studies of city streets lent some support to this view: on several urban roads where lanes had been narrowed or trees planted along the curb, average speeds fell and the number of crashes did not rise, even though drivers now had less room to correct their mistakes.", "Because the harm done when a car strikes a pedestrian depends heavily on the car's speed, the critics concluded that on busy urban streets a design that feels slightly less comfortable to drive may in fact be the safer one."], ["This argument does not show that forgiving design was simply wrong.", "On rural highways, where traffic is meant to move quickly and pedestrians are rare, a driver who leaves the road at high speed still benefits greatly from a wide shoulder and a clear roadside.", "The lesson of the debate is rather that no feature of a street is safe or dangerous in itself: its effect depends on how drivers respond to it, and that response depends in turn on what the street is for."]]}, "e-generation-effect": ["People usually remember a word better if they have produced it themselves than if they have simply read it: someone who completes the pair 'hot–c_ld' is more likely to recall 'cold' later than someone who reads the pair already filled in.", "This advantage, known as the generation effect, was at first attributed to effort: producing a word takes more work than reading it, and the extra work was thought to strengthen the memory.", "Later experiments complicated this account by asking participants to generate made-up nonwords, for example by completing a string of letters according to a rule.", "Although producing the nonwords demanded at least as much effort as producing real words, it gave little or no memory advantage over simply reading them.", "Many researchers now conclude that effort aids memory in this way only when it draws on knowledge already stored there, such as a word's meaning or its links to other words."], "e-yoghurt-aroma": ["A food manufacturer cut the sugar in its strawberry yoghurt by 20 percent and, to compensate, added extra strawberry aroma.", "In blind tastings, panels of regular yoghurt eaters rated the new recipe exactly as sweet as the original.", "The company concluded that the added aroma had made up for the missing sugar, and it now plans to use the same approach to reduce the sugar in its other desserts."]}, "tables": {"t1-factory-output": {"title": "Units produced and units rejected at four factories of one manufacturer, 2025", "head": ["Factory", "Units produced (thousands)", "Units rejected (thousands)", "Employees"], "rows": [["Aldgate", "240", "7.2", "160"], ["Brindle", "180", "7.2", "100"], ["Carrow", "300", "6.0", "250"], ["Dunmore", "120", "6.0", "60"]]}, "t1-league-season": {"title": "Season results for six teams in a 21-team soccer league (each team played every other team once, 20 matches in all)", "head": ["Team", "Won", "Drawn", "Lost", "Goals scored", "Goals conceded"], "rows": [["Harriers", "12", "2", "6", "41", "25"], ["Kestrels", "11", "7", "2", "33", "15"], ["Ospreys", "10", "5", "5", "36", "28"], ["Falcons", "8", "6", "6", "27", "26"], ["Merlins", "6", "5", "9", "24", "30"], ["Buzzards", "4", "3", "13", "19", "44"]]}, "e-sports-shop": {"title": "Monthly sales at a sports shop, January to April", "head": ["Month", "Soccer balls sold", "Price per soccer ($)", "Pairs of sneakers sold", "Price per pair ($)"], "rows": [["January", "40", "15", "20", "60"], ["February", "60", "15", "25", "60"], ["March", "50", "18", "30", "45"], ["April", "70", "16", "24", "55"]]}}, "charts": {"t1-farm-crops": {"kind": "bar", "title": "Area planted with three crops on a farm, 2021–2025 (hectares)", "categories": ["2021", "2022", "2023", "2024", "2025"], "series": [{"name": "Wheat", "values": [120, 140, 150, 140, 170]}, {"name": "Barley", "values": [80, 70, 90, 120, 100]}, {"name": "Oats", "values": [30, 50, 50, 60, 60]}], "yLabel": "Area (hectares)", "yMax": 180, "yTicks": 18}}, "sections": {"V1": {"measure": "Verbal", "minutes": 18, "label": "Verbal Reasoning: Section 1", "questions": [{"id": "T1-V1-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Popular accounts portray the composer as a recluse, but his letters reveal a man so ______ that he rarely dined alone and grew restless whenever illness kept his visitors away.", "blanks": [["gregarious", "peripatetic", "taciturn", "misanthropic", "fastidious"]], "answer": [0], "explain": "'But' sets the letters against the recluse image, and a man who rarely dines alone and misses his visitors is gregarious (fond of company). 'Taciturn' and 'misanthropic' would confirm the recluse image rather than contradict it, and 'peripatetic' (traveling about) says nothing about company."}, {"id": "T1-V1-02", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The committee's unanimous public endorsement of the plan ______ the bitter divisions that, as minutes released years later revealed, had marked its private deliberations.", "blanks": [["mirrored", "betrayed", "publicized", "belied", "prompted"]], "answer": [3], "why": "'Betrayed' looks like a near-synonym of 'belied' but means revealed, the reverse of what a unanimous front does.", "explain": "A unanimous public front gave a false picture of a deeply divided committee, so the endorsement belied the divisions. 'Betrayed' would mean the endorsement exposed them, yet it took the minutes, years later, to do that. 'Prompted' fails on timing, since the divisions came first."}, {"id": "T1-V1-03", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The novelist's admirers praise the (i)______ of her work, pointing to the dozen genres she has tried, yet even they concede that such range has come at the cost of (ii)______: no single book of hers is as fully realized as the best work of writers who have confined themselves to one form.", "blanks": [["catholicity", "parochialism", "punctiliousness"], ["finish", "range", "accessibility"]], "answer": [0, 0], "why": "'Catholicity' is used in its secular sense of breadth, and 'finish' in its sense of polish, so both keys are unfamiliar uses of familiar words.", "explain": "A dozen genres and 'such range' call for catholicity (breadth of interest); 'parochialism' is its opposite. What the range costs is shown after the colon: no book is fully realized, so it lacks finish (refinement). 'Range' cannot be the cost of range, and nothing suggests the books are hard to read."}, {"id": "T1-V1-04", "type": "tc", "skill": "Text completion", "difficulty": 5, "stem": "Critics who expected the retrospective to (i)______ the painter's reputation were surprised: by hanging the early and late canvases side by side, the curators revealed not a decline but a (ii)______ development, in which ideas first sketched tentatively in the 1950s were (iii)______ rather than abandoned.", "blanks": [["deflate", "burnish", "revive"], ["erratic", "precipitous", "coherent"], ["forgotten", "elaborated", "repudiated"]], "answer": [0, 2, 1], "why": "The first blank can only be filled from the end of the sentence: the critics' surprise at 'not a decline' shows they expected the show to hurt the painter.", "explain": "The critics were surprised to find 'not a decline', so they had expected the show to expose one and deflate the reputation; expecting it to burnish or revive the reputation leaves nothing to be surprised by. Ideas taken up early and developed 'rather than abandoned' were elaborated, and a career that builds on its early ideas shows a coherent development, not an erratic or precipitous one."}, {"id": "T1-V1-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The spokesperson's ______ answers, which managed to sound responsive while committing the ministry to nothing, frustrated even sympathetic reporters.", "options": ["evasive", "belligerent", "candid", "forthright", "terse", "equivocal"], "answer": [0, 5], "explain": "Answers that sound responsive but commit to nothing are equivocal or evasive. 'Candid' and 'forthright' form the trap pair: they agree with each other but contradict 'committing the ministry to nothing'. 'Terse' answers would not sound responsive, and 'belligerent' has no partner."}, {"id": "T1-V1-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "Hardly a ______ observer of the court, the diarist owed her position to the queen's favor and repaid it with portraits so flattering that historians now read them with caution.", "options": ["disinterested", "partisan", "garrulous", "detached", "biased", "perceptive"], "answer": [0, 3], "why": "'Disinterested' means impartial, not bored, and the trap pair 'partisan'/'biased' describes what she was rather than what she was hardly.", "explain": "A diarist who owed her place to the queen and flattered her in return was hardly impartial, so disinterested or detached. 'Partisan' and 'biased' are a matching pair, but 'hardly' needs the opposite of what she was. 'Perceptive' misses the point: the caution comes from her loyalty, not from any lack of insight."}, {"id": "T1-V1-07", "type": "mc", "skill": "Reading comprehension", "passage": "t1-model-books", "difficulty": 3, "stem": "The passage is primarily concerned with", "options": ["arguing that model books were the chief means by which designs spread between monasteries", "assessing how much of a traditional method of linking manuscripts to one artist survives a discovery that weakened it", "explaining why medieval workshops lent their drawings to one another", "contrasting the working methods of copyists with those of original designers", "defending the traditional practice of attributing rare motifs to itinerant artists"], "answer": 1, "explain": "The passage describes the old inference from rare motifs, shows how model books weakened it, and then sets out what remains of it: shared handling still points to one hand. Defending the traditional practice is too strong, since the author says a shared motif alone proves little, and the passage never argues that model books were the chief route for designs."}, {"id": "T1-V1-08", "type": "multi", "skill": "Reading comprehension", "passage": "t1-model-books", "difficulty": 4, "stem": "According to the passage, which of the following would support the conclusion that two manuscripts were decorated by the same artist rather than copied from a shared model book? Select all that apply.", "options": ["The draperies in both manuscripts are shaded with the same unusual sequence of brushstrokes.", "The two manuscripts share a motif found in no other surviving manuscript.", "The figures in the two manuscripts have identical outlines."], "answer": [0], "why": "The rare motif is exactly the evidence the passage says has become ambiguous, and identical outlines are what copying produces.", "explain": "The passage says individual habits show in features no drawing records, such as the modeling of folds and the pressure of the brush, so matching brushwork in the draperies points to one hand. A copyist reproduces outlines, so identical outlines fit copying just as well. A motif's rarity is the very evidence that model books have made ambiguous."}, {"id": "T1-V1-09", "type": "mc", "skill": "Reading comprehension", "passage": "t1-model-books", "difficulty": 4, "stem": "The author would most likely agree that the rarity of a motif shared by two manuscripts", "options": ["is irrelevant to attribution once model books are taken into account", "is not by itself sufficient evidence that one artist decorated both", "is a more reliable guide to attribution than the modeling of folds", "was overvalued only by historians who never examined the coloring of manuscripts", "proves that the motif was copied from a model book"], "answer": 1, "why": "'Irrelevant' overstates the author's position: rarity is called ambiguous, not worthless.", "explain": "The last sentence says that where only the motif is shared, the case for one artist rests on a rarity that model books have made ambiguous, so rarity alone is not enough. Calling it irrelevant goes too far, and the passage never says rarity proves copying; it says rarity fits either explanation."}, {"id": "T1-V1-10", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t1-island-seabirds", "difficulty": 5, "stem": "Which of the following, if true, most seriously weakens the argument?", "options": ["Since the eradication, nests on Marrow have on average produced more chicks than nests on the nearby islands.", "The seabird does not breed until it is at least six years old, and many birds breeding for the first time choose an island other than the one where they hatched.", "Several other seabird species have also become more numerous on Marrow since the eradication.", "The bait used to eradicate the rats on Marrow is not toxic to seabirds.", "The nearby islands offer more suitable nesting ground than Marrow does."], "answer": 1, "why": "The rebuttal about nearby nest counts looks decisive, but chicks hatched since the eradication cannot yet be nesting, so the new nests must belong to incomers who were not nesting nearby.", "explain": "If birds first breed at six or older, no chick raised on Marrow in the last five years could yet have built a nest, so the tripling in nests cannot come from improved breeding there; it must come from first-time breeders arriving from elsewhere, whose arrival would not reduce nest counts on the nearby islands. More chicks per nest on Marrow is the tempting choice, but it supports the conclusion rather than weakening it."}, {"id": "T1-V1-11", "type": "mc", "skill": "Reading comprehension", "passage": "t1-railway-savings", "difficulty": 3, "stem": "According to the passage, the critics' objection to the study was chiefly that it", "options": ["relied on figures from a single year", "assumed that the existing waterways could not have been improved", "overestimated the cost of moving freight by waterway and road", "concluded that the railways had no effect on national income", "left out of account developments that the railways themselves helped to bring about"], "answer": 4, "explain": "The critics 'accepted much of the arithmetic but questioned the frame': holding all else constant ignored what the railways created, such as prairie towns and national firms. Because they accepted the arithmetic, a complaint about the cost estimates misdescribes them, and the study found the economy would have been 'somewhat poorer', not unaffected."}, {"id": "T1-V1-12", "type": "mc", "skill": "Reading comprehension", "passage": "t1-railway-savings", "difficulty": 4, "stem": "Which of the following, if true, would most strengthen the critics' objection as it is described in the passage?", "options": ["The historian's estimate of the freight carried in 1890 was later found to be slightly too low.", "Several European countries with dense railway networks grew more slowly than the United States did.", "In 1890, moving freight by wagon cost many times as much as moving it by rail.", "Many of the firms that served a national market in 1890 grew up in places no waterway reached, and only after a railway arrived.", "The national income of the United States grew more slowly in the decade after 1890 than in the decade before."], "answer": 3, "why": "The cost-of-wagons option bears on the arithmetic, which the critics accepted, not on the frame they attacked.", "explain": "The critics' point is that the calculation ignored what the railways brought into being; firms that arose only where and after a railway arrived are exactly such effects. The comparison of wagon and rail costs, and the revised freight figure, concern the arithmetic, which the critics largely accepted, so they would change the estimate without supporting the objection to its frame."}]}, "V2M": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "T1-V2M-01", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "The film's costumes are meticulously researched, which makes its dialogue, peppered with modern slang, all the more jarringly ______.", "blanks": [["archaic", "authentic", "laconic", "ornate", "anachronistic"]], "answer": [4], "explain": "Modern slang in a carefully researched period film belongs to the wrong time: it is anachronistic. 'Archaic' means old-fashioned, the reverse of modern slang, and 'authentic' contradicts 'jarringly'."}, {"id": "T1-V2M-02", "type": "tc", "skill": "Text completion", "difficulty": 3, "stem": "Having been burned by two failed expansions, the firm's board is now ______ of any proposal that requires borrowing, however promising its projected returns.", "blanks": [["heedless", "enamored", "ignorant", "chary", "tolerant"]], "answer": [3], "explain": "Two failures and 'however promising' show the board resists borrowing even when it looks attractive, so it is chary (wary) of such proposals. 'Enamored' and 'tolerant' point the wrong way, and 'heedless' would mean careless, the opposite of a burned board."}, {"id": "T1-V2M-03", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The reviewer's praise was so (i)______, hedged with qualifications in nearly every sentence, that the author could be forgiven for reading it as (ii)______ in disguise.", "blanks": [["grudging", "fulsome", "unstinting"], ["plagiarism", "disparagement", "adulation"]], "answer": [0, 1], "why": "'Fulsome' sounds like the right word for overdone praise, but praise hedged in every sentence is grudging.", "explain": "Praise hedged with qualifications throughout is grudging; 'fulsome' (excessive) and 'unstinting' both contradict the hedging. Praise that reluctant could pass for criticism, so disparagement in disguise; 'adulation' would be praise disguised as praise."}, {"id": "T1-V2M-04", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "Early studies of the policy were largely (i)______, each drawing sweeping conclusions from the experience of a single town; only when researchers (ii)______ data from dozens of regions did it become clear that the policy's effects, far from uniform, were (iii)______ local conditions.", "blanks": [["anecdotal", "belated", "exhaustive"], ["fabricated", "suppressed", "aggregated"], ["contingent on", "immune to", "irrelevant to"]], "answer": [0, 2, 0], "why": "'Exhaustive' tempts because the sentence is about data, but a study of one town cannot be exhaustive.", "explain": "Sweeping conclusions from a single town make the early studies anecdotal. The contrast 'only when' requires researchers to have combined, or aggregated, data from many regions. Effects that are 'far from uniform' vary with place, so they are contingent on local conditions; 'immune to' and 'irrelevant to' would make them uniform."}, {"id": "T1-V2M-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "Though the museum's founder was famously ______ in his personal habits, wearing the same coat for twenty years, he spent lavishly on acquisitions.", "options": ["extravagant", "gregarious", "profligate", "frugal", "economical", "reclusive"], "answer": [3, 4], "explain": "'Though' sets his personal habits against his lavish buying, and twenty years in one coat shows thrift: frugal or economical. 'Profligate' and 'extravagant' form the trap pair, but they remove the contrast that 'though' requires."}, {"id": "T1-V2M-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 3, "stem": "The newly discovered letters do not so much overturn the received account of the expedition as ______ it, adding detail without altering its main lines.", "options": ["summarize", "undermine", "augment", "refute", "supplant", "amplify"], "answer": [2, 5], "explain": "Adding detail without changing the main lines is to augment or amplify (expand on) the account. 'Refute' and 'undermine' are the trap pair: they repeat 'overturn' instead of contrasting with it. 'Supplant' also means replace, and 'summarize' would remove detail."}, {"id": "T1-V2M-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "The ______ tone of the inquiry's report, which reduced years of documented neglect to a few bloodless sentences, struck the victims' families as an insult.", "options": ["hyperbolic", "antiseptic", "lyrical", "clinical", "impassioned", "fervent"], "answer": [1, 3], "why": "'Antiseptic' is used in its secondary sense of coldly impersonal, which many readers do not know.", "explain": "A tone that turns years of neglect into a few bloodless sentences is coldly impersonal: clinical or antiseptic. 'Impassioned' and 'fervent' form the trap pair and contradict 'bloodless', and 'hyperbolic' contradicts 'reduced'."}, {"id": "T1-V2M-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "Colleagues found her ______ manner disarming: she would concede a point the moment the evidence went against her, without any of the face-saving maneuvers they had come to expect from senior scholars.", "options": ["disingenuous", "calculating", "obstinate", "guileless", "artless", "pedantic"], "answer": [3, 4], "why": "'Artless' sounds like an insult, but here it means free of guile, and the trap pair 'disingenuous'/'calculating' reverses the sense.", "explain": "Conceding at once, with no face-saving maneuvers, shows a manner free of calculation: artless or guileless. 'Disingenuous' and 'calculating' are a matching pair but describe the maneuvers she avoided, and 'obstinate' contradicts her readiness to concede."}, {"id": "T1-V2M-09", "type": "mc", "skill": "Reading comprehension", "passage": "t1-urban-song", "difficulty": 3, "stem": "The primary purpose of the passage is to", "options": ["describe a method for recording bird song in noisy surroundings", "weigh competing interpretations of a pattern and argue that the evidence does not yet decide between them", "argue that critics were right to treat urban song as a reflex rather than an adaptation", "explain why traffic noise is concentrated at low frequencies", "defend the claim that higher-pitched urban song is a product of natural selection"], "answer": 1, "explain": "The passage sets out the selection account, the flexibility objection and the critics' stronger claim, then concludes that how much of the response is genetic remains open. It does not defend the selection account, and it explicitly says the critics' conclusion 'outruns the evidence'."}, {"id": "T1-V2M-10", "type": "mc", "skill": "Reading comprehension", "passage": "t1-urban-song", "difficulty": 4, "stem": "The author's view of the critics who said that the literature on urban song had mistaken a reflex for an adaptation is that they", "options": ["were right about the pattern but wrong about the frequencies of traffic noise", "were correct that urban birds have undergone no genetic change", "relied on recordings made at the wrong times of day", "overlooked the finding that individual birds adjust their pitch", "drew from the evidence of flexible singing a conclusion it does not support"], "answer": 4, "why": "The author rejects the critics' conclusion but not their evidence, so 'correct that there has been no genetic change' tempts by overstating them.", "explain": "The author says the critics' conclusion 'outruns the evidence', because selection might act on flexibility itself. The critics built their case on flexible singing, so they did not overlook it, and the author leaves open how much of the response is genetic, so saying there has been no genetic change goes beyond the passage."}, {"id": "T1-V2M-11", "type": "multi", "skill": "Reading comprehension", "passage": "t1-urban-song", "difficulty": 4, "stem": "Which of the following findings would support the possibility, raised in the third paragraph, that selection has acted on the ability to adjust pitch? Select all that apply.", "options": ["In a noisy city, males that raise their pitch most readily rear more young than males that adjust little.", "Forest birds exposed to recorded traffic noise sing at a higher pitch within minutes.", "Birds hatched in city nests and forest nests and raised under identical conditions differ in how readily they raise their pitch in response to noise."], "answer": [0, 2], "why": "The forest-bird finding shows flexibility exists, which is the critics' evidence, not evidence that selection has acted on it.", "explain": "Selection on flexibility needs the most flexible birds to raise the most young, which the first finding shows, and an inherited difference in flexibility, which the common-rearing finding shows. Forest birds adjusting within minutes only shows that flexibility exists everywhere; it says nothing about whether it has been selected in cities."}, {"id": "T1-V2M-12", "type": "sentence", "skill": "Reading comprehension", "passage": "t1-urban-song", "difficulty": 3, "stem": "Select the sentence in which the author explains why a newly observed behavior undermines the original evidence for an evolutionary explanation.", "answer": 5, "explain": "The sentence beginning 'Such flexibility requires no genetic change at all' explains that flexible birds would produce the very pattern credited to selection. The sentence before it only reports the behavior, and the one after it reports the critics' further claim."}, {"id": "T1-V2M-13", "type": "mc", "skill": "Reading comprehension", "passage": "t1-still-life", "difficulty": 3, "stem": "The author's view of the later scholars' objection is best described by which of the following?", "options": ["Part of it rests on evidence that cannot bear the weight placed on it, but it still identifies a genuine weakness in the older approach.", "It decisively refutes the moral readings of Dutch still-life paintings.", "It applies only to paintings that include lemons and candles.", "It shows that owners of still-life paintings were indifferent to their meaning.", "It is mistaken, because emblem books are reliable guides to the meanings of paintings."], "answer": 0, "explain": "The author calls the inventory argument weaker than it seems, since inventories would not record meanings anyway, yet says the objection 'exposes a real flaw' in the older method. That mixed verdict rules out a decisive refutation, and the passage never vouches for emblem books."}, {"id": "T1-V2M-14", "type": "multi", "skill": "Reading comprehension", "passage": "t1-still-life", "difficulty": 4, "stem": "The passage suggests that the author would accept which of the following? Select all that apply.", "options": ["Some objects in Dutch still-life paintings may have carried moral meanings.", "The silence of owners' inventories about meaning is good evidence that the paintings had none.", "A reading that assigns a moral message to every object in a still life rests on an unwarranted assumption."], "answer": [0, 2], "why": "The answers depend on separating the author's partial defense of the old readings from the flaw the author concedes.", "explain": "The flaw the author names is the leap from 'some objects carried meanings' to 'every object must', which leaves the first claim standing and condemns readings of every object. The author explicitly discounts the inventories' silence, since such documents would not record meanings in any case."}, {"id": "T1-V2M-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t1-debasement", "difficulty": 4, "stem": "The argument depends on which of the following assumptions?", "options": ["The flow of American silver into Europe had ended by 1551.", "Debasing a coinage always raises prices in proportion to the reduction in its silver content.", "The realm did not receive substantially more American silver, relative to its size, than the neighboring states did.", "The debasement was the only measure taken by the realm's government that affected prices.", "Prices in the neighboring states did not rise at all between 1542 and 1551."], "answer": 2, "why": "The comparison with neighboring states only isolates the debasement if American silver reached the realm and its neighbors in similar measure.", "explain": "The argument treats the realm's faster inflation as the debasement's doing because American silver affected the whole continent. If the realm had received far more of that silver than its neighbors, the silver could explain the gap and the argument would collapse. The argument does not need neighboring prices to have stayed flat, only to have risen more slowly, and other minor measures would not undermine it."}]}, "V2H": {"measure": "Verbal", "minutes": 23, "label": "Verbal Reasoning: Section 2", "questions": [{"id": "T1-V2H-01", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "Critics who call the institute ______ overlook how readily it abandoned its founding doctrine once its own data turned against it.", "blanks": [["profligate", "hidebound", "mercurial", "venal", "credulous"]], "answer": [1], "why": "'Mercurial' matches the institute's readiness to change, but the critics' label must be the opposite of what they overlook.", "explain": "The critics overlook the institute's readiness to drop its doctrine, so their label must mean the opposite: hidebound (rigidly attached to tradition). 'Mercurial' describes the very flexibility the critics ignore, and 'venal' and 'profligate' have nothing to do with holding doctrine."}, {"id": "T1-V2H-02", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "The biography's portrait of its subject is relentlessly (i)______, but the author's refusal to grant him a single virtue ultimately (ii)______ her case: readers begin to suspect a grudge rather than a judgment.", "blanks": [["censorious", "even-handed", "hagiographic"], ["bolsters", "hampers", "epitomizes"]], "answer": [0, 1], "why": "'Bolsters' tempts because a relentless case sounds strong, but 'but', 'ultimately' and the readers' suspicion mark the case as self-defeating.", "explain": "Refusing the subject a single virtue makes the portrait censorious (severely critical); 'hagiographic' and 'even-handed' contradict that refusal. When readers suspect a grudge, the one-sidedness damages the argument, so it hampers her case rather than bolstering it."}, {"id": "T1-V2H-03", "type": "tc", "skill": "Text completion", "difficulty": 4, "stem": "That the treaty has endured for a century is less a tribute to the (i)______ of its drafters than to the (ii)______ of its language: phrased so loosely that each signatory could read its own interests into the text, it has survived precisely by never forcing a dispute to resolution.", "blanks": [["pedantry", "rashness", "acumen"], ["concision", "rigor", "elasticity"]], "answer": [2, 2], "why": "The 'less X than Y' frame means the first blank is a quality the treaty's survival is usually credited to, not the real cause.", "explain": "The colon explains the treaty's survival by language loose enough for every party to read its own interests into it: elasticity, not rigor or concision. 'Less a tribute to' sets up a merit that might otherwise get the credit, the drafters' acumen; nobody pays tribute to rashness, and pedantry would have produced precise wording."}, {"id": "T1-V2H-04", "type": "tc", "skill": "Text completion", "difficulty": 5, "stem": "The prevailing view holds that the shipyard's decline was (i)______, the inevitable result of forces no firm could have resisted; yet its own records suggest that its managers, far from being the (ii)______ victims of circumstance, (iii)______ their predicament by repeatedly rejecting reforms that rival yards adopted with success.", "blanks": [["foreordained", "gradual", "reversible"], ["helpless", "willing", "culpable"], ["aggravated", "foresaw", "alleviated"]], "answer": [0, 0, 0], "why": "Three linked blanks: 'far from' flips the second blank, and rejecting successful reforms worsened rather than eased the yard's plight.", "explain": "The appositive 'the inevitable result of forces no firm could have resisted' defines the first blank: foreordained; 'gradual' says nothing about inevitability. The prevailing view casts the managers as helpless victims, which 'far from' denies. Rejecting reforms that worked elsewhere made matters worse, so they aggravated their predicament; 'alleviated' reverses the logic."}, {"id": "T1-V2H-05", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "The scheme's promise of limitless cheap power proved ______: in thirty years of trials the reactor never once produced more energy than it consumed.", "options": ["fanciful", "prescient", "chimerical", "tendentious", "prophetic", "lucrative"], "answer": [0, 2], "why": "'Chimerical' is rare, and the trap pair 'prescient'/'prophetic' agree with each other while contradicting the reactor's failure.", "explain": "A reactor that never produced net energy in thirty years shows the promise was unrealistic: chimerical or fanciful. 'Prescient' and 'prophetic' are a matching pair, but they would mean the promise came true. 'Lucrative' and 'tendentious' have no partner and no support."}, {"id": "T1-V2H-06", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "Having once championed the method, the economist now ______ it entirely, conceding that her early results owed more to faulty data than to any genuine effect.", "options": ["revisits", "espouses", "qualifies", "abjures", "endorses", "forswears"], "answer": [3, 5], "why": "'Qualifies' tempts because she admits a flaw, but 'entirely' and results owed to faulty data call for total renunciation.", "explain": "'Having once championed' and the admission that her results were artefacts point to rejecting the method: she abjures or forswears it. 'Endorses' and 'espouses' form the trap pair that repeats her old stance, and 'qualifies' clashes with 'entirely'."}, {"id": "T1-V2H-07", "type": "se", "skill": "Sentence equivalence", "difficulty": 5, "stem": "Authors came to dread her reviews less for their severity than for their pettiness; so ______ was she that she would spend a paragraph on a misplaced comma and ignore the book's argument altogether.", "options": ["laudatory", "incisive", "captious", "magnanimous", "trenchant", "carping"], "answer": [2, 5], "why": "The pair 'trenchant'/'incisive' fits 'severity', but the sentence turns on pettiness, which only 'captious' and 'carping' convey.", "explain": "Fixing on a comma while ignoring the argument is fault-finding over trifles: captious or carping. 'Trenchant' and 'incisive' are the trap pair; they mean sharply penetrating, which a reviewer who ignores the argument is not. 'Magnanimous' and 'laudatory' contradict the dread."}, {"id": "T1-V2H-08", "type": "se", "skill": "Sentence equivalence", "difficulty": 4, "stem": "Pitched at a handful of specialists, the lecture's ______ allusions, to unpublished manuscripts and long-forgotten controversies, left most of the audience bewildered.", "options": ["arcane", "esoteric", "pellucid", "limpid", "ribald", "hackneyed"], "answer": [0, 1], "why": "The trap pair 'pellucid'/'limpid' is itself obscure vocabulary meaning clear, the reverse of what the sentence needs.", "explain": "Allusions to unpublished manuscripts, aimed at specialists and baffling to everyone else, are arcane or esoteric. 'Pellucid' and 'limpid' both mean clear, which would not bewilder anyone, and 'hackneyed' (overused) clashes with 'long-forgotten'."}, {"id": "T1-V2H-09", "type": "mc", "skill": "Reading comprehension", "passage": "t1-industrious-households", "difficulty": 4, "stem": "The passage is primarily concerned with", "options": ["assessing how far the evidence supports one explanation of an apparent paradox in early modern economic history", "explaining why the observance of saints' days declined", "arguing that households worked longer because their wages fell", "showing that court testimony is an unreliable historical source", "defending the view that the desire for consumer goods drove the growth of household labor"], "answer": 0, "why": "The passage gives the 'darker story' a fair hearing, which tempts readers to think the author endorses it.", "explain": "The passage poses the puzzle of flat wages and rising possessions, presents the extra-work explanation, and concludes that the evidence secures the extra work but not its motive. The author treats the darker story only as an equally compatible alternative, not a conclusion, and calls the testimony 'substantial' evidence of longer working, not unreliable."}, {"id": "T1-V2H-10", "type": "mc", "skill": "Reading comprehension", "passage": "t1-industrious-households", "difficulty": 5, "stem": "The author's response to the proponents' reply in the third paragraph implies that the purchase of coats and tea by laboring households", "options": ["was recorded inaccurately by the inventories on which historians rely", "would support the proponents' explanation only if such goods were not, for those households, practical requirements", "proves that the darker story described in the second paragraph is correct", "shows that those households were not in fact short of money for bread", "confirms that the desire for goods preceded the increase in work"], "answer": 1, "why": "The key restates the author's doubt as a condition; the trap 'proves the darker story' turns a doubt into a verdict.", "explain": "The proponents treat such purchases as proof that households were not working from want; the author replies that a coat or tea may have been a necessity for someone seeking a place in service. The purchases therefore count for the proponents only if they were not practical requirements. The author's last sentence leaves the motive open, so the purchases prove neither story."}, {"id": "T1-V2H-11", "type": "multi", "skill": "Reading comprehension", "passage": "t1-industrious-households", "difficulty": 4, "stem": "Which of the following can be inferred from the passage? Select all that apply.", "options": ["The court testimony shows that workers gave up holidays in order to buy goods.", "The author regards the fact that households worked more as better established than the reason they did so.", "The explanation described in the first paragraph does not require that daily wage rates rose."], "answer": [1, 2], "why": "The testimony option borrows the passage's words about lost holidays but adds a motive the author says testimony cannot reveal.", "explain": "The first explanation has families 'earning more in total even as the rate for each day stood still', so it needs no rise in wage rates, and the final sentence says the evidence secures greater industry while its motive remains a matter of interpretation. The testimony shows only that holidays declined; the author stresses that it records 'what they did, not why'."}, {"id": "T1-V2H-12", "type": "sentence", "skill": "Reading comprehension", "passage": "t1-industrious-households", "difficulty": 4, "stem": "Select the sentence that gives the reason a particular kind of source cannot, by itself, decide between the two explanations of why households worked more.", "answer": 7, "why": "Two neighboring sentences also concern the limits of the evidence, but one only asserts that it fits both stories and the other speaks of all the evidence rather than one source.", "explain": "The sentence 'Testimony about how people spent their hours records what they did, not why they did it' gives the reason court testimony cannot settle the question of motive. The sentence before it says only that the evidence fits a darker story, without saying why, and the final sentence sums up all the evidence rather than one kind of source."}, {"id": "T1-V2H-13", "type": "mc", "skill": "Reading comprehension", "passage": "t1-cave-fish", "difficulty": 4, "stem": "The author mentions the energy consumed by visual tissue primarily in order to", "options": ["explain why damaging mutations accumulate slowly", "demonstrate that the absence of selection played no part in eye loss", "refute the claim that vision is useless in caves", "explain why chance mutations would leave different populations at different stages of degeneration", "support an explanation in which smaller eyes gave cave fish an advantage"], "answer": 4, "why": "'Played no part' is too strong: the author says the two mechanisms are not exclusive.", "explain": "The energy cost is what makes the alternative work: where food is scarce, fish that spend less on eyes may survive better, so smaller eyes are favored. The author explicitly says the two mechanisms are not exclusive, so the energy finding cannot show that relaxed selection played no part. The uneven stages of degeneration are the author's objection to the chance account, made before the energy finding is introduced."}, {"id": "T1-V2H-14", "type": "multi", "skill": "Reading comprehension", "passage": "t1-cave-fish", "difficulty": 5, "stem": "Which of the following findings, if made, would count against the alternative explanation that the author bases on measurements of energy use? Select all that apply.", "options": ["In a cave with plentiful food, fish lost their eyes as quickly and as consistently as fish in caves where food is scarce.", "In a cave where food is scarce, fish with smaller eyes survived no better than fish with larger eyes.", "In cave fish, the tissue devoted to vision uses less energy than the tissue devoted to smell."], "answer": [0, 1], "why": "The plentiful-food cave counts against the explanation only by inference: the energy argument predicts weaker selection where food is not scarce.", "explain": "The proposed explanation rests on food being scarce and on smaller-eyed fish surviving better, so equally fast loss where food is plentiful, and no survival advantage for smaller eyes where it is scarce, both cut against it. A comparison with the tissue used for smell is irrelevant: vision can be costly even if smell costs more."}, {"id": "T1-V2H-15", "type": "mc", "skill": "Reading comprehension (argument)", "passage": "t1-pigment-sky", "difficulty": 5, "stem": "In the argument, the statement that the pigment appears only in the sky plays which of the following roles?", "options": ["It is evidence offered in support of an alternative explanation of a finding that some take to show the painting is not authentic.", "It is the main conclusion of the argument.", "It is a consideration that the argument concedes weakens its own conclusion.", "It is a finding that the scholars mentioned use to support their conclusion.", "It is offered as evidence that Corvetti painted the landscape."], "answer": 0, "why": "The argument never claims that Corvetti painted the work, only that the pigment cannot show who did, so 'evidence that Corvetti painted it' overshoots.", "explain": "The scholars infer forgery from the late pigment; the author counters that restorers' retouching explains it, and the pigment's confinement to the damage-prone sky supports that account. The conclusion is only that the pigment says nothing about authorship, so the statement is not offered as proof that Corvetti was the painter, and the scholars rely on the pigment's presence, not on where it appears."}]}, "Q1": {"measure": "Quant", "minutes": 21, "label": "Quantitative Reasoning: Section 1", "questions": [{"id": "T1-Q1-01", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "k is a positive integer, and k² is divisible by 72.", "qa": "The greatest integer that must be a divisor of k", "qb": "12", "answer": 2, "explain": "72 = 2³ × 3², and every prime in a perfect square appears to an even power, so k² must contain at least 2⁴ × 3². Hence k is divisible by 2² × 3 = 12, and k = 12 itself works (144 = 2 × 72), so no larger number must divide k. The tempting answer 6 fails because 6² = 36 is not a multiple of 72.", "why": "The odd exponent in 2³ must be rounded up, so k needs 2², not 2, and the answer is 12, not 6."}, {"id": "T1-Q1-02", "type": "qc", "skill": "Algebra", "difficulty": 4, "given": "x³ < x", "qa": "x", "qb": "x²", "answer": 3, "explain": "x³ − x = x(x − 1)(x + 1) < 0 when 0 < x < 1 or x < −1. For x = 0.5, A (0.5) is greater than B (0.25), but for x = −2, B (4) is greater than A (−2). Assuming that only fractions between 0 and 1 satisfy x³ < x leads to the wrong answer A.", "why": "Most students test only fractions between 0 and 1 and miss that every x < −1 also satisfies x³ < x."}, {"id": "T1-Q1-03", "type": "qc", "skill": "Geometry", "difficulty": 3, "given": "In triangle PQR, PQ = 6, QR = 8, and angle PQR is greater than 90°.", "qa": "PR", "qb": "10", "answer": 0, "explain": "If angle PQR were exactly 90°, PR would be the hypotenuse of a 6–8–10 right triangle. Opening the angle beyond 90° pushes P and R further apart, so PR² > 6² + 8² = 100 and PR > 10. The triangle inequality alone (2 < PR < 14) would not decide the comparison, which is why choosing 'cannot be determined' is tempting."}, {"id": "T1-Q1-04", "type": "qc", "skill": "Probability", "difficulty": 4, "given": "A packet holds 8 bulbs that look identical: 5 tulip bulbs and 3 daffodil bulbs. A gardener picks 2 of the bulbs at random, without replacement.", "qa": "The probability that the 2 bulbs are of the same kind", "qb": "1/2", "answer": 1, "explain": "There are C(8, 2) = 28 equally likely pairs. Pairs of the same kind number C(5, 2) + C(3, 2) = 10 + 3 = 13, so the probability is 13/28, just under 1/2. With replacement it would be (25 + 9)/64 = 34/64, just over 1/2, which is the trap.", "why": "With replacement the probability is just above 1/2; without replacement it falls just below."}, {"id": "T1-Q1-05", "type": "mc", "skill": "Mixtures", "difficulty": 3, "stem": "A farmer has 40 liters of liquid fertilizer that is 15% nitrogen by volume. How many liters of a fertilizer that is 40% nitrogen by volume must be mixed in to produce a mixture that is 30% nitrogen by volume?", "options": ["20", "30", "45", "60", "75"], "answer": 3, "explain": "The first fertilizer contains 0.15 × 40 = 6 liters of nitrogen. With x liters added, 6 + 0.4x = 0.3(40 + x), so 0.1x = 6 and x = 60; check: 30 liters of nitrogen in 100 liters is 30%. Because 30% is twice as far from 15% as from 40%, the mixture needs twice as much of the stronger fertilizer, not a smaller amount such as 20 or 30 liters."}, {"id": "T1-Q1-06", "type": "numeric", "skill": "Number properties", "difficulty": 4, "stem": "How many of the positive divisors of 7,200 are perfect squares?", "answer": 12, "explain": "7,200 = 2⁵ × 3² × 5². A divisor is a perfect square exactly when each exponent is even: 0, 2 or 4 for the 2; 0 or 2 for the 3; 0 or 2 for the 5. That gives 3 × 2 × 2 = 12, including 1 itself. Counting all 6 × 3 × 3 = 54 divisors, or leaving out the exponent 0, are the usual slips.", "why": "The exponent 0 counts as even, so 1 and squares such as 9 and 25 must be included."}, {"id": "T1-Q1-07", "type": "multi", "skill": "Algebra", "difficulty": 4, "stem": "If x is an integer and |x − 4| < 3, which of the following could be the value of x² − 6x? Indicate all such values.", "options": ["−9", "−8", "−6", "−5", "0", "7"], "answer": [0, 1, 3, 4], "explain": "|x − 4| < 3 means 1 < x < 7, so x is 2, 3, 4, 5 or 6. Then x² − 6x is −8, −9, −8, −5 and 0, so −6 and 7 are impossible. Including x = 7, which would give 7, ignores that the inequality is strict.", "why": "The inequality is strict, so x = 7 (which gives 7) is excluded, and x = 2 and x = 4 give the same value."}, {"id": "T1-Q1-08", "type": "mc", "skill": "Coordinate geometry", "difficulty": 5, "stem": "In the xy-plane, O is the point (0, 0) and B is the point (6, 0). Point P has a positive y-coordinate, triangle OBP is isosceles, and the area of triangle OBP is 12. How many different points could P be?", "options": ["2", "3", "4", "5", "6"], "answer": 3, "explain": "The area fixes the height: ½ × 6 × y = 12, so P lies on the line y = 4. If PO = PB, P is (3, 4). If OP = OB = 6, then x² + 16 = 36 and x = ±√20, giving two points; if BP = BO = 6, then x = 6 ± √20, two more. None of these coincide or make an equilateral triangle, so there are 5; answering 3 counts only one of the two ways OB can be an equal side.", "why": "OB can be one of the two equal sides as well as the base, which adds four points off the perpendicular bisector."}, {"id": "T1-Q1-09", "type": "fraction", "skill": "Probability", "difficulty": 4, "stem": "In a sports league of 6 teams, each team plays every other team exactly once. If 2 of the league's games are chosen at random, what is the probability that no team plays in both of them? Give your answer as a fraction.", "answer": [3, 7], "explain": "There are C(6, 2) = 15 games. A given game shares a team with 4 + 4 = 8 of the other 14 games, so 6 of the 14 share no team with it. The probability is 6/14 = 3/7. Counting only 4 overlapping games gives 10/14 = 5/7.", "why": "Each of the game's two teams plays 4 other games, so 8 of the other 14 overlap it; counting only 4 overlaps gives 5/7."}, {"id": "T1-Q1-10", "type": "mc", "skill": "Data interpretation", "table": "t1-factory-output", "difficulty": 3, "stem": "For the four factories combined, the units rejected were what percent of the units produced, to the nearest tenth of a percent?", "options": ["2.9%", "3.1%", "3.3%", "3.5%", "3.7%"], "answer": 1, "explain": "Combined, 7.2 + 7.2 + 6.0 + 6.0 = 26.4 thousand units were rejected out of 240 + 180 + 300 + 120 = 840 thousand produced: 26.4/840 ≈ 3.14%, or 3.1%. Averaging the four factories' rates (3%, 4%, 2% and 5%) gives 3.5%, which ignores that the factories produced different amounts."}, {"id": "T1-Q1-11", "type": "mc", "skill": "Data interpretation", "table": "t1-factory-output", "difficulty": 4, "stem": "Suppose Dunmore's number of rejected units stays the same. By what percent would Dunmore's production have to increase for its rejection rate (units rejected as a percent of units produced) to equal Aldgate's rate in 2025?", "options": ["40%", "60%", "66⅔%", "80%", "100%"], "answer": 2, "explain": "Aldgate's rate is 7.2/240 = 3%. Dunmore rejects 6.0 thousand units, and 6.0 is 3% of 200 thousand, so production must rise from 120 to 200 thousand, an increase of 80/120 = 66⅔%. The tempting 40% is how much the rate itself must fall (from 5% to 3%), not how much production must grow.", "why": "Cutting the rate by 40% needs production multiplied by 5/3, not increased by 40%."}, {"id": "T1-Q1-12", "type": "multi", "skill": "Data interpretation", "table": "t1-factory-output", "difficulty": 4, "stem": "Which of the following statements are true? Indicate all such statements.", "options": ["The factory with the most employees had the lowest number of units produced per employee.", "Aldgate and Brindle together accounted for more than half of all the units rejected at the four factories.", "Aldgate produced more units per employee than the four factories combined.", "Carrow's share of all the units produced at the four factories was more than twice its share of all the units rejected.", "The median of the four factories' rejection rates was equal to the rejection rate of the four factories combined."], "answer": [0, 1, 2], "explain": "Units produced per employee are 1.5, 1.8, 1.2 and 2.0 thousand, so Carrow, the largest employer, is lowest. Aldgate and Brindle rejected 14.4 of the 26.4 thousand units, about 55%. Combined output per employee is 840/570 ≈ 1.47 thousand, just below Aldgate's 1.5. Carrow's shares are 300/840 ≈ 36% of output and 6.0/26.4 ≈ 23% of rejects, a ratio of about 1.6, not 2; and the median rejection rate is 3.5%, not the combined 3.1%.", "why": "Two statements are close calls (1.47 against 1.5, and a share ratio of about 1.6), and the median rate is easily confused with the combined rate."}]}, "Q2M": {"measure": "Quant", "minutes": 26, "label": "Quantitative Reasoning: Section 2", "questions": [{"id": "T1-Q2M-01", "type": "qc", "skill": "Number properties", "difficulty": 4, "given": "When the positive integer n is divided by 6, the remainder is 4.", "qa": "The remainder when n is divided by 4", "qb": "The remainder when n is divided by 3", "answer": 3, "explain": "n is 4, 10, 16, 22, …, so dividing by 3 always leaves 1. Dividing by 4 leaves 0 when n = 4 or 16 but 2 when n = 10 or 22, so A can be smaller or larger than B. Testing only n = 4 suggests B is always greater.", "why": "n = 4 and n = 10 give different remainders on division by 4, so testing a single value misleads."}, {"id": "T1-Q2M-02", "type": "qc", "skill": "Ratios", "difficulty": 3, "given": "At the start of a league match, the home and away supporters in a stadium were in the ratio 7 : 3. Then 400 more away supporters arrived and no one left, after which the ratio was 7 : 4.", "qa": "The number of home supporters in the stadium", "qb": "2,500", "answer": 0, "explain": "Write the groups as 7k and 3k. The home number does not change, so 7k : (3k + 400) = 7 : 4 gives 28k = 21k + 2,800, so k = 400 and there are 2,800 home supporters. Check: 2,800 : 1,600 = 7 : 4. The answer is close to 2,500, so a rough estimate from the ratios is not enough to decide."}, {"id": "T1-Q2M-03", "type": "qc", "skill": "Algebra", "difficulty": 3, "given": "a and b are positive, and a/b = 3/5.", "qa": "(a + 3)/(b + 5)", "qb": "3/5", "answer": 2, "explain": "Write a = 3t and b = 5t with t > 0. Then (a + 3)/(b + 5) = (3t + 3)/(5t + 5) = 3(t + 1)/(5(t + 1)) = 3/5. Adding to the top and bottom changes a fraction only when the added amounts are not in the fraction's own ratio; here 3 : 5 matches, so the quantities are always equal."}, {"id": "T1-Q2M-04", "type": "qc", "skill": "Geometry", "difficulty": 4, "given": "A square is inscribed in a circle of radius r, and a second square is drawn so that each of its four sides is tangent to the same circle.", "qa": "The area inside the circle but outside the smaller square", "qb": "The area inside the larger square but outside the circle", "answer": 0, "explain": "The smaller square's diagonal is the diameter 2r, so its area is (2r)²/2 = 2r²; the larger square has side 2r and area 4r². A is πr² − 2r² ≈ 1.14r² and B is 4r² − πr² ≈ 0.86r². Assuming the circle lies halfway between the two squares in area is the trap: π is closer to 4 than to 2.", "why": "The circle's area is not midway between the squares' areas (2r² and 4r²), since π − 2 > 4 − π."}, {"id": "T1-Q2M-05", "type": "qc", "skill": "Counting", "difficulty": 3, "given": "A sports league has 8 teams.", "qa": "The number of games played if each team plays each other team exactly twice", "qb": "The number of different groups of 3 teams that could be chosen for a play-off", "answer": 2, "explain": "There are C(8, 2) = 28 pairs of teams, each playing twice, so A is 56. B is C(8, 3) = (8 × 7 × 6)/(3 × 2 × 1) = 56. Forgetting the factor of 2 in A (28) or not dividing by 3! in B (336) breaks the tie."}, {"id": "T1-Q2M-06", "type": "mc", "skill": "Rates and work", "difficulty": 4, "stem": "In a factory, machines P and Q, working together at their constant rates, can complete an order in 12 hours. On one occasion, P worked alone for 6 hours and then Q, working alone, finished the order in a further 21 hours. How many hours would P take to complete the whole order working alone?", "options": ["12", "15", "16", "18", "20"], "answer": 4, "explain": "Let the rates be p and q, with p + q = 1/12 and 6p + 21q = 1. Six hours of both together does half the order, so 6p + 6q = 1/2 and therefore 15q = 1/2, giving q = 1/30. Then p = 1/12 − 1/30 = 1/20, so P alone takes 20 hours; 12 is the joint time, not P's.", "why": "The key step is to pair 6 of Q's 21 hours with P's
