<title>GRE Practice Test 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a computer-based test console — fixed toolbar on top, one question per screen, passage beside question on wide screens. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #18212b; --muted: #5a6573; --line: #d5dbe2;
  --accent: #1d5a86; --accent-ink: #ffffff; --accent-soft: #e3edf5;
  --flag: #a8660f; --flag-soft: #fbefdc; --good: #2b7a4b; --good-soft: #e2f2e8; --bad: #ad3434; --bad-soft: #f8e3e3;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e5eaf0; --muted: #9aa6b4; --line: #2c3743;
  --accent: #6ea9d8; --accent-ink: #0d1620; --accent-soft: #1d2d3c;
  --flag: #e0a24a; --flag-soft: #3a2c17; --good: #6cc191; --good-soft: #17301f; --bad: #e57d7d; --bad-soft: #3a1c1c; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-ui); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button { font: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar-in { max-width: 1080px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-title { font-weight: 600; min-width: 0 }
.bar-sub { color: var(--muted); font-size: 13px }
.bar-tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.timer { font-family: var(--f-num); font-variant-numeric: tabular-nums; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 76px; text-align: center }
.timer.low { color: var(--bad); border-color: var(--bad) }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 6px }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.flagged { background: var(--flag-soft); border-color: var(--flag); color: var(--flag) }
.btn.big { padding: 10px 20px; font-size: 16px }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0 }
h1 { font-size: 28px; font-weight: 600 }
h2 { font-size: 21px; font-weight: 600 }
h3 { font-size: 16px; font-weight: 600 }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.stack { display: flex; flex-direction: column; gap: 16px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px }
.prose { max-width: 68ch }
.muted { color: var(--muted) }
.small { font-size: 13px }
table.plain { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top }
table.plain th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600 }
.scroll-x { overflow-x: auto }
/* question screen */
.q-grid { display: grid; grid-template-columns: 1fr; gap: 20px }
.q-grid.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
@media (max-width: 760px) { .q-grid.split { grid-template-columns: 1fr } }
.passage { font-family: var(--f-read); font-size: 16.5px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0 }
.passage .s { border-radius: 3px }
.passage.selectable .s { cursor: pointer }
.passage.selectable .s:hover { background: var(--accent-soft) }
.passage .s.on { background: var(--accent); color: var(--accent-ink) }
.stem { font-family: var(--f-read); font-size: 17px; line-height: 1.65; min-width: 0 }
.direction { font-size: 13px; color: var(--muted); font-style: italic }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--ink) }
.opt:hover { border-color: var(--accent) }
.opt .mk { flex: 0 0 auto; width: 22px; height: 22px; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-top: 1px }
.opt.round .mk { border-radius: 50% }
.opt.square .mk { border-radius: 3px }
.opt.on { border-color: var(--accent); background: var(--accent-soft) }
.opt.on .mk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.opt .tx { min-width: 0 }
.blanks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px }
.blank-col { display: flex; flex-direction: column; gap: 6px }
.blank-col .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase }
.cell { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 10px; border-radius: 4px; text-align: center; font-family: var(--f-read); font-size: 16px }
.cell:hover { border-color: var(--accent) }
.cell.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.qc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.qc > div { border: 1px solid var(--line); border-radius: 6px; padding: 12px; text-align: center; background: var(--surface); min-width: 0 }
.qc .h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.qc .v { font-family: var(--f-read); font-size: 17px }
.given { text-align: center; font-family: var(--f-read); font-size: 16.5px }
.numin { font: 18px var(--f-num); padding: 8px 10px; width: 180px; max-width: 100%; border: 1.5px solid var(--muted); border-radius: 4px; background: var(--surface); color: var(--ink) }
.frac { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; align-self: flex-start }
.frac hr { width: 100%; border: 0; border-top: 2px solid var(--ink); margin: 0 }
.frac .numin { width: 120px; text-align: center }
.essay-box { width: 100%; min-height: 380px; font: 16px/1.6 var(--f-read); padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); resize: vertical }
.data-table caption { caption-side: top; text-align: left; font-weight: 600; padding-bottom: 6px }
/* review grid */
.rv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.rv button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 10px }
.rv button:hover { border-color: var(--accent) }
.rv .st { display: block; font-size: 12px; color: var(--muted) }
.rv .st.unans { color: var(--bad) }
.rv .flag { color: var(--flag); font-weight: 600 }
/* calculator */
.calc { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 248px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 10px }
.calc .disp { font: 20px var(--f-num); text-align: right; padding: 8px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums }
.calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px }
.calc .keys button { padding: 8px 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; font-family: var(--f-num) }
.calc .keys button.wide { grid-column: span 4; font-family: var(--f-ui); font-size: 13px }
.calc .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600 }
/* results */
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px }
.score .big { font: 600 44px/1 var(--f-num); font-variant-numeric: tabular-nums; margin: 6px 0 }
.score .range { font-family: var(--f-num); font-size: 14px }
.scale { position: relative; height: 8px; background: var(--line); border-radius: 4px; margin: 14px 0 6px }
.scale .band { position: absolute; top: 0; height: 8px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 4px }
.scale .pt { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; transform: translateX(-2px) }
.scale-lbl { display: flex; justify-content: space-between; font: 11px var(--f-num); color: var(--muted) }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor }
.pill.good { color: var(--good); background: var(--good-soft) }
.pill.bad { color: var(--bad); background: var(--bad-soft) }
.pill.skip { color: var(--muted) }
.qrev { border-top: 1px solid var(--line); padding-block: 14px; display: flex; flex-direction: column; gap: 6px }
.qrev .ex { background: var(--bg); border-radius: 6px; padding: 10px 12px; font-size: 14px }
details > summary { cursor: pointer; font-weight: 600; padding-block: 6px }
.copybox { width: 100%; min-height: 160px; font: 13px var(--f-num); padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink) }
.note { border-left: 3px solid var(--flag); background: var(--flag-soft); padding: 10px 14px; border-radius: 0 6px 6px 0 }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); padding: 12px 14px; border-radius: 6px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<div id="bar" class="bar" hidden></div>
<main id="app" class="wrap"></main>
<div id="calc" class="calc" hidden></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var KEY = "gre-pt1-state-v1";

  // ETS percentile ranks (percent scoring lower), Guide to the Use of Scores 2026, test takers 1 July 2022 – 30 June 2025.
  var PCT_V = {170:99,169:99,168:98,167:97,166:96,165:95,164:93,163:90,162:88,161:85,160:82,159:79,158:76,157:72,156:68,155:64,154:59,153:54,152:48,151:43,150:39,149:34,148:30,147:27,146:24,145:21,144:18,143:16,142:14,141:11,140:10,139:8,138:6,137:5,136:4,135:3,134:2,133:2,132:1,131:1,130:0};
  var PCT_Q = {170:89,169:85,168:80,167:75,166:72,165:67,164:63,163:60,162:57,161:53,160:50,159:47,158:45,157:42,156:39,155:37,154:34,153:31,152:29,151:26,150:23,149:21,148:19,147:16,146:14,145:12,144:10,143:9,142:7,141:6,140:5,139:4,138:3,137:2,136:2,135:1,134:1,133:1,132:0,131:0,130:0};
  var PCT_AW = {"6.0":99,"5.5":98,"5.0":93,"4.5":85,"4.0":63,"3.5":40,"3.0":16,"2.5":7,"2.0":3,"1.5":1,"1.0":1,"0.5":0,"0.0":0};
  // ETS conditional standard error of measurement at selected scores (Table 4C).
  var CSEM = { Verbal: [[130,4.3],[135,3.9],[140,3.3],[145,2.9],[150,2.7],[155,2.5],[160,2.5],[165,2.6],[170,1.7]],
               Quant:  [[130,4.2],[135,3.6],[140,3.0],[145,2.8],[150,2.7],[155,2.6],[160,2.7],[165,2.5],[170,1.2]] };

  var ORDER = ["AW", "V1", "V2", "Q1", "Q2"];
  var QC_OPTS = ["Quantity A is greater.", "Quantity B is greater.", "The two quantities are equal.", "The relationship cannot be determined from the information given."];
  var LET = "ABCDEFGHI";

  var S = null; // state
  var tick = null;
  var ui = { review: false, confirmExit: false, confirmRestart: false, calc: { show: false, expr: "", mem: 0 } };

  function fresh() { return { phase: "intro", step: 0, route: {}, answers: {}, marked: {}, essay: "", timeLeft: {}, current: 0, essayUsed: 0 }; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function load() { try { var t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function blankify(s) { return esc(s).replace(/\(i{1,3}\)______|______/g, function (m) { return '<span style="display:inline-block;min-width:4.5em;border-bottom:2px solid currentColor;text-align:center">' + (m.length > 6 ? m.slice(0, m.indexOf(")") + 1) : "") + "</span>"; }); }
  function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }

  function secKey(step) {
    var k = ORDER[step];
    if (k === "V2") return S.route.Verbal === "harder" ? "V2H" : "V2E";
    if (k === "Q2") return S.route.Quant === "harder" ? "Q2H" : "Q2E";
    return k;
  }
  function section(k) { return D.sections[k]; }
  function minutesOf(k) { return k === "AW" ? D.essay.minutes : section(k).minutes; }
  function labelOf(k) { return k === "AW" ? "Analytical Writing" : section(k).label; }

  // ---------- marking ----------
  function isCorrect(q, a) {
    if (a === undefined || a === null) return false;
    switch (q.type) {
      case "mc": case "qc": case "sentence": return a === q.answer;
      case "tc": return Array.isArray(a) && q.answer.every(function (v, i) { return a[i] === v; });
      case "se": case "multi":
        if (!Array.isArray(a)) return false;
        var x = a.slice().sort(), y = q.answer.slice().sort();
        return x.length === y.length && x.every(function (v, i) { return v === y[i]; });
      case "numeric": var n = parseNum(a); return n !== null && Math.abs(n - q.answer) < 1e-9;
      case "fraction":
        if (!a) return false;
        var p = parseNum(a[0]), r = parseNum(a[1]);
        return p !== null && r !== null && r !== 0 && Math.abs(p / r - q.answer[0] / q.answer[1]) < 1e-12;
    }
    return false;
  }
  function parseNum(s) { if (s === undefined || s === null) return null; s = String(s).trim().replace(/,/g, "").replace(/^−/, "-"); if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null; return parseFloat(s); }
  function answered(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === "tc") return Array.isArray(a) && a.filter(function (v) { return v !== null && v !== undefined; }).length === q.blanks.length;
    if (q.type === "se" || q.type === "multi") return Array.isArray(a) && a.length > 0;
    if (q.type === "numeric") return String(a).trim() !== "";
    if (q.type === "fraction") return a && String(a[0] || "").trim() !== "" && String(a[1] || "").trim() !== "";
    return true;
  }
  function rawScore(k) { return section(k).questions.reduce(function (n, q) { return n + (isCorrect(q, S.answers[q.id]) ? 1 : 0); }, 0); }

  // Estimated scaled score. ETS's conversion is not public; this mapping is a transparent approximation (see report notes).
  function estimate(route, raw) {
    var s = route === "harder" ? 140 + Math.round((raw - 7) * 1.5) : 130 + Math.round(raw * 1.25);
    return Math.max(130, Math.min(route === "harder" ? 170 : 157, s));
  }
  function csem(measure, s) {
    var t = CSEM[measure];
    for (var i = 0; i < t.length - 1; i++) if (s >= t[i][0] && s <= t[i + 1][0]) { var f = (s - t[i][0]) / (t[i + 1][0] - t[i][0]); return t[i][1] + f * (t[i + 1][1] - t[i][1]); }
    return t[t.length - 1][1];
  }

  // ---------- flow ----------
  function startTest() { S = fresh(); S.phase = "sectionIntro"; save(); render(); }
  function beginSection() {
    var k = secKey(S.step);
    if (S.timeLeft[k] === undefined) S.timeLeft[k] = minutesOf(k) * 60;
    S.phase = "inSection"; S.current = 0; ui.review = false; ui.confirmExit = false; save(); render(); startTimer();
  }
  function endSection() {
    stopTimer();
    var k = secKey(S.step);
    if (k === "AW") S.essayUsed = D.essay.minutes * 60 - (S.timeLeft.AW || 0);
    if (k === "V1") S.route.Verbal = rawScore("V1") >= D.meta.routingThreshold ? "harder" : "easier";
    if (k === "Q1") S.route.Quant = rawScore("Q1") >= D.meta.routingThreshold ? "harder" : "easier";
    S.step++; ui.review = false; ui.confirmExit = false; ui.calc.show = false;
    if (S.step >= ORDER.length) { S.phase = "results"; S.finishedAt = new Date().toISOString(); } else S.phase = "sectionIntro";
    save(); render(); window.scrollTo(0, 0);
  }
  function startTimer() {
    stopTimer();
    var last = Date.now();
    tick = setInterval(function () {
      var now = Date.now(), k = secKey(S.step);
      S.timeLeft[k] -= (now - last) / 1000; last = now;
      if (S.timeLeft[k] <= 0) { S.timeLeft[k] = 0; save(); endSection(); return; }
      save(); paintTimer();
    }, 1000);
  }
  function stopTimer() { if (tick) clearInterval(tick); tick = null; }
  function paintTimer() {
    var el = document.getElementById("timer"); if (!el) return;
    var t = S.timeLeft[secKey(S.step)];
    if (S.hideTime) { el.textContent = "Time hidden"; el.classList.remove("low"); return; }
    el.textContent = fmt(t); el.classList.toggle("low", t <= 300);
  }

  // ---------- rendering ----------
  var app = document.getElementById("app"), bar = document.getElementById("bar"), calcEl = document.getElementById("calc");

  function render() {
    bar.hidden = S.phase !== "inSection";
    calcEl.hidden = !(S.phase === "inSection" && ui.calc.show);
    if (S.phase === "intro") return renderIntro();
    if (S.phase === "sectionIntro") return renderSectionIntro();
    if (S.phase === "inSection") return secKey(S.step) === "AW" ? renderEssay() : (ui.review ? renderReview() : renderQuestion());
    if (S.phase === "results") return renderResults();
  }

  function renderIntro() {
    var saved = load(), resumable = saved && saved.phase !== "intro";
    var rows = [["Analytical Writing", "1 Issue essay", "30 min"], ["Verbal Reasoning, section 1", "12 questions", "18 min"], ["Verbal Reasoning, section 2", "15 questions (adaptive)", "23 min"], ["Quantitative Reasoning, section 1", "12 questions", "21 min"], ["Quantitative Reasoning, section 2", "15 questions (adaptive)", "26 min"]];
    app.innerHTML =
      '<div class="stack">' +
      '<div class="stack" style="gap:6px"><span class="eyebrow">Full-length practice · current shorter GRE format</span><h1>GRE Practice Test 1</h1></div>' +
      '<p class="prose">This test follows the structure of the GRE General Test used since September 2023: one essay, then two Verbal and two Quantitative sections. How well you do in each first section decides whether you get an easier or harder second section, just like the real test. Total time: about 1 hour 58 minutes.</p>' +
      '<div class="panel scroll-x"><table class="plain"><thead><tr><th>Section</th><th>Content</th><th>Time</th></tr></thead><tbody>' +
      rows.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + '</td><td style="font-family:var(--f-num)">' + r[2] + "</td></tr>"; }).join("") +
      "</tbody></table></div>" +
      '<div class="panel stack" style="gap:8px"><h3>How it works</h3><ul class="prose" style="margin:0;padding-left:20px">' +
      "<li>Each section has its own countdown. When it reaches zero, the section ends and your answers are kept.</li>" +
      "<li>Inside a section you can skip, go back, mark questions to revisit and use the Review screen. You cannot return to a finished section.</li>" +
      "<li>There is no penalty for wrong answers, so answer every question. No partial credit: multi-answer questions must be fully right.</li>" +
      "<li>The Quant sections have an on-screen calculator. The essay box has no spell-checker, as on the real test.</li>" +
      "<li>Your progress saves in this browser. If the page reloads, you can resume where you left off (the clock pauses while the page is closed).</li>" +
      "</ul></div>" +
      '<div class="note small prose">Questions are original practice material, not ETS questions. Your Verbal and Quant scores will be an estimate on the 130–170 scale. For the most accurate benchmark, also take ETS\'s free official POWERPREP practice tests.</div>' +
      (ui.confirmRestart ? '<div class="confirm stack" style="gap:8px"><strong>Start over?</strong> This deletes your saved answers and essay. <div class="row"><button class="btn primary" id="yesRestart">Yes, start over</button><button class="btn" id="noRestart">Cancel</button></div></div>' : "") +

  function renderQuestion() {

  function optsHtml(opts, a, many) {

  function wireQuestion(q) {

  // ---------- calculator ----------
  function renderCalc() {
    if (calcEl.hidden) return;
    var c = ui.calc, k = secKey(S.step), q = section(k) && section(k).questions[S.current];
    var canTransfer = !ui.review && q && q.type === "numeric";
    var keys = ["7", "8", "9", "÷", "4", "5", "6", "×", "1", "2", "3", "−", "0", ".", "=", "+", "(", ")", "√", "±", "MR", "MC", "M+", "C"];
    calcEl.innerHTML = '<div class="hd"><span>Calculator</span><button class="btn" id="calcX" style="padding:2px 8px">Close</button></div>' +
      '<div class="disp" id="disp">' + esc(c.expr || "0") + "</div>" +
      '<div class="keys">' + keys.map(function (x) { return '<button data-k="' + x + '">' + x + "</button>"; }).join("") +
      (canTransfer ? '<button class="wide" data-k="T">Transfer display</button>' : "") + "</div>";
    calcEl.querySelectorAll("[data-k]").forEach(function (b) { b.addEventListener("click", function () { calcKey(b.dataset.k); }); });
    on("calcX", function () { ui.calc.show = false; render(); });
  }
  // Small recursive-descent parser (no eval): expr = term (+|- term)*, term = factor (*|/ factor)*, factor = -factor | (expr) | number
  function calcEval(expr) {
    var s = String(expr).replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/\s+/g, ""), i = 0;
    if (!s) return null;
    function parseExpr() { var v = parseTerm(); while (s[i] === "+" || s[i] === "-") { var op = s[i++], r = parseTerm(); v = op === "+" ? v + r : v - r; } return v; }
    function parseTerm() { var v = parseFactor(); while (s[i] === "*" || s[i] === "/") { var op = s[i++], r = parseFactor(); v = op === "*" ? v * r : v / r; } return v; }
    function parseFactor() {
      if (s[i] === "-") { i++; return -parseFactor(); }
      if (s[i] === "(") { i++; var v = parseExpr(); if (s[i] !== ")") throw 0; i++; return v; }
      var m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]);
    }
    try { var v = parseExpr(); if (i !== s.length || !isFinite(v)) return null; return +v.toPrecision(10); } catch (e) { return null; }
  }
  function calcKey(k) {
    var c = ui.calc;
    if (c.err) { c.expr = ""; c.err = false; }
    if (c.done && /^[0-9.(]$/.test(k)) c.expr = "";
    c.done = false;
    if (k === "C") c.expr = "";
    else if (k === "=") { var v = calcEval(c.expr); if (v === null) { c.expr = "Error"; c.err = true; } else { c.expr = String(v); c.done = true; } }
    else if (k === "√") { var r = calcEval(c.expr); if (r === null || r < 0) { c.expr = "Error"; c.err = true; } else c.expr = String(+Math.sqrt(r).toPrecision(10)); }
    else if (k === "±") { var s = calcEval(c.expr); if (s !== null) c.expr = String(-s); }
    else if (k === "M+") { var m = calcEval(c.expr); if (m !== null) c.mem += m; }
    else if (k === "MR") c.expr += String(c.mem);
    else if (k === "MC") c.mem = 0;
    else if (k === "T") { var t = calcEval(c.expr); if (t !== null) { var q = section(secKey(S.step)).questions[S.current]; S.answers[q.id] = String(t); save(); render(); return; } }
    else c.expr += k;
    document.getElementById("disp").textContent = c.expr || "0";
  }

  // ---------- results ----------
  function measureResult(measure) {
    var k1 = measure === "Verbal" ? "V1" : "Q1", route = S.route[measure], k2 = measure === "Verbal" ? (route === "harder" ? "V2H" : "V2E") : (route === "harder" ? "Q2H" : "Q2E");
    var r1 = rawScore(k1), r2 = rawScore(k2), raw = r1 + r2, est = estimate(route, raw);
    var half = Math.round(csem(measure, est)) + 2;
    var lo = Math.max(130, est - half), hi = Math.min(170, est + half);
    var pct = (measure === "Verbal" ? PCT_V : PCT_Q)[est];
    return { measure: measure, k1: k1, k2: k2, r1: r1, r2: r2, raw: raw, route: route, est: est, lo: lo, hi: hi, pct: pct };
  }
  function ordinal(n) { var s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function scoreCard(r) {
    var pos = function (s) { return ((s - 130) / 40 * 100).toFixed(2) + "%"; };
    return '<div class="score"><span class="eyebrow">' + (r.measure === "Quant" ? "Quantitative" : "Verbal") + " Reasoning · estimate</span>" +
      '<div class="big">' + r.est + "</div>" +

      '<div class="scale-lbl"><span>130</span><span>150</span><span>170</span></div>' +
      '<p class="small" style="margin:10px 0 0">About the <strong>' + ordinal(r.pct) + " percentile</strong>: " + r.pct + "% of recent GRE takers scored lower than " + r.est + ".</p>" +
      '<p class="small muted" style="margin:6px 0 0">' + r.raw + " of 27 correct (section 1: " + r.r1 + "/12, section 2: " + r.r2 + "/15). Second section: <strong>" + r.route + "</strong>.</p></div>";
  }
  function answerText(q, a) {
    if (!answered(q, a)) return "—";
    switch (q.type) {
      case "mc": return LET[a] + ". " + q.options[a];
      case "qc": return LET[a] + ". " + QC_OPTS[a];
      case "sentence": return "Sentence " + (a + 1);
      case "tc": return a.map(function (v, b) { return q.blanks[b][v]; }).join(" / ");
      case "se": case "multi": return a.slice().sort().map(function (i) { return LET[i]; }).join(", ");
      case "numeric": return String(a);
      case "fraction": return a[0] + "/" + a[1];
    }
  }
  function keyText(q) {
    switch (q.type) {
      case "mc": return LET[q.answer] + ". " + q.options[q.answer];
      case "qc": return LET[q.answer] + ". " + QC_OPTS[q.answer];
      case "sentence": return "Sentence " + (q.answer + 1) + ": “" + D.passages[q.passage][q.answer] + "”";
      case "tc": return q.answer.map(function (v, b) { return q.blanks[b][v]; }).join(" / ");
      case "se": case "multi": return q.answer.map(function (i) { return LET[i] + " (" + q.options[i] + ")"; }).join(", ");
      case "numeric": return String(q.answer);

    }
  }
  function skillTable(ks) {

    ks.forEach(function (k) { section(k).questions.forEach(function (q) { var s = agg[q.skill] = agg[q.skill] || [0, 0]; s[1]++; if (isCorrect(q, S.answers[q.id])) s[0]++; }); });
    return '<table class="plain"><thead><tr><th>Question type</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>' +

  }
  function reviewList(k) {

      sec.questions.map(function (q, i) {

          (q.passage ? '<details class="small"><summary>Show passage</summary><ol style="margin:4px 0;padding-left:22px;font-family:var(--f-read)">' + D.passages[q.passage].map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></details>" : "") +
          (q.table ? '<details class="small"><summary>Show table</summary>' + tableHtml(q.table) + "</details>" : "") +
          '<div class="small">' + esc(stem) + "</div>" +
          '<div class="small">Your answer: <strong>' + esc(answerText(q, a)) + "</strong> · Correct: <strong>" + esc(keyText(q)) + "</strong></div>" +
          '<div class="ex">' + esc(q.explain) + "</div></div>";

  }
  function copyText(V, Q) {

  }
  function renderResults() {
    var V = measureResult("Verbal"), Q = measureResult("Quant");
    var awRows = Object.keys(PCT_AW).filter(function (s) { return +s >= 1; }).map(function (s) { return '<tr><td style="font-family:var(--f-num)">' + s + '</td><td style="font-family:var(--f-num)">' + PCT_AW[s] + "%</td></tr>"; }).join("");
    app.innerHTML = '<div class="stack">' +
      '<div class="stack" style="gap:6px"><span class="eyebrow">Score report</span><h1>GRE Practice Test 1: results</h1></div>' +
      '<div class="scores">' + scoreCard(V) + scoreCard(Q) +
      '<div class="score"><span class="eyebrow">Analytical Writing</span><div class="big" style="font:600 24px/1.2 var(--f-ui);margin:16px 0">Awaiting marking</div>' +
      '<p class="small" style="margin:0">Copy your essay below and paste it to Claude. You will get a 0–6 score using ETS\'s published score-level descriptions, with feedback.</p></div></div>' +
      '<div class="panel stack" style="gap:8px"><h3>Send your essay for marking</h3><p class="small muted" style="margin:0">This copies your essay, the prompt and your scores.</p>' +
      '<div class="row"><button class="btn primary" id="copy">Copy essay and results</button><span class="small" id="copied"></span></div>' +
      '<textarea id="copybox" class="copybox" readonly hidden></textarea></div>' +
      '<div class="note small prose"><strong>How to read these numbers.</strong> ETS does not publish how it turns correct answers into a 130–170 score for this test format, and these questions were not tested on real candidates. So each score is an estimate from a simple, fixed conversion that gives more credit on the harder second section. The likely range adds ETS\'s own measurement error (about ±2.5 points) plus 2 extra points for that uncertainty. Percentiles are ETS\'s official figures for test takers between 1 July 2022 and 30 June 2025.</div>' +
      '<div class="scores"><div class="panel scroll-x"><h3 style="margin-bottom:8px">Verbal by question type</h3>' + skillTable([V.k1, V.k2]) + "</div>" +
      '<div class="panel scroll-x"><h3 style="margin-bottom:8px">Quant by question type</h3>' + skillTable([Q.k1, Q.k2]) + "</div>" +
      '<div class="panel scroll-x"><h3 style="margin-bottom:8px">Writing percentiles (ETS)</h3><table class="plain"><thead><tr><th>Score</th><th>Scored lower</th></tr></thead><tbody>' + awRows + "</tbody></table></div></div>" +
      '<div class="panel stack" style="gap:4px"><h2 style="margin-bottom:6px">Answers and explanations</h2>' + [V.k1, V.k2, Q.k1, Q.k2].map(reviewList).join("") + "</div>" +
      '<div class="row">' + (ui.confirmRestart ? '<span>Delete these results and start again?</span><button class="btn primary" id="yesRestart">Yes, start over</button><button class="btn" id="noRestart">Cancel</button>' : '<button class="btn" id="restart">Retake from the start</button>') + "</div></div>";
    on("copy", function () {
      var txt = copyText(V, Q), box = document.getElementById("copybox"), msg = document.getElementById("copied");
      box.value = txt;
      var fallback = function () { box.hidden = false; box.focus(); box.select(); msg.textContent = "Select all the text in the box and copy it."; };
      try { navigator.clipboard.writeText(txt).then(function () { msg.textContent = "Copied. Paste it into your chat with Claude."; }, fallback); } catch (e) { fallback(); }
    });
    on("restart", function () { ui.confirmRestart = true; render(); });
    on("noRestart", function () { ui.confirmRestart = false; render(); });
    on("yesRestart", function () { ui.confirmRestart = false; try { localStorage.removeItem(KEY); } catch (e) {} S = fresh(); render(); });
  }

  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener("click", fn); }

  // expose pure functions for checking
  window.__gre = { estimate: estimate, isCorrect: isCorrect, D: D };

  S = fresh();
  render();
})();
</script>
